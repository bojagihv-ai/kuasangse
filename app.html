    render();
  }
}

async function generateAllSections() {
  state.step = 'generating';
  state.progress = 35;
  const preservedContents = cloneData(state.sectionContents || {});
  const preservedImages = cloneData(state.sectionImages || {});
  const preservedRepairUndoStack = cloneData(state.aiRepairUndoStack || {});
  state.sectionContents = {};
  state.sectionImages = {};
  state.aiRepairUndoStack = {};
  SECTIONS.forEach(section => {
    if (state.sectionLocks[section.id] && preservedContents[section.id]) {
      state.sectionContents[section.id] = preservedContents[section.id];
      if (preservedImages[section.id]) state.sectionImages[section.id] = preservedImages[section.id];
      if (preservedRepairUndoStack[section.id]) state.aiRepairUndoStack[section.id] = preservedRepairUndoStack[section.id];
    }
  });
  render();

  let llm;
  try { llm = getLLMClient(); } catch(e) { state.error = e.message; state.step = 'sections'; render(); return; }
  // gemini 인스턴스도 이미지 생성용으로 유지
  const imageClientReady = hasImageConnection();

  const total = SECTIONS.length;
  const compRef = state.competitorData ? JSON.stringify(state.competitorData).substring(0, 1000) : '';

  for (let i = 0; i < total; i++) {
    const s = SECTIONS[i];
    if (state.sectionLocks[s.id] && state.sectionContents[s.id]) {
      state.progressMsg = `[${i+1}/${total}] ${s.name} 잠금 유지`;
      render();
      continue;
    }
    const pct = Math.round(35 + ((i / total) * 60));
    state.progress = pct;
    state.progressMsg = `[${i+1}/${total}] ${s.name} 콘텐츠 생성 중...`;
    render();

    try {
      // Generate content via selected LLM
      const content = await llm.generateSectionContent(
        s, state.analysis, state.sectionInstructions[s.id] || '', compRef
      );
      state.sectionContents[s.id] = content;

      // Try to generate image with the selected image model
      if (imageClientReady) {
        state.progressMsg = `[${i+1}/${total}] ${s.name} 이미지 생성 중...`;
        render();
        try {
          const imgPrompt = content.image_description || content.design_notes || s.purpose;
          const img = await generateWithSelectedImageModel(imgPrompt, state.imageBase64, state.imageMime);
          if (img) {
            state.sectionImages[s.id] = img;
            // Drive 자동 업로드
            if (state.sectionDriveFolderId && driveService && state.auto.driveConnected) {
              uploadSectionImageToDrive(s.id).catch(()=>{});
            }
          }
        } catch (e) {
          console.warn(`Image gen failed for ${s.id}:`, e);
        }
      }

      applySectionContent(s.id, content, state.sectionImages[s.id] || undefined, 'generated');

    } catch (e) {
      console.error(`Section ${s.id} failed:`, e);
      state.sectionContents[s.id] = {
        headline: s.name,
        subheadline: '생성 실패 - 재시도해주세요',
        body_text: e.message,
        color_scheme: { background: '#FFF5F5', text_primary: '#C53030', text_secondary: '#E53E3E', accent: '#FC8181' },
        font_suggestion: { headline_size: '32px', body_size: '14px' }
      };
    }

    // Small delay for rate limiting
    await new Promise(r => setTimeout(r, 500));
  }

  state.progress = 100;
  state.progressMsg = '모든 섹션 생성 완료!';
  state.step = 'preview';
  savePersistentState();
  render();
}

function downloadTextFile(filename, content, type = 'text/plain;charset=utf-8') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function svgEscape(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function solidSvgFill(value, fallback = '#ffffff') {
  const v = String(value || '').trim();
  if (/^#[0-9a-f]{3,8}$/i.test(v)) return v;
  if (/^rgb/i.test(v)) return v;
  return fallback;
}

function wrapSvgLines(text, maxChars = 22) {
  const raw = String(text || '').replace(/\s+/g, ' ').trim();
  if (!raw) return [];
  const words = raw.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    if ((line + ' ' + word).trim().length > maxChars && line) {
      lines.push(line);
      line = word;
    } else {
      line = (line + ' ' + word).trim();
    }
  }
  if (line) lines.push(line);
  return lines.flatMap(l => {
    if (l.length <= maxChars * 1.4) return [l];
    const chunks = [];
    for (let i = 0; i < l.length; i += maxChars) chunks.push(l.slice(i, i + maxChars));
    return chunks;
  });
}

function svgTextBlock(text, opts) {
  const fontSize = opts.fontSize || 32;
  const width = opts.width || 760;
  const maxChars = Math.max(8, Math.floor(width / (fontSize * 0.52)));
  const lines = wrapSvgLines(text, maxChars).slice(0, opts.maxLines || 8);
  const anchor = opts.align === 'right' ? 'end' : (opts.align === 'center' ? 'middle' : 'start');
  const x = opts.align === 'right' ? width : (opts.align === 'center' ? width / 2 : 0);
  return `<text x="${x}" y="0" font-family="${svgEscape(opts.font || 'Pretendard, Noto Sans KR, sans-serif')}" font-size="${fontSize}" font-weight="${svgEscape(opts.weight || '400')}" fill="${svgEscape(opts.fill || '#333')}" text-anchor="${anchor}">
    ${lines.map((line, i) => `<tspan x="${x}" dy="${i === 0 ? fontSize : fontSize * (opts.lineHeight || 1.25)}">${svgEscape(line)}</tspan>`).join('\n')}
  </text>`;
}

function svgLayerGroup(sectionId, layerId, baseX, baseY, inner) {
  const e = getLayerEdit(sectionId, layerId);
  return `<g id="${svgEscape(sectionId + '_' + layerId)}" data-layer="${svgEscape(layerId)}" opacity="${e.opacity}" transform="translate(${baseX + e.x} ${baseY + e.y}) scale(${e.scale})">${inner}</g>`;
}

    const headlineEdit = getLayerEdit(s.id, 'headline');

      font: headlineFont,
      fontSize: parseInt(font.headline_size || '46', 10) || 46,
      weight: font.headline_weight || '800',
      fill: headlineColor,
      width: headlineEdit.width || 920,
      align: headlineEdit.align || 'center',
      maxLines: 3,
      lineHeight: 1.16,
    }));

    const subEdit = getLayerEdit(s.id, 'subheadline');
    body += svgLayerGroup(s.id, 'subheadline', 120, 240, svgTextBlock(content.subheadline || '', {
      font: bodyFont,
      fontSize: 26,
      weight: '400',
      fill: bodyColor,
      width: subEdit.width || 840,
      align: subEdit.align || 'center',
      maxLines: 3,
      lineHeight: 1.25,
    }));

    if (img) {
      const imageEdit = getLayerEdit(s.id, 'image');

      body += svgLayerGroup(s.id, 'image', Math.round((width - imageW) / 2), 320, `
        <image href="${svgEscape(img)}" x="0" y="0" width="${imageW}" height="330" preserveAspectRatio="xMidYMid meet"/>

    }

    const bodyEdit = getLayerEdit(s.id, 'body');
    body += svgLayerGroup(s.id, 'body', 150, img ? 690 : 355, svgTextBlock(content.body_text || '', {
      font: bodyFont,
      fontSize: parseInt(font.body_size || '24', 10) || 24,
      weight: '400',
      fill: bodyColor,
      width: bodyEdit.width || 780,
      align: bodyEdit.align || 'center',
      maxLines: 5,
      lineHeight: 1.35,
    }));

    if (content.extra_elements?.length) {
      const extraEdit = getLayerEdit(s.id, 'extra');
      body += svgLayerGroup(s.id, 'extra', 170, img ? 785 : 560, svgTextBlock(content.extra_elements.map(v => `• ${v}`).join('   '), {
        font: bodyFont,
        fontSize: 20,
        weight: '500',
        fill: bodyColor,
        width: extraEdit.width || 740,
        align: extraEdit.align || 'center',
        maxLines: 4,
        lineHeight: 1.35,
      }));
    }

    if (content.cta_text) {
      const ctaEdit = getLayerEdit(s.id, 'cta');
      const ctaW = ctaEdit.width || 300;
      const ctaInner = `<rect x="0" y="0" width="${ctaW}" height="58" rx="29" fill="${svgEscape(accent)}"/>
        <text x="${ctaW / 2}" y="37" text-anchor="middle" font-family="${svgEscape(bodyFont)}" font-size="22" font-weight="700" fill="#ffffff">${svgEscape(content.cta_text)}</text>`;
      body += svgLayerGroup(s.id, 'cta', Math.round((width - ctaW) / 2), 825, ctaInner);
    }

    body += `</g>`;
  });

  const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <title>${svgEscape(product.product_name || '상세페이지 레이어')}</title>
  <desc>Photoshop/Illustrator 편집을 위해 섹션, 텍스트, 이미지가 개별 그룹으로 분리된 SVG입니다. PSD가 아니라 SVG이므로 앱 안의 레이어 조정값을 보존하는 포토샵 친화 내보내기 형식입니다.</desc>
  ${body}
</svg>`;
  return { svg, filename: `${product.product_name || 'detail-page'}_layered.svg` };
}

function downloadBytesFile(filename, bytes, type = 'application/octet-stream') {
  const blob = new Blob([bytes], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function utf8Bytes(text) {
  return new TextEncoder().encode(String(text ?? ''));
}

function concatBytes(parts) {
  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const part of parts) {
    out.set(part, offset);
    offset += part.length;
  }
  return out;
}

let ZIP_CRC_TABLE = null;
function crc32(bytes) {
  if (!ZIP_CRC_TABLE) {
    ZIP_CRC_TABLE = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      ZIP_CRC_TABLE[i] = c >>> 0;
    }
  }
  let crc = 0 ^ -1;
  for (const b of bytes) crc = (crc >>> 8) ^ ZIP_CRC_TABLE[(crc ^ b) & 0xFF];
  return (crc ^ -1) >>> 0;
}

function zipDosTime(date = new Date()) {
  const time = (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2);
  const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  return { time, date: dosDate };
}

function u16(value) {
  const b = new Uint8Array(2);
  new DataView(b.buffer).setUint16(0, value, true);
  return b;
}

function u32(value) {
  const b = new Uint8Array(4);
  new DataView(b.buffer).setUint32(0, value >>> 0, true);
  return b;
}

function createZip(files) {
  const now = zipDosTime();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const file of files) {
    const nameBytes = utf8Bytes(file.name.replace(/\\/g, '/'));
    const data = file.data instanceof Uint8Array ? file.data : utf8Bytes(file.data);
    const crc = crc32(data);
    const localHeader = concatBytes([
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(now.time), u16(now.date),
      u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0), nameBytes
    ]);
    localParts.push(localHeader, data);

    const centralHeader = concatBytes([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(now.time), u16(now.date),
      u32(crc), u32(data.length), u32(data.length), u16(nameBytes.length), u16(0), u16(0),
      u16(0), u16(0), u32(0), u32(offset), nameBytes
    ]);
    centralParts.push(centralHeader);
    offset += localHeader.length + data.length;
  }

  const central = concatBytes(centralParts);
  const end = concatBytes([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(central.length), u32(offset), u16(0)
  ]);
  return concatBytes([...localParts, central, end]);
}

function safeAssetName(value) {
  return String(value || 'asset')
    .replace(/[\\/:*?"<>|]+/g, '_')
    .replace(/\s+/g, '_')
    .slice(0, 80);
}

function bytesFromDataUrl(dataUrl) {
  const match = String(dataUrl || '').match(/^data:([^;,]+)?(;base64)?,(.*)$/);
  if (!match) return null;
  const mime = match[1] || 'application/octet-stream';
  const isBase64 = !!match[2];
  const payload = match[3] || '';
  if (!isBase64) return { mime, bytes: utf8Bytes(decodeURIComponent(payload)) };
  const binary = atob(payload);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return { mime, bytes };
}

function imageExtFromMime(mime) {
  if (/jpe?g/i.test(mime)) return 'jpg';
  if (/webp/i.test(mime)) return 'webp';
  if (/gif/i.test(mime)) return 'gif';
  return 'png';
}

function hexOnly(value, fallback = '#ffffff') {
  const v = String(value || '').trim();
  return /^#[0-9a-f]{6}$/i.test(v) ? v : fallback;
}

function makePsdText(text, width, fontSize, maxLines = 5) {
  const maxChars = Math.max(8, Math.floor(width / (fontSize * 0.52)));
  return wrapSvgLines(text, maxChars).slice(0, maxLines).join('\r');
}

        x: 170 + extraEdit.x, y: y + (img ? 785 : 560) + extraEdit.y,
        width: extraWidth, fontSize: Math.round(20 * extraEdit.scale), fontFamily: bodyFont,
        fontWeight: '500', color: bodyColor, align: extraEdit.align || 'center',
        opacity: Math.round(extraEdit.opacity * 100),
      });
    }

    if (content.cta_text) {
      const ctaEdit = getLayerEdit(s.id, 'cta');
      const ctaW = ctaEdit.width || 300;
      const ctaX = Math.round((width - ctaW) / 2) + ctaEdit.x;
      const ctaY = y + 825 + ctaEdit.y;
      section.layers.push({
        type: 'fill', id: 'cta_bg', name: `${s.n}. ${s.name} / cta background`,
        x: ctaX, y: ctaY, width: ctaW, height: 58, color: accent, opacity: Math.round(ctaEdit.opacity * 100),
      });
      section.layers.push({
        type: 'text', id: 'cta', name: `${s.n}. ${s.name} / cta text`,
        text: content.cta_text, x: ctaX, y: ctaY + 18, width: ctaW,
        fontSize: Math.round(22 * ctaEdit.scale), fontFamily: bodyFont, fontWeight: '700',
        color: '#ffffff', align: 'center', opacity: Math.round(ctaEdit.opacity * 100),
      });
    }

    manifest.sections.push(section);
  });

  return { manifest, files };
}

function buildPhotoshopImportJsx(manifest) {
  const payload = JSON.stringify(manifest, null, 2);
  return `#target photoshop
app.bringToFront();
app.preferences.rulerUnits = Units.PIXELS;

var PDP = ${payload};

function hexColor(hex) {
  hex = String(hex || '#000000').replace('#', '').substring(0, 6);
  var c = new SolidColor();
  c.rgb.hexValue = hex;
  return c;
}

function setJustification(textItem, align) {
  try {
    if (align === 'right') textItem.justification = Justification.RIGHT;
    else if (align === 'center') textItem.justification = Justification.CENTER;
    else textItem.justification = Justification.LEFT;
  } catch (e) {}
}

function fillLayer(doc, group, layerInfo) {
  var layer = group.artLayers.add();
  layer.name = layerInfo.name;
  doc.activeLayer = layer;
  doc.selection.select([
    [layerInfo.x, layerInfo.y],
    [layerInfo.x + layerInfo.width, layerInfo.y],
    [layerInfo.x + layerInfo.width, layerInfo.y + layerInfo.height],
    [layerInfo.x, layerInfo.y + layerInfo.height]
  ]);
  doc.selection.fill(hexColor(layerInfo.color), ColorBlendMode.NORMAL, layerInfo.opacity || 100, false);
  doc.selection.deselect();
  layer.opacity = layerInfo.opacity || 100;
  return layer;
}

function textLayer(group, layerInfo) {
  var layer = group.artLayers.add();
  layer.kind = LayerKind.TEXT;
  layer.name = layerInfo.name;
  layer.opacity = layerInfo.opacity || 100;
  var t = layer.textItem;
  try { t.kind = TextType.PARAGRAPHTEXT; } catch (e) {}
  t.contents = layerInfo.text || '';
  t.position = [UnitValue(layerInfo.x, 'px'), UnitValue(layerInfo.y, 'px')];
  t.size = UnitValue(layerInfo.fontSize || 24, 'px');
  try { t.width = UnitValue(layerInfo.width || 800, 'px'); } catch (e) {}
  try { t.height = UnitValue(400, 'px'); } catch (e) {}
  try { t.font = layerInfo.fontFamily || 'ArialMT'; } catch (e) {}
  t.color = hexColor(layerInfo.color || '#333333');
  setJustification(t, layerInfo.align || 'left');
  return layer;
}

function placeEmbedded(file) {
  var desc = new ActionDescriptor();
  desc.putPath(charIDToTypeID('null'), file);
  desc.putEnumerated(charIDToTypeID('FTcs'), charIDToTypeID('QCSt'), charIDToTypeID('Qcsa'));
  var offset = new ActionDescriptor();
  offset.putUnitDouble(charIDToTypeID('Hrzn'), charIDToTypeID('#Pxl'), 0);
  offset.putUnitDouble(charIDToTypeID('Vrtc'), charIDToTypeID('#Pxl'), 0);
  desc.putObject(charIDToTypeID('Ofst'), charIDToTypeID('Ofst'), offset);
  executeAction(charIDToTypeID('Plc '), desc, DialogModes.NO);
  return app.activeDocument.activeLayer;
}

function fitLayerToBox(layer, x, y, width, height) {
  try {
    var b = layer.bounds;
    var currentW = b[2].value - b[0].value;
    var currentH = b[3].value - b[1].value;
    if (currentW > 0 && currentH > 0) {
      var scale = Math.min(width / currentW, height / currentH) * 100;
      layer.resize(scale, scale, AnchorPosition.TOPLEFT);
      b = layer.bounds;
      layer.translate(UnitValue(x - b[0].value, 'px'), UnitValue(y - b[1].value, 'px'));
    }
  } catch (e) {}
}

function imageLayer(doc, group, layerInfo, rootFolder) {
  if (!layerInfo.asset) return null;
  var file = new File(rootFolder.fsName + '/' + layerInfo.asset);
  if (!file.exists) return null;
  var layer = placeEmbedded(file);
  layer.name = layerInfo.name;
  layer.opacity = layerInfo.opacity || 100;
  fitLayerToBox(layer, layerInfo.x, layerInfo.y, layerInfo.width, layerInfo.height);
  try { layer.move(group, ElementPlacement.PLACEATBEGINNING); } catch (e) {}
  return layer;
}

function resolvePackageRoot() {
  try {
    if ($.fileName) return new File($.fileName).parent;
  } catch (e) {}
  return Folder.selectDialog('Select the extracted Photoshop package folder');
}

function safeFileName(name) {
  return String(name || 'detail-page').replace(/[\\\\\\/:*?"<>|]+/g, '_').replace(/^\\s+|\\s+$/g, '').substring(0, 120) || 'detail-page';
}

function savePsd(doc, root) {
  try {
    var outDir = new Folder(root.fsName + '/exports');
    if (!outDir.exists) outDir.create();
    var psdFile = new File(outDir.fsName + '/' + safeFileName(PDP.outputPsdName || PDP.title || 'detail-page.psd'));
    var opts = new PhotoshopSaveOptions();
    opts.layers = true;
    opts.embedColorProfile = true;
    doc.saveAs(psdFile, opts, true, Extension.LOWERCASE);
    return psdFile.fsName;
  } catch (e) {
    return '';
  }
}

function main() {
  var root = resolvePackageRoot();
  if (!root) return;
  var doc = app.documents.add(PDP.width, PDP.height, PDP.resolution || 72, PDP.title || 'detail-page', NewDocumentMode.RGB, DocumentFill.TRANSPARENT);
  for (var i = 0; i < PDP.sections.length; i++) {
    var section = PDP.sections[i];
    var group = doc.layerSets.add();
    group.name = ('0' + section.index).slice(-2) + ' ' + section.name;
    for (var j = 0; j < section.layers.length; j++) {
      var layer = section.layers[j];
      if (layer.type === 'fill') fillLayer(doc, group, layer);
      else if (layer.type === 'text') textLayer(group, layer);
      else if (layer.type === 'image') imageLayer(doc, group, layer, root);
    }
  }
  var savedPath = savePsd(doc, root);
  if (savedPath) alert('PSD layer document created and saved:\\n' + savedPath);
  else alert('PSD layer document created. Save it as a .psd file from Photoshop.');
}

main();
`;
}

// GOOGLE DRIVE SERVICE
// ════════════════════════════════════════════════════════════════
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const GD_CLIENT_ID = localStorage.getItem('gd_client_id') || '';

// URL이든 ID만이든 폴더 ID를 추출
function extractFolderId(input) {
  if (!input) return '';
  input = input.trim();
  // https://drive.google.com/drive/folders/XXXXX?usp=... 형태
  const m1 = input.match(/folders\/([a-zA-Z0-9_-]+)/);
  if (m1) return m1[1];
  // https://drive.google.com/drive/u/0/folders/XXXXX 형태
  const m2 = input.match(/drive[^"]*folders\/([a-zA-Z0-9_-]+)/);
  if (m2) return m2[1];
  // 이미 순수 ID (공백, 슬래시 없음)
  if (/^[a-zA-Z0-9_-]+$/.test(input)) return input;
  return input;
}

class DriveService {
  constructor(token) {
    this.token = token;
    this.tokenExpiresAt = Date.now() + 3500 * 1000; // ~58분 후 만료 예상
  }
  headers() { return { 'Authorization': `Bearer ${this.token}` }; }

  // 토큰 만료 체크 후 자동 갱신
  async ensureToken() {
    if (Date.now() > this.tokenExpiresAt) {
      autoLog('info', '토큰 만료됨 — 자동 갱신 중...');
      await refreshDriveToken();
    }
  }

  // 401 에러 시 토큰 갱신 후 재시도하는 래퍼
  async fetchWithRetry(url, options = {}) {
    await this.ensureToken();
    let res = await fetch(url, { ...options, headers: { ...this.headers(), ...(options.headers||{}) } });
    if (res.status === 401) {
      autoLog('info', '401 인증 만료 — 토큰 갱신 후 재시도...');
      await refreshDriveToken();
      res = await fetch(url, { ...options, headers: { ...this.headers(), ...(options.headers||{}) } });
    }
    return res;
  }

  async getFolderMeta(folderId) {
    const res = await this.fetchWithRetry(`${DRIVE_API}/files/${folderId}?fields=id,name`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data;
  }

  async listImages(folderId) {
    const q = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and trashed=false`);
    const res = await this.fetchWithRetry(`${DRIVE_API}/files?q=${q}&fields=files(id,name,mimeType,createdTime,size,thumbnailLink,imageMediaMetadata)&orderBy=createdTime&pageSize=100`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.files || [];
  }

  async downloadFile(fileId) {
    const res = await this.fetchWithRetry(`${DRIVE_API}/files/${fileId}?alt=media`);
    if (!res.ok) throw new Error('Download failed');
    const blob = await res.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ base64: reader.result.split(',')[1], dataUrl: reader.result, mime: blob.type });
      reader.readAsDataURL(blob);
    });
  }

  async uploadHtml(folderId, fileName, htmlContent) {
    await this.ensureToken();
    const metadata = { name: fileName, mimeType: 'text/html', parents: [folderId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([htmlContent], { type: 'text/html' }));

    let res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
      method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form
    });
    if (res.status === 401) {
      autoLog('info', '업로드 401 — 토큰 갱신 후 재시도...');
      await refreshDriveToken();
      const form2 = new FormData();
      form2.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form2.append('file', new Blob([htmlContent], { type: 'text/html' }));
      res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
        method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form2
      });
    }
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data;
  }

  async uploadImage(folderId, fileName, blob) {
    await this.ensureToken();
    const metadata = { name: fileName, mimeType: 'image/jpeg', parents: [folderId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    let res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
      method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form
    });
    if (res.status === 401) {
      await refreshDriveToken();
      const form2 = new FormData();
      form2.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form2.append('file', blob);
      res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
        method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form2
      });
    }
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data;
  }

  async getFolderName(folderId) {
    const res = await this.fetchWithRetry(`${DRIVE_API}/files/${folderId}?fields=name`);
    const data = await res.json();
    return data.name || folderId;
  }
}

function dataUrlToJpegBlob(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('canvas toBlob failed')), 'image/jpeg', 0.92);
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function uploadSectionImageToDrive(sectionId) {
  const folderId = extractFolderId(state.sectionDriveFolderId);
  if (!folderId || !driveService || !state.auto.driveConnected) return;
  const imgDataUrl = state.sectionImages[sectionId];
  if (!imgDataUrl) return;
  const s = SECTIONS.find(x => x.id === sectionId);
  const n = String(s?.n || 0).padStart(2, '0');
  const fileName = `${n}_${sectionId}.jpg`;
  state.sectionDriveUploadStatus[sectionId] = 'uploading';
  render();
  try {
    const blob = await dataUrlToJpegBlob(imgDataUrl);
    await driveService.uploadImage(folderId, fileName, blob);
    state.sectionDriveUploadStatus[sectionId] = 'done';
  } catch(e) {
    state.sectionDriveUploadStatus[sectionId] = 'error';
    console.warn(`Drive upload failed [${sectionId}]:`, e);
  }
  render();
}

function agentGetContext() {
  const a = state.analysis;
  const directives = state.imageDirectives.filter(d=>d.active).map(d=>d.text);
  const customInstructions = Object.entries(state.sectionInstructions).filter(([,v])=>v).map(([k,v])=>`${k}: "${v}"`);
  const cfg = state.modelConfig;
  return `현재 앱 상태:
- 제품: ${a ? `${a.product_name} (${a.category})` : '없음'}
- LLM 모델: ${cfg.llmProvider}/${cfg.llmModel}
- 이미지 모델: ${cfg.imageModel}
- 활성 이미지 제약 조건 (${directives.length}개): ${directives.length ? directives.map((d,i)=>`\n  ${i+1}. ${d}`).join('') : '없음'}
- 섹션별 커스텀 지시사항 (${customInstructions.length}개): ${customInstructions.length ? customInstructions.join(', ') : '없음'}
- 생성된 섹션: ${Object.keys(state.sectionContents).length}/15개`;
}

function agentGetSystemPrompt() {
  return `당신은 한국어 이커머스 상세페이지 자동 생성 앱을 완전히 제어하는 AI 어시스턴트입니다.
사용자의 자연어 명령을 이해하고 앱 설정을 직접 변경합니다.

${agentGetContext()}

사용 가능한 도구 (actions 배열에 포함):
- add_directive: 이미지 생성 제약 추가 → {"tool":"add_directive","text":"English constraint","label":"한국어 설명"}
- remove_directive: 제약 삭제 (텍스트 부분 일치) → {"tool":"remove_directive","match":"삭제할 텍스트"}
- clear_directives: 모든 제약 삭제 → {"tool":"clear_directives"}
- set_section_instruction: 섹션 커스텀 지시사항 설정 → {"tool":"set_section_instruction","sectionId":"header","text":"지시사항"}
- clear_section_instruction: 섹션 지시사항 삭제 → {"tool":"clear_section_instruction","sectionId":"header"}
- set_image_model: 이미지 모델 변경 → {"tool":"set_image_model","modelId":"gemini-3.1-flash-image-preview"}
- set_llm_model: LLM 모델 변경 → {"tool":"set_llm_model","provider":"gemini","modelId":"gemini-2.5-flash"}
- update_analysis: 분석 필드 수정 → {"tool":"update_analysis","field":"product_name","value":"새 이름"}
- regenerate_section: 섹션 재생성 트리거 → {"tool":"regenerate_section","sectionId":"header"}

응답 형식 (반드시 이 JSON으로만 응답):
{
  "reply": "사용자에게 보여줄 한국어 응답 (2-3문장, 친절하게)",
  "actions": []
}

규칙:
- 반드시 JSON으로만 응답. 다른 텍스트 없음.
- reply는 항상 한국어.
- 명령이 없는 질문(현재 상태 등)은 actions 빈 배열로 답변.
- 확실하지 않은 명령은 actions 없이 질문으로 되물음.`;
}

async function executeAgentActions(actions) {
  const results = [];
  for (const action of actions) {
    try {
      if (action.tool === 'add_directive') {
        const id = Date.now() + Math.random();
        state.imageDirectives.push({ id, original: action.label || action.text, text: action.text, active: true });
        saveImageDirectives();
        results.push({ ...action, label: action.label || `제약 추가: "${action.text.slice(0,40)}"` });

      } else if (action.tool === 'remove_directive') {
        const before = state.imageDirectives.length;
        state.imageDirectives = state.imageDirectives.filter(d =>
          !d.text.toLowerCase().includes((action.match||'').toLowerCase()) &&
          !d.original.toLowerCase().includes((action.match||'').toLowerCase())
        );
        saveImageDirectives();
        results.push({ ...action, label: `제약 삭제 (${before - state.imageDirectives.length}개)` });

      } else if (action.tool === 'clear_directives') {
        state.imageDirectives = [];
        saveImageDirectives();
        results.push({ ...action, label: '모든 이미지 제약 초기화' });

      } else if (action.tool === 'set_section_instruction') {
        state.sectionInstructions[action.sectionId] = action.text;
        saveSectionInstructions(state.sectionInstructions);
        results.push({ ...action, label: `섹션 [${action.sectionId}] 지시사항 설정` });

      } else if (action.tool === 'clear_section_instruction') {
        delete state.sectionInstructions[action.sectionId];
        saveSectionInstructions(state.sectionInstructions);
        results.push({ ...action, label: `섹션 [${action.sectionId}] 지시사항 삭제` });

      } else if (action.tool === 'set_image_model') {
        state.modelConfig.imageModel = action.modelId;
        saveModelConfig(state.modelConfig);
        results.push({ ...action, label: `이미지 모델 → ${action.modelId}` });

      } else if (action.tool === 'set_llm_model') {
        state.modelConfig.llmProvider = action.provider;
        state.modelConfig.llmModel = action.modelId;
        state.modelConfig = normalizeModelConfig(state.modelConfig);
        saveModelConfig(state.modelConfig);
        results.push({ ...action, label: `LLM → ${state.modelConfig.llmProvider}/${state.modelConfig.llmModel}` });

      } else if (action.tool === 'update_analysis') {
        if (state.analysis) {
          state.analysis[action.field] = action.value;
          savePersistentState();
          results.push({ ...action, label: `분석 데이터 [${action.field}] → "${action.value}"` });
        }

      } else if (action.tool === 'regenerate_section') {
        results.push({ ...action, label: `섹션 [${action.sectionId}] 재생성 시작` });
        // 비동기로 실행 (채팅 응답 후에)
        setTimeout(() => generateSingleSection(action.sectionId), 500);
      }
    } catch(e) {
      console.warn('Action failed:', action, e);
    }
  }
  return results;
}

function agentLastBubble() {
  const bubbles = document.querySelectorAll('.agent-bubble.assistant');
  return bubbles[bubbles.length - 1] || null;
}
function agentSetStatus(text) {
  const el = agentLastBubble()?.querySelector('[data-agent-status]');
  if (el) el.textContent = text;
}
function agentAddStep(label, done) {
  const msg = state.agentMessages[state.agentMessages.length - 1];
  if (!msg || msg.role !== 'assistant') return;
  msg.steps = msg.steps || [];
  msg.steps.push({ label, done });

  const stepsEl = agentLastBubble()?.querySelector('[data-agent-steps]');
  if (!stepsEl) return;
  const spinnerRow = stepsEl.querySelector('[data-agent-status]')?.parentElement;
  const newRow = document.createElement('div');
  newRow.style.cssText = `display:flex;align-items:center;gap:6px;font-size:11px;color:${done?'var(--ok)':'var(--primary-h)'};font-family:monospace;padding:3px 0;border-bottom:1px solid var(--border)`;
  newRow.dataset.stepRow = '';
  newRow.innerHTML = `<span class="material-icons-outlined" style="font-size:13px">${done?'check_circle':'pending'}</span><span>${label}</span>`;
  if (spinnerRow) stepsEl.insertBefore(newRow, spinnerRow);
  else stepsEl.appendChild(newRow);
  scrollAgentToBottom();
}
function agentMarkLastStepDone() {
  const stepsEl = agentLastBubble()?.querySelector('[data-agent-steps]');
  if (!stepsEl) return;
  const rows = [...stepsEl.querySelectorAll('[data-step-row=""]')];
  const last = rows[rows.length - 1];
  if (last) {
    last.style.color = 'var(--ok)';
    const icon = last.querySelector('.material-icons-outlined');
    if (icon) icon.textContent = 'check_circle';
  }
}

async function agentSendMessage(userText) {
  if (!userText.trim() || state.agentStreaming) return;

  state.agentMessages.push({ role: 'user', content: userText });
  state.agentStreaming = true;
  const assistantIdx = state.agentMessages.length;
  state.agentMessages.push({ role: 'assistant', content: '', steps: [], done: false });
  render();
  scrollAgentToBottom();

  try {
    let llm;
    try { llm = getLLMClient(); } catch(e) {
      state.agentMessages[assistantIdx].content = `⚠️ LLM 연결 없음: ${e.message}`;
      state.agentMessages[assistantIdx].done = true;
      state.agentStreaming = false;
      render(); return;
    }

    // ① LLM 호출
    agentSetStatus('명령 분석 중...');
    const systemPrompt = agentGetSystemPrompt();
    const history = state.agentMessages.slice(0, -1);
    let rawResponse = '';
    if (llm instanceof GeminiAPI) rawResponse = await agentCallGemini(llm, systemPrompt, history);
    else if (llm instanceof OpenAIAPI) rawResponse = await agentCallOpenAI(llm, systemPrompt, history);

    let parsed = { reply: '', actions: [] };
    try {
      const cleaned = rawResponse.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
      parsed = JSON.parse(cleaned);
    } catch(e) { parsed = { reply: rawResponse, actions: [] }; }

    // ② 액션 실행 — 각 스텝을 DOM에 실시간 표시
    if (parsed.actions && parsed.actions.length > 0) {
      agentSetStatus('처리 중...');
      for (const action of parsed.actions) {
        const label = agentActionLabel(action);
        agentAddStep(label, false);
        await new Promise(r => setTimeout(r, 100));
        await executeAgentActions([action]);
        agentMarkLastStepDone();
        await new Promise(r => setTimeout(r, 80));
      }
    }

    // ③ spinner 제거 후 타이프라이터
    const bubble = agentLastBubble();
    const spinnerRow = bubble?.querySelector('[data-agent-status]')?.parentElement;
    if (spinnerRow) spinnerRow.remove();

    const replyText = parsed.reply || '';
    state.agentMessages[assistantIdx].content = replyText;

    if (bubble && replyText) {
      const twDiv = document.createElement('div');
      twDiv.style.cssText = 'white-space:pre-wrap;margin-top:6px;font-size:13px;line-height:1.6';
      const twSpan = document.createElement('span');
      const cursor = document.createElement('span');
      cursor.className = 'agent-cursor';
      twDiv.appendChild(twSpan);
      twDiv.appendChild(cursor);
      bubble.appendChild(twDiv);

      for (let i = 0; i <= replyText.length; i++) {
        twSpan.textContent = replyText.slice(0, i);
        if (i % 4 === 0) scrollAgentToBottom();
        await new Promise(r => setTimeout(r, 14));
      }
      cursor.remove();
    }

    state.agentMessages[assistantIdx].done = true;

  } catch(e) {
    state.agentMessages[assistantIdx].content = `오류가 발생했습니다: ${e.message}`;
    state.agentMessages[assistantIdx].done = true;
  }

  state.agentStreaming = false;
  render();
  scrollAgentToBottom();
}

function agentActionLabel(action) {
  const map = {
    add_directive:            `이미지 제약 추가 → "${(action.text||'').slice(0,50)}"`,
    remove_directive:         `이미지 제약 삭제 → "${action.match||''}"`,
    clear_directives:         '모든 이미지 제약 초기화',
    set_section_instruction:  `섹션 [${action.sectionId}] 지시사항 설정`,
    clear_section_instruction:`섹션 [${action.sectionId}] 지시사항 삭제`,
    set_image_model:          `이미지 모델 변경 → ${action.modelId}`,
    set_llm_model:            `LLM 변경 → ${action.provider}/${action.modelId}`,
    update_analysis:          `분석 데이터 [${action.field}] 수정 → "${action.value}"`,
    regenerate_section:       `섹션 [${action.sectionId}] 재생성 시작`,
  };
  return map[action.tool] || action.tool;
}

async function agentCallGemini(llm, systemPrompt, history) {
  const contents = [
    { role: 'user', parts: [{ text: systemPrompt }] },
    { role: 'model', parts: [{ text: '{"reply":"알겠습니다. 명령을 기다리겠습니다.","actions":[]}' }] },
    ...history.map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.content || '{}' }]
    }))
  ];
  const body = { contents, generationConfig: { temperature: 0.3, maxOutputTokens: 1024 } };
  const data = await llm._generateContent(llm.model, body);
  return data.candidates[0].content.parts[0].text.trim();
}

async function agentCallOpenAI(llm, systemPrompt, history) {
  const messages = [
    { role: 'system', content: systemPrompt },
    ...history.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content || '' }))
  ];
  const body = { model: llm.model, messages, temperature: 0.3, max_completion_tokens: 1024 };
  const res = await fetch(`${llm.baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${llm.apiKey}` },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content.trim();
}

function scrollAgentToBottom() {
  setTimeout(() => {
    const el = document.getElementById('agentMsgs');
    if (el) el.scrollTop = el.scrollHeight;
  }, 0);
}

function saveImageDirectives() {
  saveJson(STORAGE_KEYS.imageDirectives, state.imageDirectives);
  savePersistentState();
}

async function addImageDirective(rawText) {
  if (!rawText.trim()) return;
  state.imageDirectiveProcessing = true;
  render();

  let processed = rawText.trim();
  // 설정된 LLM으로 자연어 지시사항 → 이미지 프롬프트 제약 조건으로 변환
  try {
    const llm = getLLMClient();
    const convPrompt = `You are helping convert a user's natural language instruction about image generation into a concise English constraint for an AI image generator.

User instruction (Korean or English): "${rawText}"

Convert this into a short, clear English constraint (1-2 sentences max) that can be appended to an image generation prompt. Be specific and actionable. Return ONLY the constraint text, nothing else.`;

    let result = '';
    if (llm instanceof GeminiAPI) {
      const body = { contents: [{ parts: [{ text: convPrompt }] }], generationConfig: { temperature: 0.2, maxOutputTokens: 150 } };
      const data = await llm._generateContent(llm.model, body);
      result = data.candidates[0].content.parts[0].text.trim();
    } else if (llm instanceof OpenAIAPI) {
      const body = { model: llm.model, messages: [{ role: 'user', content: convPrompt }], max_completion_tokens: 150, temperature: 0.2 };
      const res = await fetch(`${llm.baseUrl}/chat/completions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${llm.apiKey}` }, body: JSON.stringify(body) });
      const data = await res.json();
      result = data.choices[0].message.content.trim();
    }
    if (result) processed = result;
  } catch(e) {
    console.warn('Directive LLM processing failed, using raw text:', e);
  }

  const directive = { id: Date.now(), original: rawText.trim(), text: processed, active: true };
  state.imageDirectives.push(directive);
  state.imageDirectiveInput = '';
  state.imageDirectiveProcessing = false;
  saveImageDirectives();
  render();
}

let driveService = null;
let tokenClient = null;

// 토큰 자동 갱신 — 사용자 팝업 없이 silent 시도, 실패 시 팝업
function refreshDriveToken() {
  return new Promise((resolve, reject) => {
    const clientId = state.auto.gdClientId || localStorage.getItem('gd_client_id') || '';
    const oauth = window.google?.accounts?.oauth2;
    if (!clientId || !oauth) {
      reject(new Error('Google OAuth 초기화 안 됨'));
      return;
    }
    const client = oauth.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
      prompt: '',  // silent 갱신 시도
      callback: (resp) => {
        if (resp.error) {
          autoLog('err', '토큰 갱신 실패 — Google Drive 재연결 필요');
          state.auto.driveConnected = false;
          render();
          reject(new Error(resp.error));
          return;
        }
        if (resp.access_token) {
          state.auto.accessToken = resp.access_token;
          state.auto.driveConnected = true;
          if (driveService) {
            driveService.token = resp.access_token;
            driveService.tokenExpiresAt = Date.now() + 3500 * 1000;
          } else {
            driveService = new DriveService(resp.access_token);
          }
          autoLog('ok', '토큰 자동 갱신 완료');
          resolve();
        } else {
          autoLog('err', '토큰 갱신 실패 — Google Drive 재연결 필요');
          state.auto.driveConnected = false;
          render();
          reject(new Error('Token refresh failed'));
        }
      },
    });
    client.requestAccessToken();
  });
}

function initGoogleAuth() {
  const clientId = state.auto.gdClientId || GD_CLIENT_ID;
  if (!clientId) return;
  const oauth = window.google?.accounts?.oauth2;
  if (!oauth) return;
  try {
    tokenClient = oauth.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
      callback: (resp) => {
        if (resp.error) {
          autoLog('info', 'Google Drive 자동 재연결 대기 중: ' + resp.error);
          return;
        }
        if (resp.access_token) {
          state.auto.accessToken = resp.access_token;
          state.auto.driveConnected = true;
          driveService = new DriveService(resp.access_token);
          autoLog('info', 'Google Drive 연결 완료');
          render();
        }
      },
    });
    if (!state.auto.driveConnected && !initGoogleAuth._silentAttempted) {
      initGoogleAuth._silentAttempted = true;
      setTimeout(() => {
        try {
          tokenClient?.requestAccessToken({ prompt: '' });
        } catch(e) {
          autoLog('info', 'Google Drive 자동 재연결 대기 중');
        }
      }, 200);
    }
  } catch(e) { console.warn('Google auth init failed:', e); }
}

async function ensureDriveServiceReady() {
  if (driveService) return true;
  try {
    await refreshDriveToken();
    return !!driveService;
  } catch(e) {
    return false;
  }
}

function connectDrive() {
  const clientId = document.getElementById('gdClientId')?.value.trim() || GD_CLIENT_ID;
  if (!clientId) {
    state.error = 'Google Cloud OAuth Client ID를 입력하세요.';
    render();
    return;
  }
  localStorage.setItem('gd_client_id', clientId);
  state.auto.gdClientId = clientId;
  try {
    const oauth = window.google?.accounts?.oauth2;
    if (!oauth) throw new Error('Google OAuth 스크립트가 아직 로드되지 않았습니다.');
    tokenClient = oauth.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
      callback: (resp) => {
        if (resp.error) {
          state.error = `Drive 인증 실패: ${resp.error}`;
          render();
          return;
        }
        state.auto.accessToken = resp.access_token;
        state.auto.driveConnected = true;
        driveService = new DriveService(resp.access_token);
        autoLog('info', 'Google Drive 연결 완료');
        render();
      },
    });
    tokenClient.requestAccessToken();
  } catch(e) {
    state.error = `Google 인증 오류: ${e.message}`;
    render();
  }
}

const autoLogs = [];
function autoLog(type, msg) {
  const t = new Date().toLocaleTimeString('ko-KR');
  autoLogs.unshift({ type, msg, time: t });
  if (autoLogs.length > 200) autoLogs.length = 200;
}

function escAttr(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function parsePositiveInt(value, fallback, min, max) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

async function fetchServerAutomationConfig() {
  const base = saveServerAutomationApiBase(state.auto.serverApiBase);
  state.auto.serverApiBase = base;
  state.auto.serverLoading = true;
  state.auto.serverError = '';
  render();
  try {
    assertServerAutomationApiBaseAllowed(base);
    const res = await fetch(`${base}/pdp/automation/config`);
    const data = await res.json();
    if (!res.ok || !data?.ok) {
      throw new Error(data?.message || data?.error || '자동화 설정 조회 실패');
    }
    state.auto.serverConfig = data;
    state.auto.serverStatus = data.status || null;
    // 서버 커스텀 컷을 draftCuts에 한 번만 동기화 (로컬 편집 덮어쓰기 방지)
    if (!state.auto.draftCutsFromServer) {
      const serverCuts = data?.profiles?.['image-cuts']?.customCuts;
      if (Array.isArray(serverCuts) && serverCuts.some(c => c?.prompt?.trim())) {
        const synced = serverCuts.slice(0, 10).map(c => ({label: String(c?.label||''), prompt: String(c?.prompt||'')}));
        while (synced.length < 10) synced.push({label:'',prompt:''});
        state.auto.draftCuts = synced;
        saveDraftCuts(synced);
      }
      state.auto.draftCutsFromServer = true;
    }
    autoLog('ok', '서버 자동화 상태를 불러왔습니다.');
  } catch(e) {
    state.auto.serverError = e.message || String(e);
    autoLog('err', `서버 자동화 연결 실패: ${state.auto.serverError}`);
  } finally {
    state.auto.serverLoading = false;
    render();
  }
}

}

async function runServerAutomationMode(mode) {
  const base = saveServerAutomationApiBase(state.auto.serverApiBase);
  state.auto.serverApiBase = base;
  state.auto.serverError = '';

  // 실행 전 현재 설정(폴더ID, 프롬프트, 모델)을 서버에 먼저 저장 — enabled는 현재 상태 유지
  try {
    assertServerAutomationApiBaseAllowed(base);
    const modeId = mode === 'image-cuts' ? 'ImageCuts' : 'DetailPage';
    const currentProfile = state.auto.serverConfig?.profiles?.[mode] || {};
    const profileUpdate = {
      enabled: !!currentProfile.enabled,
      inputFolderId: extractFolderId(document.getElementById(`serverInput${modeId}`)?.value?.trim() || ''),
      sourceDoneFolderId: extractFolderId(document.getElementById(`serverDone${modeId}`)?.value?.trim() || ''),
      outputFolderId: extractFolderId(document.getElementById(`serverOutput${modeId}`)?.value?.trim() || ''),
      pollIntervalSeconds: parsePositiveInt(document.getElementById(`serverPoll${modeId}`)?.value, 120, 30, 3600),
      maxFilesPerRun: parsePositiveInt(document.getElementById(`serverMax${modeId}`)?.value, 1, 1, 20),
      imageModel: document.getElementById(`serverModel${modeId}`)?.value || currentProfile.imageModel || 'gemini-3.1-flash-image-preview',
      outputImageSize: document.getElementById(`serverResolution${modeId}`)?.value || null
    };
    if (mode === 'image-cuts') {
      profileUpdate.customCuts = state.auto.draftCuts.map(c => ({label: c.label, prompt: c.prompt}));
    }
    const saveRes = await fetch(`${base}/pdp/automation/config`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({profiles: {[mode]: profileUpdate}})
    });
    const saveData = await saveRes.json();
    if (saveData?.ok) {
      state.auto.serverConfig = saveData;
      autoLog('ok', '설정을 서버에 저장했습니다.');
    }
  } catch(e) {
    autoLog('err', `설정 저장 실패: ${e.message}`);
  }

  try {
    assertServerAutomationApiBaseAllowed(base);
    const res = await fetch(`${base}/pdp/automation/run`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode })
    });
    const data = await res.json();
    if (!res.ok || !data?.ok) {
      throw new Error(data?.message || data?.error || '자동 실행 요청 실패');
    }
    if (data.status) { state.auto.serverStatus = data.status; patchAutomationStatusInPlace(); }
    autoLog('info', data.message || `${mode} 실행을 요청했습니다.`);
    startStatusPolling(base, mode);
  } catch(e) {
    state.auto.serverError = e.message || String(e);
    autoLog('err', `서버 실행 요청 실패: ${state.auto.serverError}`);
  }
}

let _statusPollTimer = null;
function startStatusPolling(base, mode) {
  if (_statusPollTimer) clearInterval(_statusPollTimer);
  _statusPollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${base}/pdp/automation/status`);
      if (!res.ok) return;
      const data = await res.json();
      state.auto.serverStatus = data;
      patchAutomationStatusInPlace();
      const modeStatus = data?.byMode?.[mode];
      if (!modeStatus?.isRunning) {
        clearInterval(_statusPollTimer);
        _statusPollTimer = null;
        autoLog('info', `${mode} 작업이 완료되었습니다.`);
        patchAutomationStatusInPlace();
      }
    } catch(e) { /* 무시 */ }
  }, 2000);
}

// 깜빡임 없이 상태/로그만 DOM 직접 업데이트
function patchAutomationStatusInPlace() {
  const status = state.auto.serverStatus;
  const allEvents = status?.recentEvents || [];
  const modes = [['image-cuts','ImageCuts'],['detail-page','DetailPage']];
  for (const [mode, modeId] of modes) {
    const modeStatus = status?.byMode?.[mode];
    const profile = state.auto.serverConfig?.profiles?.[mode];
    const running = !!modeStatus?.isRunning;
    const autoEnabled = !!profile?.enabled;

    const statusEl = document.getElementById(`autoStatusLine-${modeId}`);
    if (statusEl) {
      const pollInterval = profile?.pollIntervalSeconds || 120;
      statusEl.textContent = '상태: ' + (running ? '실행 중' : (autoEnabled ? `자동화 ON (${pollInterval}초 간격)` : '자동화 OFF'));
      statusEl.style.color = running ? 'var(--ok)' : (autoEnabled ? '#4a9eff' : 'var(--text-d)');
    }
    const summaryEl = document.getElementById(`autoSummaryLine-${modeId}`);
    if (summaryEl) summaryEl.textContent = '최근 요약: ' + (modeStatus?.lastSummary || '기록 없음');
    const errorEl = document.getElementById(`autoErrorLine-${modeId}`);
    if (errorEl) {
      const err = modeStatus?.lastError || '';
      errorEl.textContent = err ? '최근 오류: ' + err : '';
      errorEl.style.display = err ? '' : 'none';
    }
    const logEl = document.getElementById(`autoLogBox-${modeId}`);
    if (logEl) logEl.innerHTML = buildEventLogInner(mode, modeStatus, allEvents);
    const autoStartBtn = document.getElementById(`serverAutoStart${modeId}`);
    if (autoStartBtn) autoStartBtn.disabled = autoEnabled;
    const autoStopBtn = document.getElementById(`serverAutoStop${modeId}`);
    if (autoStopBtn) autoStopBtn.disabled = !autoEnabled && !running;
    const runBtn = document.getElementById(`serverRun${modeId}`);
    if (runBtn) runBtn.textContent = running ? '실행 중...' : '즉시 실행';
  }
}

function buildEventLogInner(mode, modeStatus, allEvents) {
  const modeEvents = allEvents.filter(e => e.mode === mode).slice(0, 20);
  if (!modeEvents.length) return '<span style="font-size:11px;color:var(--text-d)">로그 없음</span>';
  return modeEvents.map(e => {
    const t = new Date(e.timestamp).toLocaleTimeString('ko-KR');
    const isErr = e.level === 'error';
    const color = isErr ? 'var(--err)' : 'var(--text-d)';
    const icon = isErr ? '✖' : '●';
    const fileName = e.fileName ? `<span style="color:var(--text-m);margin-left:4px">[${escAttr(e.fileName)}]</span>` : '';
    return `<div style="display:flex;gap:6px;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
      <span style="color:var(--text-m);white-space:nowrap;flex-shrink:0">${t}</span>
      <span style="color:${color};flex-shrink:0">${icon}</span>
      <span style="color:${isErr?'var(--err)':'var(--text)'}">${escAttr(e.message)}${fileName}</span>
    </div>`;
  }).join('');
}

const AUTO_RESOLUTION_OPTIONS = [

  return AUTO_RESOLUTION_OPTIONS.map(o =>
    `<option value="${o.value}" ${cur === o.value ? 'selected' : ''}>${o.label}</option>`

}

          <div>

            <textarea class="input" id="serverCutPrompt${modeId}_${i}" rows="2" placeholder="이미지 생성 프롬프트를 입력하세요. 비워두면 이 슬롯은 건너뜁니다." style="font-size:12px;resize:vertical">${escAttr(cut.prompt)}</textarea>
          </div>

    }).join('');

      ? `<span style="color:var(--ok)">✔ 프롬프트 ${activeCount}개 설정됨 — 실행 시 ${activeCount}개 이미지 생성</span>`

        <p style="font-size:12px;margin:0 0 10px">${modeNote}</p>
        ${rows}
      </div>`;
  })() : '';

  const allEvents = (state.auto.serverStatus || state.auto.serverConfig?.status || {})?.recentEvents || [];

  return `
    <div class="auto-card" style="margin-top:10px">
      <h3 style="margin-bottom:10px">${title}</h3>

      <div class="input-group"><label class="label">결과 출력 폴더 ID/URL</label><input class="input" id="serverOutput${modeId}" value="${escAttr(profile.outputFolderId)}" placeholder="Drive folder ID or URL"></div>

        <div class="input-group"><label class="label">확인 간격(초)</label><input class="input" id="serverPoll${modeId}" type="number" min="30" max="3600" value="${escAttr(profile.pollIntervalSeconds)}"></div>

        <div class="input-group"><label class="label">이미지 생성 모델</label><select class="input" id="serverModel${modeId}" style="height:38px">${modelOptions}</select></div>

  `;
}

      <p style="font-size:12px;color:var(--text-m);margin-bottom:12px">섹션 이미지와 이미지컷 생성에 사용됩니다. OpenAI 모델은 OpenAI API Key, Gemini 모델은 Vertex Backend URL 또는 Gemini API Key가 필요합니다.</p>
      <div class="model-list">
        ${IMAGE_MODELS.map(m => renderImgModelCard(m)).join('')}
      </div>
      ${needsGeminiImageCreds ? `
      <div class="input-group" style="margin-top:4px">
        <label class="label">이미지 생성용 Vertex Backend URL (권장)</label>
        <input type="text" class="input" id="geminiBackendInput" value="${state.backendBaseUrl || ''}" placeholder="http://localhost:5000" style="font-family:monospace;font-size:13px;margin-bottom:8px">
        <label class="label">이미지 생성용 Gemini API Key (선택)</label>
        <div style="position:relative">
          <input type="password" class="input" id="geminiKeyInput" value="${state.apiKey}" placeholder="AIza..." style="font-family:monospace;font-size:13px;padding-right:40px">
          <span class="material-icons-outlined" id="toggleGeminiKey" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;color:var(--text-m)">visibility</span>
        </div>
      </div>
      ` : ''}
      ${needsOpenAIImageCreds ? `
      <div class="input-group" style="margin-top:4px">
        <label class="label">이미지 생성용 OpenAI API Key</label>
        <div style="position:relative">
          <input type="password" class="input" id="openaiKeyInput" value="${runtimeOpenAIKey}" placeholder="sk-..." style="font-family:monospace;font-size:13px;padding-right:40px">
          <span class="material-icons-outlined" id="toggleOpenAIKey" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px;color:var(--text-m)">visibility</span>
        </div>
      </div>
      ` : ''}
      ${!needsGeminiImageCreds && !needsOpenAIImageCreds ? `
      <div style="font-size:11px;color:var(--text-m);margin-top:8px">
        현재 선택된 이미지 모델은 위의 LLM 설정과 같은 공급자 인증 정보를 그대로 사용합니다.
      </div>
      ` : ''}
    </div>

    <!-- ── 이미지 크기(픽셀) 설정 ── -->
    <div class="settings-section">
      <h3><span class="material-icons-outlined" style="font-size:18px;color:var(--cyan)">photo_size_select_large</span> 이미지 출력 크기</h3>
      <p style="font-size:12px;color:var(--text-m);margin-bottom:14px">
        AI가 생성한 이미지를 지정한 픽셀로 <b>정확하게</b> 출력합니다. (Canvas 리사이즈 적용)<br>
        auto 모드는 AI가 자유롭게 크기를 결정합니다.
      </p>

      <!-- 모드 토글 -->
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="provider-tab ${cfg.imageSizeMode==='auto' ? 'active-gemini' : ''}"
          id="imgSizeModeAuto" style="flex:1;padding:10px">
          <div class="pt-icon" style="font-size:16px;color:var(--text-d)">🔄</div>
          <div class="pt-label" style="font-size:13px">auto</div>
          <div class="pt-sub">AI가 크기 자동 결정</div>
        </button>
        <button class="provider-tab ${cfg.imageSizeMode==='custom' ? 'active-gemini' : ''}"
          id="imgSizeModeCustom" style="flex:1;padding:10px">
          <div class="pt-icon" style="font-size:16px;color:var(--cyan)">📐</div>
          <div class="pt-label" style="font-size:13px">custom px</div>
          <div class="pt-sub">정확한 픽셀 지정</div>
        </button>
      </div>

      <!-- 픽셀 입력 (custom 모드에서만 활성화) -->
      <div style="display:flex;gap:12px;align-items:flex-end;${cfg.imageSizeMode!=='custom'?'opacity:.4;pointer-events:none':''}">
        <div class="input-group" style="margin-bottom:0;flex:1">
          <label class="label">가로 (W) px</label>
          <input type="number" class="input" id="imgWidthInput"
            value="${cfg.imageWidth || 860}" min="64" max="4096" step="1"
            placeholder="860" style="font-family:monospace"
            ${cfg.imageSizeMode!=='custom' ? 'disabled' : ''}>
        </div>
        <div style="padding-bottom:10px;color:var(--text-m);font-size:18px">×</div>
        <div class="input-group" style="margin-bottom:0;flex:1">
          <label class="label">세로 (H) px <span style="font-weight:400;color:var(--text-m)">(비워두면 비율 유지)</span></label>
          <input type="number" class="input" id="imgHeightInput"
            value="${cfg.imageHeight || ''}" min="64" max="4096" step="1"
            placeholder="비율 유지" style="font-family:monospace"
            ${cfg.imageSizeMode!=='custom' ? 'disabled' : ''}>
        </div>
      </div>

      ${cfg.imageSizeMode === 'custom' ? `
      <div style="margin-top:10px;padding:8px 12px;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.2);border-radius:6px;font-size:12px;color:var(--cyan)">
        📐 설정됨: ${cfg.imageWidth}px × ${cfg.imageHeight ? cfg.imageHeight+'px' : '(비율 유지)'}
        — AI 생성 후 Canvas로 정확히 리사이즈됩니다
      </div>` : `
      <div style="margin-top:10px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text-m)">
        🔄 auto 모드 — AI가 자유롭게 크기를 결정합니다
      </div>`}
    </div>

    <!-- ── 저장 버튼 ── -->
    <div style="display:flex;gap:12px;align-items:center">
      <button class="btn-primary" id="saveModelSettings">
        <span class="material-icons-outlined" style="font-size:18px">save</span>
        설정 저장
      </button>
      <div id="modelSaveMsg" style="font-size:13px;color:var(--ok);display:none">✅ 저장되었습니다!</div>
    </div>

    <!-- ── Vertex AI 설정 ── -->
    <div class="settings-section" style="margin-top:24px;border-color:var(--primary)">
      <h3><span class="material-icons-outlined" style="font-size:18px;color:var(--primary)">cloud</span> Vertex AI 연결 설정 (공용)</h3>
      <p style="font-size:12px;color:var(--text-d);margin-bottom:12px">한 번 저장하면 이미지 업로드 분석 + 자동화 탭 전체에 즉시 적용됩니다. Google Cloud 계정을 바꿀 때 여기서만 수정하면 됩니다.</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
        <div class="input-group">
          <label class="label">Google Cloud Project ID</label>
          <input class="input" id="vertexProjectInput" placeholder="project-xxxxxxxx-xxxx-xxxx-xxx" style="font-family:monospace;font-size:12px" value="${state.vertexConfig?.project || ''}">
        </div>
        <div class="input-group">
          <label class="label">리전 (Location)</label>
          <select class="input" id="vertexLocationInput" style="height:38px">
            ${['us-central1','us-east1','us-west1','europe-west1','europe-west4','asia-northeast1','asia-southeast1'].map(r =>
              `<option value="${r}" ${(state.vertexConfig?.location||'us-central1')===r?'selected':''}>${r}</option>`
            ).join('')}
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-sm" id="saveVertexConfigBtn" style="background:var(--primary);color:#fff;border:none">저장 (즉시 적용)</button>
        <button class="btn-sm" id="loadVertexConfigBtn">현재 설정 불러오기</button>
        <span id="vertexSaveMsg" style="font-size:12px;color:var(--ok);display:none">✅ 저장됨</span>
        <span id="vertexErrMsg" style="font-size:12px;color:var(--err);display:none"></span>
      </div>
    </div>

    <!-- ── 현재 설정 요약 ── -->
    <div style="margin-top:24px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;font-size:12px;line-height:2">
      <div style="font-weight:700;margin-bottom:8px;color:var(--text-d)">현재 설정 요약</div>
      <div>LLM 프로바이더: <b style="color:${cfg.llmProvider==='openai'?'#10a37f':'var(--primary-h)'}">${LLM_PROVIDERS[cfg.llmProvider]?.label}</b></div>
      <div>LLM 모델: <code style="background:var(--bg);padding:1px 6px;border-radius:4px;font-size:11px">${cfg.llmModel}</code></div>
      <div>이미지 모델: <code style="background:var(--bg);padding:1px 6px;border-radius:4px;font-size:11px">${cfg.imageModel}</code></div>
      <div>이미지 크기: <b style="color:var(--cyan)">${cfg.imageSizeMode === 'custom' ? (cfg.imageWidth + 'px × ' + (cfg.imageHeight ? cfg.imageHeight+'px' : '비율유지')) : 'auto'}</b></div>
      <div>Vertex Backend: <span style="color:${state.backendBaseUrl?'var(--ok)':'var(--text-m)'}">${state.backendBaseUrl ? state.backendBaseUrl : '— 미설정'}</span></div>
      <div>OpenAI Key: <span style="color:${runtimeOpenAIKey?'var(--ok)':'var(--text-m)'}">${runtimeOpenAIKey ? '✅ 설정됨' : '— 미설정'}</span></div>
    </div>
  </div>`;
}

function makeDefaultProfile(mode) {
  return {
    enabled: false,
    inputFolderId: '',
    sourceDoneFolderId: '',
    outputFolderId: '',
    pollIntervalSeconds: mode === 'image-cuts' ? 120 : 180,
    maxFilesPerRun: 1,
    aspectRatio: mode === 'image-cuts' ? '3:4' : '9:16',
    imageModel: 'gemini-3.1-flash-image-preview',
    desiredTone: '',
    additionalInfo: '',
    customCuts: [],
    outputImageSize: null
  };
}

function renderAutomation() {
  const a = state.auto;
  const connected = a.driveConnected;
  const savedClientId = localStorage.getItem('gd_client_id') || '';
  const serverCfg = a.serverConfig;
  const serverDrive = serverCfg?.driveConnection || null;
  const serverProfiles = serverCfg?.profiles || {
    'image-cuts': makeDefaultProfile('image-cuts'),
    'detail-page': makeDefaultProfile('detail-page')
  };
  const serverModeStatus = (a.serverStatus || serverCfg?.status || {}).byMode || {};

  return `<div class="fade-in">
    <h1 class="page-title">🔄 자동화 시스템</h1>
    <p class="page-desc">구글 드라이브 폴더를 연결하면 설정한 간격마다 자동으로 상세페이지를 생성합니다.</p>

    <div class="auto-card" style="border-color:var(--primary);margin-bottom:14px">
      <h3><span class="material-icons-outlined" style="font-size:20px;color:var(--primary)">hub</span> 서버 Drive 자동화 연결 (권장)</h3>
      <p style="font-size:12px;color:var(--text-d);margin-bottom:10px">
        로컬 앱 실행 시 자동화 API(기본: <code>http://127.0.0.1:4000/v1</code>)를 호출해 image-cuts/detail-page를 제어합니다. GitHub Pages 같은 HTTPS 배포에서는 HTTPS API 엔드포인트가 필요합니다.
      </p>
      <div class="input-group" style="margin-bottom:8px">
        <label class="label">자동화 API Base</label>
        <input class="input" id="serverAutoApiBase" value="${escAttr(a.serverApiBase)}" placeholder="http://127.0.0.1:4000/v1" style="font-family:monospace">
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn-sm" id="serverAutoRefreshBtn">${a.serverLoading ? '불러오는 중...' : '상태 불러오기'}</button>
        ${serverDrive ? `<span class="auto-status ${serverDrive.ready ? 'running' : 'stopped'}">${serverDrive.ready ? 'Drive ready' : 'Drive not ready'}</span>` : ''}
        ${serverDrive?.accountEmail ? `<span style="font-size:12px;color:var(--text-d)">${serverDrive.accountEmail}</span>` : ''}
      </div>
      ${a.serverError ? `<p style="font-size:12px;color:var(--err);margin-top:8px">${a.serverError}</p>` : ''}
      ${serverDrive?.message ? `<p style="font-size:12px;color:var(--text-d);margin-top:8px">${serverDrive.message}</p>` : ''}
      ${!serverCfg && !a.serverLoading ? `<p style="font-size:12px;color:var(--text-m);margin-top:8px;padding:8px;background:var(--bg-input);border-radius:6px">⏳ API 서버 연결 대기 중 — 서버가 켜지면 자동으로 설정을 불러옵니다. 아래 프로파일은 기본값으로 표시됩니다.</p>` : ''}

      ${renderServerAutomationModeEditor('image-cuts', 'Image Cuts', serverProfiles['image-cuts'], serverModeStatus['image-cuts'])}
      ${renderServerAutomationModeEditor('detail-page', 'Detail Page', serverProfiles['detail-page'], serverModeStatus['detail-page'])}
    </div>

    <!-- Drive Connection -->
    <div class="auto-card">
      <h3><span class="material-icons-outlined" style="font-size:20px;color:var(--primary)">cloud</span> Google Drive 연결
        ${connected ? '<span class="auto-status running">● 연결됨</span>' : '<span class="auto-status stopped">● 미연결</span>'}
      </h3>
      ${!connected ? `
        <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px">
          <p style="font-size:13px;color:var(--warn);font-weight:600;margin-bottom:8px">⚠️ 반드시 start.bat으로 실행하세요</p>
          <p style="font-size:12px;color:var(--text-d);margin-bottom:4px">Google OAuth는 <code style="background:var(--bg-card);padding:2px 6px;border-radius:4px;color:var(--cyan)">http://localhost:8081</code> 에서만 작동합니다.</p>
          <p style="font-size:11px;color:var(--text-m)">file:///로 열면 인증이 차단됩니다. start.bat 더블클릭 → 브라우저에서 localhost:8080 접속</p>
        </div>
        <p style="font-size:13px;color:var(--text-d);margin-bottom:12px">
          <a href="https://console.cloud.google.com/apis/credentials" target="_blank" style="color:var(--primary)">Google Cloud Console</a>에서 OAuth 2.0 Client ID를 발급 받으세요.
        </p>
        <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;font-size:12px;color:var(--text-d)">
          <p style="font-weight:600;margin-bottom:6px">📋 설정 방법:</p>
          <p>1. 유형: <strong>웹 애플리케이션</strong></p>
          <p>2. 승인된 JavaScript 원본 추가:</p>
          <code style="display:block;background:var(--bg-card);padding:8px 12px;border-radius:6px;margin:6px 0;color:var(--cyan);font-size:13px">http://localhost:8081</code>
          <p>3. Google Drive API 활성화 필요 (<a href="https://console.cloud.google.com/apis/library/drive.googleapis.com" target="_blank" style="color:var(--primary)">여기서 활성화</a>)</p>
        </div>
        <div class="input-group" style="margin-bottom:12px">
          <label class="label">OAuth Client ID</label>
          <input type="text" class="input" id="gdClientId" value="${savedClientId}" placeholder="xxxx.apps.googleusercontent.com" style="font-size:12px;font-family:monospace">
        </div>
        <button class="btn-primary" id="connectDriveBtn">
          <span class="material-icons-outlined" style="font-size:18px">login</span>
          Google Drive 연결
        </button>
      ` : `
        <p style="font-size:13px;color:var(--ok)">✅ Google Drive가 연결되었습니다.</p>
      `}
    </div>

    ${connected ? `
    <!-- Folder Settings -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="auto-card">
        <h3><span class="material-icons-outlined" style="font-size:20px;color:var(--orange)">folder_open</span> 입력 폴더 (제품 이미지)</h3>
        <div class="input-group" style="margin-bottom:8px">
          <label class="label">Google Drive 폴더 ID</label>
          <input type="text" class="input" id="inputFolderId" value="${a.inputFolderId}" placeholder="폴더 URL 전체 또는 ID 붙여넣기" style="font-size:12px;font-family:monospace">
        </div>
        ${a.inputFolderName ? `<p style="font-size:12px;color:var(--ok)">📁 ${a.inputFolderName}</p>` : ''}
        <button class="btn-sm" id="setInputFolder" style="margin-top:4px">
          <span class="material-icons-outlined" style="font-size:14px">check</span> 폴더 설정
        </button>
        <p style="font-size:11px;color:var(--text-m);margin-top:8px">
          💡 드라이브 폴더 열고 URL에서 <code>folders/</code> 뒤의 문자열이 ID입니다
        </p>
      </div>

      <div class="auto-card">
        <h3><span class="material-icons-outlined" style="font-size:20px;color:var(--cyan)">drive_file_move</span> 출력 폴더 (상세페이지)</h3>
        <div class="input-group" style="margin-bottom:8px">
          <label class="label">Google Drive 폴더 ID</label>
          <input type="text" class="input" id="outputFolderId" value="${a.outputFolderId}" placeholder="폴더 URL 전체 또는 ID 붙여넣기" style="font-size:12px;font-family:monospace">
        </div>
        ${a.outputFolderName ? `<p style="font-size:12px;color:var(--ok)">📁 ${a.outputFolderName}</p>` : ''}
        <button class="btn-sm" id="setOutputFolder" style="margin-top:4px">
          <span class="material-icons-outlined" style="font-size:14px">check</span> 폴더 설정
        </button>
      </div>
    </div>

    <!-- Interval & Control -->
    <div class="auto-card">
      <h3><span class="material-icons-outlined" style="font-size:20px;color:var(--warn)">timer</span> 실행 간격</h3>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
        <input type="range" min="5" max="60" step="5" value="${a.intervalMin}" class="interval-slider" id="intervalSlider">
        <span style="font-size:24px;font-weight:700;color:var(--primary);min-width:60px;text-align:center" id="intervalDisplay">${a.intervalMin}분</span>
      </div>
      <p style="font-size:12px;color:var(--text-m)">입력 폴더에서 아직 처리 안 된 이미지를 1장씩 가져와 15섹션 상세페이지를 생성 후 출력 폴더에 저장합니다.</p>

      <div style="display:flex;gap:10px;margin-top:16px;align-items:center">
        ${!a.running ? `
          <button class="btn-primary" id="startAutoBtn" ${!a.inputFolderId||!a.outputFolderId?'disabled':''}>
            <span class="material-icons-outlined" style="font-size:18px">play_arrow</span>
            자동화 시작
          </button>
        ` : `
          <button class="btn-primary" id="stopAutoBtn" style="background:var(--err)">
            <span class="material-icons-outlined" style="font-size:18px">stop</span>
            자동화 중지
          </button>
        `}
        <button class="btn-sm" id="runOnceBtn" ${!a.inputFolderId||!a.outputFolderId||a.running?'disabled':''} style="padding:10px 16px">
          <span class="material-icons-outlined" style="font-size:16px">play_circle</span>
          1회 즉시 실행
        </button>
        <button class="btn-sm" id="resetProcessedBtn" style="padding:10px 16px">
          <span class="material-icons-outlined" style="font-size:16px">restart_alt</span>
          처리기록 초기화
        </button>
        ${a.running ? `<span class="auto-status running" style="margin-left:auto">● 작동 중 ${a.nextRunAt ? '| 다음 실행: '+a.nextRunAt : ''}</span>` : ''}
      </div>
    </div>

    <!-- Current Processing -->
    ${a.currentItem ? `
    <div class="auto-card" style="border-color:var(--warn)">
      <h3><span class="material-icons-outlined" style="font-size:20px;color:var(--warn)">hourglass_top</span> 현재 처리 중</h3>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <span style="font-size:13px;font-weight:600">${a.currentItem.name}</span>
        <span style="font-size:12px;color:var(--text-m)">${a.currentMsg}</span>
      </div>
      <div class="progress-outer" style="max-width:100%"><div class="progress-inner" style="width:${a.currentProgress}%">${a.currentProgress}%</div></div>
    </div>
    ` : ''}

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
      <div class="auto-card" style="text-align:center">
        <div style="font-size:32px;font-weight:900;color:var(--primary)">${a.totalProcessed}</div>
        <div style="font-size:12px;color:var(--text-d)">총 처리 완료</div>
      </div>
      <div class="auto-card" style="text-align:center">
        <div style="font-size:32px;font-weight:900;color:var(--warn)">${a.queue.length}</div>
        <div style="font-size:12px;color:var(--text-d)">대기 중</div>
      </div>
      <div class="auto-card" style="text-align:center">
        <div style="font-size:32px;font-weight:900;color:var(--ok)">${a.processedFileIds.size}</div>
        <div style="font-size:12px;color:var(--text-d)">누적 처리 (스킵)</div>
      </div>
    </div>

    <!-- Recent Completed -->

// AUTOMATION ENGINE
// ════════════════════════════════════════════════════════════════
async function autoProcessOne() {
  if (!driveService) {
    autoLog('err', 'Drive가 연결되지 않음');
    return;
  }
  if (!state.auto.inputFolderId || !state.auto.outputFolderId) {
    autoLog('err', '입력/출력 폴더가 설정되지 않음');
    return;
  }

  let autoLLM;
  try { autoLLM = getLLMClient(); } catch(e) { autoLog('err', e.message); return; }
  const autoImageReady = hasImageConnection();

  // 1. List images in input folder
  autoLog('info', '입력 폴더 스캔 중...');
  state.auto.currentMsg = '폴더 스캔 중...';
  state.auto.currentProgress = 0;
  render();

  let files;
  try {
    files = await driveService.listImages(state.auto.inputFolderId);
  } catch(e) {
    // 인증 만료인 경우 자동 갱신 시도
    if (e.message.includes('invalid authentication') || e.message.includes('401') || e.message.includes('Request had invalid')) {
      autoLog('info', '토큰 만료 감지 — 자동 갱신 시도...');
      try {
        await refreshDriveToken();
        files = await driveService.listImages(state.auto.inputFolderId);
      } catch(e2) {
        autoLog('err', `토큰 갱신 후에도 실패: ${e2.message}`);
        state.auto.currentItem = null;
        render();
        return;
      }
    } else {
      autoLog('err', `폴더 스캔 실패: ${e.message}`);
      state.auto.currentItem = null;
      render();
      return;
    }
  }

  // 2. Filter already processed
  const unprocessed = files.filter(f => !state.auto.processedFileIds.has(f.id));
  autoLog('info', `전체 ${files.length}장, 미처리 ${unprocessed.length}장`);

  if (unprocessed.length === 0) {
    autoLog('info', '처리할 새 이미지가 없습니다. 대기합니다.');
    state.auto.currentItem = null;
    render();
    return;
  }

  // 3. Pick the first unprocessed file
  const file = unprocessed[0];
  state.auto.currentItem = { id: file.id, name: file.name };
  state.auto.currentProgress = 5;
  state.auto.currentMsg = `${file.name} 다운로드 중...`;
  autoLog('info', `처리 시작: ${file.name}`);
  render();

  try {
    // 4. Download the image
    const imgData = await driveService.downloadFile(file.id);
    state.auto.currentProgress = 15;
    state.auto.currentMsg = 'AI 분석 중...';
    render();

    // 5. Analyze with selected LLM
    const analysis = await autoLLM.analyzeImage(imgData.base64, imgData.mime);
    autoLog('ok', `분석 완료: ${analysis.product_name || file.name}`);
    state.auto.currentProgress = 25;
    state.auto.currentMsg = '경쟁 분석 중...';
    render();

    // 6. Competitor search
    let compRef = '';
    try {
      const comp = await autoLLM.searchSimilarProducts(analysis.product_name || analysis.product_name_en, analysis.category);
      compRef = JSON.stringify(comp).substring(0, 1000);
      autoLog('ok', `경쟁 분석 완료: ${comp.similar_products?.length || 0}개`);
    } catch(e) {
      autoLog('err', '경쟁 분석 스킵: ' + e.message);
    }
    state.auto.currentProgress = 30;

    // 7. Generate all 15 sections
    const sectionContents = {};
    const sectionImages = {};
    const instructions = state.sectionInstructions; // use saved instructions

    for (let i = 0; i < SECTIONS.length; i++) {
      const s = SECTIONS[i];
      const pct = Math.round(30 + ((i / SECTIONS.length) * 60));
      state.auto.currentProgress = pct;
      state.auto.currentMsg = `[${i+1}/15] ${s.name} 생성 중...`;
      render();

      try {
        const content = await autoLLM.generateSectionContent(s, analysis, instructions[s.id] || '', compRef);
        sectionContents[s.id] = content;

        // Image generation follows the selected image model
        if (autoImageReady) {
          try {
            const imgPrompt = content.image_description || content.design_notes || s.purpose;
            const img = await generateWithSelectedImageModel(imgPrompt, imgData.base64, imgData.mime);
            if (img) sectionImages[s.id] = img;
          } catch(e) {}
        }
      } catch(e) {
        autoLog('err', `섹션 ${s.name} 실패: ${e.message}`);
        sectionContents[s.id] = { headline: s.name, subheadline: '생성 실패', body_text: e.message, color_scheme: {background:'#fff',text_primary:'#c00',text_secondary:'#e00'}, font_suggestion:{headline_size:'32px',body_size:'14px'} };
      }
      await new Promise(r => setTimeout(r, 500));
    }

    state.auto.currentProgress = 92;
    state.auto.currentMsg = 'HTML 생성 및 업로드 중...';
    render();

    // 8. Build HTML
    const htmlContent = buildExportHtml(analysis, sectionContents, sectionImages);

    // 9. Upload to Drive
    const productName = analysis.product_name || file.name.replace(/\.[^.]+$/, '');
    const fileName = `${productName}_상세페이지_${new Date().toISOString().slice(0,10)}.html`;
    const uploaded = await driveService.uploadHtml(state.auto.outputFolderId, fileName, htmlContent);
    autoLog('ok', `✅ 업로드 완료: ${fileName}`);

    // 10. Mark as processed
    state.auto.processedFileIds.add(file.id);
    localStorage.setItem('auto_processed_ids', JSON.stringify([...state.auto.processedFileIds]));
    state.auto.totalProcessed++;
    localStorage.setItem('auto_total_processed', state.auto.totalProcessed);
    state.auto.completed.unshift({ name: file.name, finishedAt: new Date().toLocaleTimeString('ko-KR'), error: null });
    if (state.auto.completed.length > 50) state.auto.completed.length = 50;
    localStorage.setItem('auto_completed', JSON.stringify(state.auto.completed));
    state.auto.currentItem = null;
    state.auto.currentProgress = 100;
    state.auto.currentMsg = '';
    render();

  } catch(e) {
    autoLog('err', `처리 실패 (${file.name}): ${e.message}`);
    state.auto.completed.unshift({ name: file.name, finishedAt: new Date().toLocaleTimeString('ko-KR'), error: e.message });
    if (state.auto.completed.length > 50) state.auto.completed.length = 50;
    localStorage.setItem('auto_completed', JSON.stringify(state.auto.completed));
    state.auto.currentItem = null;
    render();
  }
}
