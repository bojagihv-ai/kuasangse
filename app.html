function applyWorkspacePayload(payload, options = {}) {
  if (!payload) return;
  const next = cloneData(payload);
  state.currentProjectId = options.projectId !== undefined ? options.projectId : (state.currentProjectId || '');
  state.currentProjectName = next.name || '';
  state.currentProjectCreatedAt = options.createdAt || state.currentProjectCreatedAt || Date.now();
  state.step = next.step === 'generating' ? 'preview' : (next.step || (next.sectionContents ? 'preview' : 'upload'));
  state.productName = next.productName || '';
  state.imagePreview = next.imagePreview || null;
  state.imageBase64 = next.imageBase64 || null;
  state.imageMime = next.imageMime || null;
  state.analysis = next.analysis || null;
  state.competitorData = next.competitorData || null;
  state.analysisTimestamp = next.analysisTimestamp || null;
  state.sectionInstructions = next.sectionInstructions || {};
  state.sectionContents = next.sectionContents || {};
  state.sectionImages = next.sectionImages || {};
  state.sectionLocks = next.sectionLocks || {};
  state.sectionVariants = next.sectionVariants || {};
  state.currentSectionVariantIds = next.currentSectionVariantIds || {};
  state.aiRepairUndoStack = next.aiRepairUndoStack || {};
  state.manualSectionEdits = next.manualSectionEdits || {};
  state.detailImageBlocks = Array.isArray(next.detailImageBlocks) ? next.detailImageBlocks : [];
  state.imageDirectives = Array.isArray(next.imageDirectives) ? next.imageDirectives : [];
  state.modelConfig = normalizeModelConfig(next.modelConfig || state.modelConfig);
  state.layoutTemplate = LAYOUT_TEMPLATES.some(t => t.id === next.layoutTemplate) ? next.layoutTemplate : state.layoutTemplate;
  state.activeBrandPresetId = typeof next.activeBrandPresetId === 'string' ? next.activeBrandPresetId : state.activeBrandPresetId;
  state.brandPresetDraft = getInitialBrandPresetDraft(state.activeBrandPresetId);
  state.contentVersion = Number.isFinite(next.contentVersion) ? next.contentVersion : (state.contentVersion || 0);
  state.qaVersion = Number.isFinite(next.qaVersion) ? next.qaVersion : 0;
  state.qaReport = null;
  state.sectionGenerating = {};
  state.progress = 0;
  state.progressMsg = '';
  if (next.compPage) {
    state.compPage.analysisResult = next.compPage.analysisResult || null;
    state.compPage.sectionPlan = next.compPage.sectionPlan || null;
    state.compPage.planEdits = next.compPage.planEdits || {};
    saveCompAnalysis(state.compPage.analysisResult, state.compPage.sectionPlan, state.compPage.planEdits);
  }
  saveSectionInstructions(state.sectionInstructions);
  saveImageDirectives();
  saveModelConfig(state.modelConfig);
  saveLayoutTemplate(state.layoutTemplate);
  saveActiveBrandPresetId(state.activeBrandPresetId);
  savePersistentState();
}

async function refreshWorkspaceLists(renderAfter = true) {
  try {
    const [projects, snapshots] = await Promise.all([
      workspaceGetAll(WORKSPACE_DB.projects),
      workspaceGetAll(WORKSPACE_DB.snapshots),
    ]);
    const counts = {};
    for (const snap of snapshots) counts[snap.projectId] = (counts[snap.projectId] || 0) + 1;
    state.projects = projects
      .map(project => ({ ...project, snapshotCount: counts[project.id] || 0 }))
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    state.snapshots = snapshots
      .filter(snap => snap.projectId === state.currentProjectId)
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    state.projectsLoaded = true;
  } catch (e) {
    state.projectsLoaded = true;
    console.warn('Workspace list load failed:', e);
  }
  if (renderAfter) render();
}

async function saveCurrentProject() {
  state.projectBusy = true;
  render();
  try {
    const id = state.currentProjectId || uid('project');
    const existing = state.currentProjectId ? await workspaceGet(WORKSPACE_DB.projects, id) : null;
    const name = deriveProjectName();
    const record = {
      id,
      name,
      createdAt: existing?.createdAt || state.currentProjectCreatedAt || Date.now(),
      updatedAt: Date.now(),
      payload: buildWorkspacePayload(),
    };
    await workspacePut(WORKSPACE_DB.projects, record);
    state.currentProjectId = id;
    state.currentProjectName = name;
    state.currentProjectCreatedAt = record.createdAt;
    await refreshWorkspaceLists(false);
    savePersistentState();
  } catch (e) {
    state.error = `프로젝트 저장 실패: ${e.message}`;
  } finally {
    state.projectBusy = false;
    render();
  }
}

async function saveCurrentSnapshot() {
  if (!state.analysis && !Object.keys(state.sectionContents || {}).length) {
    state.error = '스냅샷을 만들려면 먼저 작업물이 있어야 합니다.';
    render();
    return;
  }
  if (!state.currentProjectId) await saveCurrentProject();
  if (!state.currentProjectId) return;
  state.projectBusy = true;
  render();
  try {
    await workspacePut(WORKSPACE_DB.snapshots, {
      id: uid('snapshot'),
      projectId: state.currentProjectId,
      projectName: deriveProjectName(),
      createdAt: Date.now(),
      label: new Date().toLocaleString('ko-KR'),
      payload: buildWorkspacePayload(),
    });
    await refreshWorkspaceLists(false);
  } catch (e) {
    state.error = `스냅샷 저장 실패: ${e.message}`;
  } finally {
    state.projectBusy = false;
    render();
  }
}

async function loadProjectRecord(projectId) {

async function deleteProjectRecord(projectId) {
  try {
    const snapshots = await workspaceGetAll(WORKSPACE_DB.snapshots);
    const linked = snapshots.filter(s => s.projectId === projectId);
    for (const snap of linked) await workspaceDelete(WORKSPACE_DB.snapshots, snap.id);

    if (state.currentProjectId === projectId) {
      state.currentProjectId = '';
      state.currentProjectName = '';

      state.snapshots = [];
      savePersistentState();

function sectionContentFingerprint(content, imageData) {
  return JSON.stringify({
    headline: content?.headline || '',
    subheadline: content?.subheadline || '',
    body_text: content?.body_text || '',
    cta_text: content?.cta_text || '',
    extra_elements: content?.extra_elements || [],
    image: imageData ? `img:${String(imageData).slice(0, 32)}` : '',
  });
}

function nextVariantLabel(sectionId, source = 'variant') {
  const list = state.sectionVariants[sectionId] || [];
  const count = list.length + 1;
  if (source === 'manual') return `수정안 ${count}`;
  if (source === 'baseline') return `기준안 ${count}`;
  return `시안 ${count}`;
}

function rememberSectionVariant(sectionId, content, imageData, source = 'variant', explicitLabel = '') {
  if (!content) return null;
  const list = state.sectionVariants[sectionId] || [];
  const fingerprint = sectionContentFingerprint(content, imageData);
  if (list.some(item => item.fingerprint === fingerprint)) return list.find(item => item.fingerprint === fingerprint);
  const variant = {
    id: uid(`variant_${sectionId}`),
    label: explicitLabel || nextVariantLabel(sectionId, source),
    source,
    createdAt: Date.now(),
    fingerprint,
    content: cloneData(content),
    image: imageData || null,
  };
  state.sectionVariants[sectionId] = [variant, ...list].slice(0, 8);
  return variant;
}

function captureCurrentSectionVariant(sectionId, source = 'baseline', label = '') {
  return rememberSectionVariant(sectionId, state.sectionContents[sectionId], state.sectionImages[sectionId] || null, source, label);
}

function applySectionContent(sectionId, content, imageData, source = 'variant', label = '') {
  const effectiveImage = imageData === undefined ? (state.sectionImages[sectionId] || null) : imageData;
  state.sectionContents[sectionId] = cloneData(content);
  if (imageData === null) delete state.sectionImages[sectionId];
  else if (imageData !== undefined) state.sectionImages[sectionId] = imageData;
  const variant = rememberSectionVariant(sectionId, state.sectionContents[sectionId], effectiveImage, source, label);
  if (variant) state.currentSectionVariantIds[sectionId] = variant.id;
  markContentChanged();
}

function applySectionVariant(sectionId, variantId) {
  const variant = (state.sectionVariants[sectionId] || []).find(item => item.id === variantId);
  if (!variant) return;
  state.sectionContents[sectionId] = cloneData(variant.content);
  if (variant.image) state.sectionImages[sectionId] = variant.image;
  else delete state.sectionImages[sectionId];
  state.currentSectionVariantIds[sectionId] = variant.id;
  markContentChanged();
  render();
}

function getAiRepairUndoStack(sectionId, create = true) {
  if (!sectionId) return [];
  if (!state.aiRepairUndoStack || typeof state.aiRepairUndoStack !== 'object') {
    if (!create) return [];
    state.aiRepairUndoStack = {};
  }
  if (!Array.isArray(state.aiRepairUndoStack[sectionId])) {
    if (!create) return [];
    state.aiRepairUndoStack[sectionId] = [];
  }
  return state.aiRepairUndoStack[sectionId];
}

function canUndoAiRepair(sectionId) {
  return getAiRepairUndoStack(sectionId, false).some(item => item?.image);
}

function pushAiRepairUndo(sectionId, imageData, content, mode = 'spot') {
  if (!sectionId || !imageData) return;
  const stack = getAiRepairUndoStack(sectionId);
  const entry = {
    id: uid(`repair_undo_${sectionId}`),
    label: mode === 'replace' ? 'AI 부분 교체 전' : 'AI 스팟 복구 전',
    mode,
    image: imageData,
    content: cloneData(content || state.sectionContents[sectionId] || {}),
    createdAt: Date.now(),
  };
  state.aiRepairUndoStack[sectionId] = [entry, ...stack].slice(0, 5);
}

function undoAiRepair(sectionId) {
  const stack = getAiRepairUndoStack(sectionId);
  const entryIndex = stack.findIndex(item => item?.image);
  if (entryIndex < 0) {
    state.error = '되돌릴 AI 수정 기록이 없습니다.';
    render();
    return;
  }
  const [entry] = stack.splice(entryIndex, 1);
  state.aiRepairUndoStack[sectionId] = stack;
  if (state.sectionContents[sectionId] || state.sectionImages[sectionId]) {
    rememberSectionVariant(sectionId, state.sectionContents[sectionId], state.sectionImages[sectionId] || null, 'variant', 'AI 되돌리기 전');
  }
  state.sectionContents[sectionId] = cloneData(entry.content || state.sectionContents[sectionId] || {});
  state.sectionImages[sectionId] = entry.image;
  const variant = rememberSectionVariant(sectionId, state.sectionContents[sectionId], entry.image, 'baseline', entry.label || 'AI 수정 전');
  if (variant) state.currentSectionVariantIds[sectionId] = variant.id;
  markContentChanged();
  savePersistentState();
  render();
}

function saveManualSectionContent(sectionId, patch) {
  const current = cloneData(state.sectionContents[sectionId] || {});
  current.headline = patch.headline;
  current.subheadline = patch.subheadline;
  current.body_text = patch.body_text;
  current.cta_text = patch.cta_text;
  current.extra_elements = (patch.extra_elements || '')
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);
  current.layout_suggestion = patch.layout_suggestion || current.layout_suggestion || '';
  applySectionContent(sectionId, current, undefined, 'manual');
  state.manualSectionEdits[sectionId] = true;
  savePersistentState();
}

function setSectionLock(sectionId, locked) {

  else delete state.sectionLocks[sectionId];
  savePersistentState();
  render();
}

function normalizeText(value) {
  return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
}

function hexToRgb(hex) {
  const raw = String(hex || '').trim().replace('#', '');
  if (!/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(raw)) return null;
  const normalized = raw.length === 3 ? raw.split('').map(c => c + c).join('') : raw;
  const num = parseInt(normalized, 16);
  return {
    r: (num >> 16) & 255,
    g: (num >> 8) & 255,
    b: num & 255,
  };
}

function contrastRatio(fg, bg) {
  const a = hexToRgb(fg);
  const b = hexToRgb(bg);
  if (!a || !b) return null;
  const toLum = ({ r, g, b }) => {
    const chan = [r, g, b].map(v => {
      const c = v / 255;
      return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * chan[0] + 0.7152 * chan[1] + 0.0722 * chan[2];
  };
  const l1 = toLum(a);
  const l2 = toLum(b);
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}

function runQaCheck({ renderAfter = true } = {}) {
  const findings = [];
  const preset = getActiveBrandPreset();
  const headlineSeen = new Map();
  const ctaSeen = new Map();
  const banned = String(preset?.bannedPhrases || '')
    .split(/[,\n]/)
    .map(item => item.trim())
    .filter(Boolean);

  for (const section of SECTIONS) {
    const content = state.sectionContents[section.id];
    if (!content) {
      findings.push({ severity: 'warning', sectionId: section.id, title: `${section.name} 미생성`, detail: '이 섹션은 아직 생성되지 않았습니다.' });
      continue;
    }
    const headline = String(content.headline || '').trim();
    const body = String(content.body_text || '').trim();
    const cta = String(content.cta_text || '').trim();
    const contrast = contrastRatio(content.color_scheme?.text_primary, content.color_scheme?.background);

    if (!headline) findings.push({ severity: 'critical', sectionId: section.id, title: `${section.name} 헤드라인 누락`, detail: '헤드라인이 비어 있습니다.' });
    if (!body) findings.push({ severity: 'critical', sectionId: section.id, title: `${section.name} 본문 누락`, detail: '본문 카피가 비어 있습니다.' });
    if (body && body.length < 28) findings.push({ severity: 'warning', sectionId: section.id, title: `${section.name} 본문이 너무 짧음`, detail: '본문 설명이 짧아서 설득력이 약할 수 있습니다.' });
    if ((section.id === 'header' || section.id === 'features') && !state.sectionImages[section.id]) {
      findings.push({ severity: 'warning', sectionId: section.id, title: `${section.name} 이미지 없음`, detail: '핵심 섹션인데 전용 이미지가 없습니다.' });
    }
    if (contrast && contrast < 3.5) {
      findings.push({ severity: 'warning', sectionId: section.id, title: `${section.name} 대비 부족`, detail: `텍스트 대비가 낮습니다 (${contrast.toFixed(2)}:1).` });
    }
    if (headline) {
      const key = normalizeText(headline);
      if (headlineSeen.has(key)) findings.push({ severity: 'warning', sectionId: section.id, title: `${section.name} 헤드라인 중복`, detail: `"${headline}" 문구가 다른 섹션과 겹칩니다.` });
      headlineSeen.set(key, section.id);
    }
    if (cta) {
      const key = normalizeText(cta);
      if (ctaSeen.has(key)) findings.push({ severity: 'info', sectionId: section.id, title: `${section.name} CTA 반복`, detail: `"${cta}" CTA가 반복됩니다.` });
      ctaSeen.set(key, section.id);
    }
    for (const phrase of banned) {
      if (!phrase) continue;
      const allText = `${headline} ${content.subheadline || ''} ${body} ${(content.extra_elements || []).join(' ')}`.toLowerCase();
      if (allText.includes(phrase.toLowerCase())) {
        findings.push({ severity: 'critical', sectionId: section.id, title: `${section.name} 금지 표현 포함`, detail: `"${phrase}" 금지 표현이 들어 있습니다.` });
      }
    }
  }

  if (Object.keys(state.sectionContents || {}).length < 6) {
    findings.push({ severity: 'warning', sectionId: '', title: '전체 섹션 수 부족', detail: '생성된 섹션 수가 적어서 완성도가 낮아 보일 수 있습니다.' });
  }

  state.qaReport = {
    generatedAt: Date.now(),
    version: state.contentVersion || 0,
    totalSections: Object.keys(state.sectionContents || {}).length,
    findings,
    summary: {
      critical: findings.filter(f => f.severity === 'critical').length,
      warning: findings.filter(f => f.severity === 'warning').length,
      info: findings.filter(f => f.severity === 'info').length,
    },
  };
  state.qaVersion = state.contentVersion || 0;
  if (renderAfter) render();
  return state.qaReport;
}

function updateBrandPresetDraftFromInputs() {
  const read = id => {
    const el = document.getElementById(id);
    return el ? el.value : undefined;

  state.brandPresetDraft = normalizeBrandPreset({

    bodyFont: read('brandPresetBodyFont') ?? state.brandPresetDraft?.bodyFont,
    accentColor: read('brandPresetAccent') ?? state.brandPresetDraft?.accentColor,
    backgroundColor: read('brandPresetBackground') ?? state.brandPresetDraft?.backgroundColor,
    imageDirectives: read('brandPresetImageDirectives') ?? state.brandPresetDraft?.imageDirectives,

  });
}

function saveBrandPresetFromDraft() {
  updateBrandPresetDraftFromInputs();
  const draft = normalizeBrandPreset(state.brandPresetDraft);
  if (!draft.name) {
    state.error = '프리셋 이름을 입력하세요.';
    render();
    return;
  }
  if (!draft.id) draft.id = uid('preset');
  const rest = (state.brandPresets || []).filter(item => item.id !== draft.id);
  state.brandPresets = [draft, ...rest].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  state.activeBrandPresetId = draft.id;
  state.brandPresetDraft = cloneData(draft);
  saveBrandPresets(state.brandPresets);
  saveActiveBrandPresetId(state.activeBrandPresetId);
  markContentChanged();
  render();
}

function deleteActiveBrandPreset() {
  if (!state.activeBrandPresetId) return;
  state.brandPresets = (state.brandPresets || []).filter(item => item.id !== state.activeBrandPresetId);
  state.activeBrandPresetId = '';
  state.brandPresetDraft = createEmptyBrandPreset();
  saveBrandPresets(state.brandPresets);
  saveActiveBrandPresetId('');
  markContentChanged();
  render();
}

const PREVIEW_LAYER_DEFS = [
  { id: 'headline', label: '헤드라인', icon: 'title' },
  { id: 'subheadline', label: '서브', icon: 'short_text' },
  { id: 'image', label: '이미지', icon: 'image' },
  { id: 'body', label: '본문', icon: 'notes' },
  { id: 'extra', label: '포인트', icon: 'format_list_bulleted' },
  { id: 'cta', label: 'CTA', icon: 'ads_click' },
];

function normalizeLayerEdit(edit = {}) {
  const n = (v, fallback) => Number.isFinite(Number(v)) ? Number(v) : fallback;
  return {
    x: Math.round(n(edit.x, 0)),
    y: Math.round(n(edit.y, 0)),
    scale: Math.max(0.55, Math.min(1.8, n(edit.scale, 1))),
    opacity: Math.max(0.15, Math.min(1, n(edit.opacity, 1))),
    width: Math.max(0, Math.min(1280, n(edit.width, 0))),
    z: Math.max(0, Math.min(20, Math.round(n(edit.z, 1)))),
    align: ['left', 'center', 'right'].includes(edit.align) ? edit.align : '',
  };
}

function getLayerEdit(sectionId, layerId) {
  if (!state.previewLayerEdits[sectionId]) state.previewLayerEdits[sectionId] = {};
  state.previewLayerEdits[sectionId][layerId] = normalizeLayerEdit(state.previewLayerEdits[sectionId][layerId]);
  return state.previewLayerEdits[sectionId][layerId];
}

function setLayerEdit(sectionId, layerId, patch) {
  const current = getLayerEdit(sectionId, layerId);
  state.previewLayerEdits[sectionId][layerId] = normalizeLayerEdit({ ...current, ...patch });
  savePersistentState();
}

function resetLayerEdit(sectionId, layerId = null) {
  if (!state.previewLayerEdits[sectionId]) return;
  if (layerId) delete state.previewLayerEdits[sectionId][layerId];
  else delete state.previewLayerEdits[sectionId];
  savePersistentState();
}

function layerStyle(sectionId, layerId) {
  const e = getLayerEdit(sectionId, layerId);
  const width = e.width ? `width:${e.width}px;max-width:100%;` : '';
  const align = e.align ? `text-align:${e.align};` : '';
  return `position:relative;display:block;z-index:${e.z};opacity:${e.opacity};transform:translate(${e.x}px,${e.y}px) scale(${e.scale});transform-origin:center;${width}${align}`;
}

function renderPreviewLayer(sectionId, layerId, html, mode = 'preview') {
  if (!html) return '';
  const selected = state.activePreviewLayer?.sectionId === sectionId && state.activePreviewLayer?.layerId === layerId;
  const editable = mode === 'preview' && state.previewLayerMode;
  const attrs = mode === 'preview'
    ? `data-layer-section="${escAttr(sectionId)}" data-layer-id="${escAttr(layerId)}"`
    : '';
  return `<div class="preview-layer ${editable ? 'layer-editable' : ''} ${selected ? 'layer-selected' : ''}" ${attrs} style="${layerStyle(sectionId, layerId)}">${html}</div>`;
}

          ${cutSources.length ? `<div class="image-source-grid">
            ${cutSources.map(cut => `<div class="image-source-card">
              <img src="${escAttr(cut.result)}" alt="${escAttr(cut.label || `cut ${cut.index + 1}`)}">
              <div class="src-name">${escapeHtml(cut.label || `컷 ${cut.index + 1}`)}</div>
              <button class="btn-sm" data-use-cut-detail-image="${cut.index}" style="justify-content:center">${isReplace ? '교체' : '삽입'}</button>

function renderExtraElements(content, color, bodyFont) {
  if (!content.extra_elements?.length) return '';
  return `<div style="margin-top:20px;text-align:left;max-width:640px;margin-left:auto;margin-right:auto">
    ${content.extra_elements.map(item => `
      <div style="padding:8px 0;color:${color.text_secondary || '#555'};font-size:14px;font-family:${bodyFont};border-bottom:1px solid rgba(0,0,0,.08)">• ${escapeHtml(item)}</div>
    `).join('')}
  </div>`;
}

function renderSectionTemplate(section, rawContent, img, mode = 'preview') {
  const content = applyBrandPresetToContent(rawContent);
  const color = content.color_scheme || {};
  const font = content.font_suggestion || {};
  const headlineFont = cssFontFamily(font.headline_font);
  const bodyFont = cssFontFamily(font.body_font || font.headline_font);
  const wrapLayer = (layerId, html) => renderPreviewLayer(section.id, layerId, html, mode);
  const headline = escapeHtml(content.headline || `[${section.name}]`);
  const subheadline = escapeHtml(content.subheadline || '');
  const bodyHtml = nl2br(content.body_text || '');
  const ctaCoreHtml = content.cta_text
    ? (mode === 'export'
      ? `<a href="#" style="display:inline-block;margin-top:22px;padding:14px 36px;background:${color.accent || '#6366f1'};color:#fff;border-radius:999px;text-decoration:none;font-size:16px;font-weight:600;font-family:${bodyFont}">${escapeHtml(content.cta_text)}</a>`
      : `<div style="display:inline-block;margin-top:22px;padding:14px 36px;background:${color.accent || '#6366f1'};color:#fff;border-radius:999px;font-size:16px;font-weight:600;font-family:${bodyFont}">${escapeHtml(content.cta_text)}</div>`)
    : '';
  const ctaHtml = ctaCoreHtml ? wrapLayer('cta', ctaCoreHtml) : '';
  const imageCoreHtml = img ? `<img src="${img}" alt="${escapeHtml(section.name)}" style="width:100%;max-width:100%;border-radius:18px;display:block;box-shadow:0 18px 40px rgba(0,0,0,.08)">` : '';
  const imageHtml = imageCoreHtml ? wrapLayer('image', imageCoreHtml) : '';
  const extraCoreHtml = renderExtraElements(content, color, bodyFont);
  const extraHtml = extraCoreHtml ? wrapLayer('extra', extraCoreHtml) : '';
  const template = state.layoutTemplate || 'classic';

  if (template === 'split') {
    const mediaFirst = section.n % 2 === 0;
    const mediaBlock = `<div style="min-width:0">${imageHtml || `<div style="height:280px;border:1px dashed var(--border);border-radius:18px;background:rgba(255,255,255,.45)"></div>`}</div>`;
    const textBlock = `<div style="min-width:0">
      <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:${color.accent || '#6366f1'};margin-bottom:12px">${String(section.n).padStart(2, '0')} / ${escapeHtml(section.name)}</div>
      ${wrapLayer('headline', `<h2 style="font-size:${font.headline_size || '40px'};color:${color.text_primary || '#222'};font-weight:${font.headline_weight || '800'};font-family:${headlineFont};margin-bottom:12px;line-height:1.15">${headline}</h2>`)}
      ${wrapLayer('subheadline', `<h3 style="font-size:18px;color:${color.text_secondary || '#666'};font-weight:400;font-family:${bodyFont};margin-bottom:18px;line-height:1.5">${subheadline}</h3>`)}
      ${wrapLayer('body', `<p style="font-size:${font.body_size || '16px'};color:${color.text_secondary || '#666'};line-height:1.9;font-family:${bodyFont}">${bodyHtml}</p>`)}
      ${extraHtml}
      ${ctaHtml}
    </div>`;
    return `<div style="background:${color.background || '#fff'};padding:54px 20px">
      <div style="max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;align-items:center">
        ${mediaFirst ? `${mediaBlock}${textBlock}` : `${textBlock}${mediaBlock}`}
      </div>
    </div>`;
  }

  if (template === 'spotlight') {
    return `<div style="background:${color.background || 'linear-gradient(135deg,#f7f3ee 0%,#ffffff 100%)'};padding:60px 20px">
      <div style="max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;align-items:stretch">
        <div style="padding:34px;border-radius:28px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);box-shadow:0 24px 60px rgba(0,0,0,.08)">
          <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:${color.accent || '#6366f1'};margin-bottom:12px">${escapeHtml(section.name)}</div>
          ${wrapLayer('headline', `<h2 style="font-size:${font.headline_size || '46px'};color:${color.text_primary || '#222'};font-weight:${font.headline_weight || '900'};font-family:${headlineFont};margin-bottom:14px;line-height:1.08">${headline}</h2>`)}
          ${wrapLayer('subheadline', `<h3 style="font-size:19px;color:${color.text_secondary || '#666'};font-weight:400;font-family:${bodyFont};margin-bottom:18px;line-height:1.5">${subheadline}</h3>`)}
          ${wrapLayer('body', `<p style="font-size:${font.body_size || '16px'};color:${color.text_secondary || '#666'};line-height:1.9;font-family:${bodyFont}">${bodyHtml}</p>`)}
          ${extraHtml}
          ${ctaHtml}
        </div>
        <div style="display:flex;align-items:center;justify-content:center;padding:18px;border-radius:28px;background:rgba(255,255,255,.35)">
          ${imageHtml || `<div style="height:320px;width:100%;border:1px dashed rgba(0,0,0,.15);border-radius:18px"></div>`}
        </div>
      </div>
    </div>`;
  }

  if (template === 'minimal') {
    return `<div style="background:${color.background || '#fff'};padding:52px 20px;border-top:1px solid rgba(0,0,0,.05)">
      <div style="max-width:880px;margin:0 auto">
        <div style="font-size:12px;color:${color.accent || '#6366f1'};margin-bottom:10px">${String(section.n).padStart(2, '0')} · ${escapeHtml(section.name)}</div>
        ${wrapLayer('headline', `<h2 style="font-size:${font.headline_size || '34px'};color:${color.text_primary || '#222'};font-weight:${font.headline_weight || '700'};font-family:${headlineFont};margin-bottom:10px;line-height:1.2">${headline}</h2>`)}
        ${wrapLayer('subheadline', `<h3 style="font-size:17px;color:${color.text_secondary || '#666'};font-weight:400;font-family:${bodyFont};margin-bottom:18px;line-height:1.6">${subheadline}</h3>`)}
        ${imageHtml ? `<div style="margin:0 0 20px">${imageHtml}</div>` : ''}
        ${wrapLayer('body', `<p style="font-size:${font.body_size || '16px'};color:${color.text_secondary || '#666'};line-height:1.9;font-family:${bodyFont}">${bodyHtml}</p>`)}
        ${extraHtml}
        ${ctaHtml}
      </div>
    </div>`;
  }

  return `<div style="background:${color.background || '#FFFFFF'};padding:48px 20px;text-align:center">
    <div style="max-width:860px;margin:0 auto">
      ${wrapLayer('headline', `<h2 style="font-size:${font.headline_size || '36px'};color:${color.text_primary || '#333'};font-weight:${font.headline_weight || '700'};font-family:${headlineFont};margin-bottom:10px;line-height:1.15">
        ${headline}
      </h2>`)}
      ${wrapLayer('subheadline', `<h3 style="font-size:18px;color:${color.text_secondary || '#666'};font-weight:400;font-family:${bodyFont};margin-bottom:20px;line-height:1.55">
        ${subheadline}
      </h3>`)}
      ${imageHtml ? `<div style="margin-bottom:20px">${imageHtml}</div>` : ''}
      ${wrapLayer('body', `<p style="font-size:${font.body_size || '16px'};color:${color.text_secondary || '#666'};line-height:1.8;font-family:${bodyFont};max-width:680px;margin:0 auto">${bodyHtml}</p>`)}
      ${extraHtml}
      ${ctaHtml}
    </div>
  </div>`;
}

function renderAnalysisLog() {
  const a = state.analysis;
  const c = state.competitorData;
  if (!a) return '';
  const ts = state.analysisTimestamp ? new Date(state.analysisTimestamp).toLocaleString('ko-KR') : '';
  const open = state.analysisLogOpen;

  const r = a.reasoning || {};
  const confidenceColor = { high:'var(--ok)', medium:'var(--orange)', low:'var(--err,#e53e3e)' }[r.confidence] || 'var(--text-m)';

  function row(label, value, color) {
    if (!value && value !== 0) return '';
    return `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:flex-start">
      <span style="color:var(--text-m);min-width:130px;flex-shrink:0">${label}</span>
      <span style="color:${color||'var(--text)'};word-break:break-word">${value}</span>
    </div>`;
  }
  function reasoningBox(text, color) {
    if (!text) return '';
    return `<div style="font-size:11px;color:var(--text-d);margin-bottom:8px;line-height:1.6;padding:7px 10px;background:var(--bg-card);border-radius:6px;border-left:3px solid ${color||'var(--border)'}">
      💬 AI 판단 근거: ${text}
    </div>`;
  }
  function tags(arr) {
    if (!arr?.length) return '—';
    return arr.map(v=>`<span class="tag" style="font-size:11px">${v}</span>`).join('');
  }

  return `<div style="margin-bottom:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden">
    <div id="analysisLogToggle" style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-card);cursor:pointer;user-select:none">
      <span class="material-icons-outlined" style="font-size:18px;color:var(--primary)">analytics</span>
      <span style="font-weight:600;font-size:14px;flex:1">AI 분석 결과 로그</span>
      ${r.confidence ? `<span style="font-size:11px;font-weight:600;color:${confidenceColor}">신뢰도 ${r.confidence}</span>` : ''}
      ${ts ? `<span style="font-size:11px;color:var(--text-m)">${ts}</span>` : ''}
      <span class="material-icons-outlined" style="font-size:18px;color:var(--text-m)">${open?'expand_less':'expand_more'}</span>
    </div>

    ${open ? `<div style="padding:0 16px 16px;background:var(--bg)">

      <!-- ① 제품 식별 -->
      <div style="margin-top:16px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text-m);letter-spacing:.08em;text-transform:uppercase">① 제품 식별</div>
      ${reasoningBox(r.product_name_basis, 'var(--primary)')}
      ${row('제품명 (Korean)', a.product_name, 'var(--primary-h)')}
      ${row('제품명 (English)', a.product_name_en)}
      ${reasoningBox(r.category_basis, 'var(--cyan)')}
      ${row('카테고리', a.category, 'var(--cyan)')}
      ${row('브랜드', a.brand || '—')}
      ${reasoningBox(r.price_basis, 'var(--ok)')}
      ${row('가격대 추정', a.price_range_estimate, 'var(--ok)')}

      <!-- ② 시각적 특성 -->
      <div style="margin-top:16px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text-m);letter-spacing:.08em;text-transform:uppercase">② 시각적 특성</div>
      ${reasoningBox(r.material_basis, 'var(--cyan)')}
      ${row('색상', `<span style="display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center">${(a.colors||[]).map(clr=>`<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:10px;height:10px;border-radius:50%;background:${clr.toLowerCase()};border:1px solid var(--border);display:inline-block"></span>${clr}</span>`).join('')}</span>`)}
      ${row('소재', tags(a.materials))}
      ${row('형태', a.shape)}
      ${row('크기 추정', a.size_estimate)}
      ${row('분위기/무드', a.mood, 'var(--orange)')}

      <!-- ③ 판매 포인트 -->
      <div style="margin-top:16px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text-m);letter-spacing:.08em;text-transform:uppercase">③ 판매 포인트 & 기능</div>
      <div style="padding:8px 0">${row('핵심 특징', tags(a.key_features))}</div>
      <div style="padding:8px 0">${row('셀링 포인트', tags(a.selling_points))}</div>
      <div style="padding:8px 0">${row('사용 상황', tags(a.use_cases))}</div>

      <!-- ④ 타겟 & 디자인 -->
      <div style="margin-top:16px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text-m);letter-spacing:.08em;text-transform:uppercase">④ 타겟 & 디자인 방향</div>
      ${reasoningBox(r.target_basis, 'var(--orange)')}
      ${row('타겟 고객', a.target_audience)}
      ${row('스타일 키워드', tags(a.style_keywords))}
      ${row('보완 컬러 추천', `<span style="display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center">${(a.complementary_colors||[]).map(clr=>`<span style="display:inline-flex;align-items:center;gap:3px"><span style="width:10px;height:10px;border-radius:50%;background:${clr};border:1px solid var(--border);display:inline-block"></span>${clr}</span>`).join('')}</span>`)}
      ${row('텍스트 컬러 추천', a.text_color_recommendation)}

      <!-- ⑤ AI 마케팅 설명문 -->
      <div style="margin-top:16px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text-m);letter-spacing:.08em;text-transform:uppercase">⑤ AI 마케팅 설명문 <span style="font-size:10px;font-weight:400;color:var(--text-m)">(15개 섹션 생성의 기반 컨텍스트)</span></div>
      ${a.detailed_description ? `<div style="font-size:13px;color:var(--text-d);line-height:1.7;padding:10px 12px;background:var(--bg-card);border-radius:6px">${a.detailed_description}</div>` : ''}

      ${c ? `
      <!-- ⑥ 경쟁 분석 -->
      <div style="margin-top:16px;margin-bottom:6px;font-size:11px;font-weight:700;color:var(--text-m);letter-spacing:.08em;text-transform:uppercase">⑥ 경쟁 분석 <span style="font-size:10px;font-weight:400;color:var(--text-m)">(LLM 학습 데이터 기반 추론 — 실시간 검색 아님)</span></div>
      ${row('시장 인사이트', c.market_insights)}
      ${row('권장 전략', c.recommended_approach, 'var(--ok)')}
      <div style="margin-top:8px">
        ${(c.similar_products||[]).map((p,i)=>`<div style="padding:8px 10px;background:var(--bg-card);border-radius:6px;margin-bottom:6px;font-size:12px">
          <span style="color:var(--primary-h);font-weight:600">${i+1}. ${p.name}</span>
          <span style="color:var(--text-m);margin-left:8px">${p.price_range||''}</span>
          <div style="color:var(--text-d);margin-top:3px">${p.strengths||''}</div>
        </div>`).join('')}
      </div>
      ${(c.detail_page_trends||[]).length ? `<div style="margin-top:8px">${row('상세페이지 트렌드', tags(c.detail_page_trends))}</div>` : ''}
      ` : ''}

      <!-- Raw JSON -->
      <div style="margin-top:16px">
        <button class="btn-sm" id="toggleRawJson" style="font-size:11px">${state.showRawJson?'Raw JSON 숨기기':'Raw JSON 보기'}</button>
        ${state.showRawJson ? `<pre style="margin-top:8px;font-size:10px;color:var(--text-d);background:var(--bg-card);padding:12px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all">${JSON.stringify(a, null, 2)}</pre>` : ''}
      </div>
    </div>` : ''}
  </div>`;
}

// COMPETITOR ANALYSIS STEP

function renderCompetitorStep() {
  const cp = state.compPage;
  const backendBase = (cp.scraperBase || 'http://127.0.0.1:5001').replace(/\/+$/, '');
  const hasBackend = cp.backendOk === true;

  if (cp.subStep === 'analyzing') {
    return `<div class="fade-in" style="text-align:center;padding:60px 20px">
      <div class="spinner" style="margin:0 auto 24px"></div>
      <p style="font-size:16px;color:var(--text-m)">${cp.analyzeMsg || '경쟁사 페이지 분석 중...'}</p>
    </div>`;
  }

  if (cp.subStep === 'report') {
    const r = cp.analysisResult || {};
    const sections = r.sections_found || [];
    const typeLabel = {header:'헤더',hook:'훅',features:'핵심특징',specs:'스펙',scenarios:'사용시나리오',comparison:'비교우위',material:'소재/기술',certification:'인증',review:'리뷰',size_color:'사이즈/컬러',promotion:'프로모션',shipping:'배송',faq:'FAQ',brand_story:'브랜드스토리',cta:'CTA',other:'기타'};

    const ps = r.page_score || {};
    const total = typeof ps.total === 'number' ? ps.total : null;

    const scoreColor = s => s >= 8 ? '#48bb78' : s >= 6 ? '#f6ad55' : s >= 4 ? '#fc8181' : '#e53e3e';
    const gradeBg = g => ({S:'#6366f1',A:'#48bb78',B:'#38b2ac',C:'#f6ad55',D:'#fc8181',F:'#e53e3e'}[g]||'#666');
    const renderStars = (score, size=15) => {
      let h = '';
      for (let i = 1; i <= 5; i++) {
        const v = score/2;
        h += v >= i ? `<span style="color:#f6ad55;font-size:${size}px">★</span>`
           : v >= i-.5 ? `<span style="color:#f6ad55;font-size:${size}px;opacity:.6">★</span>`
           : `<span style="color:#444;font-size:${size}px">☆</span>`;
      }
      return h;
    };

    return `<div class="fade-in">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <button class="btn-sm" data-comp-back="input" style="gap:6px"><span class="material-icons-outlined" style="font-size:14px">arrow_back</span>다시 입력</button>
        <h1 class="page-title" style="margin:0">🔍 경쟁사 분석 결과</h1>
      </div>
      <p class="page-desc" style="margin-bottom:16px">${r.page_title ? `"${r.page_title}" 분석 완료 · ` : ''}섹션 ${sections.length}개 발견</p>

      ${total !== null ? `
      <!-- ── 총점 헤더 ── -->
      <div style="background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(99,102,241,.05));border:1px solid rgba(99,102,241,.3);border-radius:12px;padding:16px;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
          <div style="text-align:center">
            <div style="font-size:48px;font-weight:900;color:${scoreColor(total)};line-height:1">${total.toFixed(1)}</div>
            <div style="font-size:11px;color:var(--text-m)">/10점</div>
            <div style="margin-top:4px">${renderStars(total, 16)}</div>
          </div>
          <div style="flex:1">
            ${ps.grade ? `<span style="display:inline-block;background:${gradeBg(ps.grade)};color:#fff;font-size:18px;font-weight:900;padding:3px 14px;border-radius:20px;margin-bottom:8px">${ps.grade}등급</span>` : ''}
            ${ps.verdict ? `<p style="font-size:13px;color:var(--text);line-height:1.6;margin:0;font-style:italic">"${ps.verdict}"</p>` : ''}
          </div>
        </div>

        <!-- 항목별 바 요약 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px">
          ${(ps.criteria||[]).map(c=>`
            <div style="display:flex;align-items:center;gap:6px;font-size:11px">
              <span style="font-size:13px">${c.icon||''}</span>
              <span style="color:var(--text-m);min-width:80px;font-size:11px">${c.name}</span>
              <div style="flex:1;height:4px;background:#333;border-radius:2px;overflow:hidden">
                <div style="height:100%;width:${(c.score||0)*10}%;background:${scoreColor(c.score||0)};border-radius:2px"></div>
              </div>
              <span style="font-weight:700;color:${scoreColor(c.score||0)};min-width:20px;text-align:right">${c.score||0}</span>
            </div>`).join('')}
        </div>

        <!-- 최우선 개선사항 -->
        ${(ps.top_priorities||[]).length > 0 ? `
        <div style="margin-top:14px;padding:12px;background:rgba(229,62,62,.1);border:1px solid rgba(229,62,62,.25);border-radius:8px">
          <div style="font-size:12px;font-weight:700;color:#fc8181;margin-bottom:8px">🚨 지금 당장 고쳐야 할 것</div>
          ${ps.top_priorities.map(p=>`<div style="font-size:12px;color:var(--text);line-height:1.6;margin-bottom:4px">${p}</div>`).join('')}
        </div>` : ''}
      </div>

      <!-- ── 항목별 상세 카드 ── -->
      <div style="margin-bottom:16px">
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px">📋 항목별 상세 분석</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${(ps.criteria||[]).map(c => {
            const sc = c.score || 0;
            const col = scoreColor(sc);
            return `<div style="background:var(--bg-card);border:1px solid var(--border);border-left:3px solid ${col};border-radius:8px;padding:12px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <span style="font-size:16px">${c.icon||'📌'}</span>
                <span style="font-weight:700;font-size:13px;flex:1">${c.name}</span>
                <div style="display:flex;align-items:center;gap:4px">
                  ${renderStars(sc, 12)}
                  <span style="font-weight:900;font-size:14px;color:${col};margin-left:4px">${sc}</span>
                  <span style="font-size:10px;color:var(--text-m)">/10</span>
                </div>
              </div>
              ${c.current_state ? `<div style="font-size:12px;color:var(--text-m);margin-bottom:6px;padding:6px 8px;background:rgba(255,255,255,.04);border-radius:5px">현황: ${c.current_state}</div>` : ''}
              ${(c.issues||[]).length > 0 ? `<div style="margin-bottom:8px">${c.issues.map(i=>`<span style="display:inline-block;font-size:11px;color:#fc8181;background:rgba(229,62,62,.1);padding:2px 7px;border-radius:10px;margin:2px">✗ ${i}</span>`).join('')}</div>` : ''}
              ${c.to_perfect ? `<div style="padding:8px 10px;background:rgba(72,187,120,.08);border:1px solid rgba(72,187,120,.2);border-radius:6px;font-size:12px;color:#68d391;line-height:1.6">
                <span style="font-weight:700;color:#48bb78">💡 10점 받으려면:</span> ${c.to_perfect}

            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      <div class="comp-card" style="margin-bottom:16px">
        <div class="comp-card-title">📋 전체 전략 요약</div>
        <p style="color:var(--text-m);line-height:1.7;font-size:14px">${r.overall_strategy || '-'}</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div class="comp-card">
          <div class="comp-card-title">✅ 강점</div>

          <div class="comp-card-title">⚠️ 약점</div>

      ${(r.selling_strategies||[]).length>0?`<div class="comp-card" style="margin-bottom:16px">
        <div class="comp-card-title">💡 판매 전략</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${(r.selling_strategies||[]).map(s=>`<span class="comp-tag">${s}</span>`).join('')}</div>

        <div class="comp-card-title">🗂 발견된 섹션 (${sections.length}개)</div>

          ${sections.map(s=>`<div style="display:flex;gap:10px;padding:8px;background:var(--bg);border-radius:6px;font-size:13px">

          </div>`).join('')}
        </div>
      </div>

      ${cp.sectionPlan
        ? `<div style="display:flex;gap:10px">
            <button class="btn" id="compViewPlan" style="flex:1;justify-content:center;font-size:15px;padding:13px">
              <span class="material-icons-outlined">dashboard_customize</span> 섹션 플랜 보기 →
            </button>

        : `<button class="btn" id="compGenPlan" style="width:100%;justify-content:center;font-size:16px;padding:14px">

  }

  if (cp.subStep === 'plan') {
    const plan = cp.sectionPlan || {};
    const recs = plan.recommended_sections || [];
    const edits = cp.planEdits || {};
    const hasAnalysis = !!state.analysis;
    const genStatus = cp.sectionStatus || {}; // {sectionId: 'loading'|'done'|'error'}
    return `<div class="fade-in">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <button class="btn-sm" data-comp-back="report" style="gap:6px"><span class="material-icons-outlined" style="font-size:14px">arrow_back</span>분석 결과로</button>

      ${plan.strategy_summary?`<div class="comp-card" style="margin-bottom:12px">

      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
        ${SECTIONS.map(s => {
          const rec = recs.find(r=>r.section_id===s.id) || {};
          const ed = edits[s.id] || {};
          const enabled = ed.enabled !== undefined ? ed.enabled : (rec.enabled !== false);
          const instructions = ed.instructions !== undefined ? ed.instructions : (rec.recommended_instructions || '');
          const st = genStatus[s.id];
          const doneContent = state.sectionContents[s.id];
          return `<div class="comp-section-card ${enabled?'':'comp-section-disabled'}">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <label class="comp-toggle-wrap">

                st === 'loading'
                  ? `<span style="font-size:12px;color:var(--primary-h)">⏳ 생성 중...</span>`

                    ? `<button class="btn-sm" data-comp-gen-section="${s.id}" style="background:rgba(229,62,62,.15);color:#e53e3e;border-color:#e53e3e">재시도</button>`

                      ? `<span style="font-size:12px;color:#48bb78;font-weight:700">✓ 완료</span>
                         <button class="btn-sm" data-comp-gen-section="${s.id}" style="padding:3px 8px">↺</button>`

            <textarea class="comp-plan-input" data-sid="${s.id}" rows="3"

              style="width:100%;resize:vertical;${!enabled?'opacity:0.4;':''}">
${instructions}</textarea>
            ${rec.competitor_reference?`<details style="margin-top:6px">
              <summary style="font-size:12px;color:var(--text-m);cursor:pointer">📌 경쟁사 방식 / 개선 포인트</summary>
              <div style="font-size:12px;color:var(--text-m);margin-top:6px;padding:8px;background:var(--bg);border-radius:6px;line-height:1.6">
                <b>경쟁사:</b> ${rec.competitor_reference}<br>
                <b>개선:</b> ${rec.improvement_suggestions||'-'}
              </div>
            </details>`:''}
          </div>`;
        }).join('')}
      </div>

      <div style="display:flex;gap:12px;position:sticky;bottom:0;background:var(--surface);padding:16px 0">
        <button class="btn" id="compApplyGenerate" style="flex:1;justify-content:center;font-size:15px"
          ${!hasAnalysis?'disabled title="먼저 제품 이미지를 분석해주세요 (AI 분석 탭)"':''}>
          <span class="material-icons-outlined">rocket_launch</span> 자동 생성 바로 시작
        </button>
        <button class="btn-secondary" id="compApplySections" style="flex:1;justify-content:center;font-size:15px">
          <span class="material-icons-outlined">dashboard_customize</span> 섹션 설정으로 이동
        </button>
      </div>
    </div>`;
  }

  // subStep === 'input'
  const imgs = cp.uploadedImages || [];
  const savedComp = loadCompAnalysis();
  const hasSaved = !!(savedComp?.analysisResult);
  const savedAt = hasSaved ? new Date(savedComp.savedAt).toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  const savedTitle = hasSaved ? (savedComp.analysisResult.page_title || '경쟁사 페이지') : '';
  const hasSavedPlan = !!(savedComp?.sectionPlan);
  const savedTot = hasSaved ? savedComp.analysisResult.page_score?.total : null;
  const savedScoreHtml = savedTot != null
    ? `<span style="font-weight:900;color:${savedTot>=8?'#48bb78':savedTot>=6?'#f6ad55':'#fc8181'};margin-left:6px">${savedTot.toFixed(1)}점</span>`
    : '';

  return `<div class="fade-in">
    <h1 class="page-title">🔍 경쟁사 상세페이지 분석</h1>
    <p class="page-desc">경쟁사 상세페이지를 업로드하면 AI가 구조를 분석하고 우리 제품에 맞는 섹션 플랜을 제안합니다.</p>

    ${hasSaved ? `<div class="comp-card" style="margin-bottom:20px;border-color:var(--primary);background:rgba(99,102,241,.06)">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:18px">🕐</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:13px">마지막 저장: ${savedTitle}${savedScoreHtml}</div>
          <div style="font-size:11px;color:var(--text-m);margin-top:2px">${savedAt} 저장 · 섹션 ${(savedComp.analysisResult.sections_found||[]).length}개 발견${hasSavedPlan?' · 15개 플랜 있음':''}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button class="btn-sm" id="compLoadReport">분석 결과 보기</button>
          ${hasSavedPlan ? `<button class="btn-sm" id="compLoadPlan" style="background:var(--primary);color:#fff;border-color:var(--primary)">섹션 플랜 바로가기</button>` : ''}
        </div>
      </div>
    </div>` : ''}

    <div style="display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
      ${[['images','🖼 이미지 스크린샷'],['html','📄 HTML 파일'],['url','🔗 URL']].map(([m,l])=>`
        <button class="comp-mode-tab ${cp.mode===m?'active':''}" data-comp-mode="${m}" style="flex:1">${l}</button>
      `).join('')}
    </div>

    ${cp.mode === 'images' ? `
      <div class="comp-drop-zone" id="compDropZone">
        <span class="material-icons-outlined" style="font-size:40px;color:var(--primary);margin-bottom:8px">add_photo_alternate</span>
        <p style="font-weight:500">클릭 또는 드래그하여 스크린샷 업로드</p>
        <p style="font-size:12px;color:var(--text-m);margin-top:4px">JPG, PNG, WEBP · 최대 10장</p>
        <input type="file" id="compImageInput" accept="image/*" multiple style="display:none">
      </div>
      ${imgs.length>0?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
        ${imgs.map((img,i)=>`<div style="position:relative">
          <img src="data:${img.mime};base64,${img.base64}" style="width:100px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">
          <button data-comp-remove-img="${i}" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#e53e3e;color:#fff;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center">✕</button>
        </div>`).join('')}
      </div>`:''}
    ` : cp.mode === 'html' ? `
      <div style="margin-bottom:12px">
        <label style="font-size:13px;color:var(--text-m);display:block;margin-bottom:6px">HTML 파일 업로드</label>
        <input type="file" id="compHtmlInput" accept=".html,.htm" class="comp-file-input">
      </div>
      <div>
        <label style="font-size:13px;color:var(--text-m);display:block;margin-bottom:6px">또는 HTML 텍스트 직접 붙여넣기</label>
        <textarea id="compHtmlText" rows="8" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:monospace;resize:vertical"
          placeholder="경쟁사 페이지 소스 붙여넣기 (Ctrl+U → 전체 복사)...">${cp.htmlText||''}</textarea>
      </div>
    ` : `
      <div>
        <label style="font-size:13px;color:var(--text-m);display:block;margin-bottom:6px">경쟁사 상세페이지 URL</label>
        <input type="url" id="compUrlInput" value="${cp.urlInput||''}"
          style="width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:10px"
          placeholder="https://smartstore.naver.com/...">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <input type="text" id="compScraperBase" value="${cp.scraperBase||'http://127.0.0.1:5001'}"
            style="flex:1;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text-m);font-size:12px;font-family:monospace"
            placeholder="http://127.0.0.1:5001">
          <button id="compPingBtn" class="btn-sm" style="white-space:nowrap">연결 확인</button>
        </div>
        <div style="padding:8px 10px;background:var(--bg);border-radius:6px;font-size:12px;color:var(--text-m)">
          ${cp.backendOk === true
            ? `<span style="color:#48bb78">● 백엔드 연결됨</span> — 더보기/펼쳐보기 버튼 자동 클릭 후 스크린샷 캡처`
            : cp.backendOk === false
              ? `<span style="color:#e53e3e">● 백엔드 미연결</span> — Flask 백엔드를 시작하세요: <code>cd backend && python app.py</code>`
              : `<span style="color:#ccc">● 미확인</span> — 위 "연결 확인" 버튼을 누르거나 분석을 바로 시작하세요`}
        </div>
      </div>
    `}

    <button class="btn" id="compStartAnalyze" style="width:100%;justify-content:center;margin-top:20px;font-size:15px;padding:14px">
      <span class="material-icons-outlined">search</span> 분석 시작
    </button>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// EVENT BINDING
// ════════════════════════════════════════════════════════════════
const bindEventExtensions = [];

function registerBindEventExtension(fn) {
  if (typeof fn === 'function') bindEventExtensions.push(fn);
}

function runBindEventExtensions() {
  for (const fn of bindEventExtensions) {
    try {
      fn();
    } catch(e) {
      console.warn('bindEvents extension failed:', e);
    }
  }
}

function bindEvents() {
  // API Key modal
  const saveBtn = document.getElementById('saveApiKey');
  if (saveBtn) {
    saveBtn.onclick = () => {
      const key = document.getElementById('apiKeyInput')?.value.trim() || '';
      const backendUrl = document.getElementById('backendUrlInput')?.value.trim() || '';
      if (!key && !backendUrl) return;

      state.apiKey = key;
      state.backendBaseUrl = backendUrl;
      saveKey(key);
      saveBackendUrl(backendUrl);

      gemini = createGeminiClient();
      state.showApiModal = false;
      render();
    };
  }

  const skipBtn = document.getElementById('skipApiModal');
  if (skipBtn) {
    skipBtn.onclick = () => {
      if (!hasGeminiConnection()) return;
      gemini = createGeminiClient();
      state.showApiModal = false;
      render();
    };
  }

  const toggleVis = document.getElementById('toggleKeyVis');
  if (toggleVis) {
    toggleVis.onclick = () => {
      const inp = document.getElementById('apiKeyInput');
      if (inp.type === 'text') { inp.type = 'password'; toggleVis.textContent = 'visibility'; }
      else { inp.type = 'text'; toggleVis.textContent = 'visibility_off'; }
    };
  }

  const changeApiBtn = document.getElementById('changeApiKey');
  if (changeApiBtn) {
    changeApiBtn.onclick = () => { state.showApiModal = true; render(); };
  }

  // Navigation
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.nav;
      // 과도기 상태 탭은 데이터 여부에 따라 적절한 탭으로 리다이렉트
      if (target === 'analyzing') { state.step = state.analysis ? 'sections' : 'upload'; render(); return; }
      if (target === 'generating') { state.step = Object.keys(state.sectionContents).length > 0 ? 'preview' : 'sections'; render(); return; }
      state.step = target;
      render();
      // 모델 설정 탭 열면 Vertex config 자동 로드
      if (target === 'modelsettings' && !state.vertexConfig) {
        const base = state.auto.serverApiBase || 'http://127.0.0.1:4000/v1';
        fetch(`${base}/pdp/vertex-config`).then(r => r.json()).then(d => { state.vertexConfig = d; render(); }).catch(() => {});
      }
    };
  });

  // ── 경쟁사 분석 이벤트 ──────────────────────────────────────
  // 모드 탭 전환
  document.querySelectorAll('[data-comp-mode]').forEach(btn => {
    btn.onclick = () => { state.compPage.mode = btn.dataset.compMode; render(); };
  });
  // 뒤로가기
  document.querySelectorAll('[data-comp-back]').forEach(btn => {
    btn.onclick = () => { state.compPage.subStep = btn.dataset.compBack; render(); };
  });
  // 이미지 업로드 드롭존
  const compDrop = document.getElementById('compDropZone');
  const compImgInput = document.getElementById('compImageInput');
  if (compDrop) {
    compDrop.onclick = () => compImgInput?.click();
    compDrop.ondragover = e => e.preventDefault();
    compDrop.ondrop = e => { e.preventDefault(); handleCompImages(e.dataTransfer.files); };
  }
  if (compImgInput) compImgInput.onchange = e => handleCompImages(e.target.files);
  // 이미지 삭제
  document.querySelectorAll('[data-comp-remove-img]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); state.compPage.uploadedImages.splice(+btn.dataset.compRemoveImg, 1); render(); };
  });
  // HTML 파일 업로드
  const compHtmlInput = document.getElementById('compHtmlInput');
  if (compHtmlInput) compHtmlInput.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => { state.compPage.htmlText = ev.target.result; render(); };
    reader.readAsText(f, 'utf-8');
  };
  // HTML textarea 동기화
  const compHtmlText = document.getElementById('compHtmlText');
  if (compHtmlText) compHtmlText.oninput = e => { state.compPage.htmlText = e.target.value; };
  // URL input 동기화
  const compUrlInput = document.getElementById('compUrlInput');
  if (compUrlInput) compUrlInput.oninput = e => { state.compPage.urlInput = e.target.value; };
  // 스크래퍼 백엔드 URL 동기화
  const compScraperBase = document.getElementById('compScraperBase');
  if (compScraperBase) compScraperBase.oninput = e => { state.compPage.scraperBase = e.target.value.trim(); };
  // 핑 버튼
  const compPingBtn = document.getElementById('compPingBtn');
  if (compPingBtn) compPingBtn.onclick = async () => {
    const base = (state.compPage.scraperBase || 'http://127.0.0.1:5001').replace(/\/+$/, '');
    compPingBtn.textContent = '확인 중...';
    try {
      const r = await fetch(`${base}/api/health`, { signal: AbortSignal.timeout(3000) });
      state.compPage.backendOk = r.ok || r.status < 500;
    } catch(e) {
      state.compPage.backendOk = false;
    }
    render();
  };
  // 분석 시작
  const compStartBtn = document.getElementById('compStartAnalyze');

function bindColorPickerPair(textInputId, pickerInputId) {
  const textInput = document.getElementById(textInputId);
  const pickerInput = document.getElementById(pickerInputId);
  if (!textInput || !pickerInput) return;

  pickerInput.oninput = () => {
    textInput.value = pickerInput.value;
    updateBrandPresetDraftFromInputs();
  };

  textInput.addEventListener('input', () => {
    const normalized = normalizeHexColor(textInput.value);
    if (normalized) pickerInput.value = normalized;
  });

  textInput.addEventListener('blur', () => {
    const normalized = normalizeHexColor(textInput.value);
    if (!normalized) return;
    textInput.value = normalized;
    pickerInput.value = normalized;
    updateBrandPresetDraftFromInputs();
  });
}

function readImageFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type?.startsWith('image/')) {
      reject(new Error('이미지 파일만 불러올 수 있습니다.'));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('파일을 읽지 못했습니다.'));
    reader.readAsDataURL(file);
  });
}

function applyImageInsert(dataUrl, label = '추가 상세 이미지', source = 'local') {
  const insert = state.imageInsert || {};
  if (!dataUrl) return;
  if (insert.targetSectionId) {
    const sectionId = insert.targetSectionId;
    if (!state.sectionContents[sectionId]) return;
    captureCurrentSectionVariant(sectionId, 'baseline', '이미지 교체 전');
    delete state.aiRepairUndoStack[sectionId];
    applySectionContent(sectionId, state.sectionContents[sectionId], dataUrl, 'manual', '이미지 교체');
  } else {
    const afterSectionId = insert.afterSectionId || SECTIONS[SECTIONS.length - 1]?.id;
    const block = {
      id: uid('detail_img'),
      afterSectionId,
      dataUrl,
      label: String(label || '추가 상세 이미지').slice(0, 80),
      source,
      createdAt: Date.now(),
    };
    state.detailImageBlocks = [...(state.detailImageBlocks || []), block];
    markContentChanged();
  }
  state.imageInsert.open = false;
  state.imageInsert.error = '';
  savePersistentState();
  render();
}

function deleteDetailImageBlock(blockId) {
  if (!blockId) return;
  if (!confirm('추가한 상세 이미지를 삭제할까요?')) return;
  state.detailImageBlocks = (state.detailImageBlocks || []).filter(block => block.id !== blockId);

  render();
}

function moveDetailImageBlock(blockId, direction) {
  const blocks = [...(state.detailImageBlocks || [])];
  const index = blocks.findIndex(block => block.id === blockId);
  if (index < 0) return;
  const block = blocks[index];
  const sectionIndex = SECTIONS.findIndex(section => section.id === block.afterSectionId);
  const sameSlotIndexes = blocks
    .map((item, itemIndex) => ({ item, itemIndex }))
    .filter(entry => entry.item.afterSectionId === block.afterSectionId)
    .map(entry => entry.itemIndex);
  const slotPosition = sameSlotIndexes.indexOf(index);

  if (direction === 'up') {
    if (slotPosition > 0) {
      const swapIndex = sameSlotIndexes[slotPosition - 1];
      [blocks[index], blocks[swapIndex]] = [blocks[swapIndex], blocks[index]];
    } else if (sectionIndex > 0) {
      block.afterSectionId = SECTIONS[sectionIndex - 1].id;
    }
  } else {
    if (slotPosition >= 0 && slotPosition < sameSlotIndexes.length - 1) {
      const swapIndex = sameSlotIndexes[slotPosition + 1];
      [blocks[index], blocks[swapIndex]] = [blocks[swapIndex], blocks[index]];
    } else if (sectionIndex >= 0 && sectionIndex < SECTIONS.length - 1) {
      block.afterSectionId = SECTIONS[sectionIndex + 1].id;
    }
  }

  state.detailImageBlocks = blocks;
  markContentChanged();
  savePersistentState();
  render();
}

async function loadDetailDriveImages() {
  const folderRaw = document.getElementById('detailImageDriveFolderInput')?.value || state.imageInsert?.driveFolderId || '';
  const folderId = extractFolderId(folderRaw);
  if (!folderId) {
    state.imageInsert.error = 'Google Drive 폴더 URL 또는 ID를 입력해주세요.';
    render();
    return;
  }
  if (!driveService && !(await ensureDriveServiceReady())) {
    state.imageInsert.error = 'Google Drive가 아직 연결되지 않았습니다. 먼저 연결해주세요.';
    render();
    return;
  }
  state.imageInsert.driveFolderId = folderId;
  state.imageInsert.driveLoading = true;
  state.imageInsert.error = '';
  localStorage.setItem('detail_insert_drive_folder_id', folderId);
  render();
  try {
    const files = await driveService.listImages(folderId);
    state.imageInsert.driveFiles = files;
    state.imageInsert.driveLoading = false;
    state.imageInsert.error = files.length ? '' : '이 폴더에서 이미지 파일을 찾지 못했습니다.';
    render();
  } catch(e) {
    state.imageInsert.driveLoading = false;
    state.imageInsert.error = e.message || 'Google Drive 이미지를 불러오지 못했습니다.';
    render();
  }
}

async function useDriveDetailImage(fileId) {
  const file = (state.imageInsert?.driveFiles || []).find(item => item.id === fileId);
  if ((!driveService && !(await ensureDriveServiceReady())) || !fileId) return;
  state.imageInsert.driveLoading = true;
  state.imageInsert.error = '';
  render();
  try {
    const imgData = await driveService.downloadFile(fileId);

    state.imageInsert.driveLoading = false;
    state.imageInsert.error = e.message || 'Drive 이미지 다운로드에 실패했습니다.';
    render();
  }
}

function cacheRepairMaskFromCanvas() {
  const canvas = document.getElementById('repairMaskCanvas');
  if (canvas && canvas.width && canvas.height) state.aiRepair.maskDataUrl = canvas.toDataURL('image/png');

function restoreRepairMask(canvas, dataUrl) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!dataUrl) return;
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  img.src = dataUrl;
}

function initAiRepairCanvas() {
  const canvas = document.getElementById('repairMaskCanvas');
  const img = document.getElementById('repairSourceImage');
  if (!canvas || !img) return;

  const setup = () => {
    const w = img.naturalWidth || img.clientWidth || 1024;
    const h = img.naturalHeight || img.clientHeight || 1024;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      restoreRepairMask(canvas, state.aiRepair.maskDataUrl);
    }
    const ctx = canvas.getContext('2d');
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  };
  if (img.complete && img.naturalWidth) setup();
  else img.onload = setup;

  let drawing = false;
  let last = null;
  const point = event => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * (canvas.width / rect.width),
      y: (event.clientY - rect.top) * (canvas.height / rect.height),
      scale: canvas.width / rect.width,
    };
  };
  const draw = event => {
    if (!drawing) return;
    const p = point(event);
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(255,70,70,.72)';
    ctx.lineWidth = Math.max(2, (state.aiRepair.brushSize || 48) * p.scale);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  };
  const paintDot = p => {
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(255,70,70,.72)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(2, ((state.aiRepair.brushSize || 48) * p.scale) / 2), 0, Math.PI * 2);
    ctx.fill();
  };
  canvas.onpointerdown = event => {
    if (state.aiRepair.busy || event.button !== 0) return;
    event.preventDefault();
    setup();
    aiRepairMaskHistory = [...aiRepairMaskHistory.slice(-12), canvas.toDataURL('image/png')];
    drawing = true;
    last = point(event);
    canvas.setPointerCapture?.(event.pointerId);
    paintDot(last);
    draw(event);
  };
  canvas.onpointermove = event => draw(event);
  canvas.onpointerup = event => {
    if (!drawing) return;
    drawing = false;
    canvas.releasePointerCapture?.(event.pointerId);
    cacheRepairMaskFromCanvas();
  };
  canvas.onpointercancel = () => { drawing = false; cacheRepairMaskFromCanvas(); };
}

function buildAiRepairPrompt(mode, userInstruction) {
  const instruction = String(userInstruction || '').trim();
  const task = mode === 'replace'
    ? `Inside the masked area, apply this user request exactly: "${instruction}".`
    : `Remove the selected blemish, artifact, unwanted object, or distracting detail in the masked area and reconstruct the background or product surface naturally. ${instruction ? `Additional user note: "${instruction}".` : ''}`;
  return `Edit this Korean ecommerce detail-page image with high fidelity.
Use the mask as the target edit area. Edit only the transparent masked area.
Preserve every unmasked pixel as much as possible: product shape, text, lighting, shadows, colors, camera angle, texture, and layout must remain unchanged.
Blend the edit seamlessly so it looks like the original photo/design, not a pasted object.
${task}`;
}

async function runAiRepair() {
  const repair = state.aiRepair || {};
  const sectionId = repair.sectionId;
  const source = sectionId ? state.sectionImages[sectionId] : null;
  const canvas = document.getElementById('repairMaskCanvas');
  if (!sectionId || !source || !canvas) return;

  repair.mode = document.getElementById('repairMode')?.value || repair.mode || 'spot';
  repair.prompt = document.getElementById('repairPrompt')?.value || '';
  repair.model = document.getElementById('repairModel')?.value || repair.model || getAiRepairDefaultModel();
  repair.error = '';
  const openaiKey = getRuntimeOpenAIKey();

  if (!openaiKey) {
    repair.error = 'OpenAI API 키가 필요합니다. 모델 설정에서 OpenAI 키를 저장해주세요.';
    render();
    return;
  }
  if (!maskCanvasHasPaint(canvas)) {
    repair.error = '수정할 영역을 먼저 사진 위에 칠해주세요.';
    render();
    return;
  }
  if (repair.mode === 'replace' && !repair.prompt.trim()) {
    repair.error = '부분 교체 모드에서는 “꽃 장식으로 바꿔줘”처럼 수정 코멘트를 입력해주세요.';
    render();
    return;
  }

  const visualMask = canvas.toDataURL('image/png');
  const editMask = buildTransparentEditMaskDataUrl(canvas);
  repair.maskDataUrl = visualMask;
  repair.busy = true;
  render();

  try {
    const sourcePng = await imageSourceToPngDataUrl(source);
    const client = new OpenAIAPI(openaiKey, state.modelConfig.llmModel);
    const result = await client.editImageWithMask(
      sourcePng,
      editMask,
      buildAiRepairPrompt(repair.mode, repair.prompt),
      repair.model
    );
    if (!result) throw new Error('AI가 수정 이미지를 반환하지 않았습니다.');

    pushAiRepairUndo(sectionId, source, state.sectionContents[sectionId], repair.mode);
    captureCurrentSectionVariant(sectionId, 'baseline', 'AI 수정 전');
    applySectionContent(
      sectionId,
      state.sectionContents[sectionId],
      result,
      'generated',
      repair.mode === 'replace' ? 'AI 부분 교체' : 'AI 스팟 복구'
    );
    state.aiRepair = {
      ...state.aiRepair,
      open: false,
      busy: false,
      error: '',
      maskDataUrl: '',
    };
    aiRepairMaskHistory = [];
    savePersistentState();
    render();
  } catch(e) {
    state.aiRepair.busy = false;
    state.aiRepair.error = e.message || 'AI 부분 수정에 실패했습니다.';
    render();
  }
}

function bindPreviewLayerEvents() {
  document.querySelectorAll('[data-layer-select]').forEach(btn => {
    btn.onclick = () => {
      const [sectionId, layerId] = (btn.dataset.layerSelect || '').split(':');
      if (!sectionId || !layerId) return;
      state.activePreviewLayer = { sectionId, layerId };
      state.previewLayerMode = true;

    };
  });

  document.querySelectorAll('[data-layer-prop]').forEach(input => {
    input.oninput = () => {
      const [sectionId, layerId, prop] = (input.dataset.layerProp || '').split(':');
      if (!sectionId || !layerId || !prop) return;
      const value = prop === 'align' ? input.value : Number(input.value);
      setLayerEdit(sectionId, layerId, { [prop]: value });
      state.activePreviewLayer = { sectionId, layerId };
      render();
    };
  });

  document.querySelectorAll('[data-layer-reset]').forEach(btn => {
    btn.onclick = () => {
      const [sectionId, layerId] = (btn.dataset.layerReset || '').split(':');
      resetLayerEdit(sectionId, layerId);
      state.activePreviewLayer = { sectionId, layerId };
      render();
    };
  });

  document.querySelectorAll('[data-layer-reset-section]').forEach(btn => {
    btn.onclick = () => {
      resetLayerEdit(btn.dataset.layerResetSection);
      state.activePreviewLayer = null;
      render();
    };
  });

  document.querySelectorAll('[data-layer-nudge]').forEach(btn => {
    btn.onclick = () => {
      const [sectionId, layerId, dx, dy] = (btn.dataset.layerNudge || '').split(':');
      const e = getLayerEdit(sectionId, layerId);
      setLayerEdit(sectionId, layerId, { x: e.x + Number(dx || 0), y: e.y + Number(dy || 0) });
      state.activePreviewLayer = { sectionId, layerId };
      render();
    };
  });

  document.querySelectorAll('[data-layer-section][data-layer-id]').forEach(el => {
    const sectionId = el.dataset.layerSection;
    const layerId = el.dataset.layerId;
    el.onclick = (event) => {
      if (!state.previewLayerMode) return;
      event.stopPropagation();
      state.activePreviewLayer = { sectionId, layerId };
      render();
    };
    el.onpointerdown = (event) => {
      if (!state.previewLayerMode || event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      state.activePreviewLayer = { sectionId, layerId };
      const start = getLayerEdit(sectionId, layerId);
      const drag = { x: event.clientX, y: event.clientY, startX: start.x, startY: start.y };
      el.setPointerCapture?.(event.pointerId);
      el.style.cursor = 'grabbing';
      el.onpointermove = moveEvent => {
        const nextX = Math.round(drag.startX + moveEvent.clientX - drag.x);
        const nextY = Math.round(drag.startY + moveEvent.clientY - drag.y);
        state.previewLayerEdits[sectionId][layerId] = normalizeLayerEdit({ ...getLayerEdit(sectionId, layerId), x: nextX, y: nextY });
        el.style.transform = `translate(${nextX}px,${nextY}px) scale(${state.previewLayerEdits[sectionId][layerId].scale})`;
      };
      el.onpointerup = () => {
        el.onpointermove = null;
        el.onpointerup = null;
        el.style.cursor = '';
        savePersistentState();
        render();
      };
    };
  });

  document.onkeydown = event => {
    if (!state.previewLayerMode || !state.activePreviewLayer) return;
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const keyMap = {
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
    };
    const dir = keyMap[event.key];
    if (!dir) return;
    event.preventDefault();
    const step = event.shiftKey ? 10 : 1;
    const { sectionId, layerId } = state.activePreviewLayer;
    const e = getLayerEdit(sectionId, layerId);
    setLayerEdit(sectionId, layerId, { x: e.x + dir[0] * step, y: e.y + dir[1] * step });
    render();
  };
}

function handleCompImages(files) {
  const current = state.compPage.uploadedImages || [];
  const remaining = 10 - current.length;
  if (remaining <= 0) return;
  Array.from(files).slice(0, remaining).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const b64 = e.target.result.split(',')[1];
      state.compPage.uploadedImages = [...(state.compPage.uploadedImages || []), { name: file.name, base64: b64, mime: file.type }];
      render();
    };
    reader.readAsDataURL(file);
  });
}

async function startCompetitorAnalysis() {
  const cp = state.compPage;
  let llm;
  try { llm = getLLMClient(); } catch(e) {
    state.error = e.message || 'API 키를 먼저 설정해주세요.'; render(); return;
  }

  if (cp.mode === 'images') {
    if (!cp.uploadedImages || cp.uploadedImages.length === 0) {
      state.error = '스크린샷 이미지를 1장 이상 업로드해주세요.'; render(); return;
    }
  } else if (cp.mode === 'html') {
    const htmlEl = document.getElementById('compHtmlText');
    const htmlVal = htmlEl ? htmlEl.value.trim() : cp.htmlText;
    state.compPage.htmlText = htmlVal;
    if (!htmlVal) { state.error = 'HTML 텍스트를 입력하거나 파일을 업로드해주세요.'; render(); return; }
  } else if (cp.mode === 'url') {
    const urlEl = document.getElementById('compUrlInput');
    const urlVal = urlEl ? urlEl.value.trim() : cp.urlInput;
    state.compPage.urlInput = urlVal;
    if (!urlVal) { state.error = 'URL을 입력해주세요.'; render(); return; }
  }

  state.error = '';
  state.compPage.subStep = 'analyzing';
  state.compPage.analysisResult = null;
  render();

  try {
    let analysisResult;

    if (cp.mode === 'url') {
      // 1. 백엔드로 URL 스크래핑
      const backendBase = (state.compPage.scraperBase || 'http://127.0.0.1:5001').replace(/\/+$/, '');
      state.compPage.analyzeMsg = '페이지 데이터 불러오는 중...';
      render();

      const fetchResp = await fetch(`${backendBase}/api/competitor/fetch-url`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: state.compPage.urlInput }),
      });
      if (!fetchResp.ok) throw new Error(`백엔드 오류: ${fetchResp.status}`);
      const { job_id } = await fetchResp.json();

      // 폴링
      let fetchResult = null;
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const poll = await fetch(`${backendBase}/api/competitor/job/${job_id}`);
        const data = await poll.json();
        if (data.status === 'done') { fetchResult = data.result; break; }
        if (data.status === 'error') throw new Error(data.error || '스크래핑 실패');
      }
      if (!fetchResult) throw new Error('스크래핑 시간 초과');

      state.compPage.analyzeMsg = '경쟁사 페이지 구조 분석 중...';
      render();

      if (fetchResult.screenshots && fetchResult.screenshots.length > 0) {
        const imgs = fetchResult.screenshots.map(b64 => ({ base64: b64, mime: 'image/jpeg' }));
        analysisResult = await llm.analyzeCompetitorImages(imgs);
      } else if (fetchResult.html_text) {
        analysisResult = await llm.analyzeCompetitorHTML(fetchResult.html_text);
      } else {
        throw new Error('페이지 데이터를 가져오지 못했습니다.');
      }

    } else if (cp.mode === 'images') {
      state.compPage.analyzeMsg = '경쟁사 페이지 구조 분석 중...';
      render();
      analysisResult = await llm.analyzeCompetitorImages(cp.uploadedImages);

    } else {
      state.compPage.analyzeMsg = '경쟁사 페이지 구조 분석 중...';
      render();
      analysisResult = await llm.analyzeCompetitorHTML(cp.htmlText);
    }

    state.compPage.analysisResult = analysisResult;
    state.compPage.subStep = 'report';
    saveCompAnalysis(analysisResult, state.compPage.sectionPlan, state.compPage.planEdits);
    render();
  } catch(e) {
    state.error = `분석 실패: ${e.message}`;
    state.compPage.subStep = 'input';
    render();
  }
}

async function generateCompetitorPlan() {
  let llm;
  try { llm = getLLMClient(); } catch(e) { state.error = e.message; render(); return; }

  state.compPage.subStep = 'analyzing';
  state.compPage.analyzeMsg = '15개 섹션 플랜 생성 중...';
  render();

  try {
    const plan = await llm.generateCompetitorSectionPlan(
      state.compPage.analysisResult,
      state.analysis
    );
    // 초기 planEdits를 recommended_sections 기본값으로 채움
    const edits = {};
    (plan.recommended_sections || []).forEach(r => {
      edits[r.section_id] = {
        enabled: r.enabled !== false,
        instructions: r.recommended_instructions || '',
      };
    });
    state.compPage.sectionPlan = plan;
    state.compPage.planEdits = edits;
    state.compPage.subStep = 'plan';
    saveCompAnalysis(state.compPage.analysisResult, plan, edits);
    render();
  } catch(e) {
    state.error = `플랜 생성 실패: ${e.message}`;
    state.compPage.subStep = 'report';
    render();
  }
}

function applyCompetitorPlan() {
  const edits = state.compPage.planEdits || {};
  const newInstructions = { ...state.sectionInstructions };
  SECTIONS.forEach(s => {
    const ed = edits[s.id];
    if (ed && ed.instructions) {
      newInstructions[s.id] = ed.instructions;
    }
  });
  state.sectionInstructions = newInstructions;
  saveSectionInstructions(newInstructions);
  // 비활성화된 섹션은 skipSections에 추가
  const skip = new Set(state.skipSections || []);
  SECTIONS.forEach(s => {
    const ed = edits[s.id];
    if (ed && ed.enabled === false) skip.add(s.id);
    else if (ed && ed.enabled === true) skip.delete(s.id);
  });
  state.skipSections = Array.from(skip);
  // 경쟁사 분석 결과를 컨텍스트로 저장
  state.competitorData = state.compPage.analysisResult;
}

async function generateCompSection(sectionId) {
  if (!state.analysis) { state.error = '먼저 AI 분석 탭에서 제품 이미지를 분석해주세요.'; render(); return; }
  const s = SECTIONS.find(x => x.id === sectionId);
  if (!s) return;
  if (state.sectionLocks[sectionId]) {
    state.error = `${s.name} 섹션이 잠겨 있어 재생성하지 않았습니다. 먼저 잠금을 해제해주세요.`;
    render();
    return;
  }
  captureCurrentSectionVariant(sectionId, 'baseline');

  // 현재 planEdits 지시사항을 sectionInstructions에 반영
  const ed = state.compPage.planEdits[sectionId];
  if (ed?.instructions) state.sectionInstructions[sectionId] = ed.instructions;

  state.compPage.sectionStatus[sectionId] = 'loading';
  render();

  let llm;
  try { llm = getLLMClient(); } catch(e) { state.error = e.message; state.compPage.sectionStatus[sectionId] = 'error'; render(); return; }

  try {
    const compRef = state.competitorData ? JSON.stringify(state.competitorData).substring(0, 1000) : '';
    const content = await llm.generateSectionContent(s, state.analysis, state.sectionInstructions[sectionId] || '', compRef);
    let generatedImage;

    if (hasImageConnection()) {
      try {
        const img = await generateWithSelectedImageModel(
          content.image_description || content.design_notes || s.purpose,
          state.imageBase64,
          state.imageMime
        );
        if (img) generatedImage = img;
      } catch(e) {}
    }

    applySectionContent(sectionId, content, generatedImage, 'generated');
    savePersistentState();
    state.compPage.sectionStatus[sectionId] = 'done';
    render();
  } catch(e) {
    state.error = `${s.name} 생성 실패: ${e.message}`;

async function startAnalysis() {
  if (!state.imageBase64) { state.error = '제품 이미지를 업로드해주세요.'; render(); return; }

  let llm;
  try { llm = getLLMClient(); } catch(e) {
    if (state.modelConfig.llmProvider === 'openai') { state.error = e.message; render(); return; }
    state.showApiModal = true; render(); return;
  }

  state.error = '';
  state.step = 'analyzing';
  state.progress = 10;
  state.progressMsg = '제품 이미지 AI 분석 중...';
  // 이전 분석 결과 초기화
  state.analysis = null;
  state.competitorData = null;
  state.sectionContents = {};
  state.sectionImages = {};
  state.detailImageBlocks = [];
  state.sectionVariants = {};
  state.currentSectionVariantIds = {};
  state.manualSectionEdits = {};
  state.sectionLocks = {};
  state.qaReport = null;

    state.analysis = analysis;
    state.progress = 25;
    state.progressMsg = '유사 제품 검색 중...';
    render();

    // 2. Competitor search
    try {
      const competitors = await llm.searchSimilarProducts(

      );

  } catch (e) {
