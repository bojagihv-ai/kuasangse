// ════════════════════════════════════════════════════════════════
// IMAGE CUTS — GENERATION LOGIC
// ════════════════════════════════════════════════════════════════
async function generateCut(idx, workImgOverride) {
  const c = state.cuts;
  const p = c.prompts[idx];
  if (!c.sourceBase64 || !p.prompt.trim()) {
    state.error = '이미지와 프롬프트를 모두 입력해주세요.';
    render();
    return;
  }

  if (!hasImageConnection()) {
    state.error = '선택된 이미지 모델에 필요한 연결 정보가 없습니다.';
    render();
    return;
  }
  p.generating = true;
  render();

  // work image: override (Drive automation) > state > null
  const workImg = workImgOverride || (c.workImageBase64 ? { base64: c.workImageBase64, mime: c.workImageMime } : null);

  try {
    const cfg = state.modelConfig;
    const sizeHint = (cfg.imageSizeMode === 'custom' && cfg.imageWidth)
      ? `Exact output size: ${cfg.imageWidth}px wide${cfg.imageHeight ? ' × ' + cfg.imageHeight + 'px tall' : ''}.`
      : 'Aspect ratio 4:3.';

    let fullPrompt;
    if (workImg) {
      // Two-image mode: sample as style reference, work as the product to process
      fullPrompt = `You are given TWO images:
1. SAMPLE IMAGE — reference for style, background, composition, lighting
2. WORK IMAGE — the actual product to place in the scene

Task: Apply the following creative direction using the WORK IMAGE product, matching the SAMPLE IMAGE style.
${p.prompt}
Requirements: High quality, clean, professional Korean e-commerce style.
Use the WORK IMAGE product as the subject. Match the SAMPLE IMAGE background/composition. ${sizeHint}`;
    } else {
      fullPrompt = `Create a professional Korean e-commerce product detail page image cut.
Product image is provided. Apply the following creative direction:
${p.prompt}
Requirements: High quality, clean, professional Korean e-commerce style.
Maintain the product as the focal point. ${sizeHint}`;
    }
    const primaryImage = workImg || { base64: c.sourceBase64, mime: c.sourceMime };
    const extraImages = workImg ? [{ base64: c.sourceBase64, mime: c.sourceMime }] : [];
    const cutImage = await generateWithSelectedImageModel(
      fullPrompt,
      primaryImage.base64,
      primaryImage.mime,
      extraImages
    );
    if (!cutImage) throw new Error('이미지가 반환되지 않았습니다');

    p.result = cutImage;
    p.generating = false;
    savePrompts();
    render();
  } catch(e) {
    p.generating = false;
    state.error = `컷 ${idx+1} 생성 실패: ${e.message}`;
    render();
  }
}

async function generateAllCuts() {
  for (let i = 0; i < state.cuts.prompts.length; i++) {
    await generateCut(i);
    await new Promise(r => setTimeout(r, 800));
  }
}

function savePrompts() {
  // result(base64)는 용량 문제로 저장 안 함 — prompt/label만 저장
  const toSave = state.cuts.prompts.map(p => ({
    id: p.id,
    label: p.label,
    prompt: p.prompt,
    result: null,
    generating: false,
  }));
  try { localStorage.setItem('cuts_prompts', JSON.stringify(toSave)); } catch(e) {}
  try {
    document.cookie = `cuts_prompts=${encodeURIComponent(JSON.stringify(toSave))};max-age=31536000;path=/;SameSite=Lax`;
  } catch(e) {}
}

function loadPrompts() {
  let data = null;
  try {
    const raw = localStorage.getItem('cuts_prompts');
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
  if (!data) {
    try {
      const m = document.cookie.match(/cuts_prompts=([^;]+)/);
      if (m) data = JSON.parse(decodeURIComponent(m[1]));
    } catch(e) {}
  }
  return data || [
    { id:'cut1', label:'컷 1', prompt:'', result:null, generating:false },
    { id:'cut2', label:'컷 2', prompt:'', result:null, generating:false },
    { id:'cut3', label:'컷 3', prompt:'', result:null, generating:false },
    { id:'cut4', label:'컷 4', prompt:'', result:null, generating:false },
  ];
}

function savePlacement() {
  localStorage.setItem('cuts_placement', JSON.stringify(state.cuts.placement));
}

// 배치 적용 — sectionImages에 이미지컷 반영
function applyPlacement() {
  const c = state.cuts;
  for (const [sectionId, cutId] of Object.entries(c.placement)) {
    const cut = c.prompts.find(p => p.id === cutId);
    if (cut?.result) {
      state.sectionImages[sectionId] = cut.result;
    } else {
      delete state.sectionImages[sectionId];
    }
  }
  savePlacement();
  markContentChanged();
  savePersistentState();
  state.step = 'preview';
  render();
}

async function runCutsWorkDriveAutomation() {
  if (!driveService && !(await ensureDriveServiceReady())) { state.error = 'Drive가 연결되어 있지 않습니다. 자동화 탭에서 연결하세요.'; render(); return; }
  const folderId = state.cuts.workDriveFolderId;
  if (!folderId) { state.error = '작업 이미지 Drive 폴더 ID를 입력하세요.'; render(); return; }
  if (!state.cuts.sourceBase64) { state.error = '샘플 이미지를 먼저 업로드하세요.'; render(); return; }
  const hasPrompts = state.cuts.prompts.some(p => p.prompt.trim());
  if (!hasPrompts) { state.error = '프롬프트를 하나 이상 입력하세요.'; render(); return; }

  state.cuts.workDriveRunning = true;
  render();

  try {
    const files = await driveService.listImages(folderId);
    if (files.length === 0) {
      state.error = '폴더에 이미지가 없습니다.';
      state.cuts.workDriveRunning = false;
      render();
      return;
    }

    for (const file of files) {
      state.progressMsg = `작업 이미지 처리 중: ${file.name}`;
      render();
      try {
        const imgData = await driveService.downloadFile(file.id);
        const workImgOverride = { base64: imgData.base64, mime: imgData.mime };
        // 이 작업 이미지로 모든 컷 생성
        for (let i = 0; i < state.cuts.prompts.length; i++) {
          if (!state.cuts.prompts[i].prompt.trim()) continue;
          await generateCut(i, workImgOverride);
          await new Promise(r => setTimeout(r, 600));
        }
        // 결과를 Drive 출력 폴더가 있으면 업로드 (자동화 output 폴더 재사용)
        if (state.auto.outputFolderId && driveService) {
          for (let i = 0; i < state.cuts.prompts.length; i++) {
            const cut = state.cuts.prompts[i];
            if (!cut.result) continue;
            try {
              const baseName = file.name.replace(/\.[^.]+$/, '');
              const blob = await (await fetch(cut.result)).blob();
              const jpegBlob = await convertToJpegBlob(blob);
              await driveService.uploadImage(state.auto.outputFolderId, `${baseName}_cut${i+1}.jpg`, jpegBlob);
            } catch(e2) { console.warn('Drive 업로드 실패:', e2.message); }
          }
        }
      } catch(e) {
        console.warn(`${file.name} 처리 실패:`, e.message);
      }
    }
    state.progressMsg = '';
    state.cuts.workDriveRunning = false;
    render();
  } catch(e) {
    state.error = `Drive 자동화 실패: ${e.message}`;
    state.cuts.workDriveRunning = false;
    render();
  }
}

async function convertToJpegBlob(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('변환 실패')), 'image/jpeg', 0.92);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}

function buildExportHtml(analysis, sectionContents, sectionImages, detailImageBlocks = []) {
  let sectionsHtml = '';
  for (const s of SECTIONS) {
    const content = sectionContents[s.id];
    if (!content) continue;
    const img = sectionImages[s.id];
    sectionsHtml += renderSectionTemplate(s, content, img, 'export');
    sectionsHtml += renderDetailImageBlocksAfter(s.id, 'export', detailImageBlocks);
  }
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${analysis.product_name||'상세페이지'}</title><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Pretendard','Noto Sans KR',sans-serif;color:#333}img{max-width:100%;height:auto}section{width:100%}</style></head><body>${sectionsHtml}</body></html>`;
}

function startAutomation() {
  if (state.auto.running) return;
  state.auto.running = true;
  autoLog('info', `자동화 시작 (${state.auto.intervalMin}분 간격)`);

  // Run immediately
  autoProcessOne();

  // Schedule
  state.auto.timerId = setInterval(() => {
    if (!state.auto.currentItem) { // 이전 작업 완료된 경우만
      const now = new Date();
      state.auto.nextRunAt = new Date(now.getTime() + state.auto.intervalMin * 60000).toLocaleTimeString('ko-KR');
      autoProcessOne();
    }
  }, state.auto.intervalMin * 60 * 1000);

  const now = new Date();
  state.auto.nextRunAt = new Date(now.getTime() + state.auto.intervalMin * 60000).toLocaleTimeString('ko-KR');
  render();
}

function stopAutomation() {
  state.auto.running = false;
  if (state.auto.timerId) {
    clearInterval(state.auto.timerId);
    state.auto.timerId = null;
  }
  state.auto.nextRunAt = null;
  autoLog('info', '자동화 중지됨');
  render();
}

// 자동화 탭 상태 폴링 (자동화 탭에 있을 때 5초마다 서버 상태 갱신)
let _autoTabPollTimer = null;
function startAutoTabPolling() {
  if (_autoTabPollTimer) return;
  _autoTabPollTimer = setInterval(async () => {
    if (state.step !== 'automation') {
      clearInterval(_autoTabPollTimer);
      _autoTabPollTimer = null;
      return;
    }
    const base = state.auto.serverApiBase;
    if (!base) return;
    // config가 아직 없으면 전체 config 재시도 (API 늦게 켜지는 경우)
    if (!state.auto.serverConfig && !state.auto.serverLoading) {
      await fetchServerAutomationConfig();
      return;
    }
    try {
      const res = await fetch(`${base}/pdp/automation/status`);
      if (!res.ok) return;
      const data = await res.json();
      state.auto.serverStatus = data;
      patchAutomationStatusInPlace(); // render() 대신 — 깜빡임 없음
    } catch(e) { /* 무시 */ }
  }, 5000);
}

registerBindEventExtension(function bindAutomationEvents() {
  if (state.step === 'automation') {
    if (!state.auto.serverFetchedOnce && !state.auto.serverLoading) {
      state.auto.serverFetchedOnce = true;
      fetchServerAutomationConfig();

  }

  const serverRefreshBtn = document.getElementById('serverAutoRefreshBtn');
  if (serverRefreshBtn) {
    serverRefreshBtn.onclick = async () => {
      const baseInput = document.getElementById('serverAutoApiBase');
      if (baseInput) state.auto.serverApiBase = baseInput.value.trim();

    };
  }

  const buildProfileUpdate = (mode, modeId, enabledOverride) => {
    const currentProfile = state.auto.serverConfig?.profiles?.[mode] || {};
    // 저장(save) 시 enabledOverride 없으면 항상 OFF — 자동화 실행 버튼만 ON 설정
    const enabled = enabledOverride !== undefined ? enabledOverride : false;

    const imageModel = document.getElementById(`serverModel${modeId}`)?.value || currentProfile.imageModel || 'gemini-3.1-flash-image-preview';

    const update = { enabled, inputFolderId, sourceDoneFolderId, outputFolderId, pollIntervalSeconds, maxFilesPerRun, imageModel, outputImageSize };
    if (mode === 'image-cuts') {
      update.customCuts = state.auto.draftCuts.map(c => ({label: c.label, prompt: c.prompt}));
    }
    return update;
  };

  const bindServerMode = (mode, modeId) => {
    const saveBtn = document.getElementById(`serverSave${modeId}`);

      saveBtn.onclick = async () => {
        await updateServerAutomationProfiles({ [mode]: buildProfileUpdate(mode, modeId) });

  if (connectBtn) connectBtn.onclick = connectDrive;

  if (setInput) setInput.onclick = async () => {
    const raw = document.getElementById('inputFolderId')?.value.trim();
    if (!raw) return;
    const id = extractFolderId(raw);

      if (!driveService) await ensureDriveServiceReady();
      const name = await driveService.getFolderName(id);
      state.auto.inputFolderName = name;
      localStorage.setItem('auto_input_folder_name', name);
      autoLog('ok', `입력 폴더 설정 완료: ${name}`);
    } catch(e) {
      state.auto.inputFolderName = id;
      autoLog('err', '폴더 이름 조회 실패: ' + e.message);
    }
    render();
  };

  const setOutput = document.getElementById('setOutputFolder');
  if (setOutput) setOutput.onclick = async () => {
    const raw = document.getElementById('outputFolderId')?.value.trim();
    if (!raw) return;
    const id = extractFolderId(raw);
    state.auto.outputFolderId = id;
    localStorage.setItem('auto_output_folder_id', id);
    autoLog('info', `출력 폴더 ID 추출: ${id}`);
    try {
      if (!driveService) await ensureDriveServiceReady();
      const name = await driveService.getFolderName(id);
      state.auto.outputFolderName = name;
      localStorage.setItem('auto_output_folder_name', name);
      autoLog('ok', `출력 폴더 설정: ${name}`);
    } catch(e) {
      state.auto.outputFolderName = id;
      autoLog('err', '폴더 이름 조회 실패, ID로 설정됨');
    }
    render();
  };

  const intervalSlider = document.getElementById('intervalSlider');
  if (intervalSlider) {
    intervalSlider.oninput = () => {
      const v = parseInt(intervalSlider.value);
      state.auto.intervalMin = v;
      localStorage.setItem('auto_interval', v);
      const disp = document.getElementById('intervalDisplay');
      if (disp) disp.textContent = v + '분';
    };
  }

  const startBtn = document.getElementById('startAutoBtn');
  if (startBtn) startBtn.onclick = startAutomation;

  const stopBtn = document.getElementById('stopAutoBtn');
  if (stopBtn) stopBtn.onclick = stopAutomation;

  const runOnce = document.getElementById('runOnceBtn');
  if (runOnce) runOnce.onclick = () => {
    autoLog('info', '수동 1회 실행');
    autoProcessOne();
  };

  const resetBtn = document.getElementById('resetProcessedBtn');
  if (resetBtn) resetBtn.onclick = () => {
    state.auto.processedFileIds.clear();
    localStorage.removeItem('auto_processed_ids');
    state.auto.totalProcessed = 0;
    localStorage.setItem('auto_total_processed', '0');
    state.auto.completed = [];
    localStorage.setItem('auto_completed', '[]');
    autoLog('info', '처리 기록 초기화됨');
    render();
  };
});

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
if (hasGeminiConnection()) {
  gemini = createGeminiClient();
}
// Try init Google auth if client ID exists
setTimeout(() => { try { initGoogleAuth(); } catch(e) {} }, 1000);
render();
hydratePersistentSessionAssets().catch(() => {});
refreshWorkspaceLists().catch(() => {});
</script>
