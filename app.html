.factory-page{display:flex;flex-direction:column;gap:18px;padding-bottom:48px}
.factory-run-status-rail{position:sticky;top:92px;align-self:start;min-width:0;overflow:visible}
.factory-run-status-card{display:flex;flex-direction:column;max-height:calc(100vh - 110px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-gutter:stable}
.factory-run-status-card [data-factory-goal-log-list]{max-height:min(460px,calc(100vh - 220px));overflow-y:auto;overflow-x:hidden;min-height:120px;flex:0 0 auto;scrollbar-width:thin;scrollbar-gutter:stable}
.factory-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding:18px 20px;border:1px solid rgba(99,102,241,.28);border-radius:14px;background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(20,184,166,.05))}
.factory-title{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.factory-title h2{font-size:24px;font-weight:900;letter-spacing:0;white-space:nowrap;word-break:keep-all;flex:0 0 auto}
.factory-desc{font-size:13px;color:var(--text-d);line-height:1.65;max-width:860px;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.factory-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.factory-section{border:1px solid var(--border);border-radius:14px;background:var(--bg-card);padding:16px}
.factory-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.factory-section-head h3{font-size:16px;font-weight:900;margin-bottom:4px;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.factory-section-head p{font-size:12px;color:var(--text-d);line-height:1.55;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.factory-product-grid{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(280px,.9fr);gap:12px}
.factory-card{border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.18);padding:14px;min-width:0}
.factory-card h4{font-size:13px;font-weight:900;margin-bottom:8px;color:var(--text)}
.factory-automation-shell{background:linear-gradient(180deg,rgba(99,102,241,.10),rgba(0,0,0,.16));border-color:rgba(99,102,241,.34)}
.factory-automation-tabs{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:0 4px;border-bottom:1px solid rgba(99,102,241,.22);scrollbar-width:thin}
.factory-automation-tab{display:flex;align-items:center;gap:8px;min-width:max-content;padding:10px 14px;border:1px solid var(--border);border-bottom:0;border-radius:12px 12px 0 0;background:rgba(10,12,20,.74);color:var(--text-d);font-size:12px;font-weight:900;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.factory-automation-tab:hover{border-color:rgba(129,140,248,.52);color:var(--text)}
.factory-automation-tab.active{background:var(--bg-card);border-color:rgba(99,102,241,.62);color:var(--text);box-shadow:0 -1px 0 rgba(99,102,241,.28) inset}
.factory-automation-tab-no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;font-weight:900;flex-shrink:0}
.factory-automation-body{border:1px solid rgba(99,102,241,.28);border-top:0;border-radius:0 0 14px 14px;background:rgba(0,0,0,.12);padding:14px}
.factory-automation-grid{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(320px,1.1fr);gap:12px;align-items:start}
.factory-automation-panel{border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.18);padding:14px;min-width:0;content-visibility:auto;contain-intrinsic-size:360px}
.factory-automation-panel:has([data-factory-confirm-size-image]){content-visibility:visible}
.factory-automation-panel:has(.factory-candidate-panel){content-visibility:visible}
.factory-candidate-automation-panel{content-visibility:visible;contain-intrinsic-size:none}
.factory-automation-panel h4{font-size:14px;font-weight:900;margin:0 0 8px;color:var(--text);word-break:keep-all;overflow-wrap:normal;line-break:strict}
.factory-automation-panel p{font-size:12px;color:var(--text-d);line-height:1.6;margin:0 0 12px;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.factory-automation-drop{min-height:210px;margin-bottom:12px}
.factory-automation-status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:10px 0}
.factory-automation-status-card{border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.025);padding:10px;min-width:0}
.factory-automation-status-card.done{border-color:rgba(34,197,94,.36);background:rgba(34,197,94,.08)}
.factory-automation-status-card.warn{border-color:rgba(245,158,11,.38);background:rgba(245,158,11,.08)}
.factory-automation-status-card strong{display:block;font-size:16px;color:var(--text);margin-top:3px}
.factory-automation-status-card span{display:block;font-size:11px;color:var(--text-m);line-height:1.45}
.factory-automation-step-list{display:flex;flex-direction:column;gap:8px}
.factory-automation-step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.025)}
.factory-automation-step.done{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.06)}
.factory-automation-step.warn{border-color:rgba(245,158,11,.38);background:rgba(245,158,11,.06)}
.factory-automation-step .material-icons-outlined{font-size:18px;color:var(--primary-h)}
.factory-automation-step-title{font-size:12px;font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.factory-automation-step-desc{font-size:11px;color:var(--text-m);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.factory-automation-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.factory-automation-note{border:1px dashed rgba(99,102,241,.30);border-radius:10px;background:rgba(99,102,241,.07);padding:10px;font-size:11px;color:var(--text-d);line-height:1.55;margin-top:10px;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.factory-input-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.factory-size-review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:8px;margin-top:9px}
[data-factory-size-card="size"]{grid-column:1/-1}
.factory-size-review-value{font-size:14px;font-weight:950;color:var(--text);margin-top:3px;white-space:normal;overflow-wrap:break-word;word-break:keep-all}
.factory-field-transfer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:8px;margin-top:12px}
.factory-field-transfer-target-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px;margin-top:12px}
.factory-drop{position:relative;display:flex;align-items:center;justify-content:center;min-height:170px;border:1.5px dashed rgba(99,102,241,.35);border-radius:12px;background:rgba(10,12,20,.56);overflow:hidden;cursor:pointer;transition:.15s}
.factory-drop[draggable="true"],.factory-asset-card[draggable="true"]{cursor:grab}
.factory-drop.dragging,.factory-asset-card.dragging{opacity:.72}
.factory-drop:hover,.factory-drop.drag-over{border-color:var(--primary-h);background:rgba(99,102,241,.08)}
.factory-drop img{width:100%;height:auto;max-width:100%;max-height:260px;object-fit:contain;display:block;margin:auto}
#factoryProductDrop,#factoryGuideProductDrop{min-height:170px}
#factoryProductDrop > img,#factoryGuideProductDrop > img{max-height:170px}
.factory-automation-drop#factoryGuideProductDrop{min-height:210px}
.factory-automation-drop#factoryGuideProductDrop > img{max-height:210px}
.factory-drop-empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--text-d);font-size:12px;line-height:1.5;padding:18px}
.factory-drop-empty .material-icons-outlined{font-size:30px;color:var(--primary-h)}
.factory-mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.factory-mini{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px;background:rgba(255,255,255,.025);font-size:12px;color:var(--text-d);min-width:0}
.factory-mini b{display:block;color:var(--text);font-size:14px;margin-top:3px;word-break:keep-all;overflow-wrap:anywhere}
.factory-review-toggle{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.10);border-radius:10px;background:rgba(0,0,0,.18);padding:8px 10px;font-size:11px;font-weight:900;color:var(--text);cursor:pointer}
.factory-review-toggle input{width:16px;height:16px;accent-color:var(--primary)}
.factory-candidate-review{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px;margin-top:12px}
.factory-candidate-panel{border:1px solid rgba(245,158,11,.26);border-radius:12px;background:rgba(245,158,11,.045);padding:11px;min-width:0}
.factory-candidate-panel.confirmed{border-color:rgba(34,197,94,.34);background:rgba(34,197,94,.045)}
.factory-candidate-panel h5{margin:0;font-size:12px;font-weight:950;color:var(--text)}
.factory-candidate-panel p{margin:3px 0 0;color:var(--text-m);font-size:10px;line-height:1.5}
.factory-candidate-list{display:grid;gap:8px;margin-top:9px;max-height:360px;overflow:auto;padding-right:2px}
.factory-candidate-card{border:1px solid rgba(255,255,255,.09);border-radius:10px;background:rgba(0,0,0,.20);padding:9px;display:grid;gap:7px;min-width:0}
.factory-candidate-card.selected{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.075)}
.factory-candidate-card-top{display:grid;grid-template-columns:auto auto minmax(140px,1fr);gap:10px;align-items:start}
.factory-candidate-actions{grid-column:1 / -1}
.factory-candidate-card-top .btn-sm{grid-column:3;justify-self:start;max-width:100%;white-space:normal;text-align:left;line-height:1.25}
.factory-candidate-rank{width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-size:11px;font-weight:950}
.factory-candidate-thumb{width:74px;height:74px;border:1px solid rgba(255,255,255,.10);border-radius:9px;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-m)}
.factory-candidate-thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.factory-candidate-thumb .material-icons-outlined{font-size:20px;opacity:.72}
.factory-candidate-text{min-width:0;max-width:100%}
.factory-candidate-name{font-size:12px;font-weight:950;color:var(--text);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.factory-candidate-code{font-size:10px;color:var(--text-m);line-height:1.45;margin-top:2px;word-break:break-all}
.factory-candidate-meta{display:flex;flex-wrap:wrap;gap:5px}
.factory-candidate-meta span{border:1px solid rgba(99,102,241,.30);border-radius:999px;background:rgba(99,102,241,.10);color:var(--primary-h);font-size:10px;font-weight:850;padding:3px 7px}
.factory-candidate-note{font-size:10px;color:var(--text-d);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.factory-db-review{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.factory-db-review-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.factory-db-review-head h4{margin:0;font-size:13px;font-weight:950}
.factory-db-review-head p{margin:3px 0 0;color:var(--text-d);font-size:11px;line-height:1.5}
.factory-db-field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:8px}
.factory-db-field-card{border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.025);padding:9px;min-width:0}
.factory-db-field-card.missing{border-color:rgba(239,68,68,.54);background:rgba(239,68,68,.08)}
.factory-db-field-card.disabled{opacity:.58}
.factory-db-field-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.factory-db-field-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;min-width:0}
.factory-db-field-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.factory-db-check{width:16px;height:16px;accent-color:var(--primary)}
.factory-db-required{font-size:9px;font-weight:950;color:#fecaca;border:1px solid rgba(239,68,68,.38);background:rgba(239,68,68,.10);border-radius:999px;padding:2px 5px;white-space:nowrap}
.factory-db-source{font-size:9px;font-weight:850;color:var(--primary-h);border:1px solid rgba(99,102,241,.34);background:rgba(99,102,241,.10);border-radius:999px;padding:2px 5px;white-space:nowrap}
.factory-db-value{width:100%;min-height:44px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:rgba(0,0,0,.22);color:var(--text);font-size:11px;line-height:1.45;font-family:inherit;resize:vertical}
.factory-db-value.missing{border-color:rgba(239,68,68,.60);color:#fecaca}
.factory-db-hint{font-size:10px;color:var(--text-m);line-height:1.45;margin-top:5px}
.factory-db-source-list{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.factory-db-source-btn{border:1px solid rgba(99,102,241,.28);background:rgba(99,102,241,.08);color:var(--primary-h);border-radius:999px;padding:2px 6px;font-size:9px;font-weight:850;cursor:pointer}
.factory-db-source-btn:hover{background:rgba(99,102,241,.16)}
.factory-db-raw{margin-top:12px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(0,0,0,.15);overflow:hidden}
.factory-db-raw summary{cursor:pointer;padding:9px 10px;font-size:11px;font-weight:900;color:var(--text-d)}
.factory-db-raw-table{display:grid;gap:1px;background:rgba(255,255,255,.05);max-height:260px;overflow:auto}
.factory-db-raw-row{display:grid;grid-template-columns:78px minmax(90px,.8fr) minmax(120px,1.2fr) auto;gap:8px;align-items:center;padding:7px 8px;background:rgba(10,12,20,.96);font-size:10px;color:var(--text-d);min-width:0}
.factory-db-raw-row b,.factory-db-raw-row code{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.factory-db-raw-row code{font-family:monospace;color:var(--text-m)}
.factory-db-raw-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.factory-source-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:10px;margin-top:12px}
.factory-source-panel{border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.018);padding:11px;min-width:0}
.factory-source-panel.cafe24{border-color:rgba(34,197,94,.28);background:rgba(34,197,94,.035);grid-column:1/-1}
.factory-source-panel.sinhwa{border-color:rgba(99,102,241,.25);background:rgba(99,102,241,.035)}
.factory-source-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.factory-source-head-side{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.factory-source-panel-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.factory-source-title{font-size:12px;font-weight:950;color:var(--text);line-height:1.35}
.factory-source-sub{font-size:10px;color:var(--text-m);line-height:1.5;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.factory-source-section{border:1px solid rgba(255,255,255,.065);border-radius:10px;background:rgba(0,0,0,.14);padding:8px;margin-top:8px}
.factory-source-section h5{margin:0 0 7px;font-size:11px;font-weight:950;color:var(--text-d);display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.factory-source-section h5>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.factory-source-collapsed-note{border:1px dashed rgba(148,163,184,.24);border-radius:10px;background:rgba(2,6,23,.22);padding:10px 12px;font-size:11px;color:var(--text-m);line-height:1.45;margin-top:8px;word-break:keep-all;overflow-wrap:anywhere}
.factory-source-field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:6px}
.factory-source-field{border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(0,0,0,.18);padding:8px;min-width:0}
.factory-source-panel.cafe24 .factory-source-section{padding:0;overflow:hidden}
.factory-source-panel.cafe24 .factory-source-section h5{padding:10px 12px;margin:0;border-bottom:1px solid rgba(255,255,255,.075);background:rgba(255,255,255,.035);color:var(--text);font-size:12px}
.factory-source-panel.cafe24 .factory-source-section.collapsed h5{border-bottom:0}
.factory-source-panel.cafe24 .factory-source-field-grid{display:grid;grid-template-columns:1fr;gap:0}
.factory-source-panel.cafe24 .factory-source-field{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) minmax(240px,.72fr);gap:8px 14px;align-items:start;background:rgba(4,15,12,.42);border:0;border-bottom:1px solid rgba(255,255,255,.075);border-radius:0;padding:10px 12px;min-width:0;overflow:hidden}
.factory-source-panel.cafe24 .factory-source-field:last-child{border-bottom:0}
.factory-source-field.missing{border-color:rgba(239,68,68,.48);background:rgba(239,68,68,.07)}
.factory-source-field-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.factory-source-panel.cafe24 .factory-source-field-top{grid-column:1;align-items:flex-start;justify-content:flex-start;flex-wrap:wrap;margin:0;padding-top:2px}
.factory-source-panel.cafe24 .factory-source-field>.factory-source-select,.factory-source-panel.cafe24 .factory-source-field>.factory-source-input,.factory-source-panel.cafe24 .factory-source-field>.factory-source-edit,.factory-source-panel.cafe24 .factory-source-field>.factory-source-field-value,.factory-source-panel.cafe24 .factory-source-field>.factory-cafe24-structured{grid-column:2;min-width:0;max-width:100%}
.factory-source-panel.cafe24 .factory-source-field>.factory-source-edit-hint{grid-column:2;margin-top:0;max-width:64ch}
.factory-source-panel.cafe24 .factory-source-field>.factory-source-cafe24-actions{grid-column:2}
.factory-source-panel.cafe24 .factory-source-field>div[style]{grid-column:2}
.factory-source-panel.cafe24 .factory-source-field>.factory-source-compare-cell{grid-column:3;grid-row:1 / span 3}
.factory-source-field-label{font-size:10px;font-weight:900;color:var(--text-m);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.factory-source-panel.cafe24 .factory-source-field-label{font-size:11px;color:var(--text);min-width:120px}
.factory-source-panel.cafe24 .factory-source-field.missing{background:rgba(127,29,29,.16)}
.factory-source-api-key{font-size:9px;font-weight:800;color:var(--text-m);opacity:.72;margin-left:4px}
.factory-source-route-badge{font-size:9px;font-weight:950;line-height:1.2;border:1px solid rgba(148,163,184,.24);border-radius:999px;padding:2px 6px;color:var(--text-m);background:rgba(148,163,184,.08);white-space:nowrap}
.factory-source-route-badge.product{border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.09);color:#86efac}
.factory-source-route-badge.dedicated{border-color:rgba(245,158,11,.36);background:rgba(245,158,11,.10);color:#fbbf24}
.factory-source-route-badge.readonly{border-color:rgba(148,163,184,.22);background:rgba(148,163,184,.07);color:var(--text-m)}
.factory-cafe24-advanced{margin-top:12px;border:1px solid rgba(99,102,241,.18);border-radius:12px;background:rgba(13,16,31,.55);overflow:hidden}
.factory-cafe24-advanced summary{cursor:pointer;padding:11px 12px;font-size:12px;font-weight:950;color:var(--text);display:flex;align-items:center;gap:8px}
.factory-cafe24-advanced summary::before{content:'settings';font-family:'Material Icons Outlined';font-size:16px;color:var(--primary-h)}
.factory-cafe24-advanced-body{padding:0 12px 12px;display:grid;gap:10px}
.factory-source-field-value{min-height:26px;font-size:12px;font-weight:850;color:var(--text);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.factory-source-field-value.missing{color:#fecaca}
.factory-source-compare-cell{border:1px solid rgba(99,102,241,.22);border-radius:9px;background:rgba(99,102,241,.06);padding:8px;min-height:54px;display:grid;gap:5px;align-self:stretch;min-width:0;max-width:100%;overflow:hidden}
.factory-source-compare-cell.match{border-color:rgba(34,197,94,.36);background:rgba(34,197,94,.07)}
.factory-source-compare-cell.diff{border-color:rgba(245,158,11,.34);background:rgba(245,158,11,.07)}
.factory-source-compare-cell.missing{border-color:rgba(239,68,68,.28);background:rgba(127,29,29,.10)}
.factory-source-compare-head{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:10px;font-weight:950;color:#c4b5fd}
.factory-source-compare-head small{font-size:9px;color:var(--text-m);font-weight:850;line-height:1.25}
.factory-source-compare-value{font-size:12px;font-weight:850;color:var(--text);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.factory-source-compare-cell.missing .factory-source-compare-value{color:#fecaca}
.factory-source-compare-edit{width:100%;min-width:0;resize:vertical;border:1px solid rgba(148,163,184,.18);border-radius:8px;background:rgba(3,7,18,.52);color:var(--text);font-size:12px;font-weight:850;line-height:1.45;padding:8px;outline:none}
.factory-source-compare-edit:focus{border-color:rgba(99,102,241,.62);box-shadow:0 0 0 2px rgba(99,102,241,.16)}
.factory-source-compare-edit.missing{border-color:rgba(239,68,68,.45);background:rgba(127,29,29,.12);color:#fecaca}
.factory-source-compare-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.factory-source-compare-actions .btn-sm{font-size:10px;padding:5px 7px}
.factory-source-cafe24-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:2px}
.factory-source-cafe24-actions .btn-sm{font-size:10px;padding:5px 7px;color:#93c5fd}
.factory-source-compare-badge{font-size:9px;font-weight:950;line-height:1.2;border:1px solid rgba(148,163,184,.24);border-radius:999px;padding:2px 6px;color:var(--text-m);background:rgba(148,163,184,.08);white-space:nowrap}
.factory-source-compare-badge.match{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.10);color:#86efac}
.factory-source-compare-badge.diff{border-color:rgba(245,158,11,.34);background:rgba(245,158,11,.10);color:#fbbf24}
.factory-source-compare-badge.missing{border-color:rgba(239,68,68,.30);background:rgba(239,68,68,.08);color:#fecaca}
.factory-workspace-panel{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}

  .factory-page{order:1}
  .factory-run-status-rail{position:static;width:100%;max-height:none;order:2}
  .factory-run-status-card{max-height:calc(100vh - 140px)}
  .factory-run-status-card [data-factory-goal-log-list]{max-height:min(420px,calc(100vh - 220px))}

  .factory-toolbar{justify-content:flex-start}
  .factory-product-grid{grid-template-columns:1fr}
  .factory-automation-grid{grid-template-columns:1fr}
  .factory-stage-head{grid-template-columns:auto minmax(0,1fr)}
  .factory-stage-status{grid-column:1/-1;justify-self:start}
  .factory-stage-counts{grid-template-columns:1fr}
  .factory-db-raw-row{grid-template-columns:1fr;gap:4px}
  .factory-source-panel.cafe24 .factory-source-field{grid-template-columns:1fr}
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-select,
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-input,
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-edit,
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-field-value,
  .factory-source-panel.cafe24 .factory-source-field>.factory-cafe24-structured,
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-cafe24-actions,
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-compare-cell,
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-edit-hint,
  .factory-source-panel.cafe24 .factory-source-field>div[style]{grid-column:1}
  .factory-source-panel.cafe24 .factory-source-field>.factory-source-compare-cell{grid-row:auto}
  .factory-db-snapshot-list{grid-template-columns:1fr}
  .factory-workspace-panel{grid-template-columns:1fr}
  .factory-recent-workfile-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .factory-cafe24-option-grid{grid-template-columns:1fr}
  .factory-option-compare-grid{grid-template-columns:1fr}
  .factory-cafe24-variant-row{grid-template-columns:1fr}

  .factory-cafe24-structured-row.two,

/* Model Settings */
.provider-tabs{display:flex;gap:8px;margin-bottom:20px}
.provider-tab{flex:1;padding:14px;border-radius:10px;border:2px solid var(--border);background:var(--bg-card);cursor:pointer;text-align:center;transition:.15s}
.provider-tab:hover{border-color:var(--border-h)}
.provider-tab.active-gemini{border-color:#6366f1;background:rgba(99,102,241,.1)}
.provider-tab.active-openai{border-color:#10a37f;background:rgba(16,163,127,.1)}
.provider-tab .pt-icon{font-size:22px;font-weight:900;margin-bottom:4px}
.provider-tab .pt-label{font-size:13px;font-weight:700}
.provider-tab .pt-sub{font-size:11px;color:var(--text-m);margin-top:2px}
.model-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.model-card{padding:12px 14px;border-radius:8px;border:2px solid var(--border);background:var(--bg-card);cursor:pointer;transition:.15s}
.model-card:hover{border-color:var(--border-h)}
.model-card.selected{border-color:var(--primary);background:var(--primary-dim)}
.model-card.selected-green{border-color:#10a37f;background:rgba(16,163,127,.1)}
.model-card .mc-label{font-size:13px;font-weight:700;margin-bottom:2px}
.model-card .mc-id{font-size:10px;font-family:monospace;color:var(--text-m)}
.model-card .mc-desc{font-size:11px;color:var(--text-d);margin-top:4px}
.model-card .mc-price{font-size:10px;color:var(--warn);margin-top:4px}
.settings-section{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.settings-section h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;min-width:0;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.model-size-input-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:var(--space-3);align-items:end}
.model-size-input-row.is-disabled{opacity:.4}
.model-size-multiply{padding-bottom:10px;color:var(--text-m);font-size:18px}
.model-size-keep-ratio-note{font-weight:400;color:var(--text-m);word-break:keep-all;overflow-wrap:normal;line-break:strict}
.model-size-summary{margin-top:10px;padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);font-size:12px;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.model-size-summary.is-custom{background:var(--surface-cyan-dim);border:1px solid var(--border-cyan-dim);color:var(--cyan)}
.model-size-summary.is-auto{background:var(--bg);border:1px solid var(--border);color:var(--text-m)}
.cur-model-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-left:8px}
.cur-model-badge.gemini{background:rgba(99,102,241,.2);color:var(--primary-h)}
.cur-model-badge.openai{background:rgba(16,163,127,.2);color:#10a37f}

/* Competitor Analysis */
.comp-mode-tab{padding:10px 4px;background:var(--bg-card);border:none;color:var(--text-m);cursor:pointer;font-size:13px;font-weight:500;transition:background .15s,color .15s;border-right:1px solid var(--border)}
.comp-mode-tab:last-child{border-right:none}
.comp-mode-tab.active{background:var(--primary);color:#fff;font-weight:700}
.comp-drop-zone{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.comp-drop-zone:hover{border-color:var(--primary);background:rgba(99,102,241,.05)}
.comp-file-input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px}
.comp-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.comp-card-title{font-weight:700;font-size:13px;color:var(--text);margin-bottom:8px}
.comp-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(99,102,241,.12);color:var(--primary-h);margin:2px}
.comp-tag-green{background:rgba(72,187,120,.15);color:#48bb78}
.comp-tag-red{background:rgba(229,62,62,.12);color:#e53e3e}

.comp-flow-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.comp-flow-step{border:1px solid var(--border);border-radius:12px;background:var(--bg-card);color:var(--text-d);padding:10px 12px;display:flex;align-items:center;gap:9px;min-width:0;text-align:left;font-family:inherit;cursor:pointer}
.comp-flow-step[disabled]{cursor:not-allowed;opacity:.48}
.comp-flow-step:not([disabled]):hover{border-color:var(--primary);background:rgba(99,102,241,.08);color:var(--text)}
.comp-flow-step.active{border-color:var(--primary);background:var(--primary-dim);color:var(--text)}
.comp-flow-step.next{border-color:rgba(72,187,120,.4);background:rgba(72,187,120,.08);color:#b7f7c8}
.comp-flow-num{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0}
.comp-flow-step.active .comp-flow-num{background:var(--primary);color:#fff}
.comp-flow-step.next .comp-flow-num{background:#48bb78;color:#05140a}
.comp-flow-copy{min-width:0}
.comp-flow-label{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-flow-hint{font-size:10px;color:var(--text-m);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){.comp-flow-nav{grid-template-columns:1fr}.comp-flow-step{padding:9px 10px}}
.comp-strategy-card{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(255,255,255,.025));border:1px solid rgba(99,102,241,.28);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.comp-strategy-text{font-size:14px;color:var(--text-d);line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;margin:0}
.comp-section-list{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.comp-section-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;transition:opacity .2s;min-width:0}
.comp-plan-head{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:start;margin-bottom:12px}
.comp-plan-title{font-weight:900;font-size:15px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.comp-plan-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.comp-plan-input{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;line-height:1.5;resize:vertical;box-sizing:border-box}
.comp-plan-readable{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;margin-top:8px}
.comp-plan-readable-title{font-size:11px;font-weight:900;color:var(--text-m);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.comp-plan-list{display:flex;flex-direction:column;gap:7px}
.comp-plan-item{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start;font-size:13px;color:var(--text);line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.comp-plan-num{width:18px;height:18px;border-radius:50%;background:var(--primary-dim);color:var(--primary-h);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px}

.comp-plan-evidence-box b{display:block;color:var(--text);font-size:11px;margin-bottom:4px}
.comp-plan-reference-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.65;color:var(--text-d);word-break:keep-all;overflow-wrap:anywhere}
.comp-plan-reference-box b{display:flex;align-items:center;gap:5px;color:var(--text);font-size:11px;margin-bottom:4px}
.comp-plan-improvement-card{background:linear-gradient(135deg,rgba(34,197,94,.13),rgba(34,197,94,.045));border:1px solid rgba(34,197,94,.34);border-radius:12px;padding:12px 14px;margin-top:10px}
.comp-plan-improvement-title{font-size:12px;font-weight:900;color:#48bb78;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.comp-plan-improvement-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:start;font-size:12px;line-height:1.7;color:#b7f7c8;word-break:keep-all;overflow-wrap:anywhere}
.comp-plan-improvement-row+.comp-plan-improvement-row{margin-top:7px;padding-top:7px;border-top:1px solid rgba(72,187,120,.18)}

.comp-plan-reflect-list{display:flex;flex-direction:column;gap:4px}

.section-helper-card{margin-top:10px;border:1px solid rgba(34,197,94,.24);border-radius:10px;background:linear-gradient(135deg,rgba(34,197,94,.09),rgba(99,102,241,.045));padding:10px 12px}
.section-helper-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section-helper-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#b7f7c8;line-height:1.35}
.section-helper-count{font-size:10px;font-weight:900;color:var(--ok);border:1px solid rgba(34,197,94,.28);background:rgba(34,197,94,.10);border-radius:999px;padding:3px 7px;white-space:nowrap}
.section-helper-list{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.section-helper-item{font-size:12px;line-height:1.55;color:var(--text-d);word-break:keep-all;overflow-wrap:anywhere}
.section-helper-item b{color:var(--ok);font-size:10px;margin-right:5px}
.section-helper-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.section-helper-muted{font-size:11px;color:var(--text-m);line-height:1.55;margin-top:7px;word-break:keep-all}
.section-helper-empty{margin-top:8px;font-size:11px;color:var(--text-m);line-height:1.55}
.comp-analysis-list{display:flex;flex-direction:column;gap:14px}
.comp-analysis-card{background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--err);border-radius:12px;padding:14px;min-width:0}
.comp-analysis-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,.95fr);gap:14px;align-items:stretch}
.comp-analysis-main{min-width:0;display:flex;flex-direction:column;gap:10px}
.comp-analysis-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.comp-analysis-icon{font-size:18px;line-height:1}
.comp-analysis-title{font-size:14px;font-weight:900;color:var(--text);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.comp-analysis-score{display:flex;align-items:center;gap:5px;white-space:nowrap}
.comp-score-num{font-size:15px;font-weight:900}
.comp-score-denom{font-size:10px;color:var(--text-m)}
.comp-current-state{font-size:12px;color:var(--text-d);line-height:1.65;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:8px;padding:9px 10px;word-break:keep-all;overflow-wrap:anywhere}
.comp-issue-list{display:flex;flex-wrap:wrap;gap:6px}
.comp-issue-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#ff9aa3;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.18);padding:4px 8px;border-radius:999px;line-height:1.35;word-break:keep-all}

<body>
<div id="app"></div>

<script>
const MAX_LOADER_ATTEMPTS = 2;
const bootstrapState = {
  status: 'manifest-loading',
  attempts: 0,
  loaderUrl: '',
  lastError: '',
};
window.__KUASANGSE_LOADER_BOOTSTRAP__ = bootstrapState;

async function loadRuntimeLoader(manifest) {
  for (let attempt = 1; attempt <= MAX_LOADER_ATTEMPTS; attempt += 1) {
    bootstrapState.attempts = attempt;
    bootstrapState.status = attempt === 1 ? 'loader-loading' : 'retrying';
    const loader = document.createElement('script');
    const loaderUrl = new URL(manifest.loader, document.baseURI);
    loaderUrl.searchParams.set('v', manifest.buildId);
    loaderUrl.searchParams.set('attempt', String(attempt));
    loader.src = loaderUrl.href;
    loader.dataset.kuasangseBuildId = manifest.buildId;
    bootstrapState.loaderUrl = loader.src;
    try {
      await new Promise((resolve, reject) => {
        loader.addEventListener('load', resolve, { once: true });
        loader.addEventListener('error', () => reject(new Error(`앱 로더 전송 실패 (${attempt}/${MAX_LOADER_ATTEMPTS})`)), { once: true });
        document.body.appendChild(loader);
      });
      bootstrapState.status = 'loaded';
      bootstrapState.lastError = '';
      return;
    } catch (error) {
      bootstrapState.lastError = String(error?.message || error);
      loader.remove();
      if (attempt < MAX_LOADER_ATTEMPTS) {
        bootstrapState.status = 'retrying';
        await new Promise(resolve => setTimeout(resolve, 180));
        continue;
      }
      bootstrapState.status = 'failed';
      throw error;
    }
  }
}

window.__KUASANGSE_BOOTSTRAP_PROMISE__ = (async function bootstrapKuasangseRuntime() {
  const response = await fetch('src/runtime-manifest.json', { cache: 'no-store' });
  if (!response.ok) throw new Error(`runtime manifest HTTP ${response.status}`);
  const manifest = await response.json();
  if (manifest.schema !== 'kuasangse.runtime.v1' || !manifest.buildId || !manifest.loader) {
    throw new Error('runtime manifest가 올바르지 않습니다.');
  }
  window.__KUASANGSE_RUNTIME_MANIFEST__ = Object.freeze(manifest);
  bootstrapState.status = 'manifest-ready';
  await loadRuntimeLoader(manifest);
})().catch(error => {
  const loaderFailed = bootstrapState.status === 'failed';
  console.error(loaderFailed ? '앱 로더 전송 실패' : '실행 매니페스트 로드 실패', error);
  const root = document.getElementById('app');
  if (root) root.textContent = loaderFailed
    ? '앱 로더를 불러오지 못했습니다. 로컬 서버를 확인한 뒤 새로고침해주세요.'
    : '실행 매니페스트를 불러오지 못했습니다. 로컬 서버를 확인한 뒤 새로고침해주세요.';
});
</script>
</body>
