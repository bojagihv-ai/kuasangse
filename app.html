// ACTIONS
// ════════════════════════════════════════════════════════════════
function handleFile(file) {
  state.imageMime = file.type;
  const reader = new FileReader();
  reader.onload = (e) => {
    state.imagePreview = e.target.result;
    state.imageBase64 = e.target.result.split(',')[1];
    render();
  };
  reader.readAsDataURL(file);
}

function handleCompImages(files) {
  const current = state.compPage.uploadedImages || [];
  const remaining = 10 - current.length;
  if (remaining <= 0) return;
  Array.from(files).slice(0, remaining).forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const b64 = e.target.result.split(',')[1];
      state.compPage.uploadedImages = [...(state.compPage.uploadedImages || []), { name: file.name, base64: b64, mime: file.type }];
      render();
    };
    reader.readAsDataURL(file);
  });
}

async function startCompetitorAnalysis() {
  const cp = state.compPage;
  let llm;
  try { llm = getLLMClient(); } catch(e) {
    state.error = e.message || 'API 키를 먼저 설정해주세요.'; render(); return;
  }

  if (cp.mode === 'images') {
    if (!cp.uploadedImages || cp.uploadedImages.length === 0) {
      state.error = '스크린샷 이미지를 1장 이상 업로드해주세요.'; render(); return;
    }
  } else if (cp.mode === 'html') {
    const htmlEl = document.getElementById('compHtmlText');
    const htmlVal = htmlEl ? htmlEl.value.trim() : cp.htmlText;
    state.compPage.htmlText = htmlVal;
    if (!htmlVal) { state.error = 'HTML 텍스트를 입력하거나 파일을 업로드해주세요.'; render(); return; }
  } else if (cp.mode === 'url') {
    const urlEl = document.getElementById('compUrlInput');
    const urlVal = urlEl ? urlEl.value.trim() : cp.urlInput;
    state.compPage.urlInput = urlVal;
    if (!urlVal) { state.error = 'URL을 입력해주세요.'; render(); return; }
  }

  state.error = '';
  state.compPage.subStep = 'analyzing';
  state.compPage.analysisResult = null;
  render();

  try {
    let analysisResult;

    if (cp.mode === 'url') {
      // 1. 백엔드로 URL 스크래핑
      const backendBase = (state.compPage.scraperBase || 'http://127.0.0.1:5001').replace(/\/+$/, '');
      state.compPage.analyzeMsg = '페이지 데이터 불러오는 중...';
      render();

      const fetchResp = await fetch(`${backendBase}/api/competitor/fetch-url`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: state.compPage.urlInput }),
      });
      if (!fetchResp.ok) throw new Error(`백엔드 오류: ${fetchResp.status}`);
      const { job_id } = await fetchResp.json();

      // 폴링
      let fetchResult = null;
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 2000));
        const poll = await fetch(`${backendBase}/api/competitor/job/${job_id}`);
        const data = await poll.json();
        if (data.status === 'done') { fetchResult = data.result; break; }
        if (data.status === 'error') throw new Error(data.error || '스크래핑 실패');
      }
      if (!fetchResult) throw new Error('스크래핑 시간 초과');

      state.compPage.analyzeMsg = '경쟁사 페이지 구조 분석 중...';
      render();

      if (fetchResult.screenshots && fetchResult.screenshots.length > 0) {
        const imgs = fetchResult.screenshots.map(b64 => ({ base64: b64, mime: 'image/jpeg' }));
        analysisResult = await llm.analyzeCompetitorImages(imgs);
      } else if (fetchResult.html_text) {
        analysisResult = await llm.analyzeCompetitorHTML(fetchResult.html_text);
      } else {
        throw new Error('페이지 데이터를 가져오지 못했습니다.');
      }

    } else if (cp.mode === 'images') {
      state.compPage.analyzeMsg = '경쟁사 페이지 구조 분석 중...';
      render();
      analysisResult = await llm.analyzeCompetitorImages(cp.uploadedImages);

    } else {
      state.compPage.analyzeMsg = '경쟁사 페이지 구조 분석 중...';
      render();
      analysisResult = await llm.analyzeCompetitorHTML(cp.htmlText);
    }

    state.compPage.analysisResult = analysisResult;
    state.compPage.subStep = 'report';
    saveCompAnalysis(analysisResult, state.compPage.sectionPlan, state.compPage.planEdits);
    render();
  } catch(e) {
    state.error = `분석 실패: ${e.message}`;
    state.compPage.subStep = 'input';
    render();
  }
}

async function generateCompetitorPlan() {
  let llm;
  try { llm = getLLMClient(); } catch(e) { state.error = e.message; render(); return; }

  state.compPage.subStep = 'analyzing';
  state.compPage.analyzeMsg = '15개 섹션 플랜 생성 중...';
  render();

  try {
    const plan = await llm.generateCompetitorSectionPlan(
      state.compPage.analysisResult,
      state.analysis
    );
    // 초기 planEdits를 recommended_sections 기본값으로 채움
    const edits = {};
    (plan.recommended_sections || []).forEach(r => {
      edits[r.section_id] = {
        enabled: r.enabled !== false,
        instructions: r.recommended_instructions || '',
      };
    });
    state.compPage.sectionPlan = plan;
    state.compPage.planEdits = edits;
    state.compPage.subStep = 'plan';
    saveCompAnalysis(state.compPage.analysisResult, plan, edits);
    render();
  } catch(e) {
    state.error = `플랜 생성 실패: ${e.message}`;
    state.compPage.subStep = 'report';
    render();
  }
}

function applyCompetitorPlan() {
  const edits = state.compPage.planEdits || {};
  const newInstructions = { ...state.sectionInstructions };
  SECTIONS.forEach(s => {
    const ed = edits[s.id];
    if (ed && ed.instructions) {
      newInstructions[s.id] = ed.instructions;
    }
  });
  state.sectionInstructions = newInstructions;
  saveSectionInstructions(newInstructions);
  // 비활성화된 섹션은 skipSections에 추가
  const skip = new Set(state.skipSections || []);
  SECTIONS.forEach(s => {
    const ed = edits[s.id];
    if (ed && ed.enabled === false) skip.add(s.id);
    else if (ed && ed.enabled === true) skip.delete(s.id);
  });
  state.skipSections = Array.from(skip);
  // 경쟁사 분석 결과를 컨텍스트로 저장
  state.competitorData = state.compPage.analysisResult;
}

async function generateCompSection(sectionId) {
  if (!state.analysis) { state.error = '먼저 AI 분석 탭에서 제품 이미지를 분석해주세요.'; render(); return; }
  const s = SECTIONS.find(x => x.id === sectionId);
  if (!s) return;

  // 현재 planEdits 지시사항을 sectionInstructions에 반영
  const ed = state.compPage.planEdits[sectionId];
  if (ed?.instructions) state.sectionInstructions[sectionId] = ed.instructions;

  state.compPage.sectionStatus[sectionId] = 'loading';
  render();

  let llm;
  try { llm = getLLMClient(); } catch(e) { state.error = e.message; state.compPage.sectionStatus[sectionId] = 'error'; render(); return; }

  try {
    const compRef = state.competitorData ? JSON.stringify(state.competitorData).substring(0, 1000) : '';
    const content = await llm.generateSectionContent(s, state.analysis, state.sectionInstructions[sectionId] || '', compRef);
    state.sectionContents[sectionId] = content;

    if (hasGeminiConnection()) {
      try {
        const g = createGeminiClient();
        const img = await g.generateImage(content.image_description || content.design_notes || s.purpose, state.imageBase64, state.imageMime);
        if (img) state.sectionImages[sectionId] = img;
      } catch(e) {}
    }

    state.compPage.sectionStatus[sectionId] = 'done';
    render();
  } catch(e) {
    state.error = `${s.name} 생성 실패: ${e.message}`;
    state.compPage.sectionStatus[sectionId] = 'error';
    render();
  }
}

async function startGenerating() {
  if (!state.analysis) { state.error = '먼저 제품 이미지를 AI 분석해주세요 (AI 분석 탭).'; render(); return; }
  await generateAllSections();
}

async function startAnalysis() {
  if (!state.imageBase64) { state.error = '제품 이미지를 업로드해주세요.'; render(); return; }

  let llm;
  try { llm = getLLMClient(); } catch(e) {
    if (state.modelConfig.llmProvider === 'openai') { state.error = e.message; render(); return; }
    state.showApiModal = true; render(); return;
  }

  state.error = '';
  state.step = 'analyzing';
  state.progress = 10;
  state.progressMsg = '제품 이미지 AI 분석 중...';
  // 이전 분석 결과 초기화
  state.analysis = null;
  state.competitorData = null;
  state.sectionContents = {};
  state.sectionImages = {};
  state.sectionGenerating = {};
  clearPersistentSession();
  render();

  try {
    // 1. Analyze image
    const analysis = await llm.analyzeImage(state.imageBase64, state.imageMime);
    if (state.productName) analysis.product_name = state.productName;
    state.analysis = analysis;
    state.progress = 25;
    state.progressMsg = '유사 제품 검색 중...';
    render();

    // 2. Competitor search
    try {
      const competitors = await llm.searchSimilarProducts(
        analysis.product_name || analysis.product_name_en,
        analysis.category
      );
      state.competitorData = competitors;
    } catch (e) {
      state.competitorData = null;
    }

    state.progress = 35;
    state.step = 'sections';
    state.progressMsg = '분석 완료!';
    state.analysisTimestamp = Date.now();
    state.analysisLogOpen = true; // 분석 직후 로그 자동 펼침
    savePersistentState();
    render();
  } catch (e) {
    state.error = `분석 실패: ${e.message}`;
    state.step = 'upload';
    render();
  }
}

async function generateAllSections() {
  state.step = 'generating';
  state.progress = 35;
  state.sectionContents = {};
  state.sectionImages = {};
  render();

  let llm;
  try { llm = getLLMClient(); } catch(e) { state.error = e.message; state.step = 'sections'; render(); return; }
  // gemini 인스턴스도 이미지 생성용으로 유지
  const geminiForImage = hasGeminiConnection() ? createGeminiClient() : null;

  const total = SECTIONS.length;
  const compRef = state.competitorData ? JSON.stringify(state.competitorData).substring(0, 1000) : '';

  for (let i = 0; i < total; i++) {
    const s = SECTIONS[i];
    const pct = Math.round(35 + ((i / total) * 60));
    state.progress = pct;
    state.progressMsg = `[${i+1}/${total}] ${s.name} 콘텐츠 생성 중...`;
    render();

    try {
      // Generate content via selected LLM
      const content = await llm.generateSectionContent(
        s, state.analysis, state.sectionInstructions[s.id] || '', compRef
      );
      state.sectionContents[s.id] = content;

      // Try to generate image (항상 Gemini 이미지 모델 사용)
      if (geminiForImage) {
        state.progressMsg = `[${i+1}/${total}] ${s.name} 이미지 생성 중...`;
        render();
        try {
          const imgPrompt = content.image_description || content.design_notes || s.purpose;
          const img = await geminiForImage.generateImage(imgPrompt, state.imageBase64, state.imageMime);
          if (img) {
            state.sectionImages[s.id] = img;
            // Drive 자동 업로드
            if (state.sectionDriveFolderId && driveService && state.auto.driveConnected) {
              uploadSectionImageToDrive(s.id).catch(()=>{});
            }
          }
        } catch (e) {
          console.warn(`Image gen failed for ${s.id}:`, e);
        }
      }

    } catch (e) {
      console.error(`Section ${s.id} failed:`, e);
      state.sectionContents[s.id] = {
        headline: s.name,
        subheadline: '생성 실패 - 재시도해주세요',
        body_text: e.message,
        color_scheme: { background: '#FFF5F5', text_primary: '#C53030', text_secondary: '#E53E3E', accent: '#FC8181' },
        font_suggestion: { headline_size: '32px', body_size: '14px' }
      };
    }

    // Small delay for rate limiting
    await new Promise(r => setTimeout(r, 500));
  }

  state.progress = 100;
  state.progressMsg = '모든 섹션 생성 완료!';
  state.step = 'preview';
  savePersistentState();
  render();
}

// GOOGLE DRIVE SERVICE
// ════════════════════════════════════════════════════════════════
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const GD_CLIENT_ID = localStorage.getItem('gd_client_id') || '';

// URL이든 ID만이든 폴더 ID를 추출
function extractFolderId(input) {
  if (!input) return '';
  input = input.trim();
  // https://drive.google.com/drive/folders/XXXXX?usp=... 형태
  const m1 = input.match(/folders\/([a-zA-Z0-9_-]+)/);
  if (m1) return m1[1];
  // https://drive.google.com/drive/u/0/folders/XXXXX 형태
  const m2 = input.match(/drive[^"]*folders\/([a-zA-Z0-9_-]+)/);
  if (m2) return m2[1];
  // 이미 순수 ID (공백, 슬래시 없음)
  if (/^[a-zA-Z0-9_-]+$/.test(input)) return input;
  return input;
}

class DriveService {
  constructor(token) {
    this.token = token;
    this.tokenExpiresAt = Date.now() + 3500 * 1000; // ~58분 후 만료 예상
  }
  headers() { return { 'Authorization': `Bearer ${this.token}` }; }

  // 토큰 만료 체크 후 자동 갱신
  async ensureToken() {
    if (Date.now() > this.tokenExpiresAt) {
      autoLog('info', '토큰 만료됨 — 자동 갱신 중...');
      await refreshDriveToken();
    }
  }

  // 401 에러 시 토큰 갱신 후 재시도하는 래퍼
  async fetchWithRetry(url, options = {}) {
    await this.ensureToken();
    let res = await fetch(url, { ...options, headers: { ...this.headers(), ...(options.headers||{}) } });
    if (res.status === 401) {
      autoLog('info', '401 인증 만료 — 토큰 갱신 후 재시도...');
      await refreshDriveToken();
      res = await fetch(url, { ...options, headers: { ...this.headers(), ...(options.headers||{}) } });
    }
    return res;
  }

  async getFolderMeta(folderId) {
    const res = await this.fetchWithRetry(`${DRIVE_API}/files/${folderId}?fields=id,name`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data;
  }

  async listImages(folderId) {
    const q = encodeURIComponent(`'${folderId}' in parents and mimeType contains 'image/' and trashed=false`);
    const res = await this.fetchWithRetry(`${DRIVE_API}/files?q=${q}&fields=files(id,name,mimeType,createdTime,size)&orderBy=createdTime&pageSize=100`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.files || [];
  }

  async downloadFile(fileId) {
    const res = await this.fetchWithRetry(`${DRIVE_API}/files/${fileId}?alt=media`);
    if (!res.ok) throw new Error('Download failed');
    const blob = await res.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ base64: reader.result.split(',')[1], dataUrl: reader.result, mime: blob.type });
      reader.readAsDataURL(blob);
    });
  }

  async uploadHtml(folderId, fileName, htmlContent) {
    await this.ensureToken();
    const metadata = { name: fileName, mimeType: 'text/html', parents: [folderId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([htmlContent], { type: 'text/html' }));

    let res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
      method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form
    });
    if (res.status === 401) {
      autoLog('info', '업로드 401 — 토큰 갱신 후 재시도...');
      await refreshDriveToken();
      const form2 = new FormData();
      form2.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form2.append('file', new Blob([htmlContent], { type: 'text/html' }));
      res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
        method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form2
      });
    }
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data;
  }

  async uploadImage(folderId, fileName, blob) {
    await this.ensureToken();
    const metadata = { name: fileName, mimeType: 'image/jpeg', parents: [folderId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', blob);
    let res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
      method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form
    });
    if (res.status === 401) {
      await refreshDriveToken();
      const form2 = new FormData();
      form2.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form2.append('file', blob);
      res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
        method: 'POST', headers: { 'Authorization': `Bearer ${this.token}` }, body: form2
      });
    }
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data;
  }

  async getFolderName(folderId) {
    const res = await this.fetchWithRetry(`${DRIVE_API}/files/${folderId}?fields=name`);
    const data = await res.json();
    return data.name || folderId;
  }
}

function dataUrlToJpegBlob(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('canvas toBlob failed')), 'image/jpeg', 0.92);
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function uploadSectionImageToDrive(sectionId) {
  const folderId = extractFolderId(state.sectionDriveFolderId);
  if (!folderId || !driveService || !state.auto.driveConnected) return;
  const imgDataUrl = state.sectionImages[sectionId];
  if (!imgDataUrl) return;
  const s = SECTIONS.find(x => x.id === sectionId);
  const n = String(s?.n || 0).padStart(2, '0');
  const fileName = `${n}_${sectionId}.jpg`;
  state.sectionDriveUploadStatus[sectionId] = 'uploading';
  render();
  try {
    const blob = await dataUrlToJpegBlob(imgDataUrl);
    await driveService.uploadImage(folderId, fileName, blob);
    state.sectionDriveUploadStatus[sectionId] = 'done';
  } catch(e) {
    state.sectionDriveUploadStatus[sectionId] = 'error';
    console.warn(`Drive upload failed [${sectionId}]:`, e);
  }
  render();
}

- 섹션별 커스텀 지시사항 (${customInstructions.length}개): ${customInstructions.length ? customInstructions.join(', ') : '없음'}
- 생성된 섹션: ${Object.keys(state.sectionContents).length}/15개`;
}

function agentGetSystemPrompt() {
  return `당신은 한국어 이커머스 상세페이지 자동 생성 앱을 완전히 제어하는 AI 어시스턴트입니다.
사용자의 자연어 명령을 이해하고 앱 설정을 직접 변경합니다.

${agentGetContext()}

사용 가능한 도구 (actions 배열에 포함):
- add_directive: 이미지 생성 제약 추가 → {"tool":"add_directive","text":"English constraint","label":"한국어 설명"}
- remove_directive: 제약 삭제 (텍스트 부분 일치) → {"tool":"remove_directive","match":"삭제할 텍스트"}
- clear_directives: 모든 제약 삭제 → {"tool":"clear_directives"}
- set_section_instruction: 섹션 커스텀 지시사항 설정 → {"tool":"set_section_instruction","sectionId":"header","text":"지시사항"}
- clear_section_instruction: 섹션 지시사항 삭제 → {"tool":"clear_section_instruction","sectionId":"header"}
- set_image_model: 이미지 모델 변경 → {"tool":"set_image_model","modelId":"gemini-3.1-flash-image-preview"}
- set_llm_model: LLM 모델 변경 → {"tool":"set_llm_model","provider":"gemini","modelId":"gemini-2.5-flash"}
- update_analysis: 분석 필드 수정 → {"tool":"update_analysis","field":"product_name","value":"새 이름"}
- regenerate_section: 섹션 재생성 트리거 → {"tool":"regenerate_section","sectionId":"header"}

응답 형식 (반드시 이 JSON으로만 응답):
{
  "reply": "사용자에게 보여줄 한국어 응답 (2-3문장, 친절하게)",
  "actions": []
}

규칙:
- 반드시 JSON으로만 응답. 다른 텍스트 없음.
- reply는 항상 한국어.
- 명령이 없는 질문(현재 상태 등)은 actions 빈 배열로 답변.
- 확실하지 않은 명령은 actions 없이 질문으로 되물음.`;
}

async function executeAgentActions(actions) {
  const results = [];
  for (const action of actions) {
    try {
      if (action.tool === 'add_directive') {
        const id = Date.now() + Math.random();
        state.imageDirectives.push({ id, original: action.label || action.text, text: action.text, active: true });
        saveImageDirectives();
        results.push({ ...action, label: action.label || `제약 추가: "${action.text.slice(0,40)}"` });

      } else if (action.tool === 'remove_directive') {
        const before = state.imageDirectives.length;
        state.imageDirectives = state.imageDirectives.filter(d =>
          !d.text.toLowerCase().includes((action.match||'').toLowerCase()) &&
          !d.original.toLowerCase().includes((action.match||'').toLowerCase())
        );
        saveImageDirectives();
        results.push({ ...action, label: `제약 삭제 (${before - state.imageDirectives.length}개)` });

      } else if (action.tool === 'clear_directives') {
        state.imageDirectives = [];
        saveImageDirectives();
        results.push({ ...action, label: '모든 이미지 제약 초기화' });

      } else if (action.tool === 'set_section_instruction') {
        state.sectionInstructions[action.sectionId] = action.text;
        saveSectionInstructions(state.sectionInstructions);
        results.push({ ...action, label: `섹션 [${action.sectionId}] 지시사항 설정` });

      } else if (action.tool === 'clear_section_instruction') {
        delete state.sectionInstructions[action.sectionId];
        saveSectionInstructions(state.sectionInstructions);
        results.push({ ...action, label: `섹션 [${action.sectionId}] 지시사항 삭제` });

      } else if (action.tool === 'set_image_model') {
        state.modelConfig.imageModel = action.modelId;
        saveModelConfig(state.modelConfig);
        results.push({ ...action, label: `이미지 모델 → ${action.modelId}` });

      } else if (action.tool === 'set_llm_model') {
        state.modelConfig.llmProvider = action.provider;
        state.modelConfig.llmModel = action.modelId;
        state.modelConfig = normalizeModelConfig(state.modelConfig);
        saveModelConfig(state.modelConfig);
        results.push({ ...action, label: `LLM → ${state.modelConfig.llmProvider}/${state.modelConfig.llmModel}` });

      } else if (action.tool === 'update_analysis') {
        if (state.analysis) {
          state.analysis[action.field] = action.value;
          savePersistentState();
          results.push({ ...action, label: `분석 데이터 [${action.field}] → "${action.value}"` });
        }

      } else if (action.tool === 'regenerate_section') {
        results.push({ ...action, label: `섹션 [${action.sectionId}] 재생성 시작` });
        // 비동기로 실행 (채팅 응답 후에)
        setTimeout(() => generateSingleSection(action.sectionId), 500);
      }
    } catch(e) {
      console.warn('Action failed:', action, e);
    }
  }
  return results;
}

function agentLastBubble() {
  const bubbles = document.querySelectorAll('.agent-bubble.assistant');
  return bubbles[bubbles.length - 1] || null;
}
function agentSetStatus(text) {
  const el = agentLastBubble()?.querySelector('[data-agent-status]');
  if (el) el.textContent = text;
}
function agentAddStep(label, done) {
  const msg = state.agentMessages[state.agentMessages.length - 1];
  if (!msg || msg.role !== 'assistant') return;
  msg.steps = msg.steps || [];
  msg.steps.push({ label, done });

  const stepsEl = agentLastBubble()?.querySelector('[data-agent-steps]');
  if (!stepsEl) return;
  const spinnerRow = stepsEl.querySelector('[data-agent-status]')?.parentElement;
  const newRow = document.createElement('div');
  newRow.style.cssText = `display:flex;align-items:center;gap:6px;font-size:11px;color:${done?'var(--ok)':'var(--primary-h)'};font-family:monospace;padding:3px 0;border-bottom:1px solid var(--border)`;
  newRow.dataset.stepRow = '';
  newRow.innerHTML = `<span class="material-icons-outlined" style="font-size:13px">${done?'check_circle':'pending'}</span><span>${label}</span>`;
  if (spinnerRow) stepsEl.insertBefore(newRow, spinnerRow);
  else stepsEl.appendChild(newRow);
  scrollAgentToBottom();
}
function agentMarkLastStepDone() {
  const stepsEl = agentLastBubble()?.querySelector('[data-agent-steps]');
  if (!stepsEl) return;
  const rows = [...stepsEl.querySelectorAll('[data-step-row=""]')];
  const last = rows[rows.length - 1];
  if (last) {
    last.style.color = 'var(--ok)';
    const icon = last.querySelector('.material-icons-outlined');
    if (icon) icon.textContent = 'check_circle';
  }
}

async function agentSendMessage(userText) {
  if (!userText.trim() || state.agentStreaming) return;

  state.agentMessages.push({ role: 'user', content: userText });
  state.agentStreaming = true;
  const assistantIdx = state.agentMessages.length;
  state.agentMessages.push({ role: 'assistant', content: '', steps: [], done: false });
  render();
  scrollAgentToBottom();

  try {
    let llm;
    try { llm = getLLMClient(); } catch(e) {
      state.agentMessages[assistantIdx].content = `⚠️ LLM 연결 없음: ${e.message}`;
      state.agentMessages[assistantIdx].done = true;
      state.agentStreaming = false;
      render(); return;
    }

    // ① LLM 호출
    agentSetStatus('명령 분석 중...');
    const systemPrompt = agentGetSystemPrompt();
    const history = state.agentMessages.slice(0, -1);
    let rawResponse = '';
    if (llm instanceof GeminiAPI) rawResponse = await agentCallGemini(llm, systemPrompt, history);
    else if (llm instanceof OpenAIAPI) rawResponse = await agentCallOpenAI(llm, systemPrompt, history);

    let parsed = { reply: '', actions: [] };
    try {
      const cleaned = rawResponse.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
      parsed = JSON.parse(cleaned);
    } catch(e) { parsed = { reply: rawResponse, actions: [] }; }

    // ② 액션 실행 — 각 스텝을 DOM에 실시간 표시
    if (parsed.actions && parsed.actions.length > 0) {
      agentSetStatus('처리 중...');
      for (const action of parsed.actions) {
        const label = agentActionLabel(action);
        agentAddStep(label, false);
        await new Promise(r => setTimeout(r, 100));
        await executeAgentActions([action]);
        agentMarkLastStepDone();
        await new Promise(r => setTimeout(r, 80));
      }
    }

    // ③ spinner 제거 후 타이프라이터
    const bubble = agentLastBubble();
    const spinnerRow = bubble?.querySelector('[data-agent-status]')?.parentElement;
    if (spinnerRow) spinnerRow.remove();

    const replyText = parsed.reply || '';
    state.agentMessages[assistantIdx].content = replyText;

    if (bubble && replyText) {
      const twDiv = document.createElement('div');
      twDiv.style.cssText = 'white-space:pre-wrap;margin-top:6px;font-size:13px;line-height:1.6';
      const twSpan = document.createElement('span');
      const cursor = document.createElement('span');
      cursor.className = 'agent-cursor';
      twDiv.appendChild(twSpan);
      twDiv.appendChild(cursor);
      bubble.appendChild(twDiv);

      for (let i = 0; i <= replyText.length; i++) {
        twSpan.textContent = replyText.slice(0, i);
        if (i % 4 === 0) scrollAgentToBottom();
        await new Promise(r => setTimeout(r, 14));
      }
      cursor.remove();
    }

    state.agentMessages[assistantIdx].done = true;

  } catch(e) {
    state.agentMessages[assistantIdx].content = `오류가 발생했습니다: ${e.message}`;
    state.agentMessages[assistantIdx].done = true;
  }

  state.agentStreaming = false;
  render();
  scrollAgentToBottom();
}

function agentActionLabel(action) {
  const map = {
    add_directive:            `이미지 제약 추가 → "${(action.text||'').slice(0,50)}"`,
    remove_directive:         `이미지 제약 삭제 → "${action.match||''}"`,
    clear_directives:         '모든 이미지 제약 초기화',
    set_section_instruction:  `섹션 [${action.sectionId}] 지시사항 설정`,
    clear_section_instruction:`섹션 [${action.sectionId}] 지시사항 삭제`,
    set_image_model:          `이미지 모델 변경 → ${action.modelId}`,
    set_llm_model:            `LLM 변경 → ${action.provider}/${action.modelId}`,
    update_analysis:          `분석 데이터 [${action.field}] 수정 → "${action.value}"`,
    regenerate_section:       `섹션 [${action.sectionId}] 재생성 시작`,
  };
  return map[action.tool] || action.tool;
}

async function agentCallGemini(llm, systemPrompt, history) {
  const contents = [
    { role: 'user', parts: [{ text: systemPrompt }] },
    { role: 'model', parts: [{ text: '{"reply":"알겠습니다. 명령을 기다리겠습니다.","actions":[]}' }] },
    ...history.map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.content || '{}' }]
    }))
  ];
  const body = { contents, generationConfig: { temperature: 0.3, maxOutputTokens: 1024 } };
  const data = await llm._generateContent(llm.model, body);
  return data.candidates[0].content.parts[0].text.trim();
}

async function agentCallOpenAI(llm, systemPrompt, history) {
  const messages = [
    { role: 'system', content: systemPrompt },
    ...history.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content || '' }))
  ];
  const body = { model: llm.model, messages, temperature: 0.3, max_completion_tokens: 1024 };
  const res = await fetch(`${llm.baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${llm.apiKey}` },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content.trim();
}

function scrollAgentToBottom() {
  setTimeout(() => {
    const el = document.getElementById('agentMsgs');
    if (el) el.scrollTop = el.scrollHeight;
  }, 0);
}

function saveImageDirectives() {
  try { localStorage.setItem('image_directives', JSON.stringify(state.imageDirectives)); } catch(e) {}
}

async function addImageDirective(rawText) {
  if (!rawText.trim()) return;
  state.imageDirectiveProcessing = true;
  render();

  let processed = rawText.trim();
  // 설정된 LLM으로 자연어 지시사항 → 이미지 프롬프트 제약 조건으로 변환
  try {
    const llm = getLLMClient();
    const convPrompt = `You are helping convert a user's natural language instruction about image generation into a concise English constraint for an AI image generator.

User instruction (Korean or English): "${rawText}"

Convert this into a short, clear English constraint (1-2 sentences max) that can be appended to an image generation prompt. Be specific and actionable. Return ONLY the constraint text, nothing else.`;

    let result = '';
    if (llm instanceof GeminiAPI) {
      const body = { contents: [{ parts: [{ text: convPrompt }] }], generationConfig: { temperature: 0.2, maxOutputTokens: 150 } };
      const data = await llm._generateContent(llm.model, body);
      result = data.candidates[0].content.parts[0].text.trim();
    } else if (llm instanceof OpenAIAPI) {
      const body = { model: llm.model, messages: [{ role: 'user', content: convPrompt }], max_completion_tokens: 150, temperature: 0.2 };
      const res = await fetch(`${llm.baseUrl}/chat/completions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${llm.apiKey}` }, body: JSON.stringify(body) });
      const data = await res.json();
      result = data.choices[0].message.content.trim();
    }
    if (result) processed = result;
  } catch(e) {
    console.warn('Directive LLM processing failed, using raw text:', e);
  }

  const directive = { id: Date.now(), original: rawText.trim(), text: processed, active: true };
  state.imageDirectives.push(directive);
  state.imageDirectiveInput = '';
  state.imageDirectiveProcessing = false;
  saveImageDirectives();
  render();
}

let driveService = null;
let tokenClient = null;

// 토큰 자동 갱신 — 사용자 팝업 없이 silent 시도, 실패 시 팝업
function refreshDriveToken() {
  return new Promise((resolve, reject) => {
    const clientId = state.auto.gdClientId || localStorage.getItem('gd_client_id') || '';
    if (!clientId || !google?.accounts?.oauth2) {
      reject(new Error('Google OAuth 초기화 안 됨'));
      return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
      prompt: '',  // silent 갱신 시도
      callback: (resp) => {
        if (resp.access_token) {
          state.auto.accessToken = resp.access_token;
          state.auto.driveConnected = true;
          if (driveService) {
            driveService.token = resp.access_token;
            driveService.tokenExpiresAt = Date.now() + 3500 * 1000;
          } else {
            driveService = new DriveService(resp.access_token);
          }
          autoLog('ok', '토큰 자동 갱신 완료');
          resolve();
        } else {
          autoLog('err', '토큰 갱신 실패 — Google Drive 재연결 필요');
          state.auto.driveConnected = false;
          render();
          reject(new Error('Token refresh failed'));
        }
      },
    });
    client.requestAccessToken();
  });
}

function initGoogleAuth() {
  const clientId = state.auto.gdClientId || GD_CLIENT_ID;
  if (!clientId) return;
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
      callback: (resp) => {
        if (resp.access_token) {
          state.auto.accessToken = resp.access_token;
          state.auto.driveConnected = true;
          driveService = new DriveService(resp.access_token);
          autoLog('info', 'Google Drive 연결 완료');
          render();
        }
      },
    });
  } catch(e) { console.warn('Google auth init failed:', e); }
}

function connectDrive() {
  const clientId = document.getElementById('gdClientId')?.value.trim() || GD_CLIENT_ID;
  if (!clientId) {
    state.error = 'Google Cloud OAuth Client ID를 입력하세요.';
    render();
    return;
  }
  localStorage.setItem('gd_client_id', clientId);
  state.auto.gdClientId = clientId;
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly',
      callback: (resp) => {
        if (resp.error) {
          state.error = `Drive 인증 실패: ${resp.error}`;
          render();
          return;
        }
        state.auto.accessToken = resp.access_token;
        state.auto.driveConnected = true;
        driveService = new DriveService(resp.access_token);
        autoLog('info', 'Google Drive 연결 완료');
        render();
      },
    });
    tokenClient.requestAccessToken();
  } catch(e) {
    state.error = `Google 인증 오류: ${e.message}`;
    render();
  }
}

const autoLogs = [];
function autoLog(type, msg) {
  const t = new Date().toLocaleTimeString('ko-KR');
  autoLogs.unshift({ type, msg, time: t });
  if (autoLogs.length > 200) autoLogs.length = 200;
}

function escAttr(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function parsePositiveInt(value, fallback, min, max) {
  const n = Number(value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(min, Math.min(max, Math.round(n)));
}

async function fetchServerAutomationConfig() {
  const base = saveServerAutomationApiBase(state.auto.serverApiBase);
  state.auto.serverApiBase = base;
  state.auto.serverLoading = true;
  state.auto.serverError = '';
  render();
  try {
    assertServerAutomationApiBaseAllowed(base);
    const res = await fetch(`${base}/pdp/automation/config`);
    const data = await res.json();
    if (!res.ok || !data?.ok) {
      throw new Error(data?.message || data?.error || '자동화 설정 조회 실패');
    }
    state.auto.serverConfig = data;
    state.auto.serverStatus = data.status || null;
    // 서버 커스텀 컷을 draftCuts에 한 번만 동기화 (로컬 편집 덮어쓰기 방지)
    if (!state.auto.draftCutsFromServer) {
      const serverCuts = data?.profiles?.['image-cuts']?.customCuts;
      if (Array.isArray(serverCuts) && serverCuts.some(c => c?.prompt?.trim())) {
        const synced = serverCuts.slice(0, 10).map(c => ({label: String(c?.label||''), prompt: String(c?.prompt||'')}));
        while (synced.length < 10) synced.push({label:'',prompt:''});
        state.auto.draftCuts = synced;
        saveDraftCuts(synced);
      }
      state.auto.draftCutsFromServer = true;
    }
    autoLog('ok', '서버 자동화 상태를 불러왔습니다.');
  } catch(e) {
    state.auto.serverError = e.message || String(e);
    autoLog('err', `서버 자동화 연결 실패: ${state.auto.serverError}`);
  } finally {
    state.auto.serverLoading = false;
    render();
  }
}

async function runServerAutomationMode(mode) {
  const base = saveServerAutomationApiBase(state.auto.serverApiBase);
  state.auto.serverApiBase = base;
  state.auto.serverError = '';

  // 실행 전 현재 설정(폴더ID, 프롬프트, 모델)을 서버에 먼저 저장 — enabled는 현재 상태 유지
  try {
    assertServerAutomationApiBaseAllowed(base);
    const modeId = mode === 'image-cuts' ? 'ImageCuts' : 'DetailPage';
    const currentProfile = state.auto.serverConfig?.profiles?.[mode] || {};
    const profileUpdate = {
      enabled: !!currentProfile.enabled,
      inputFolderId: extractFolderId(document.getElementById(`serverInput${modeId}`)?.value?.trim() || ''),
      sourceDoneFolderId: extractFolderId(document.getElementById(`serverDone${modeId}`)?.value?.trim() || ''),
      outputFolderId: extractFolderId(document.getElementById(`serverOutput${modeId}`)?.value?.trim() || ''),
      pollIntervalSeconds: parsePositiveInt(document.getElementById(`serverPoll${modeId}`)?.value, 120, 30, 3600),
      maxFilesPerRun: parsePositiveInt(document.getElementById(`serverMax${modeId}`)?.value, 1, 1, 20),
      imageModel: document.getElementById(`serverModel${modeId}`)?.value || currentProfile.imageModel || 'gemini-3.1-flash-image-preview',
      outputImageSize: document.getElementById(`serverResolution${modeId}`)?.value || null
    };
    if (mode === 'image-cuts') {
      profileUpdate.customCuts = state.auto.draftCuts.map(c => ({label: c.label, prompt: c.prompt}));
    }
    const saveRes = await fetch(`${base}/pdp/automation/config`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({profiles: {[mode]: profileUpdate}})
    });
    const saveData = await saveRes.json();
    if (saveData?.ok) {
      state.auto.serverConfig = saveData;
      autoLog('ok', '설정을 서버에 저장했습니다.');
    }
  } catch(e) {
    autoLog('err', `설정 저장 실패: ${e.message}`);
  }

  try {
    assertServerAutomationApiBaseAllowed(base);
    const res = await fetch(`${base}/pdp/automation/run`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode })
    });
    const data = await res.json();
    if (!res.ok || !data?.ok) {
      throw new Error(data?.message || data?.error || '자동 실행 요청 실패');
    }
    if (data.status) { state.auto.serverStatus = data.status; patchAutomationStatusInPlace(); }
    autoLog('info', data.message || `${mode} 실행을 요청했습니다.`);
    startStatusPolling(base, mode);
  } catch(e) {
    state.auto.serverError = e.message || String(e);
    autoLog('err', `서버 실행 요청 실패: ${state.auto.serverError}`);
  }
}

let _statusPollTimer = null;
function startStatusPolling(base, mode) {
  if (_statusPollTimer) clearInterval(_statusPollTimer);
  _statusPollTimer = setInterval(async () => {
    try {
      const res = await fetch(`${base}/pdp/automation/status`);
      if (!res.ok) return;
      const data = await res.json();
      state.auto.serverStatus = data;
      patchAutomationStatusInPlace();
      const modeStatus = data?.byMode?.[mode];
      if (!modeStatus?.isRunning) {
        clearInterval(_statusPollTimer);
        _statusPollTimer = null;
        autoLog('info', `${mode} 작업이 완료되었습니다.`);
        patchAutomationStatusInPlace();
      }
    } catch(e) { /* 무시 */ }
  }, 2000);
}

// 깜빡임 없이 상태/로그만 DOM 직접 업데이트
function patchAutomationStatusInPlace() {
  const status = state.auto.serverStatus;
  const allEvents = status?.recentEvents || [];
  const modes = [['image-cuts','ImageCuts'],['detail-page','DetailPage']];
  for (const [mode, modeId] of modes) {
    const modeStatus = status?.byMode?.[mode];
    const profile = state.auto.serverConfig?.profiles?.[mode];
    const running = !!modeStatus?.isRunning;
    const autoEnabled = !!profile?.enabled;

    const statusEl = document.getElementById(`autoStatusLine-${modeId}`);
    if (statusEl) {
      const pollInterval = profile?.pollIntervalSeconds || 120;
      statusEl.textContent = '상태: ' + (running ? '실행 중' : (autoEnabled ? `자동화 ON (${pollInterval}초 간격)` : '자동화 OFF'));
      statusEl.style.color = running ? 'var(--ok)' : (autoEnabled ? '#4a9eff' : 'var(--text-d)');
    }
    const summaryEl = document.getElementById(`autoSummaryLine-${modeId}`);
    if (summaryEl) summaryEl.textContent = '최근 요약: ' + (modeStatus?.lastSummary || '기록 없음');
    const errorEl = document.getElementById(`autoErrorLine-${modeId}`);
    if (errorEl) {
      const err = modeStatus?.lastError || '';
      errorEl.textContent = err ? '최근 오류: ' + err : '';
      errorEl.style.display = err ? '' : 'none';
    }
    const logEl = document.getElementById(`autoLogBox-${modeId}`);
    if (logEl) logEl.innerHTML = buildEventLogInner(mode, modeStatus, allEvents);
    const autoStartBtn = document.getElementById(`serverAutoStart${modeId}`);
    if (autoStartBtn) autoStartBtn.disabled = autoEnabled;
    const autoStopBtn = document.getElementById(`serverAutoStop${modeId}`);
    if (autoStopBtn) autoStopBtn.disabled = !autoEnabled && !running;
    const runBtn = document.getElementById(`serverRun${modeId}`);
    if (runBtn) runBtn.textContent = running ? '실행 중...' : '즉시 실행';
  }
}

function buildEventLogInner(mode, modeStatus, allEvents) {
  const modeEvents = allEvents.filter(e => e.mode === mode).slice(0, 20);
  if (!modeEvents.length) return '<span style="font-size:11px;color:var(--text-d)">로그 없음</span>';
  return modeEvents.map(e => {
    const t = new Date(e.timestamp).toLocaleTimeString('ko-KR');
    const isErr = e.level === 'error';
    const color = isErr ? 'var(--err)' : 'var(--text-d)';
    const icon = isErr ? '✖' : '●';
    const fileName = e.fileName ? `<span style="color:var(--text-m);margin-left:4px">[${escAttr(e.fileName)}]</span>` : '';
    return `<div style="display:flex;gap:6px;font-size:11px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
      <span style="color:var(--text-m);white-space:nowrap;flex-shrink:0">${t}</span>
      <span style="color:${color};flex-shrink:0">${icon}</span>
      <span style="color:${isErr?'var(--err)':'var(--text)'}">${escAttr(e.message)}${fileName}</span>
    </div>`;
  }).join('');
}

// AUTOMATION ENGINE
// ════════════════════════════════════════════════════════════════
async function autoProcessOne() {
  if (!driveService) {
    autoLog('err', 'Drive가 연결되지 않음');
    return;
  }
  if (!state.auto.inputFolderId || !state.auto.outputFolderId) {
    autoLog('err', '입력/출력 폴더가 설정되지 않음');
    return;
  }

  let autoLLM;
  try { autoLLM = getLLMClient(); } catch(e) { autoLog('err', e.message); return; }
  const autoGeminiImage = hasGeminiConnection() ? createGeminiClient() : null;

  // 1. List images in input folder
  autoLog('info', '입력 폴더 스캔 중...');
  state.auto.currentMsg = '폴더 스캔 중...';
  state.auto.currentProgress = 0;
  render();

  let files;
  try {
    files = await driveService.listImages(state.auto.inputFolderId);
  } catch(e) {
    // 인증 만료인 경우 자동 갱신 시도
    if (e.message.includes('invalid authentication') || e.message.includes('401') || e.message.includes('Request had invalid')) {
      autoLog('info', '토큰 만료 감지 — 자동 갱신 시도...');
      try {
        await refreshDriveToken();
        files = await driveService.listImages(state.auto.inputFolderId);
      } catch(e2) {
        autoLog('err', `토큰 갱신 후에도 실패: ${e2.message}`);
        state.auto.currentItem = null;
        render();
        return;
      }
    } else {
      autoLog('err', `폴더 스캔 실패: ${e.message}`);
      state.auto.currentItem = null;
      render();
      return;
    }
  }

  // 2. Filter already processed
  const unprocessed = files.filter(f => !state.auto.processedFileIds.has(f.id));
  autoLog('info', `전체 ${files.length}장, 미처리 ${unprocessed.length}장`);

  if (unprocessed.length === 0) {
    autoLog('info', '처리할 새 이미지가 없습니다. 대기합니다.');
    state.auto.currentItem = null;
    render();
    return;
  }

  // 3. Pick the first unprocessed file
  const file = unprocessed[0];
  state.auto.currentItem = { id: file.id, name: file.name };
  state.auto.currentProgress = 5;
  state.auto.currentMsg = `${file.name} 다운로드 중...`;
  autoLog('info', `처리 시작: ${file.name}`);
  render();

  try {
    // 4. Download the image
    const imgData = await driveService.downloadFile(file.id);
    state.auto.currentProgress = 15;
    state.auto.currentMsg = 'AI 분석 중...';
    render();

    // 5. Analyze with selected LLM
    const analysis = await autoLLM.analyzeImage(imgData.base64, imgData.mime);
    autoLog('ok', `분석 완료: ${analysis.product_name || file.name}`);
    state.auto.currentProgress = 25;
    state.auto.currentMsg = '경쟁 분석 중...';
    render();

    // 6. Competitor search
    let compRef = '';
    try {
      const comp = await autoLLM.searchSimilarProducts(analysis.product_name || analysis.product_name_en, analysis.category);
      compRef = JSON.stringify(comp).substring(0, 1000);
      autoLog('ok', `경쟁 분석 완료: ${comp.similar_products?.length || 0}개`);
    } catch(e) {
      autoLog('err', '경쟁 분석 스킵: ' + e.message);
    }
    state.auto.currentProgress = 30;

    // 7. Generate all 15 sections
    const sectionContents = {};
    const sectionImages = {};
    const instructions = state.sectionInstructions; // use saved instructions

    for (let i = 0; i < SECTIONS.length; i++) {
      const s = SECTIONS[i];
      const pct = Math.round(30 + ((i / SECTIONS.length) * 60));
      state.auto.currentProgress = pct;
      state.auto.currentMsg = `[${i+1}/15] ${s.name} 생성 중...`;
      render();

      try {
        const content = await autoLLM.generateSectionContent(s, analysis, instructions[s.id] || '', compRef);
        sectionContents[s.id] = content;

        // Image (항상 Gemini 이미지 모델)
        if (autoGeminiImage) {
          try {
            const imgPrompt = content.image_description || content.design_notes || s.purpose;
            const img = await autoGeminiImage.generateImage(imgPrompt, imgData.base64, imgData.mime);
            if (img) sectionImages[s.id] = img;
          } catch(e) {}
        }
      } catch(e) {
        autoLog('err', `섹션 ${s.name} 실패: ${e.message}`);
        sectionContents[s.id] = { headline: s.name, subheadline: '생성 실패', body_text: e.message, color_scheme: {background:'#fff',text_primary:'#c00',text_secondary:'#e00'}, font_suggestion:{headline_size:'32px',body_size:'14px'} };
      }
      await new Promise(r => setTimeout(r, 500));
    }

    state.auto.currentProgress = 92;
    state.auto.currentMsg = 'HTML 생성 및 업로드 중...';
    render();

    // 8. Build HTML
    const htmlContent = buildExportHtml(analysis, sectionContents, sectionImages);

    // 9. Upload to Drive
    const productName = analysis.product_name || file.name.replace(/\.[^.]+$/, '');
    const fileName = `${productName}_상세페이지_${new Date().toISOString().slice(0,10)}.html`;
    const uploaded = await driveService.uploadHtml(state.auto.outputFolderId, fileName, htmlContent);
    autoLog('ok', `✅ 업로드 완료: ${fileName}`);

    // 10. Mark as processed
    state.auto.processedFileIds.add(file.id);
    localStorage.setItem('auto_processed_ids', JSON.stringify([...state.auto.processedFileIds]));
    state.auto.totalProcessed++;
    localStorage.setItem('auto_total_processed', state.auto.totalProcessed);
    state.auto.completed.unshift({ name: file.name, finishedAt: new Date().toLocaleTimeString('ko-KR'), error: null });
    if (state.auto.completed.length > 50) state.auto.completed.length = 50;
    localStorage.setItem('auto_completed', JSON.stringify(state.auto.completed));
    state.auto.currentItem = null;
    state.auto.currentProgress = 100;
    state.auto.currentMsg = '';
    render();

  } catch(e) {
    autoLog('err', `처리 실패 (${file.name}): ${e.message}`);
    state.auto.completed.unshift({ name: file.name, finishedAt: new Date().toLocaleTimeString('ko-KR'), error: e.message });
    if (state.auto.completed.length > 50) state.auto.completed.length = 50;
    localStorage.setItem('auto_completed', JSON.stringify(state.auto.completed));
    state.auto.currentItem = null;
    render();
  }
}

// ════════════════════════════════════════════════════════════════
// IMAGE CUTS — GENERATION LOGIC
// ════════════════════════════════════════════════════════════════
async function generateCut(idx, workImgOverride) {
  const c = state.cuts;
  const p = c.prompts[idx];
  if (!c.sourceBase64 || !p.prompt.trim()) {
    state.error = '이미지와 프롬프트를 모두 입력해주세요.';
    render();
    return;
  }

  if (!hasGeminiConnection()) {
    state.error = 'Gemini 연결 설정(API Key 또는 Backend URL)이 필요합니다.';
    render();
    return;
  }
  gemini = gemini || createGeminiClient();
  p.generating = true;
  render();

  // work image: override (Drive automation) > state > null
  const workImg = workImgOverride || (c.workImageBase64 ? { base64: c.workImageBase64, mime: c.workImageMime } : null);

  try {
    const cfg = state.modelConfig;
    const sizeHint = (cfg.imageSizeMode === 'custom' && cfg.imageWidth)
      ? `Exact output size: ${cfg.imageWidth}px wide${cfg.imageHeight ? ' × ' + cfg.imageHeight + 'px tall' : ''}.`
      : 'Aspect ratio 4:3.';

    let fullPrompt, parts;
    if (workImg) {
      // Two-image mode: sample as style reference, work as the product to process
      fullPrompt = `You are given TWO images:
1. SAMPLE IMAGE — reference for style, background, composition, lighting
2. WORK IMAGE — the actual product to place in the scene

Task: Apply the following creative direction using the WORK IMAGE product, matching the SAMPLE IMAGE style.
${p.prompt}
Requirements: High quality, clean, professional Korean e-commerce style.
Use the WORK IMAGE product as the subject. Match the SAMPLE IMAGE background/composition. ${sizeHint}`;
      parts = [
        { text: fullPrompt },
        { text: '[SAMPLE IMAGE — style reference:]' },
        { inline_data: { mime_type: c.sourceMime, data: c.sourceBase64 } },
        { text: '[WORK IMAGE — product to use:]' },
        { inline_data: { mime_type: workImg.mime, data: workImg.base64 } }
      ];
    } else {
      fullPrompt = `Create a professional Korean e-commerce product detail page image cut.
Product image is provided. Apply the following creative direction:
${p.prompt}
Requirements: High quality, clean, professional Korean e-commerce style.
Maintain the product as the focal point. ${sizeHint}`;
      parts = [
        { text: fullPrompt },
        { inline_data: { mime_type: c.sourceMime, data: c.sourceBase64 } }
      ];
    }
    const body = {
      contents: [{ parts }],
      generationConfig: { temperature: 0.8, responseModalities: ['TEXT', 'IMAGE'] }
    };

    // 선택된 이미지 모델 사용
    const cutImgModel = getImageModel();
    const data = await gemini._generateContent(cutImgModel, body);
    tokenTracker.record(cutImgModel, data.usageMetadata?.promptTokenCount, data.usageMetadata?.candidatesTokenCount, true, '컷생성');

    let imgResult = null;
    for (const part of data.candidates[0].content.parts) {
      const id = part.inlineData || part.inline_data;
      if (id && id.mime_type?.startsWith('image/')) {
        imgResult = `data:${id.mime_type};base64,${id.data}`;
        break;
      }
      if (id && id.mimeType?.startsWith('image/')) {
        imgResult = `data:${id.mimeType};base64,${id.data}`;
        break;
      }
    }
    if (!imgResult) throw new Error('이미지가 반환되지 않았습니다');

    // 픽셀 설정이 custom이면 Canvas로 정확히 리사이즈
    imgResult = await applyImageSizeConfig(imgResult);

    p.result = imgResult;
    p.generating = false;
    savePrompts();
    render();
  } catch(e) {
    p.generating = false;
    state.error = `컷 ${idx+1} 생성 실패: ${e.message}`;
    render();
  }
}

async function generateAllCuts() {
  for (let i = 0; i < state.cuts.prompts.length; i++) {
    await generateCut(i);
    await new Promise(r => setTimeout(r, 800));
  }
}

function savePrompts() {
  // result(base64)는 용량 문제로 저장 안 함 — prompt/label만 저장
  const toSave = state.cuts.prompts.map(p => ({
    id: p.id,
    label: p.label,
    prompt: p.prompt,
    result: null,
    generating: false,
  }));
  try { localStorage.setItem('cuts_prompts', JSON.stringify(toSave)); } catch(e) {}
  try {
    document.cookie = `cuts_prompts=${encodeURIComponent(JSON.stringify(toSave))};max-age=31536000;path=/;SameSite=Lax`;
  } catch(e) {}
}

function loadPrompts() {
  let data = null;
  try {
    const raw = localStorage.getItem('cuts_prompts');
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
  if (!data) {
    try {
      const m = document.cookie.match(/cuts_prompts=([^;]+)/);
      if (m) data = JSON.parse(decodeURIComponent(m[1]));
    } catch(e) {}
  }
  return data || [
    { id:'cut1', label:'컷 1', prompt:'', result:null, generating:false },
    { id:'cut2', label:'컷 2', prompt:'', result:null, generating:false },
    { id:'cut3', label:'컷 3', prompt:'', result:null, generating:false },
    { id:'cut4', label:'컷 4', prompt:'', result:null, generating:false },
  ];
}

function savePlacement() {
  localStorage.setItem('cuts_placement', JSON.stringify(state.cuts.placement));
}

// 배치 적용 — sectionImages에 이미지컷 반영
function applyPlacement() {
  const c = state.cuts;
  for (const [sectionId, cutId] of Object.entries(c.placement)) {
    const cut = c.prompts.find(p => p.id === cutId);
    if (cut?.result) {
      state.sectionImages[sectionId] = cut.result;
    } else {
      delete state.sectionImages[sectionId];
    }
  }
  savePlacement();
  state.step = 'preview';
  render();
}

// ── bindEvents 확장 (이미지컷) ──
const _origBind2 = bindEvents;
bindEvents = function() {
  _origBind2();

  // 소스 이미지 업로드
  const cutsArea = document.getElementById('cutsUploadArea');
  const cutsInput = document.getElementById('cutsFileInput');
  if (cutsArea) {
    cutsArea.onclick = () => cutsInput.click();
    cutsArea.ondragover = e => e.preventDefault();
    cutsArea.ondrop = e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file?.type.startsWith('image/')) loadCutSource(file);
    };
  }
  if (cutsInput) cutsInput.onchange = e => { if (e.target.files[0]) loadCutSource(e.target.files[0]); };

  // 작업 이미지 업로드
  const cutsWorkArea = document.getElementById('cutsWorkUploadArea');
  const cutsWorkInput = document.getElementById('cutsWorkFileInput');
  if (cutsWorkArea) {
    cutsWorkArea.onclick = () => cutsWorkInput?.click();
    cutsWorkArea.ondragover = e => e.preventDefault();
    cutsWorkArea.ondrop = e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file?.type.startsWith('image/')) loadCutWorkImage(file);
    };
  }
  if (cutsWorkInput) cutsWorkInput.onchange = e => { if (e.target.files[0]) loadCutWorkImage(e.target.files[0]); };

  // 작업 이미지 Drive 폴더 저장
  const cutsWorkFolderSaveBtn = document.getElementById('cutsWorkFolderSaveBtn');
  if (cutsWorkFolderSaveBtn) {
    cutsWorkFolderSaveBtn.onclick = async () => {
      const inp = document.getElementById('cutsWorkFolderInput');
      const folderId = inp?.value.trim();
      if (!folderId) return;
      state.cuts.workDriveFolderId = folderId;
      localStorage.setItem('cuts_work_drive_folder_id', folderId);
      // 폴더 이름 조회 시도
      if (driveService) {
        try {
          const meta = await driveService.getFolderMeta(folderId);
          state.cuts.workDriveFolderName = meta.name || folderId;
          localStorage.setItem('cuts_work_drive_folder_name', state.cuts.workDriveFolderName);
        } catch(e) { state.cuts.workDriveFolderName = folderId; }
      }
      render();
    };
  }

  // 작업 이미지 Drive 일괄 처리
  const cutsWorkDriveRunBtn = document.getElementById('cutsWorkDriveRunBtn');
  if (cutsWorkDriveRunBtn) {
    cutsWorkDriveRunBtn.onclick = () => runCutsWorkDriveAutomation();
  }

  // 프롬프트 입력 저장
  document.querySelectorAll('[data-cut-prompt]').forEach(el => {
    el.oninput = e => {
      state.cuts.prompts[+el.dataset.cutPrompt].prompt = e.target.value;
      savePrompts();
    };
  });

  // 개별 생성
  document.querySelectorAll('[data-gen-cut]').forEach(btn => {
    btn.onclick = () => generateCut(+btn.dataset.genCut);
  });

  // 이름 변경
  document.querySelectorAll('[data-rename-cut]').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.renameCut;
      const newName = prompt('컷 이름을 입력하세요:', state.cuts.prompts[i].label);
      if (newName?.trim()) {
        state.cuts.prompts[i].label = newName.trim();
        savePrompts();
        render();
      }
    };
  });

  // 전체 생성
  const genAllBtn = document.getElementById('genAllCutsBtn');
  if (genAllBtn) genAllBtn.onclick = generateAllCuts;

  // 결과 초기화
  const clearBtn = document.getElementById('clearAllCutsBtn');
  if (clearBtn) clearBtn.onclick = () => {
    state.cuts.prompts.forEach(p => { p.result = null; p.generating = false; });
    state.cuts.placement = {};
    savePlacement();
    render();
  };

  // 배치 선택
  document.querySelectorAll('[data-place-section]').forEach(sel => {
    sel.onchange = e => {
      const sid = sel.dataset.placeSection;
      if (e.target.value) state.cuts.placement[sid] = e.target.value;
      else delete state.cuts.placement[sid];
    };
  });

  // 배치 적용
  const applyBtn = document.getElementById('applyPlacementBtn');
  if (applyBtn) applyBtn.onclick = applyPlacement;

  // ── 모델 설정 이벤트 ──
  // 프로바이더 선택
  document.querySelectorAll('[data-pick-provider]').forEach(el => {
    el.onclick = () => {
      const prov = el.dataset.pickProvider;
      state.modelConfig.llmProvider = prov;
      // 프로바이더 변경 시 해당 프로바이더의 첫 번째 모델로 자동 선택
      const firstModel = prov === 'openai'
        ? (LLM_PROVIDERS.openai?.models?.find(m => m.id === 'gpt-5.4-nano')?.id || LLM_PROVIDERS[prov]?.models[0]?.id)
        : LLM_PROVIDERS[prov]?.models[0]?.id;
      if (firstModel) state.modelConfig.llmModel = firstModel;
      render();
    };
  });

  // LLM 모델 선택
  document.querySelectorAll('[data-pick-model]').forEach(el => {
    el.onclick = () => {
      const picked = el.dataset.pickModel;
      const prov = state.modelConfig.llmProvider || 'openai';
      const allowedLlm = (LLM_PROVIDERS[prov]?.models || []).map(m => m.id);
      if (!allowedLlm.includes(picked)) {
        state.error = '선택한 프로바이더의 모델만 선택할 수 있습니다.';
        render();
        return;
      }
      state.modelConfig.llmModel = picked;
      render();
    };
  });

  // 이미지 모델 선택
  document.querySelectorAll('[data-pick-imgmodel]').forEach(el => {
    el.onclick = () => {
      state.modelConfig.imageModel = el.dataset.pickImgmodel;
      render();
    };
  });

  // Gemini 키 visibility 토글
  const toggleGemini = document.getElementById('toggleGeminiKey');
  if (toggleGemini) {
    toggleGemini.onclick = () => {
      const inp = document.getElementById('geminiKeyInput');
      if (!inp) return;
      if (inp.type === 'password') { inp.type = 'text'; toggleGemini.textContent = 'visibility_off'; }
      else { inp.type = 'password'; toggleGemini.textContent = 'visibility'; }
    };
  }

  // OpenAI 키 visibility 토글
  const toggleOAI = document.getElementById('toggleOpenAIKey');
  if (toggleOAI) {
    toggleOAI.onclick = () => {
      const inp = document.getElementById('openaiKeyInput');
      if (!inp) return;
      if (inp.type === 'password') { inp.type = 'text'; toggleOAI.textContent = 'visibility_off'; }
      else { inp.type = 'password'; toggleOAI.textContent = 'visibility'; }
    };
  }

  // 이미지 크기 모드 토글
  const imgSizeModeAuto = document.getElementById('imgSizeModeAuto');
  if (imgSizeModeAuto) {
    imgSizeModeAuto.onclick = () => {
      state.modelConfig.imageSizeMode = 'auto';
      render();
    };
  }
  const imgSizeModeCustom = document.getElementById('imgSizeModeCustom');
  if (imgSizeModeCustom) {
    imgSizeModeCustom.onclick = () => {
      state.modelConfig.imageSizeMode = 'custom';
      render();
    };
  }

  // 설정 저장
  const saveModelBtn = document.getElementById('saveModelSettings');
  if (saveModelBtn) {
    saveModelBtn.onclick = () => {
      // Gemini backend URL
      const backendInp = document.getElementById('geminiBackendInput');
      if (backendInp) {
        state.backendBaseUrl = (backendInp.value || '').trim();
        saveBackendUrl(state.backendBaseUrl);
      }

      // Gemini 키
      const geminiInp = document.getElementById('geminiKeyInput');
      if (geminiInp) {
        state.apiKey = geminiInp.value.trim();
        saveKey(state.apiKey);
      }
      // OpenAI 키
      const openaiInp = document.getElementById('openaiKeyInput');
      if (openaiInp) {
        const newOpenAIVal = openaiInp.value.trim();
        if (newOpenAIVal) state.openaiKey = newOpenAIVal;
        saveOpenAIKey(state.openaiKey); // 항상 저장 (필드가 비어있어도 기존 키 유지)
      }
      // 이미지 픽셀 설정
      const wInp = document.getElementById('imgWidthInput');
      const hInp = document.getElementById('imgHeightInput');
      if (wInp) {
        const w = parseInt(wInp.value);
        if (w >= 64 && w <= 4096) state.modelConfig.imageWidth = w;
      }
      if (hInp) {
        const h = parseInt(hInp.value);
        state.modelConfig.imageHeight = (hInp.value.trim() === '' || isNaN(h)) ? null : Math.max(64, Math.min(4096, h));
      }
      state.modelConfig = normalizeModelConfig(state.modelConfig);
      // 모델 설정 저장
      saveModelConfig(state.modelConfig);
      // 저장 완료 메시지
      const msg = document.getElementById('modelSaveMsg');
      if (msg) { msg.style.display = 'inline'; setTimeout(() => { msg.style.display = 'none'; }, 2000); }
      gemini = hasGeminiConnection() ? createGeminiClient() : null;
      render(); // 사이드바 요약 및 설정 요약 갱신
    };
  }

  // ── Vertex AI 설정 버튼 ──
  const loadVertexBtn = document.getElementById('loadVertexConfigBtn');
  if (loadVertexBtn) {
    loadVertexBtn.onclick = async () => {
      try {
        const base = state.auto.serverApiBase || 'http://127.0.0.1:4000/v1';
        const res = await fetch(`${base}/pdp/vertex-config`);
        const data = await res.json();
        state.vertexConfig = data;
        render();
      } catch(e) {
        const err = document.getElementById('vertexErrMsg');
        if (err) { err.textContent = '불러오기 실패: ' + e.message; err.style.display = 'inline'; setTimeout(() => err.style.display = 'none', 3000); }
      }
    };
  }

  const saveVertexBtn = document.getElementById('saveVertexConfigBtn');
  if (saveVertexBtn) {
    saveVertexBtn.onclick = async () => {
      const project = document.getElementById('vertexProjectInput')?.value.trim();
      const location = document.getElementById('vertexLocationInput')?.value || 'us-central1';
      if (!project) { alert('Project ID를 입력하세요'); return; }
      try {
        const base = state.auto.serverApiBase || 'http://127.0.0.1:4000/v1';
        const res = await fetch(`${base}/pdp/vertex-config`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project, location })
        });
        const data = await res.json();
        if (data.ok) {
          state.vertexConfig = { project: data.project, location: data.location };
          const msg = document.getElementById('vertexSaveMsg');
          if (msg) { msg.style.display = 'inline'; setTimeout(() => msg.style.display = 'none', 2500); }
        }
      } catch(e) {
        const err = document.getElementById('vertexErrMsg');
        if (err) { err.textContent = '저장 실패: ' + e.message; err.style.display = 'inline'; setTimeout(() => err.style.display = 'none', 3000); }
      }
    };
  }
};

    state.cuts.sourcePreview = e.target.result;
    state.cuts.sourceBase64 = e.target.result.split(',')[1];
    render();

  reader.readAsDataURL(file);
}

function loadCutWorkImage(file) {

  const reader = new FileReader();

    state.cuts.workImagePreview = e.target.result;
    state.cuts.workImageBase64 = e.target.result.split(',')[1];

}

function clearWorkImage() {
  state.cuts.workImageBase64 = null;
  state.cuts.workImageMime = null;

}

async function runCutsWorkDriveAutomation() {
  if (!driveService) { state.error = 'Drive가 연결되어 있지 않습니다. 자동화 탭에서 연결하세요.'; render(); return; }
  const folderId = state.cuts.workDriveFolderId;
  if (!folderId) { state.error = '작업 이미지 Drive 폴더 ID를 입력하세요.'; render(); return; }
  if (!state.cuts.sourceBase64) { state.error = '샘플 이미지를 먼저 업로드하세요.'; render(); return; }
  const hasPrompts = state.cuts.prompts.some(p => p.prompt.trim());
  if (!hasPrompts) { state.error = '프롬프트를 하나 이상 입력하세요.'; render(); return; }

  state.cuts.workDriveRunning = true;
  render();

  try {
    const files = await driveService.listImages(folderId);
    if (files.length === 0) {
      state.error = '폴더에 이미지가 없습니다.';
      state.cuts.workDriveRunning = false;
      render();
      return;
    }

    for (const file of files) {
      state.progressMsg = `작업 이미지 처리 중: ${file.name}`;
      render();
      try {
        const imgData = await driveService.downloadFile(file.id);
        const workImgOverride = { base64: imgData.base64, mime: imgData.mime };
        // 이 작업 이미지로 모든 컷 생성
        for (let i = 0; i < state.cuts.prompts.length; i++) {
          if (!state.cuts.prompts[i].prompt.trim()) continue;
          await generateCut(i, workImgOverride);
          await new Promise(r => setTimeout(r, 600));
        }
        // 결과를 Drive 출력 폴더가 있으면 업로드 (자동화 output 폴더 재사용)
        if (state.auto.outputFolderId && driveService) {
          for (let i = 0; i < state.cuts.prompts.length; i++) {
            const cut = state.cuts.prompts[i];
            if (!cut.result) continue;
            try {
              const baseName = file.name.replace(/\.[^.]+$/, '');
              const blob = await (await fetch(cut.result)).blob();
              const jpegBlob = await convertToJpegBlob(blob);
              await driveService.uploadImage(state.auto.outputFolderId, `${baseName}_cut${i+1}.jpg`, jpegBlob);
            } catch(e2) { console.warn('Drive 업로드 실패:', e2.message); }
          }
        }
      } catch(e) {
        console.warn(`${file.name} 처리 실패:`, e.message);
      }
    }
    state.progressMsg = '';
    state.cuts.workDriveRunning = false;
    render();
  } catch(e) {
    state.error = `Drive 자동화 실패: ${e.message}`;
    state.cuts.workDriveRunning = false;
    render();
  }
}

async function convertToJpegBlob(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('변환 실패')), 'image/jpeg', 0.92);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}

function buildExportHtml(analysis, sectionContents, sectionImages) {
  let sectionsHtml = '';
  for (const s of SECTIONS) {
    const content = sectionContents[s.id];
    if (!content) continue;
    const c = content.color_scheme || {};
    const f = content.font_suggestion || {};
    const headlineFont = cssFontFamily(f.headline_font);
    const bodyFont = cssFontFamily(f.body_font || f.headline_font);
    const img = sectionImages[s.id];
    sectionsHtml += `
    <section style="background:${c.background||'#FFFFFF'};padding:60px 20px;text-align:center;">
      <div style="max-width:860px;margin:0 auto;">
        <h2 style="font-size:${f.headline_size||'36px'};color:${c.text_primary||'#333'};margin-bottom:12px;font-weight:${f.headline_weight||'700'};font-family:${headlineFont};">${content.headline||''}</h2>
        <h3 style="font-size:20px;color:${c.text_secondary||'#666'};margin-bottom:24px;font-weight:400;font-family:${bodyFont};">${content.subheadline||''}</h3>
        ${img ? `<img src="${img}" alt="${s.name}" style="max-width:100%;border-radius:12px;margin:20px 0;">` : ''}
        <p style="font-size:${f.body_size||'16px'};color:${c.text_secondary||'#666'};line-height:1.8;font-family:${bodyFont};max-width:680px;margin:0 auto;">${content.body_text||''}</p>
        ${content.extra_elements?.length ? `<div style="margin-top:20px;text-align:left;max-width:600px;margin:0 auto;">${content.extra_elements.map(e=>`<div style="padding:8px 0;color:${c.text_secondary||'#555'};font-size:14px;font-family:${bodyFont};border-bottom:1px solid rgba(0,0,0,.05);">• ${e}</div>`).join('')}</div>` : ''}
        ${content.cta_text ? `<a href="#" style="display:inline-block;margin-top:24px;padding:14px 40px;background:${c.accent||'#6366f1'};color:#fff;border-radius:8px;text-decoration:none;font-size:18px;font-weight:600;font-family:${bodyFont};">${content.cta_text}</a>` : ''}
      </div>
    </section>`;
  }
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${analysis.product_name||'상세페이지'}</title><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Pretendard','Noto Sans KR',sans-serif;color:#333}img{max-width:100%;height:auto}section{width:100%}</style></head><body>${sectionsHtml}</body></html>`;
}

function startAutomation() {
  if (state.auto.running) return;
  state.auto.running = true;
  autoLog('info', `자동화 시작 (${state.auto.intervalMin}분 간격)`);

  // Run immediately
  autoProcessOne();

  // Schedule
  state.auto.timerId = setInterval(() => {
    if (!state.auto.currentItem) { // 이전 작업 완료된 경우만
      const now = new Date();
      state.auto.nextRunAt = new Date(now.getTime() + state.auto.intervalMin * 60000).toLocaleTimeString('ko-KR');
      autoProcessOne();
    }
  }, state.auto.intervalMin * 60 * 1000);

  const now = new Date();
  state.auto.nextRunAt = new Date(now.getTime() + state.auto.intervalMin * 60000).toLocaleTimeString('ko-KR');
  render();
}

function stopAutomation() {
  state.auto.running = false;
  if (state.auto.timerId) {
    clearInterval(state.auto.timerId);
    state.auto.timerId = null;
  }
  state.auto.nextRunAt = null;
  autoLog('info', '자동화 중지됨');
  render();
}

// ════════════════════════════════════════════════════════════════
// BIND AUTOMATION EVENTS (add to bindEvents)
// ════════════════════════════════════════════════════════════════
// 자동화 탭 상태 폴링 (자동화 탭에 있을 때 5초마다 서버 상태 갱신)
let _autoTabPollTimer = null;
function startAutoTabPolling() {
  if (_autoTabPollTimer) return;
  _autoTabPollTimer = setInterval(async () => {
    if (state.step !== 'automation') {
      clearInterval(_autoTabPollTimer);
      _autoTabPollTimer = null;
      return;
    }
    const base = state.auto.serverApiBase;
    if (!base) return;
    // config가 아직 없으면 전체 config 재시도 (API 늦게 켜지는 경우)
    if (!state.auto.serverConfig && !state.auto.serverLoading) {
      await fetchServerAutomationConfig();
      return;
    }
    try {
      const res = await fetch(`${base}/pdp/automation/status`);
      if (!res.ok) return;
      const data = await res.json();
      state.auto.serverStatus = data;
      patchAutomationStatusInPlace(); // render() 대신 — 깜빡임 없음
    } catch(e) { /* 무시 */ }
  }, 5000);
}

const _origBind = bindEvents;
bindEvents = function() {
  _origBind();

  if (state.step === 'automation') {
    if (!state.auto.serverFetchedOnce && !state.auto.serverLoading) {
      state.auto.serverFetchedOnce = true;
      fetchServerAutomationConfig();
    }
    startAutoTabPolling();
  } else {
    if (_autoTabPollTimer) { clearInterval(_autoTabPollTimer); _autoTabPollTimer = null; }
  }

  const serverRefreshBtn = document.getElementById('serverAutoRefreshBtn');
  if (serverRefreshBtn) {
    serverRefreshBtn.onclick = async () => {
      const baseInput = document.getElementById('serverAutoApiBase');
      if (baseInput) state.auto.serverApiBase = baseInput.value.trim();
      await fetchServerAutomationConfig();
    };
  }

  const buildProfileUpdate = (mode, modeId, enabledOverride) => {
    const currentProfile = state.auto.serverConfig?.profiles?.[mode] || {};
    // 저장(save) 시 enabledOverride 없으면 항상 OFF — 자동화 실행 버튼만 ON 설정
    const enabled = enabledOverride !== undefined ? enabledOverride : false;
    const inputFolderId = extractFolderId(document.getElementById(`serverInput${modeId}`)?.value.trim() || '');
    const sourceDoneFolderId = extractFolderId(document.getElementById(`serverDone${modeId}`)?.value.trim() || '');
    const outputFolderId = extractFolderId(document.getElementById(`serverOutput${modeId}`)?.value.trim() || '');
    const pollIntervalSeconds = parsePositiveInt(document.getElementById(`serverPoll${modeId}`)?.value, 120, 30, 3600);
    const maxFilesPerRun = parsePositiveInt(document.getElementById(`serverMax${modeId}`)?.value, 1, 1, 20);
    const imageModel = document.getElementById(`serverModel${modeId}`)?.value || currentProfile.imageModel || 'gemini-3.1-flash-image-preview';
    const outputImageSize = document.getElementById(`serverResolution${modeId}`)?.value || null;
    const update = { enabled, inputFolderId, sourceDoneFolderId, outputFolderId, pollIntervalSeconds, maxFilesPerRun, imageModel, outputImageSize };
    if (mode === 'image-cuts') {
      update.customCuts = state.auto.draftCuts.map(c => ({label: c.label, prompt: c.prompt}));
    }
    return update;
  };

  const bindServerMode = (mode, modeId) => {
    const saveBtn = document.getElementById(`serverSave${modeId}`);
    if (saveBtn) {
      saveBtn.onclick = async () => {
        await updateServerAutomationProfiles({ [mode]: buildProfileUpdate(mode, modeId) });
      };
    }

    if (mode === 'image-cuts') {
      for (let i = 0; i < 10; i++) {
        const labelEl = document.getElementById(`serverCutLabel${modeId}_${i}`);
        const promptEl = document.getElementById(`serverCutPrompt${modeId}_${i}`);
        if (labelEl) {
          labelEl.oninput = (e) => {
            state.auto.draftCuts[i].label = e.target.value;
            saveDraftCuts(state.auto.draftCuts);
          };
        }
        if (promptEl) {
          promptEl.oninput = (e) => {
            state.auto.draftCuts[i].prompt = e.target.value;
            saveDraftCuts(state.auto.draftCuts);
          };
        }
      }
    }

    const runBtn = document.getElementById(`serverRun${modeId}`);
    if (runBtn) {
      runBtn.onclick = async () => {
        await runServerAutomationMode(mode);
      };
    }

    const autoStartBtn = document.getElementById(`serverAutoStart${modeId}`);
    if (autoStartBtn) {
      autoStartBtn.onclick = async () => {
        await updateServerAutomationProfiles({ [mode]: buildProfileUpdate(mode, modeId, true) });
        autoLog('ok', `${mode} 자동화 실행 시작됨`);
      };
    }

    const autoStopBtn = document.getElementById(`serverAutoStop${modeId}`);
    if (autoStopBtn) {
      autoStopBtn.onclick = async () => {
        await updateServerAutomationProfiles({ [mode]: buildProfileUpdate(mode, modeId, false) });
        autoLog('info', `${mode} 자동화 중지됨`);
      };
    }
  };

  bindServerMode('image-cuts', 'ImageCuts');
  bindServerMode('detail-page', 'DetailPage');

  const connectBtn = document.getElementById('connectDriveBtn');
  if (connectBtn) connectBtn.onclick = connectDrive;

  const setInput = document.getElementById('setInputFolder');
  if (setInput) setInput.onclick = async () => {
    const raw = document.getElementById('inputFolderId')?.value.trim();
    if (!raw) return;
    const id = extractFolderId(raw);
    state.auto.inputFolderId = id;
    localStorage.setItem('auto_input_folder_id', id);
    autoLog('info', `입력 폴더 ID 추출: ${id}`);
    try {
      const name = await driveService.getFolderName(id);
      state.auto.inputFolderName = name;
      localStorage.setItem('auto_input_folder_name', name);
      autoLog('ok', `입력 폴더 설정 완료: ${name}`);
    } catch(e) {
      state.auto.inputFolderName = id;
      autoLog('err', '폴더 이름 조회 실패: ' + e.message);
    }
    render();
  };

  const setOutput = document.getElementById('setOutputFolder');
  if (setOutput) setOutput.onclick = async () => {
    const raw = document.getElementById('outputFolderId')?.value.trim();
    if (!raw) return;
    const id = extractFolderId(raw);
    state.auto.outputFolderId = id;
    localStorage.setItem('auto_output_folder_id', id);
    autoLog('info', `출력 폴더 ID 추출: ${id}`);
    try {
      const name = await driveService.getFolderName(id);
      state.auto.outputFolderName = name;
      localStorage.setItem('auto_output_folder_name', name);
      autoLog('ok', `출력 폴더 설정: ${name}`);
    } catch(e) {
      state.auto.outputFolderName = id;
      autoLog('err', '폴더 이름 조회 실패, ID로 설정됨');
    }
    render();
  };

  const intervalSlider = document.getElementById('intervalSlider');
  if (intervalSlider) {
    intervalSlider.oninput = () => {
      const v = parseInt(intervalSlider.value);
      state.auto.intervalMin = v;
      localStorage.setItem('auto_interval', v);
      const disp = document.getElementById('intervalDisplay');
      if (disp) disp.textContent = v + '분';
    };
  }

  const startBtn = document.getElementById('startAutoBtn');
  if (startBtn) startBtn.onclick = startAutomation;

  const stopBtn = document.getElementById('stopAutoBtn');
  if (stopBtn) stopBtn.onclick = stopAutomation;

  const runOnce = document.getElementById('runOnceBtn');
  if (runOnce) runOnce.onclick = () => {
    autoLog('info', '수동 1회 실행');
    autoProcessOne();
  };

  const resetBtn = document.getElementById('resetProcessedBtn');
  if (resetBtn) resetBtn.onclick = () => {
    state.auto.processedFileIds.clear();
    localStorage.removeItem('auto_processed_ids');
    state.auto.totalProcessed = 0;
    localStorage.setItem('auto_total_processed', '0');
    state.auto.completed = [];
    localStorage.setItem('auto_completed', '[]');
    autoLog('info', '처리 기록 초기화됨');
    render();
  };
};

if (hasGeminiConnection()) {
  gemini = createGeminiClient();
}
