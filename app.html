<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
// 파일 변경 감지 자동 새로고침 (로컬 개발용)
(function(){
  if(location.hostname !== '127.0.0.1' && location.hostname !== 'localhost') return;
  let lastModified = null;
  setInterval(async function(){
    try {
      const r = await fetch('/app.html', {method:'HEAD', cache:'no-store'});
      const lm = r.headers.get('last-modified') || r.headers.get('content-length');
      if(lastModified && lm && lastModified !== lm) { location.reload(); return; }
      lastModified = lm || lastModified;
    } catch(e){}
  }, 3000);
})();
</script>
<title>상세페이지 자동 생성기</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6366f1;--primary-h:#818cf8;--primary-dim:rgba(99,102,241,.15);
  --bg:#0f0f13;--bg-card:#1a1a23;--bg-input:#13131a;
  --border:#2a2a36;--border-h:#3a3a4a;
  --text:#e4e4e7;--text-d:#9494a5;--text-m:#6b6b7b;
  --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --cyan:#06b6d4;--orange:#f97316;
}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .3s ease-out}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;padding:20px 16px;border-bottom:1px solid var(--border)}
.logo-icon{font-size:28px;color:var(--primary);font-weight:900}
.logo-text{font-weight:700;font-size:15px;line-height:1.3}
.logo-sub{font-weight:400;font-size:12px;color:var(--text-d)}
.nav{padding:12px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;color:var(--text-d);font-size:13px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.03)}
.nav-item.active{background:var(--primary-dim);color:var(--primary-h)}
.nav-item.disabled{opacity:.4;cursor:not-allowed}
.main{flex:1;min-width:0;padding:24px 32px;overflow-y:auto}
.container{max-width:1100px;margin:0 auto}

/* Typography */
.page-title{font-size:26px;font-weight:800;margin-bottom:6px}
.page-desc{font-size:14px;color:var(--text-d);margin-bottom:24px}

/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:16px;padding:40px;text-align:center;cursor:pointer;background:var(--bg-card);margin-bottom:24px;min-height:240px;display:flex;align-items:center;justify-content:center;transition:.2s}
.upload-area:hover{border-color:var(--primary);background:rgba(99,102,241,.03)}
.upload-area.has-image{border-style:solid;border-color:var(--border)}
.preview-img{max-height:300px;max-width:100%;border-radius:12px;object-fit:contain}

/* Form */
.input-group{margin-bottom:20px}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-d)}
.input,.textarea{width:100%;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border .2s}
.input:focus,.textarea:focus{border-color:var(--primary)}
.textarea{resize:vertical;line-height:1.5;font-size:13px}

/* Buttons */
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary:hover{background:var(--primary-h)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--bg-card);color:var(--text-d);border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-sm:hover{border-color:var(--border-h);color:var(--text)}

/* Cards */
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.feature-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.feature-card .mi{font-size:28px;color:var(--primary);margin-bottom:8px}
.feature-card h4{font-weight:600;font-size:14px;margin-bottom:4px}
.feature-card p{font-size:12px;color:var(--text-d)}

/* Analysis Summary */
.analysis-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px}
.tag{display:inline-block;padding:3px 10px;background:var(--primary-dim);color:var(--primary-h);border-radius:20px;font-size:11px;font-weight:500;margin:2px}

/* Section Cards */
.section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.section-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s}
.section-card:hover{border-color:var(--border-h);background:var(--bg-card)}
.section-card .head{display:flex;align-items:center;gap:12px}
.section-card .icon{font-size:28px}
.section-card .info{flex:1}
.section-card .info h4{font-weight:600;font-size:14px}
.section-card .info p{font-size:12px;color:var(--text-d);margin-top:2px}
.custom-badge{margin-top:8px;padding:6px 10px;background:var(--primary-dim);border-radius:6px;font-size:12px;color:var(--primary-h)}

/* Progress */
.progress-outer{width:100%;max-width:400px;height:24px;background:var(--bg-card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));border-radius:12px;transition:width .5s ease;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:40px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.spinner-lg{width:64px;height:64px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
/* ── Agent Chat ── */
.agent-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(99,102,241,.5);z-index:1000;transition:.2s}
.agent-fab:hover{background:var(--primary-h);transform:scale(1.08)}
.agent-fab .badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center}
.agent-panel{position:fixed;bottom:88px;right:24px;width:420px;max-width:calc(100vw - 40px);height:600px;max-height:calc(100vh - 120px);background:var(--bg-card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;z-index:999;box-shadow:0 8px 40px rgba(0,0,0,.6);overflow:hidden}
.agent-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.agent-msgs::-webkit-scrollbar{width:4px}.agent-msgs::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:2px}
.agent-bubble{max-width:90%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word}
.agent-bubble.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.agent-bubble.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.agent-action-block{margin-top:8px;padding:8px 10px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.25);border-radius:8px;font-size:11px;color:var(--primary-h);font-family:monospace;line-height:1.7}
.agent-input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg)}
.agent-input-row textarea{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px;font-family:'Pretendard','Noto Sans KR',sans-serif;resize:none;line-height:1.5;max-height:120px}
.agent-input-row textarea:focus{outline:none;border-color:var(--primary)}
.agent-cursor{display:inline-block;width:2px;height:1em;background:var(--primary-h);animation:blink .7s step-end infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.gen-icons{margin-top:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gen-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border-radius:10px;font-size:22px;border:1px solid var(--border);transition:.3s}
.gen-icon.done{background:var(--primary-dim);border-color:var(--primary)}

/* Preview */
.preview-wrap{background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.section-ctrl{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-card);border-bottom:1px solid var(--border)}
.section-ctrl .name{font-weight:600;font-size:13px}
.section-ctrl .image-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inserted-image-block{background:#fff;border-top:1px solid rgba(15,23,42,.08);border-bottom:1px solid rgba(15,23,42,.08);padding:22px 20px;position:relative}
.inserted-image-inner{max-width:1120px;margin:0 auto}
.inserted-image-ctrl{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.inserted-image-card{position:relative;border-radius:22px;overflow:hidden;background:#f8fafc;box-shadow:0 18px 46px rgba(15,23,42,.10)}
.inserted-image-card img{display:block;width:100%;height:auto;max-height:820px;object-fit:contain;margin:0 auto}
.inserted-image-caption{font-size:11px;color:#64748b;margin-top:8px;text-align:right}
.image-insert-overlay{z-index:1250;align-items:flex-start;overflow:auto;padding:28px 16px}
.image-insert-modal{max-width:920px;width:min(920px,96vw);padding:0;overflow:hidden}
.image-insert-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(99,102,241,.10))}
.image-insert-title{font-size:18px;font-weight:800;margin-bottom:4px}
.image-insert-sub{font-size:12px;color:var(--text-d);line-height:1.55}
.image-insert-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.image-source-panel{border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:14px;min-width:0}
.image-source-panel h3{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.image-source-panel p{font-size:12px;color:var(--text-d);line-height:1.5;margin-bottom:12px}
.image-source-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.image-source-card{border:1px solid var(--border);border-radius:10px;background:var(--bg-card);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.image-source-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--bg-input)}
.image-source-card .src-name{font-size:11px;color:var(--text-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-insert-error{grid-column:1/-1;padding:10px 12px;border:1px solid rgba(239,68,68,.32);background:rgba(239,68,68,.10);border-radius:10px;color:var(--err);font-size:12px}
.edit-panel{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.preview-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.layer-mode-banner{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:14px;border:1px solid rgba(99,102,241,.35);background:rgba(99,102,241,.10);border-radius:12px;color:var(--text-d);font-size:13px}
.preview-layer{position:relative;transition:box-shadow .12s ease, outline-color .12s ease, transform .04s linear}
.preview-layer.layer-editable{cursor:grab;outline:1px dashed transparent;outline-offset:5px;border-radius:10px}
.preview-layer.layer-editable:hover{outline-color:rgba(99,102,241,.55);box-shadow:0 0 0 6px rgba(99,102,241,.08)}
.preview-layer.layer-selected{outline-color:var(--primary)!important;box-shadow:0 0 0 8px rgba(99,102,241,.14)}
.layer-editor{margin-top:12px;padding:14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03)}
.layer-pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.layer-pill{border:1px solid var(--border);background:var(--bg-card);color:var(--text-d);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.layer-pill.active{border-color:var(--primary);color:var(--primary-h);background:var(--primary-dim)}
.layer-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.range-row label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-m);margin-bottom:4px}
.range-row input[type=range]{width:100%;accent-color:var(--primary)}

/* AI local image repair */
.repair-overlay{z-index:1200;align-items:flex-start;overflow:auto;padding:28px 16px}
.repair-modal{max-width:1120px;width:min(1120px,96vw);padding:0;overflow:hidden}
.repair-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(16,163,127,.14),rgba(99,102,241,.10))}
.repair-title{font-size:18px;font-weight:800;margin-bottom:4px}
.repair-sub{font-size:12px;color:var(--text-d);line-height:1.6}
.repair-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:0;min-height:560px}
.repair-canvas-panel{padding:18px;background:#111827;display:flex;align-items:center;justify-content:center}
.repair-stage{position:relative;max-width:100%;max-height:70vh;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.36);background:#0b1020}
.repair-stage img{display:block;max-width:100%;max-height:70vh;object-fit:contain}
.repair-stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.repair-side{padding:18px;border-left:1px solid var(--border);background:var(--bg-card);display:flex;flex-direction:column;gap:14px}
.repair-tip{padding:10px 12px;border:1px solid rgba(16,163,127,.32);background:rgba(16,163,127,.10);border-radius:10px;color:var(--text-d);font-size:12px;line-height:1.55}
.repair-actions{display:flex;gap:8px;flex-wrap:wrap}
.repair-mini{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-m)}
.repair-error{padding:10px 12px;border:1px solid rgba(239,68,68,.32);background:rgba(239,68,68,.10);border-radius:10px;color:var(--err);font-size:12px;line-height:1.5}
.repair-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.62);backdrop-filter:blur(4px);color:#fff;font-size:13px;font-weight:700}
@media (max-width:900px){.repair-body{grid-template-columns:1fr}.repair-side{border-left:0;border-top:1px solid var(--border)}}
@media (max-width:900px){.image-insert-body{grid-template-columns:1fr}.section-ctrl{align-items:flex-start;flex-wrap:wrap}.section-ctrl .image-tools{width:100%}}

.color-field{display:flex;align-items:center;gap:8px}
.color-field .input{flex:1;font-family:monospace;font-weight:700}
.color-picker{width:44px;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--bg-input);padding:4px;cursor:pointer;flex-shrink:0}
.color-picker::-webkit-color-swatch-wrapper{padding:0}
.color-picker::-webkit-color-swatch{border:0;border-radius:6px}
.color-picker::-moz-color-swatch{border:0;border-radius:6px}

/* Error */
.error-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:var(--err);font-size:13px;margin-bottom:16px}

/* API Key Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:480px;width:90%}
.modal h2{font-size:20px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text-d);margin-bottom:20px}

/* Image Cuts */
.cuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.cut-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.cut-card.has-result{border-color:var(--primary)}
.cut-label{font-size:13px;font-weight:700;color:var(--primary)}
.cut-preview{width:100%;aspect-ratio:4/3;border-radius:8px;object-fit:cover;background:var(--bg-input);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-m);font-size:12px;overflow:hidden}
.cut-preview img{width:100%;height:100%;object-fit:cover}
.cut-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:auto}
.source-upload{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:var(--bg-card);transition:.2s;margin-bottom:0px;position:relative}
.source-upload:hover{border-color:var(--primary)}
.placement-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.placement-row:last-child{border-bottom:none}
.placement-select{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:12px;font-family:inherit;outline:none}
.cut-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:var(--bg-input)}

/* Automation */
.auto-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.auto-card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.auto-status{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.auto-status.running{background:rgba(34,197,94,.15);color:var(--ok)}
.auto-status.stopped{background:rgba(239,68,68,.15);color:var(--err)}
.auto-status.waiting{background:rgba(245,158,11,.15);color:var(--warn)}
.folder-pick{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;min-height:44px}
.folder-pick:hover{border-color:var(--primary)}
.folder-pick .name{flex:1;font-size:13px;color:var(--text)}
.folder-pick .placeholder{flex:1;font-size:13px;color:var(--text-m)}
.queue-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.queue-item:last-child{border-bottom:none}
.queue-item .q-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.queue-item .q-status.pending{background:var(--text-m)}
.queue-item .q-status.processing{background:var(--warn);animation:pulse 1s infinite}
.queue-item .q-status.done{background:var(--ok)}
.queue-item .q-status.error{background:var(--err)}
.log-box{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.8}
.log-line{color:var(--text-d)}
.log-line.ok{color:var(--ok)}
.log-line.err{color:var(--err)}
.log-line.info{color:var(--cyan)}
.interval-slider{width:100%;accent-color:var(--primary)}

/* Token Tracker */
.token-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:11px;z-index:500;flex-wrap:wrap}
.token-bar .tb-label{color:var(--text-m);white-space:nowrap}

<script>
// ════════════════════════════════════════════════════════════════

const SECTIONS = [
  {n:1,name:"헤더 (Header)",id:"header",purpose:"제품을 깔끔한 화이트톤 배경으로 강조. 제품명을 상단에 크고 임팩트 있게 표시.",desc:"화이트 배경 + 제품 중앙 배치 + 제품명 강조",icon:"🎯"},

  {n:3,name:"핵심 특징 (Key Features)",id:"key_features",purpose:"제품의 핵심 특장점 3~5가지를 아이콘/이미지와 함께 명확하게 전달.",desc:"핵심 특장점 3~5가지 아이콘+텍스트 그리드",icon:"⭐"},
  {n:4,name:"상세 스펙 (Specifications)",id:"specifications",purpose:"제품의 상세 사양, 크기, 재질, 무게 등 구체적인 정보 제공.",desc:"상세 사양 테이블 + 제품 디테일 이미지",icon:"📐"},
  {n:5,name:"사용 시나리오 (Use Scenarios)",id:"use_scenarios",purpose:"다양한 사용 상황을 보여주어 고객이 자신의 라이프스타일에서 제품을 상상할 수 있게 함.",desc:"라이프스타일 이미지 + 사용 상황 텍스트",icon:"🏠"},
  {n:6,name:"비교 우위 (Competitive Edge)",id:"competitive_edge",purpose:"경쟁 제품 대비 우위점을 시각적으로 비교.",desc:"경쟁사 대비 비교표 또는 Before/After",icon:"🏆"},
  {n:7,name:"소재/기술 (Material & Tech)",id:"material_tech",purpose:"사용된 소재의 우수성이나 특허 기술 등을 시각적으로 설명.",desc:"소재/기술력 강조 다크톤 섹션",icon:"🔬"},
  {n:8,name:"인증/수상 (Certifications)",id:"certifications",purpose:"제품이 받은 인증, 수상 내역, 테스트 결과 등으로 신뢰도 구축.",desc:"인증마크/수상내역 배지 나열",icon:"🏅"},
  {n:9,name:"리뷰/후기 (Reviews)",id:"reviews",purpose:"실제 사용자 후기를 활용한 사회적 증거.",desc:"고객 리뷰 카드 레이아웃",icon:"💬"},
  {n:10,name:"크기/컬러 가이드",id:"size_color",purpose:"사이즈 차트, 컬러 옵션 등 선택에 도움되는 정보 제공.",desc:"사이즈표 + 컬러 스와치 옵션",icon:"🎨"},
  {n:11,name:"프로모션 (Promotion)",id:"promotion",purpose:"특별 할인, 세트 구성, 사은품 등 구매 촉진 이벤트 섹션.",desc:"할인/이벤트/세트 구성 프로모션 배너",icon:"🎁"},
  {n:12,name:"배송/포장 (Shipping)",id:"shipping",purpose:"배송 정보, 포장 상태, 언박싱 경험 등을 보여줌.",desc:"배송정보 + 패키징 이미지",icon:"📦"},
  {n:13,name:"FAQ (자주 묻는 질문)",id:"faq",purpose:"고객들이 자주 묻는 질문을 미리 답변하여 구매 불안 해소.",desc:"아코디언 형식 FAQ 섹션",icon:"❓"},
  {n:14,name:"브랜드 스토리",id:"brand_story",purpose:"브랜드의 철학, 스토리, 가치를 전달하여 감성적 연결 형성.",desc:"브랜드 스토리텔링 다크 섹션",icon:"📖"},
  {n:15,name:"CTA 푸터 (Footer)",id:"cta_footer",purpose:"최종 구매 결정을 유도하는 강력한 CTA.",desc:"최종 CTA + 가격 + 구매버튼",icon:"🛒"},
];

// ════════════════════════════════════════════════════════════════
// MODEL CONFIG SYSTEM
// ════════════════════════════════════════════════════════════════
// LLM 프로바이더 및 모델 목록 정의
const LLM_PROVIDERS = {
  gemini: {
    label: 'Google Gemini',
    icon: '✦',
    color: '#6366f1',
    models: [
      { id: 'gemini-2.5-flash',       label: 'Gemini 2.5 Flash',       desc: 'Vertex 권장 기본값',      inputPerM: 0.10,  outputPerM: 0.40  },
      { id: 'gemini-2.5-flash-lite',  label: 'Gemini 2.5 Flash Lite',  desc: '저비용 대량 처리',        inputPerM: 0.075, outputPerM: 0.30  },
      { id: 'gemini-2.5-pro',         label: 'Gemini 2.5 Pro',         desc: '고성능 추론/전략',        inputPerM: 1.25,  outputPerM: 10.00 },
    ],
  },
  openai: {
    label: 'OpenAI ChatGPT',
    icon: '◆',
    color: '#10a37f',
    models: [
      { id: 'gpt-5.4-mini',   label: 'GPT-5.4 mini',   desc: '가성비(기본추천) · 실무 전반',      inputPerM: 0.75,  outputPerM: 4.50  },
      { id: 'gpt-5.4',        label: 'GPT-5.4',        desc: '최고성능 · 복잡한 추론/전략',      inputPerM: 2.50,  outputPerM: 15.00 },
      { id: 'gpt-5.4-nano',   label: 'GPT-5.4 nano',   desc: '최저비용 · 무료티어/대량 처리용',   inputPerM: 0.20,  outputPerM: 1.25  },
      { id: 'gpt-5.3-codex',  label: 'GPT-5.3-Codex',  desc: '코딩특화 · 에이전틱 생성',         inputPerM: 1.75,  outputPerM: 14.00 },
      { id: 'gpt-4.1-nano', label: 'GPT-4.1 nano', desc: '초저비용 · 1M 컨텍스트',    inputPerM: 0.10,  outputPerM: 0.40  },
      { id: 'gpt-4.1-mini', label: 'GPT-4.1 mini', desc: '저비용 · 1M 컨텍스트',      inputPerM: 0.40,  outputPerM: 1.60  },
      { id: 'gpt-4o-mini',  label: 'GPT-4o mini',  desc: '빠름 · 멀티모달',           inputPerM: 0.15,  outputPerM: 0.60  },
    ],
  },
};

// 이미지 생성 모델 목록 (OpenAI + Gemini)
const IMAGE_MODELS = [
  { id: 'gpt-image-2', label: 'OpenAI GPT Image 2', desc: 'OpenAI latest image generation/editing model', inputPerM: 5.00, imageInputPerM: 8.00, outputPerM: 30.00, imageOut: 0, provider: 'openai' },
  { id: 'gpt-image-1.5', label: 'OpenAI GPT Image 1.5', desc: 'High-quality OpenAI image model', inputPerM: 5.00, imageInputPerM: 8.00, outputPerM: 32.00, textOutputPerM: 10.00, imageOut: 0, provider: 'openai' },
  { id: 'gpt-image-1-mini', label: 'OpenAI GPT Image 1 mini', desc: 'Cost-efficient OpenAI image model', inputPerM: 2.00, imageInputPerM: 2.50, outputPerM: 8.00, imageOut: 0, provider: 'openai' },
  { id: 'gemini-3.1-flash-image-preview',       label: '나노바나나2 (Gemini 3.1 Flash Image)', desc: '빠름 · 기본값',  inputPerM: 0.10,  outputPerM: 0.40,  imageOut: 0.02  },
  { id: 'gemini-3-pro-image-preview',       label: 'Gemini 3 Pro Image Preview', desc: '최고품질',  inputPerM: 3.50,  outputPerM: 10.50, imageOut: 0.039 },
  { id: 'gemini-2.5-flash-image', label: 'Gemini 2.5 Flash Image', desc: 'Vertex 권장 대안', inputPerM: 0.10,  outputPerM: 0.40,  imageOut: 0.02  },
];

// 설정 저장/불러오기
function normalizeModelConfig(cfg) {
  const c = { ...(cfg || {}) };
  const provider = c.llmProvider === 'gemini' || c.llmProvider === 'openai' ? c.llmProvider : 'openai';
  c.llmProvider = provider;

  const allowedLlm = (LLM_PROVIDERS[provider]?.models || []).map(m => m.id);
  if (!allowedLlm.includes(c.llmModel)) c.llmModel = allowedLlm[0] || (provider === 'openai' ? 'gpt-5.4-nano' : 'gemini-2.5-flash');

  const allowedImg = IMAGE_MODELS.map(m => m.id);
  if (!allowedImg.includes(c.imageModel)) c.imageModel = allowedImg[0] || 'gemini-3.1-flash-image-preview';

  c.imageSizeMode = c.imageSizeMode === 'custom' ? 'custom' : 'auto';
  const w = Number.parseInt(c.imageWidth, 10);
  c.imageWidth = Number.isFinite(w) ? Math.max(64, Math.min(4096, w)) : 860;
  if (c.imageHeight == null || c.imageHeight === '') {
    c.imageHeight = null;
  } else {
    const h = Number.parseInt(c.imageHeight, 10);
    c.imageHeight = Number.isFinite(h) ? Math.max(64, Math.min(4096, h)) : null;
  }
  c.openaiKey = String(c.openaiKey || '').trim();
  return c;
}

function saveModelConfig(cfg) {
  try {
    const normalized = normalizeModelConfig(cfg);
    normalized.openaiKey = '';
    delete normalized.openaiApiKey;
    localStorage.setItem('model_config', JSON.stringify(normalized));
  } catch(e) {}
}
function loadModelConfig() {
  try {
    const raw = localStorage.getItem('model_config');
    if (raw) return normalizeModelConfig(JSON.parse(raw));
  } catch(e) {}
  return normalizeModelConfig({
    llmProvider: 'openai',
    llmModel: 'gpt-5.4-nano',
    imageModel: 'gemini-3.1-flash-image-preview',
    openaiKey: '',
    imageSizeMode: 'auto',   // 'auto' | 'custom'
    imageWidth: 860,          // px (custom 모드 시 사용)
    imageHeight: null,        // px or null (null = 비율 자동 유지)
  });
}
const OPENAI_KEY_STORAGE_KEY = 'pdp_openai_api_key';
const OPENAI_KEY_LEGACY_STORAGE_KEYS = ['openai_api_key', 'openaiKey', 'OPENAI_API_KEY'];

function saveOpenAIKey(key) {
  const value = String(key || '').trim();
  if (!value) return;
  try {
    localStorage.setItem(OPENAI_KEY_STORAGE_KEY, value);
    OPENAI_KEY_LEGACY_STORAGE_KEYS.forEach(storageKey => localStorage.removeItem(storageKey));
    const cfg = normalizeModelConfig(JSON.parse(localStorage.getItem('model_config') || '{}'));
    cfg.openaiKey = '';
    delete cfg.openaiApiKey;
    localStorage.setItem('model_config', JSON.stringify(cfg));
  } catch(e) {}
}

function loadOpenAIKey() {
  try {
    const current = String(localStorage.getItem(OPENAI_KEY_STORAGE_KEY) || '').trim();
    if (current) return current;
    for (const storageKey of OPENAI_KEY_LEGACY_STORAGE_KEYS) {
      const value = String(localStorage.getItem(storageKey) || '').trim();
      if (value) {
        saveOpenAIKey(value);
        return value;
      }
    }
    const cfg = JSON.parse(localStorage.getItem('model_config') || '{}');
    const migrated = String(cfg.openaiKey || cfg.openaiApiKey || '').trim();
    if (migrated) saveOpenAIKey(migrated);
    return migrated;
  } catch(e) {
    return '';
  }
}

function getRuntimeOpenAIKey() {
  try {
    if (state?.openaiKey) return state.openaiKey;
    const stored = loadOpenAIKey();
    if (stored && state) state.openaiKey = stored;
    return stored;
  } catch(e) {
    return loadOpenAIKey();
  }
}

// ════════════════════════════════════════════════════════════════
// TOKEN / COST TRACKER
// ════════════════════════════════════════════════════════════════
// 가격표를 동적으로 구성 (LLM_PROVIDERS + IMAGE_MODELS 기반)
function buildModelPricing() {
  const pricing = {};
  for (const prov of Object.values(LLM_PROVIDERS)) {
    for (const m of prov.models) {
      pricing[m.id] = { inputPerM: m.inputPerM, outputPerM: m.outputPerM, label: m.label, type: 'text' };
    }
  }
  for (const m of IMAGE_MODELS) {
    pricing[m.id] = { inputPerM: m.inputPerM, outputPerM: m.outputPerM, imageOut: m.imageOut, label: m.label, type: 'image' };
  }
  return pricing;
}
const MODEL_PRICING = buildModelPricing();

function getImageModelMeta(modelId = null) {
  const id = modelId || getImageModel();
  return IMAGE_MODELS.find(m => m.id === id) || null;
}

function getImageProvider(modelId = null) {
  const meta = getImageModelMeta(modelId);
  if (meta?.provider) return meta.provider;
  return (modelId || getImageModel()).startsWith('gpt-image') ? 'openai' : 'gemini';
}

function isOpenAIImageModel(modelId = null) {
  return getImageProvider(modelId) === 'openai';
}

function hasImageConnection(modelId = null) {
  return isOpenAIImageModel(modelId) ? !!getRuntimeOpenAIKey() : hasGeminiConnection();
}

function createImageClient(modelId = null) {
  const imgModel = modelId || getImageModel();
  if (isOpenAIImageModel(imgModel)) {
    const openaiKey = getRuntimeOpenAIKey();
    if (!openaiKey) throw new Error('OpenAI image API 키가 설정되지 않았습니다.');
    return new OpenAIAPI(openaiKey, state.modelConfig.llmModel);
  }
  return createGeminiClient(state.modelConfig.llmModel);
}

function clampOpenAIImageSize(modelId, width, height) {
  if (!width) return 'auto';
  if (modelId === 'gpt-image-2') {
    const w = Math.max(256, Math.min(3840, width));
    const h = Math.max(256, Math.min(3840, height || width));
    return `${w}x${h}`;
  }
  const presets = [
    { id: '1024x1024', w: 1024, h: 1024 },
    { id: '1536x1024', w: 1536, h: 1024 },
    { id: '1024x1536', w: 1024, h: 1536 },
  ];
  const targetW = width;
  const targetH = height || width;
  const targetRatio = targetW / targetH;
  return presets
    .map(p => ({ ...p, score: Math.abs((p.w / p.h) - targetRatio) + Math.abs(p.w - targetW) / 2048 + Math.abs(p.h - targetH) / 2048 }))
    .sort((a, b) => a.score - b.score)[0].id;
}

function getRequestedImageSize(modelId = null) {
  const cfg = state.modelConfig || {};
  if (cfg.imageSizeMode !== 'custom' || !cfg.imageWidth) return 'auto';
  return clampOpenAIImageSize(modelId || getImageModel(), cfg.imageWidth, cfg.imageHeight || null);
}

function dataUrlToBlob(dataUrl) {
  const [header, base64] = String(dataUrl || '').split(',');
  const mime = /data:([^;]+)/.exec(header || '')?.[1] || 'application/octet-stream';
  const binary = atob(base64 || '');
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

function imageSourceToPngDataUrl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    if (!String(src || '').startsWith('data:')) img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/png'));
      } catch(e) {
        reject(new Error('이미지를 편집용 PNG로 변환하지 못했습니다. 원본이 외부 URL이면 CORS 제한일 수 있습니다.'));
      }
    };
    img.onerror = () => reject(new Error('편집할 이미지를 불러오지 못했습니다.'));
    img.src = src;
  });
}

function maskCanvasHasPaint(canvas) {
  if (!canvas) return false;
  const data = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 3; i < data.length; i += 4) {
    if (data[i] > 8) return true;
  }
  return false;
}

function buildTransparentEditMaskDataUrl(maskCanvas) {
  const out = document.createElement('canvas');
  out.width = maskCanvas.width;
  out.height = maskCanvas.height;
  const outCtx = out.getContext('2d', { willReadFrequently: true });
  outCtx.fillStyle = 'rgba(255,255,255,1)';
  outCtx.fillRect(0, 0, out.width, out.height);
  const source = maskCanvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, maskCanvas.width, maskCanvas.height).data;
  const img = outCtx.getImageData(0, 0, out.width, out.height);
  for (let i = 0; i < source.length; i += 4) {
    img.data[i] = 255;
    img.data[i + 1] = 255;
    img.data[i + 2] = 255;
    img.data[i + 3] = source[i + 3] > 8 ? 0 : 255;
  }
  outCtx.putImageData(img, 0, 0);
  return out.toDataURL('image/png');
}

function calcOpenAIImageCost(modelId, usage) {
  const meta = getImageModelMeta(modelId);
  if (!meta || !usage) return null;
  const rawInputTokens = usage.input_tokens || usage.prompt_tokens || 0;
  const rawOutputTokens = usage.output_tokens || usage.image_tokens || 0;
  const inputTextTokens = usage.input_tokens_details?.text_tokens || usage.prompt_tokens_details?.text_tokens || usage.input_text_tokens || rawInputTokens;
  const inputImageTokens = usage.input_tokens_details?.image_tokens || usage.prompt_tokens_details?.image_tokens || usage.input_image_tokens || 0;
  const outputImageTokens = usage.output_tokens_details?.image_tokens || usage.output_image_tokens || rawOutputTokens;
  const outputTextTokens = usage.output_tokens_details?.text_tokens || usage.output_text_tokens || 0;
  let cost = 0;
  cost += (inputTextTokens / 1_000_000) * (meta.inputPerM || 0);
  cost += (inputImageTokens / 1_000_000) * (meta.imageInputPerM || meta.inputPerM || 0);
  cost += (outputImageTokens / 1_000_000) * (meta.outputPerM || 0);
  cost += (outputTextTokens / 1_000_000) * (meta.textOutputPerM || 0);
  return cost;
}

const tokenTracker = {
  sessions: {},      // modelId → { inputTokens, outputTokens, calls, imageCount, costUSD }
  callHistory: [],   // [{ts, model, label, provider, inputTokens, outputTokens, costUSD, op}]
  sessionStart: Date.now(),
  activeTab: 'stats',
  showDetail: false,

  record(modelId, inputTokens, outputTokens, isImage = false, op = '', meta = null) {
    if (!this.sessions[modelId]) {
      this.sessions[modelId] = { inputTokens: 0, outputTokens: 0, calls: 0, imageCount: 0, costUSD: 0 };
    }
    const s = this.sessions[modelId];
    s.inputTokens  += inputTokens  || 0;
    s.outputTokens += outputTokens || 0;
    s.calls++;
    if (isImage) s.imageCount++;

    const p = MODEL_PRICING[modelId];
    // 이번 호출 단건 비용
    let callCost = 0;
    if (meta && Number.isFinite(meta.costUSD)) {
      callCost = meta.costUSD;
    } else if (p) {
      callCost  = ((inputTokens  || 0) / 1_000_000) * p.inputPerM;
      callCost += ((outputTokens || 0) / 1_000_000) * p.outputPerM;
      if (isImage && p.imageOut) callCost += p.imageOut;
    }
    s.costUSD = (s.costUSD || 0) + callCost;

    const provider = modelId.startsWith('gemini') ? 'Gemini' : 'OpenAI';
    this.callHistory.push({
      ts: Date.now(),
      model: modelId,
      label: p?.label || modelId,
      provider,
      inputTokens:  inputTokens  || 0,
      outputTokens: outputTokens || 0,
      costUSD: callCost,
      op: op || (isImage ? '이미지생성' : '텍스트'),
    });
    if (this.callHistory.length > 200) this.callHistory.shift();

    this.save();
    this.renderBar();
  },

  totals() {
    let totalIn = 0, totalOut = 0, totalCost = 0, totalCalls = 0;
    for (const s of Object.values(this.sessions)) {
      totalIn    += s.inputTokens;
      totalOut   += s.outputTokens;
      totalCost  += s.costUSD;
      totalCalls += s.calls;
    }
    return { totalIn, totalOut, totalCost, totalCalls };
  },

  sessionTotals() {
    let sIn = 0, sOut = 0, sCost = 0, sCalls = 0, gCost = 0, oCost = 0;
    for (const h of this.callHistory) {
      if (h.ts >= this.sessionStart) {
        sIn    += h.inputTokens;
        sOut   += h.outputTokens;
        sCost  += h.costUSD;
        sCalls++;
        if (h.provider === 'Gemini') gCost += h.costUSD;
        else oCost += h.costUSD;
      }
    }
    return { sIn, sOut, sCost, sCalls, gCost, oCost };
  },

  save() {
    try {
      localStorage.setItem('token_tracker', JSON.stringify(this.sessions));
      localStorage.setItem('token_history', JSON.stringify(this.callHistory.slice(-100)));
    } catch(e) {}
  },

  load() {
    try {
      const raw = localStorage.getItem('token_tracker');
      if (raw) this.sessions = JSON.parse(raw);
      const hist = localStorage.getItem('token_history');
      if (hist) this.callHistory = JSON.parse(hist);
    } catch(e) {}
  },

  reset() {
    this.sessions = {};
    this.callHistory = [];
    this.sessionStart = Date.now();
    try {
      localStorage.removeItem('token_tracker');
      localStorage.removeItem('token_history');
    } catch(e) {}
    this.renderBar();
  },

  renderBar() {
    let bar = document.getElementById('tokenBar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'tokenBar';
      bar.className = 'token-bar';
      document.body.appendChild(bar);
    }

    const { totalCost } = this.totals();
    const { sIn, sOut, sCost, sCalls, gCost, oCost } = this.sessionTotals();
    const fmtN   = n => n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n);
    const fmtUSD = d => d < 0.0001 ? '$0.0000' : '$' + d.toFixed(4);
    const fmtKRW = d => '≈₩' + Math.round(d * 1380).toLocaleString();

    const lastCall = this.callHistory[this.callHistory.length - 1];
    const lastLabel = lastCall?.label || '-';
    const lastOp    = lastCall?.op    || '';
    const isImg = lastCall && MODEL_PRICING[lastCall.model]?.type === 'image';
    const hasCumul = totalCost > 0 && Math.abs(sCost - totalCost) > 0.00005;

    bar.innerHTML = `
      <span class="tb-label">💰 세션비용</span>
      <span class="tb-cost tb-animate" id="tbCostSession">${fmtUSD(sCost)}</span>
      <span style="color:var(--warn);font-family:monospace;font-size:10px;font-weight:700">${fmtKRW(sCost)}</span>
      ${hasCumul ? `<span class="sep">│</span><span class="tb-label">누적</span><span class="tb-cost" style="opacity:.55">${fmtUSD(totalCost)}</span>` : ''}
      ${gCost > 0.00001 ? `<span class="tb-provider g-badge" title="Gemini">G ${fmtUSD(gCost)}</span>` : ''}
      ${oCost > 0.00001 ? `<span class="tb-provider o-badge" title="OpenAI">O ${fmtUSD(oCost)}</span>` : ''}
      <span class="sep">│</span>
      <span class="tb-label">토큰</span>
      <span class="tb-val">${fmtN(sIn)}↑ ${fmtN(sOut)}↓</span>
      <span class="sep">│</span>
      <span class="tb-label">호출</span>
      <span class="tb-val">${sCalls}회</span>
      ${lastCall ? `
        <span class="sep">│</span>
        ${lastOp ? `<span class="tb-op-badge">${lastOp}</span>` : ''}
        <span class="tb-model ${isImg?'m-img':'m-flash'}">${lastLabel}</span>
        <span class="tb-call-cost">+${fmtUSD(lastCall.costUSD)}</span>
      ` : ''}
      <span class="sep">│</span>
      <button class="token-detail-btn" id="tbDetailBtn">내역 ▲</button>
      <button class="tb-reset" id="tbResetBtn">초기화</button>
    `;

    const main = document.querySelector('.main');
    if (main) main.style.paddingBottom = '52px';

    // 신규 호출 시 flash
    const el = document.getElementById('tbCostSession');
    if (el && sCalls > 0) { el.classList.remove('tb-animate'); void el.offsetWidth; el.classList.add('tb-animate'); }

    document.getElementById('tbDetailBtn')?.addEventListener('click', () => {
      this.showDetail = !this.showDetail;
      this.renderDetail();
    });
    document.getElementById('tbResetBtn')?.addEventListener('click', () => {
      if (confirm('토큰 사용 기록을 초기화할까요?')) this.reset();
    });
  },

  renderDetail() {
    let modal = document.getElementById('tokenModal');
    if (!this.showDetail) { modal?.remove(); return; }

    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'tokenModal';
      modal.className = 'token-modal';
      document.body.appendChild(modal);
    }

    const fmtUSD = d => '$' + d.toFixed(5);
    const fmtKRW = d => '₩' + Math.round(d * 1380).toLocaleString();
    const fmtN   = n => n.toLocaleString();

    // 모델별 통계 탭
    let rows = '';
    for (const [modelId, s] of Object.entries(this.sessions)) {
      const p   = MODEL_PRICING[modelId];
      const lbl = p?.label || modelId;
      const typ = p?.type  || 'text';
      rows += `
        <div class="token-row">
          <div>
            <div style="font-weight:600">${lbl}</div>
            <div class="model-name">${modelId}</div>
          </div>
          <div style="text-align:right;font-size:11px;line-height:1.8">
            <div>입력 <b>${fmtN(s.inputTokens)}</b> tok</div>
            <div>출력 <b>${fmtN(s.outputTokens)}</b> tok</div>
            ${typ==='image' ? `<div>이미지 <b>${s.imageCount}</b>장</div>` : ''}
            <div>호출 <b>${s.calls}</b>회</div>
            <div style="color:var(--ok);font-weight:700">${fmtUSD(s.costUSD)} ${fmtKRW(s.costUSD)}</div>
          </div>
        </div>`;
    }

    // 호출 이력 탭 (최신 50건)
    const recent = [...this.callHistory].reverse().slice(0, 50);
    let histRows = '';
    for (const h of recent) {
      const t = new Date(h.ts);
      const timeStr = t.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      const isSess  = h.ts >= this.sessionStart;
      histRows += `
        <tr class="${isSess ? 'hist-session' : 'hist-old'}">
          <td>${timeStr}</td>
          <td><span class="hist-op">${h.op||'-'}</span></td>
          <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${h.label}">${h.label}</td>
          <td style="font-family:monospace">${fmtN(h.inputTokens)}</td>

          <td style="color:var(--ok);font-weight:600;font-family:monospace">${fmtUSD(h.costUSD)}</td>
        </tr>`;
    }

    const { totalCost } = this.totals();
    const { sCost, sCalls } = this.sessionTotals();
    const tab = this.activeTab;

    modal.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">📊 API 사용량 실시간 추적</h3>
        <span style="cursor:pointer;font-size:18px;color:var(--text-m)" id="closeTokenModal">✕</span>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="token-tab-btn ${tab==='stats'?'active':''}" data-ttab="stats">모델별 통계</button>
        <button class="token-tab-btn ${tab==='history'?'active':''}" data-ttab="history">호출 이력 (${this.callHistory.length})</button>
      </div>
      ${tab === 'stats' ? `
        ${rows || '<div style="color:var(--text-m);font-size:13px;padding:16px 0">아직 API 호출 없음</div>'}
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700">
            <span>누적 총 비용</span>
            <span style="color:var(--ok)">${fmtUSD(totalCost)} (${fmtKRW(totalCost)})</span>
          </div>
          ${sCalls > 0 ? `
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:var(--primary-h)">
              <span>이번 세션 (${sCalls}회)</span>
              <span>${fmtUSD(sCost)} (${fmtKRW(sCost)})</span>
            </div>` : ''}
        </div>
      ` : `
        <div style="overflow-y:auto;max-height:360px">
          <table class="hist-table">
            <thead><tr>
              <th>시간</th><th>작업</th><th>모델</th><th>입력↑</th><th>출력↓</th><th>비용</th>
            </tr></thead>
            <tbody>${histRows || '<tr><td colspan="6" style="text-align:center;color:var(--text-m);padding:20px">이력 없음</td></tr>'}</tbody>
          </table>
        </div>
        <div style="margin-top:8px;font-size:11px;color:var(--text-m)">
          이번 세션(밝은 색) / 이전 세션(흐린 색) · 최근 ${this.callHistory.length}건
        </div>
      `}
      <div style="margin-top:8px;font-size:10px;color:var(--text-d)">
        * 환율 1USD = 1,380원 기준 | 공식 API 가격 기준 (변동 가능)
      </div>
    `;

    document.getElementById('closeTokenModal')?.addEventListener('click', () => {
      this.showDetail = false;
      modal.remove();
    });
    modal.querySelectorAll('[data-ttab]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.activeTab = btn.dataset.ttab;
        this.renderDetail();
      });
    });
  },
};

class GeminiAPI {
  constructor(apiKeyOrOptions, model) {
    const isObject = apiKeyOrOptions && typeof apiKeyOrOptions === 'object';
    this.apiKey = isObject ? (apiKeyOrOptions.apiKey || '') : (apiKeyOrOptions || '');
    this.model = isObject
      ? (apiKeyOrOptions.model || model || 'gemini-2.5-flash')
      : (model || 'gemini-2.5-flash');
    this.backendBaseUrl = (isObject ? apiKeyOrOptions.backendBaseUrl : '') || '';
    this.baseUrl = 'https://generativelanguage.googleapis.com/v1beta';
  }

  _normalizeBackendUrl() {
    return (this.backendBaseUrl || '').replace(/\/+$/, '');
  }

  _hasBackendRoute() {
    return !!this._normalizeBackendUrl();
  }

  async _generateContent(model, body) {
    if (this._hasBackendRoute()) {
      const backendUrl = this._normalizeBackendUrl();
      const res = await fetch(`${backendUrl}/api/gemini/generate-content`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, ...body }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data?.error?.message || data?.error || `HTTP ${res.status}`);
      return data;
    }

    if (!this.apiKey) {
      throw new Error('Gemini API key is required when backend URL is not set.');
    }

    const res = await fetch(`${this.baseUrl}/models/${model}:generateContent?key=${this.apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data?.error?.message || data?.error || `HTTP ${res.status}`);
    return data;
  }

  async analyzeImage(imageBase64, mimeType) {
    const prompt = `You are a professional e-commerce product analyst. Analyze this product image in extreme detail.
Return a JSON object with the following fields:
{
    "product_name": "detected product name in Korean",
    "product_name_en": "detected product name in English",
    "category": "product category",
    "brand": "brand name if visible",
    "colors": ["list of colors detected"],
    "materials": ["detected or estimated materials"],
    "shape": "product shape description",
    "size_estimate": "estimated size",
    "key_features": ["list of 5-10 key features"],
    "target_audience": "target customer demographic",
    "price_range_estimate": "estimated price range in KRW",
    "mood": "overall mood/aesthetic of the product",
    "use_cases": ["list of use cases"],
    "selling_points": ["list of unique selling points"],
    "style_keywords": ["style-related keywords for design"],
    "complementary_colors": ["colors that complement the product"],
    "text_color_recommendation": "recommended text color for overlay",
    "detailed_description": "A detailed Korean description for marketing",
    "reasoning": {
        "product_name_basis": "한 문장으로: 제품명을 어떻게 판단했는지 (이미지 텍스트 인식인지, 형태 추론인지)",
        "category_basis": "한 문장으로: 카테고리를 어떻게 분류했는지",
        "price_basis": "한 문장으로: 가격대를 어떻게 추정했는지 (소재·마감·브랜드 등 근거)",
        "material_basis": "한 문장으로: 소재를 어떻게 판단했는지 (텍스처·광택·색감 등)",
        "target_basis": "한 문장으로: 타겟 고객을 어떻게 추정했는지",
        "confidence": "overall|high|medium|low — 이미지 품질·정보량 기준 전체 분석 신뢰도"
    }
}
Respond ONLY with the JSON object, no other text.`;

    const body = {
      contents: [{
        parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: imageBase64 } }
        ]
      }],
      generationConfig: { temperature: 0.3, maxOutputTokens: 4096 }
    };

    const data = await this._generateContent(this.model, body);
    tokenTracker.record(this.model, data.usageMetadata?.promptTokenCount, data.usageMetadata?.candidatesTokenCount, false, '제품분석');
    let text = data.candidates[0].content.parts[0].text.trim();
    text = text.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'');
    return applyBrandPresetToContent(JSON.parse(text));
  }

    const brandBlock = buildBrandPromptBlock();

    const prompt = `You are a Korean e-commerce detail page content creator.

Section to create: ${sectionDef.name}
Section number: ${sectionDef.n}
Section purpose: ${sectionDef.purpose}
User custom instructions: ${customInstructions || 'None'}

${layoutBlock}
Based on the product analysis, generate content for this section.

// IMAGE RESIZE HELPER (Canvas API — 정확한 픽셀 강제)
// ════════════════════════════════════════════════════════════════
function resizeImageDataUrl(dataUrl, targetW, targetH) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const ratio = img.naturalWidth / img.naturalHeight;
        const w = Math.round(targetW);
        // targetH가 null이면 가로/세로 비율 유지
        const h = (targetH != null) ? Math.round(targetH) : Math.round(w / ratio);
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        // 선명한 렌더링을 위해 이중 패스 다운스케일
        if (img.naturalWidth > w * 2 || img.naturalHeight > h * 2) {
          const tmp = document.createElement('canvas');
          tmp.width = Math.round(img.naturalWidth / 2);
          tmp.height = Math.round(img.naturalHeight / 2);
          tmp.getContext('2d').drawImage(img, 0, 0, tmp.width, tmp.height);
          ctx.drawImage(tmp, 0, 0, w, h);
        } else {
          ctx.drawImage(img, 0, 0, w, h);
        }
        resolve(canvas.toDataURL('image/png'));
      } catch(e) {
        // 리사이즈 실패 시 원본 반환
        console.warn('resizeImageDataUrl failed, using original:', e);
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl); // 로드 실패 시 원본 반환
    img.src = dataUrl;
  });
}

// 현재 설정에 따라 이미지를 리사이즈 (auto 모드면 그냥 반환)
async function applyImageSizeConfig(dataUrl) {
  const cfg = state.modelConfig;
  if (!dataUrl || cfg.imageSizeMode !== 'custom' || !cfg.imageWidth) return dataUrl;
  return resizeImageDataUrl(dataUrl, cfg.imageWidth, cfg.imageHeight || null);
}

// OPENAI API SERVICE
// ════════════════════════════════════════════════════════════════
class OpenAIAPI {
  constructor(apiKey, model) {
    this.apiKey = apiKey;
    this.model = model || 'gpt-4o-mini';
    this.baseUrl = 'https://api.openai.com/v1';
  }

  // JSON 응답 파싱 헬퍼
  _parseJSON(text) {
    text = text.trim().replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'');
    return JSON.parse(text);
  }

  async generateImage(prompt, productImageBase64, mimeType, imageModel, extraImages = []) {
    const imgModel = imageModel || getImageModel();
    const requestedSize = getRequestedImageSize(imgModel);
    const outputFormat = 'png';
    const activeDirectives = getEffectiveImageDirectives();
    const directiveStr = activeDirectives.length > 0
      ? `\n\nCRITICAL CONSTRAINTS - follow exactly:\n${activeDirectives.map((d, i) => `${i + 1}. ${d}`).join('\n')}`
      : '';
    const brandBlock = buildBrandPromptBlock();
    const layoutBlock = buildLayoutPromptBlock();
    const fullPrompt = `Create a professional Korean e-commerce product detail page section image. ${prompt}${directiveStr}\n${brandBlock}\n${layoutBlock}`;
    const refs = [];
    if (productImageBase64) refs.push({ base64: productImageBase64, mime: mimeType || 'image/png' });
    for (const img of extraImages || []) {
      if (img?.base64) refs.push({ base64: img.base64, mime: img.mime || 'image/png' });
    }

    let data;
    if (refs.length > 0) {
      const form = new FormData();
      form.append('model', imgModel);
      form.append('prompt', fullPrompt);
      form.append('size', requestedSize);
      form.append('quality', 'auto');
      form.append('output_format', outputFormat);
      form.append('moderation', 'auto');
      refs.forEach((img, idx) => {
        const blob = dataUrlToBlob(`data:${img.mime};base64,${img.base64}`);
        form.append('image[]', blob, `reference-${idx + 1}.png`);
      });
      const res = await fetch(`${this.baseUrl}/images/edits`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${this.apiKey}` },
        body: form
      });
      data = await res.json();
    } else {
      const res = await fetch(`${this.baseUrl}/images/generations`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${this.apiKey}`
        },
        body: JSON.stringify({
          model: imgModel,
          prompt: fullPrompt,
          size: requestedSize,
          quality: 'auto',
          output_format: outputFormat,
          moderation: 'auto',
          n: 1,
        })
      });
      data = await res.json();
    }

    if (data.error) throw new Error(data.error.message);
    const usage = data.usage || null;
    tokenTracker.record(
      imgModel,
      usage?.input_tokens,
      usage?.output_tokens,
      true,
      '이미지생성',
      usage ? { costUSD: calcOpenAIImageCost(imgModel, usage) } : null
    );

    const first = data.data?.[0];
    if (!first) return null;
    if (first.b64_json) {
      return await applyImageSizeConfig(`data:image/${data.output_format || outputFormat};base64,${first.b64_json}`);
    }
    if (first.url) return first.url;
    return null;
  }

  async editImageWithMask(imageDataUrl, maskDataUrl, prompt, imageModel) {
    const imgModel = imageModel || getImageModel();
    const outputFormat = 'png';
    const form = new FormData();
    form.append('model', imgModel);
    form.append('prompt', prompt);
    form.append('image', dataUrlToBlob(imageDataUrl), 'source.png');
    form.append('mask', dataUrlToBlob(maskDataUrl), 'mask.png');

function getLLMClient() {
  const cfg = normalizeModelConfig(state.modelConfig);
  state.modelConfig = cfg;
  if (cfg.llmProvider === 'openai') {
    const openaiKey = getRuntimeOpenAIKey();
    if (!openaiKey) throw new Error('OpenAI API 키가 설정되지 않았습니다. 모델 설정에서 입력해주세요.');
    return new OpenAIAPI(openaiKey, cfg.llmModel);
  }
  if (!hasGeminiConnection()) throw new Error('Gemini 연결 설정(API Key 또는 Backend URL)이 필요합니다.');
  return createGeminiClient(cfg.llmModel);
}

function hasGeminiConnection() {
  return !!((state.backendBaseUrl && state.backendBaseUrl.trim()) || state.apiKey);
}

function createGeminiClient(model) {
  return new GeminiAPI({
    apiKey: state.apiKey,
    model: model || state.modelConfig.llmModel,
    backendBaseUrl: state.backendBaseUrl,
  });
}

function getImageModel() {
  return state.modelConfig.imageModel || 'gemini-3.1-flash-image-preview';
}

async function generateWithSelectedImageModel(prompt, productImageBase64, mimeType, extraImages = []) {
  const imageModel = getImageModel();
  if (!hasImageConnection(imageModel)) return null;
  const client = createImageClient(imageModel);
  return client.generateImage(prompt, productImageBase64, mimeType, imageModel, extraImages);
}

function cssFontFamily(value, fallback = "'Pretendard','Noto Sans KR',sans-serif") {
  const raw = String(value || '').trim();
  if (!raw) return fallback;
  // Prevent style-break/injection while allowing Korean/space/comma font names.
  const cleaned = raw.replace(/[<>`\\]/g, '').replace(/;/g, '').trim();
  if (!cleaned) return fallback;
  if (cleaned.includes(',') || /^['"].*['"]$/.test(cleaned)) return cleaned;
  return `'${cleaned}'`;
}

function loadJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}

function saveJson(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function cloneData(value) {
  if (value == null) return value;
  return JSON.parse(JSON.stringify(value));
}

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function normalizeHexColor(value) {
  const raw = String(value || '').trim();
  const match = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(raw);
  if (!match) return '';
  const hex = match[1];
  const full = hex.length === 3 ? hex.split('').map(ch => ch + ch).join('') : hex;
  return `#${full.toLowerCase()}`;
}

function colorInputValue(value, fallback = '#000000') {
  return normalizeHexColor(value) || fallback;
}

function nl2br(value) {
  return escapeHtml(value).replace(/\n/g, '<br>');
}

function summarizeText(value, limit = 90) {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  if (!text) return '';
  return text.length > limit ? `${text.slice(0, limit - 1)}…` : text;
}

function idbRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('IndexedDB request failed'));
  });
}

function idbDone(tx) {
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
    tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
  });
}

function ensureWorkspaceDbStores(db) {
  if (!db.objectStoreNames.contains(WORKSPACE_DB.projects)) {
    db.createObjectStore(WORKSPACE_DB.projects, { keyPath: 'id' });
  }
  if (!db.objectStoreNames.contains(WORKSPACE_DB.snapshots)) {
    const store = db.createObjectStore(WORKSPACE_DB.snapshots, { keyPath: 'id' });
    store.createIndex('projectId', 'projectId', { unique: false });
    store.createIndex('createdAt', 'createdAt', { unique: false });
  }
  if (!db.objectStoreNames.contains(WORKSPACE_DB.sessionAssets)) {
    db.createObjectStore(WORKSPACE_DB.sessionAssets, { keyPath: 'id' });
  }
}

function workspaceDbHasRequiredStores(db) {
  return [WORKSPACE_DB.projects, WORKSPACE_DB.snapshots, WORKSPACE_DB.sessionAssets]
    .every(storeName => db.objectStoreNames.contains(storeName));
}

async function openWorkspaceDb() {
  if (!('indexedDB' in window)) throw new Error('IndexedDB unavailable');
  if (openWorkspaceDb._db && workspaceDbHasRequiredStores(openWorkspaceDb._db)) return openWorkspaceDb._db;
  if (openWorkspaceDb._db) {
    openWorkspaceDb._db.close();
    openWorkspaceDb._db = null;
  }
  const request = indexedDB.open(WORKSPACE_DB.name, WORKSPACE_DB.version);
  request.onupgradeneeded = () => {
    ensureWorkspaceDbStores(request.result);
  };
  let db = await idbRequest(request);
  if (!workspaceDbHasRequiredStores(db)) {
    const nextVersion = db.version + 1;
    db.close();
    const repairRequest = indexedDB.open(WORKSPACE_DB.name, nextVersion);
    repairRequest.onupgradeneeded = () => {
      ensureWorkspaceDbStores(repairRequest.result);
    };
    db = await idbRequest(repairRequest);
  }
  db.onversionchange = () => {
    db.close();
    openWorkspaceDb._db = null;
  };
  openWorkspaceDb._db = db;
  return openWorkspaceDb._db;
}

async function workspaceGet(storeName, key) {
  const db = await openWorkspaceDb();
  const tx = db.transaction(storeName, 'readonly');
  const result = await idbRequest(tx.objectStore(storeName).get(key));
  await idbDone(tx);
  return result;
}

async function workspaceGetAll(storeName) {
  const db = await openWorkspaceDb();
  const tx = db.transaction(storeName, 'readonly');
  const result = await idbRequest(tx.objectStore(storeName).getAll());
  await idbDone(tx);
  return result;
}

async function workspacePut(storeName, value) {
  const db = await openWorkspaceDb();
  const tx = db.transaction(storeName, 'readwrite');
  tx.objectStore(storeName).put(value);
  await idbDone(tx);
}

async function workspaceDelete(storeName, key) {
  const db = await openWorkspaceDb();
  const tx = db.transaction(storeName, 'readwrite');
  tx.objectStore(storeName).delete(key);
  await idbDone(tx);
}

const SESSION_ASSET_ID = 'current';
let sessionAssetSaveTimer = null;
let lastLightweightSessionPayload = null;

function stripDetailBlockImages(blocks) {
  return (Array.isArray(blocks) ? blocks : []).map(block => {
    const copy = { ...block };
    if (copy.dataUrl) copy.hasDataUrl = true;
    delete copy.dataUrl;
    return copy;
  });
}

function stripVariantImages(sectionVariants = {}) {
  const result = {};
  for (const [sectionId, variants] of Object.entries(sectionVariants || {})) {
    result[sectionId] = (Array.isArray(variants) ? variants : []).map(variant => ({
      ...variant,
      hasImage: !!variant.image || !!variant.hasImage,
      image: null,
    }));
  }
  return result;
}

function stripAiRepairUndoImages(undoStack = {}) {
  const result = {};
  for (const [sectionId, stack] of Object.entries(undoStack || {})) {
    result[sectionId] = (Array.isArray(stack) ? stack : []).map(item => ({
      ...item,
      hasImage: !!item.image || !!item.hasImage,
      image: null,
    }));
  }
  return result;
}

function buildLightweightSessionPayload(payload) {
  return {
    ...payload,
    imagePreview: payload.imagePreview ? '__stored_in_indexeddb__' : null,
    sectionVariants: stripVariantImages(payload.sectionVariants),
    detailImageBlocks: stripDetailBlockImages(payload.detailImageBlocks),
    aiRepairUndoStack: stripAiRepairUndoImages(payload.aiRepairUndoStack),
  };
}

function currentSessionAssetsPayload() {
  return {
    id: SESSION_ASSET_ID,
    imagePreview: state.imagePreview || null,
    imageBase64: state.imageBase64 || null,
    sectionImages: cloneData(state.sectionImages || {}),
    detailImageBlocks: cloneData(state.detailImageBlocks || []),
    sectionVariants: cloneData(state.sectionVariants || {}),
    aiRepairUndoStack: cloneData(state.aiRepairUndoStack || {}),
    savedAt: Date.now(),
  };
}

async function saveSessionAssetsToDb() {
  let clearedWarning = false;
  try {
    await workspacePut(WORKSPACE_DB.sessionAssets, currentSessionAssetsPayload());
    localStorage.removeItem('pdp_session_img');
    localStorage.removeItem('pdp_session_imgs');
    localStorage.removeItem('pdp_detail_image_blocks');
    if (lastLightweightSessionPayload) {
      try {
        localStorage.setItem('pdp_session', JSON.stringify(lastLightweightSessionPayload));
      } catch(e) {
        console.warn('Session metadata retry failed:', e);
        state.storageWarning = '이미지는 IndexedDB에 저장됐지만 세션 정보 저장 공간이 부족합니다. 프로젝트 저장을 눌러 안전하게 보존해주세요.';
        if (typeof render === 'function') render();
        return;
      }
    }
    if (state.storageWarning && state.storageWarning.includes('이미지 저장')) {
      state.storageWarning = '';
      clearedWarning = true;
    }
    if (state.storageWarning && state.storageWarning.includes('세션 저장')) {
      state.storageWarning = '';
      clearedWarning = true;
    }
  } catch(e) {
    console.warn('Session asset save failed:', e);
    state.storageWarning = '이미지 저장소 저장에 실패했습니다. 현재 화면은 유지되지만, 새로고침 전에 프로젝트 저장을 한 번 눌러주세요.';
    if (typeof render === 'function') render();
    return;
  }
  if (clearedWarning && typeof render === 'function') render();
}

function scheduleSessionAssetSave() {
  if (sessionAssetSaveTimer) clearTimeout(sessionAssetSaveTimer);
  sessionAssetSaveTimer = setTimeout(() => {
    sessionAssetSaveTimer = null;
    saveSessionAssetsToDb().catch(() => {});
  }, 250);
}

async function hydratePersistentSessionAssets() {
  try {
    const assets = await workspaceGet(WORKSPACE_DB.sessionAssets, SESSION_ASSET_ID);
    if (!assets) return;
    let changed = false;
    if (assets.imagePreview && state.imagePreview !== assets.imagePreview) {
      state.imagePreview = assets.imagePreview;
      changed = true;
    }
    if (assets.imageBase64 && state.imageBase64 !== assets.imageBase64) {
      state.imageBase64 = assets.imageBase64;
      changed = true;
    }
    if (assets.sectionImages && typeof assets.sectionImages === 'object') {
      state.sectionImages = assets.sectionImages;
      changed = true;
    }
    if (Array.isArray(assets.detailImageBlocks)) {
      state.detailImageBlocks = assets.detailImageBlocks;
      changed = true;
    }
    if (assets.sectionVariants && typeof assets.sectionVariants === 'object') {
      state.sectionVariants = assets.sectionVariants;
      changed = true;
    }
    if (assets.aiRepairUndoStack && typeof assets.aiRepairUndoStack === 'object') {
      state.aiRepairUndoStack = assets.aiRepairUndoStack;
      changed = true;
    }
    if (changed) render();
  } catch(e) {
    console.warn('Session asset hydrate failed:', e);
    if (state.step !== 'upload') {
      state.storageWarning = '저장된 이미지 복원에 실패했습니다. 프로젝트 저장본이 있다면 작업공간에서 다시 불러올 수 있습니다.';
      render();
    }
  }
}

function expireCookie(name) {
  try { document.cookie = `${name}=;max-age=0;path=/;SameSite=Lax`; } catch(e) {}
}

function saveKey(key) {
  try { localStorage.setItem('gemini_api_key', key); } catch(e) {}
  expireCookie('gemini_api_key');
}
function loadKey() {
  let k = '';
  try { k = localStorage.getItem('gemini_api_key') || ''; } catch(e) {}
  if (!k) {
    try {
      const m = document.cookie.match(/gemini_api_key=([^;]+)/);
      if (m) {
        k = decodeURIComponent(m[1]);
        if (k) localStorage.setItem('gemini_api_key', k);
        expireCookie('gemini_api_key');
      }
    } catch(e) {}
  }
  return k;
}

function saveBackendUrl(url) {
  try { localStorage.setItem('gemini_backend_url', url || ''); } catch(e) {}
}

function loadBackendUrl() {
  try {
    const stored = localStorage.getItem('gemini_backend_url') || '';
    // 4000은 sachyosangse API (pdp 전용) — GeminiClient backendUrl로 쓰면 안 됨, 5050으로 리셋
    if (!stored || stored.includes(':4000')) {
      localStorage.setItem('gemini_backend_url', 'http://127.0.0.1:5050');
      return 'http://127.0.0.1:5050';
    }
    return stored;
  } catch(e) { return 'http://127.0.0.1:5050'; }
}

function defaultServerAutomationApiBase() {
  return 'http://127.0.0.1:4000/v1';
}

function normalizeServerAutomationApiBase(url) {
  let base = (url || '').trim();
  if (!base) return defaultServerAutomationApiBase();
  base = base.replace(/\/+$/, '');
  if (!/\/v1$/i.test(base)) base += '/v1';
  return base;
}

function loadServerAutomationApiBase() {
  try {
    const stored = localStorage.getItem('server_auto_api_base') || '';
    // migrate: if stored value points to wrong port (5050), reset to default
    if (stored.includes(':5050')) {
      localStorage.removeItem('server_auto_api_base');
      return defaultServerAutomationApiBase();
    }
    return normalizeServerAutomationApiBase(stored);
  } catch(e) {
    return 'http://127.0.0.1:4000/v1';
  }
}

function loadDraftCuts() {
  try {
    const raw = localStorage.getItem('server_cuts_draft');
    if (!raw) return Array.from({length: 10}, () => ({label: '', prompt: ''}));
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return Array.from({length: 10}, () => ({label: '', prompt: ''}));
    const arr = parsed.slice(0, 10).map(item => ({
      label: String(item?.label || ''),
      prompt: String(item?.prompt || '')
    }));
    while (arr.length < 10) arr.push({label: '', prompt: ''});
    return arr;
  } catch(e) {
    return Array.from({length: 10}, () => ({label: '', prompt: ''}));
  }
}

function saveDraftCuts(cuts) {
  try { localStorage.setItem('server_cuts_draft', JSON.stringify(cuts)); } catch(e) {}
}

function saveServerAutomationApiBase(url) {
  const normalized = normalizeServerAutomationApiBase(url);
  try { localStorage.setItem('server_auto_api_base', normalized); } catch(e) {}
  return normalized;
}

function assertServerAutomationApiBaseAllowed(base) {
  const isHttpsPage = typeof window !== 'undefined' && window.location?.protocol === 'https:';
  if (isHttpsPage && /^http:\/\//i.test(base)) {
    throw new Error('HTTPS 페이지에서는 http:// 자동화 API 호출이 차단됩니다. https:// 엔드포인트를 사용하거나 localhost 앱(start.bat)으로 실행하세요.');
  }
}

function savePersistentState() {
  let payload = null;
  try {
    payload = {
      step: state.step,
      analysis: state.analysis,
      competitorData: state.competitorData,
      sectionContents: state.sectionContents,
      imagePreview: state.imagePreview,
      imageMime: state.imageMime,
      productName: state.productName,
      analysisTimestamp: state.analysisTimestamp,
      currentProjectId: state.currentProjectId,
      currentProjectName: state.currentProjectName,
      currentProjectCreatedAt: state.currentProjectCreatedAt,
      sectionLocks: state.sectionLocks,
      sectionVariants: state.sectionVariants,
      currentSectionVariantIds: state.currentSectionVariantIds,
      aiRepairUndoStack: state.aiRepairUndoStack,
      manualSectionEdits: state.manualSectionEdits,
      previewLayerEdits: state.previewLayerEdits,
      detailImageBlocks: state.detailImageBlocks,
      layoutTemplate: state.layoutTemplate,
      activeBrandPresetId: state.activeBrandPresetId,
      contentVersion: state.contentVersion,
      qaVersion: state.qaVersion,
      compPage: {
        analysisResult: state.compPage.analysisResult,
        sectionPlan: state.compPage.sectionPlan,
        planEdits: state.compPage.planEdits,
      },
    };
    lastLightweightSessionPayload = buildLightweightSessionPayload(payload);
    localStorage.setItem('pdp_session', JSON.stringify(lastLightweightSessionPayload));
    if (state.storageWarning && state.storageWarning.includes('세션 저장')) state.storageWarning = '';
  } catch(e) {
    console.warn('Session metadata save failed:', e);
    state.storageWarning = '세션 저장 공간이 부족합니다. 큰 이미지는 IndexedDB에 저장을 시도 중이지만, 프로젝트 저장도 함께 눌러두는 편이 안전합니다.';
  }
  scheduleSessionAssetSave();
}
function loadPersistentSession() {
  try {
    const raw = localStorage.getItem('pdp_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    // 과도기 step → 안전한 step으로 정규화
    if (s.step === 'analyzing') s.step = 'sections';
    if (s.step === 'generating') s.step = Object.keys(s.sectionContents||{}).length > 0 ? 'preview' : 'sections';
    if (s.imagePreview === '__stored_in_indexeddb__') s.imagePreview = null;
    s.imageBase64 = localStorage.getItem('pdp_session_img') || null;
    try { s.sectionImages = JSON.parse(localStorage.getItem('pdp_session_imgs') || '{}'); } catch(e) { s.sectionImages = {}; }
    s.currentProjectId = s.currentProjectId || '';
    s.currentProjectName = s.currentProjectName || '';
    s.currentProjectCreatedAt = s.currentProjectCreatedAt || null;
    s.sectionLocks = s.sectionLocks || {};
    s.sectionVariants = s.sectionVariants || {};
    s.currentSectionVariantIds = s.currentSectionVariantIds || {};
    s.aiRepairUndoStack = s.aiRepairUndoStack || {};
    s.manualSectionEdits = s.manualSectionEdits || {};
    s.previewLayerEdits = s.previewLayerEdits || {};
    try { s.detailImageBlocks = JSON.parse(localStorage.getItem('pdp_detail_image_blocks') || JSON.stringify(s.detailImageBlocks || [])); } catch(e) { s.detailImageBlocks = []; }
    s.layoutTemplate = LAYOUT_TEMPLATES.some(t => t.id === s.layoutTemplate) ? s.layoutTemplate : loadLayoutTemplate();
    s.activeBrandPresetId = typeof s.activeBrandPresetId === 'string' ? s.activeBrandPresetId : loadActiveBrandPresetId();
    s.contentVersion = Number.isFinite(s.contentVersion) ? s.contentVersion : 0;
    s.qaVersion = Number.isFinite(s.qaVersion) ? s.qaVersion : 0;
    s.compPage = s.compPage || null;
    return s;
  } catch(e) { return null; }
}
function clearPersistentSession() {
  localStorage.removeItem('pdp_session');
  localStorage.removeItem('pdp_session_img');
  localStorage.removeItem('pdp_session_imgs');
  localStorage.removeItem('pdp_detail_image_blocks');
  workspaceDelete(WORKSPACE_DB.sessionAssets, SESSION_ASSET_ID).catch(() => {});
}

function getBrandPresetById(id) {

}

function getActiveBrandPreset() {

}

function getInitialBrandPresetDraft(id) {
  const found = getBrandPresetById(id);
  return found ? cloneData(found) : createEmptyBrandPreset();
}

function getPresetImageDirectives() {
  const preset = getActiveBrandPreset();
  if (!preset?.imageDirectives) return [];
  return preset.imageDirectives
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);
}

function getEffectiveImageDirectives() {
  const activeManual = (state.imageDirectives || [])
    .filter(d => d.active)
    .map(d => String(d.text || '').trim())
    .filter(Boolean);
  return [...new Set([...getPresetImageDirectives(), ...activeManual])];
}

function buildBrandPromptBlock() {
  const preset = getActiveBrandPreset();
  if (!preset) return '';
  const parts = [];
  if (preset.tone) parts.push(`Brand tone: ${preset.tone}`);
  if (preset.requiredKeywords) parts.push(`Required keywords or themes: ${preset.requiredKeywords}`);
  if (preset.bannedPhrases) parts.push(`Banned phrases: ${preset.bannedPhrases}`);
  if (preset.headlineFont || preset.bodyFont) parts.push(`Preferred fonts: headline=${preset.headlineFont || 'auto'}, body=${preset.bodyFont || preset.headlineFont || 'auto'}`);
  if (preset.accentColor) parts.push(`Preferred accent color: ${preset.accentColor}`);
  if (preset.backgroundColor) parts.push(`Preferred background color: ${preset.backgroundColor}`);
  if (preset.globalInstruction) parts.push(`Global instruction: ${preset.globalInstruction}`);
  if (!parts.length) return '';
  return `\nBRAND PRESET (keep the result consistent with this brand system):\n${parts.map((item, idx) => `${idx + 1}. ${item}`).join('\n')}\n`;
}

function buildLayoutPromptBlock() {
  const template = LAYOUT_TEMPLATES.find(t => t.id === state.layoutTemplate);
  if (!template) return '';
  return `\nPREFERRED PAGE TEMPLATE:\n- ${template.label}: ${template.desc}\n`;
}

function applyBrandPresetToContent(content) {
  const preset = getActiveBrandPreset();
  const next = cloneData(content) || {};
  next.color_scheme = { ...(next.color_scheme || {}) };
  next.font_suggestion = { ...(next.font_suggestion || {}) };
  if (preset?.headlineFont) next.font_suggestion.headline_font = preset.headlineFont;
  if (preset?.bodyFont) next.font_suggestion.body_font = preset.bodyFont;
  if (preset?.accentColor && !next.color_scheme.accent) next.color_scheme.accent = preset.accentColor;
  if (preset?.backgroundColor && !next.color_scheme.background) next.color_scheme.background = preset.backgroundColor;
  return next;
}

function markContentChanged(shouldPersist = true) {
