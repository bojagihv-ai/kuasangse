<script>
// 파일 변경 감지 자동 새로고침 (로컬 개발용)
(function(){
  if(location.hostname !== '127.0.0.1' && location.hostname !== 'localhost') return;
  const devReloadEnabled = new URLSearchParams(location.search).get('devReload') === '1' ||
    localStorage.getItem('pdp_dev_auto_reload') === '1';
  if (!devReloadEnabled) return;
  let lastModified = null;
  setInterval(async function(){
    try {
      const r = await fetch('/app.html', {method:'HEAD', cache:'no-store'});
      const lm = r.headers.get('last-modified') || r.headers.get('content-length');
      if(lastModified && lm && lastModified !== lm) { location.reload(); return; }
      lastModified = lm || lastModified;
    } catch(e){}
  }, 3000);
})();
</script>
<title>상세페이지 자동 생성기</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6366f1;--primary-h:#818cf8;--primary-dim:rgba(99,102,241,.15);
  --bg:#0f0f13;--bg-card:#1a1a23;--bg-input:#13131a;
  --border:#2a2a36;--border-h:#3a3a4a;
  --text:#e4e4e7;--text-d:#9494a5;--text-m:#6b6b7b;
  --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --cyan:#06b6d4;--orange:#f97316;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --radius-sm:6px;--surface-cyan-dim:rgba(6,182,212,.08);--border-cyan-dim:rgba(6,182,212,.2);
}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes factoryLiveDot{0%,20%{opacity:.18;transform:translateY(0)}35%{opacity:1;transform:translateY(-1px)}55%,100%{opacity:.28;transform:translateY(0)}}
.factory-live-ellipsis{display:inline-flex;align-items:center;gap:1px;min-width:18px;margin-left:4px;vertical-align:baseline}
.factory-live-ellipsis i{font-style:normal;opacity:.2;animation:factoryLiveDot 1.2s infinite}
.factory-live-ellipsis i:nth-child(2){animation-delay:.16s}
.factory-live-ellipsis i:nth-child(3){animation-delay:.32s}
.factory-action-busy{cursor:wait!important}
@media (prefers-reduced-motion:reduce){.factory-live-ellipsis i{animation:none;opacity:1}}
.fade-in{animation:fadeIn .3s ease-out}

/* Layout */
.app{display:flex;height:100vh;min-height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;overflow-anchor:none}
.sidebar{width:220px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;min-height:100vh;align-self:stretch;flex-shrink:0;overflow:visible;overflow-anchor:none}
.logo{display:flex;align-items:center;gap:10px;padding:20px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3;background:var(--bg-card)}
.logo-icon{font-size:28px;color:var(--primary);font-weight:900}
.logo-text{font-weight:700;font-size:15px;line-height:1.3}
.logo-sub{font-weight:400;font-size:12px;color:var(--text-d)}
.nav{padding:12px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.material-icons-outlined{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;line-height:1;display:inline-flex;align-items:center;justify-content:center;letter-spacing:normal;text-transform:none;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;max-width:1.25em;overflow:hidden;vertical-align:middle}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;color:var(--text-d);font-size:13px;border:none;background:none;width:100%;text-align:left;font-family:inherit;position:relative}
.nav-item .material-icons-outlined{flex:0 0 20px}
.nav-label{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-api-badges{display:inline-flex;align-items:center;justify-content:flex-end;gap:3px;margin-left:auto;flex:0 0 auto;max-width:66px;flex-wrap:wrap;overflow:visible;row-gap:2px}
.nav-api-badge{width:18px;height:18px;border-radius:999px;background:var(--api-color,#6366f1);color:#07111f;font-size:10px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 5px 12px rgba(0,0,0,.18)}
.nav-item:hover{background:rgba(255,255,255,.03)}
.nav-item.active{background:var(--primary-dim);color:var(--primary-h)}
.nav-item.blocked{opacity:.7}
.sidebar-model-status{padding:8px 12px;border-top:1px solid var(--border);font-size:10px;color:var(--text-m);line-height:1.45}
.sidebar-model-card:first-child{margin-bottom:7px}
.sidebar-api-actions{padding:12px 16px;border-top:1px solid var(--border)}
.sidebar-api-actions .btn-sm{width:100%;justify-content:center}
.main{flex:1;min-width:0;min-height:100vh;padding:0 76px 104px 0;overflow:visible;overflow-anchor:none}
.top-command-row{position:sticky;top:0;z-index:220;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px;width:100%;padding:0 24px 8px 32px;background:rgba(15,15,19,.98);border-bottom:1px solid rgba(42,42,54,.92);box-shadow:0 14px 30px rgba(0,0,0,.24)}
.workspace-authority-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1500px;margin:10px auto 0;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg-card);color:var(--text);overflow-wrap:anywhere;word-break:keep-all}
.workspace-authority-banner[data-mode="editing"]{border-color:var(--ok)}
.workspace-authority-banner[data-mode="readonly"]{border-color:var(--warn)}
.workspace-authority-banner[data-mode="offline-edit"]{border-color:var(--primary)}
.workspace-authority-copy{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.workspace-authority-copy strong{font-size:13px;font-weight:950;white-space:nowrap}
.workspace-authority-copy span{font-size:11px;line-height:1.55;color:var(--text-d);word-break:keep-all;overflow-wrap:break-word}
.workspace-authority-owner{display:inline-block;min-inline-size:0;max-inline-size:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:keep-all}
.workspace-authority-actions{display:flex;justify-content:flex-end;gap:7px;flex:0 1 auto;flex-wrap:wrap}
.workspace-authority-actions .btn-sm{font-weight:850;white-space:nowrap}
.workspace-readonly-content{opacity:.82;filter:saturate(.7)}
.container{max-width:1100px;margin:0 auto;padding:16px 32px 0}
.container.container-factory{max-width:1500px}
.app-notice{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;padding:11px 14px;border-radius:10px;background:rgba(99,102,241,.10);border:1px solid rgba(99,102,241,.35);color:var(--text);font-size:13px;line-height:1.6;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.app-notice.warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.34)}
.app-notice .material-icons-outlined{font-size:18px;color:var(--primary-h);margin-top:1px;flex:0 0 18px}
.mobile-step-banner{display:none;margin-bottom:14px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);font-size:12px;color:var(--text-d);align-items:center;gap:8px;flex-wrap:wrap}
.mobile-step-banner b{color:var(--text)}
.mobile-step-copy{min-width:0;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.db-workfile-strip{display:grid;grid-template-columns:minmax(190px,.7fr) minmax(300px,1.3fr) auto;align-items:center;gap:16px;min-width:0;width:100%;margin:0;padding:0;border:0;background:transparent;box-shadow:none;position:relative;z-index:1}
.db-workfile-title{grid-column:1;grid-row:1;min-width:0}
.db-workfile-sync{font-size:15px;font-weight:950;color:var(--text);line-height:1.2}
.db-workfile-sync span{font-size:12px;font-weight:750;color:var(--text-m);margin-left:8px}
.db-workfile-current{grid-column:2;grid-row:1;min-width:0;text-align:center;padding:4px 10px 2px}
.db-workfile-kicker{font-size:10px;font-weight:950;color:var(--primary-h);line-height:1.2}
.db-workfile-name{margin-top:2px;font-size:28px;font-weight:950;line-height:1.1;color:var(--text);white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word;word-break:keep-all}
.db-workfile-name-base,.db-workfile-name-ext{display:inline-block;max-width:100%}
.db-workfile-name-base{overflow-wrap:break-word;word-break:keep-all}
.db-workfile-name-ext{white-space:nowrap}
.db-workfile-current-step{margin-top:4px;font-size:11px;font-weight:800;color:var(--text-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db-workfile-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.db-workfile-meta span{display:inline-flex;align-items:center;max-width:100%;padding:2px 7px;border:1px solid rgba(148,163,184,.18);border-radius:999px;background:rgba(255,255,255,.035);color:var(--text-d);font-size:10px;font-weight:850;white-space:nowrap}
.db-workfile-meta span.dirty{color:#fbbf24;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.10)}
.db-workfile-actions{grid-column:3;grid-row:1;display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0;max-width:100%;flex-wrap:wrap;padding-top:0}
.db-workfile-actions .btn-sm{min-height:30px;padding:6px 10px;font-weight:850}
.workfile-save-status{display:inline-flex;align-items:center;min-height:30px;max-width:min(100%,410px);padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:var(--bg-input);color:var(--text-d);font-size:11px;font-weight:850;line-height:1.35;white-space:normal;overflow:visible;text-overflow:clip}
.workfile-save-status.saving{color:var(--warn);border-color:var(--warn);background:var(--bg-card)}
.workfile-save-status.saved{color:var(--ok);border-color:var(--ok);background:var(--bg-card)}
.workfile-save-status.error{color:var(--err);border-color:var(--err);background:var(--bg-card)}
.workfile-build-label{display:inline-flex;align-items:center;min-height:30px;padding:5px 7px;border:1px solid rgba(129,140,248,.34);border-radius:7px;background:rgba(99,102,241,.09);color:var(--primary-h);font-size:10px;font-weight:900;white-space:nowrap}
.global-workfile-frame{position:sticky;top:0;z-index:170;padding:0 32px 10px;background:rgba(15,15,19,.98);border-bottom:1px solid var(--border);box-shadow:0 16px 34px rgba(0,0,0,.32)}
.global-workfile-bar{position:relative;top:auto;z-index:1;display:grid;grid-template-columns:minmax(260px,.82fr) minmax(320px,1fr) minmax(260px,.72fr);gap:12px;align-items:end;margin:0;padding:10px 14px 12px;border:1px solid rgba(99,102,241,.42);border-top:0;border-radius:0 0 14px 14px;background:linear-gradient(135deg,rgba(28,30,48,.98),rgba(23,33,47,.96) 58%,rgba(18,18,27,.98));box-shadow:0 14px 32px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
.global-workfile-doc{display:flex;align-items:center;gap:12px;min-width:0}
.global-workfile-doc>.material-icons-outlined{width:42px;height:42px;border-radius:12px;background:rgba(99,102,241,.18);border:1px solid rgba(129,140,248,.34);color:var(--primary-h);font-size:24px;flex:0 0 42px}
.global-workfile-doc h2{max-width:100%;margin:0;font-size:21px;font-weight:950;line-height:1.12;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.global-workfile-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;color:var(--text-d);font-size:10px;font-weight:850;line-height:1.3}
.global-workfile-meta span{display:inline-flex;align-items:center;max-width:100%;padding:3px 7px;border:1px solid rgba(148,163,184,.18);border-radius:999px;background:rgba(255,255,255,.035);white-space:nowrap}
.global-workfile-meta span.dirty{color:#fbbf24;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.10)}
.global-workfile-kicker{font-size:10px;font-weight:950;color:var(--primary-h);margin-bottom:3px}
.global-workfile-main,.global-workfile-load{min-width:0}
.global-workfile-actions,.global-workfile-status{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px}
.global-workfile-status{align-items:flex-start}
.global-workfile-bar .input{min-height:38px}
.drive-status-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.025);font-size:12px;color:var(--text-d)}
.drive-status-strip strong{color:var(--text)}
.drive-status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-m);display:inline-block;flex:0 0 8px}
.drive-status-dot.ok{background:var(--ok)}
.drive-status-dot.warn{background:var(--warn)}

/* Typography */
.page-title{font-size:26px;font-weight:800;margin-bottom:6px;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.page-desc{font-size:14px;line-height:1.55;color:var(--text-d);margin-bottom:24px;word-break:keep-all;overflow-wrap:normal;line-break:strict}

/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:16px;padding:40px;text-align:center;cursor:pointer;background:var(--bg-card);margin-bottom:24px;min-height:240px;display:flex;align-items:center;justify-content:center;transition:.2s}
.upload-area:hover{border-color:var(--primary);background:rgba(99,102,241,.03)}
.upload-area.has-image{border-style:solid;border-color:var(--border)}
.preview-img{max-height:300px;max-width:100%;border-radius:12px;object-fit:contain}

/* Form */
.input-group{margin-bottom:20px}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-d)}
.input,.textarea{width:100%;min-width:0;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border .2s}
select.input{padding-right:34px;text-overflow:ellipsis;white-space:nowrap}
.input:focus,.textarea:focus{border-color:var(--primary)}
.textarea{resize:vertical;line-height:1.5;font-size:13px}

/* Buttons */
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary:hover{background:var(--primary-h)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;min-height:30px;background:var(--bg-card);color:var(--text-d);border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-sm:hover{border-color:var(--border-h);color:var(--text)}
.btn-sm:disabled{opacity:.5;cursor:not-allowed}

/* Cards */
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.feature-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.feature-card .mi{font-size:28px;color:var(--primary);margin-bottom:8px}
.feature-card h4{font-weight:600;font-size:14px;margin-bottom:4px}
.feature-card p{font-size:12px;color:var(--text-d)}

/* Analysis Summary */
.analysis-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px;word-break:keep-all;overflow-wrap:normal;line-break:strict}
.tag{display:inline-block;padding:3px 10px;background:var(--primary-dim);color:var(--primary-h);border-radius:20px;font-size:11px;font-weight:500;margin:2px}
.analysis-log-body{padding:0 16px 16px;background:var(--bg)}
.analysis-section-title{margin-top:18px;margin-bottom:8px;font-size:12px;font-weight:900;color:var(--text);letter-spacing:0;display:flex;align-items:center;gap:6px}
.analysis-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:10px 12px;margin-bottom:7px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:8px;align-items:start}
.analysis-row .label{font-size:12px;color:var(--text-m);margin:0;line-height:1.45}
.analysis-row .value{font-size:13px;color:var(--text);line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.analysis-note{font-size:12px;color:var(--text-d);line-height:1.7;padding:10px 12px;background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.16);border-left:3px solid var(--primary);border-radius:8px;margin-bottom:8px}
.analysis-note strong{color:var(--primary-h)}
.analysis-product-card{padding:10px 12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:9px;margin-bottom:8px;font-size:12px;line-height:1.55}
@media(max-width:760px){.analysis-row{grid-template-columns:1fr}.analysis-row .label{font-weight:800;color:var(--text-d)}}

/* Section Cards */
.section-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:12px}
.section-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:.15s;min-width:0}
.section-card:hover{border-color:var(--border-h);background:var(--bg-card)}
.section-card .head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.section-card .head>.drag-handle{grid-column:1;grid-row:1;align-self:start;margin-top:2px}
.section-card .section-identity{grid-column:2;grid-row:1;display:flex;align-items:flex-start;gap:10px;min-width:0}
.section-card .icon{flex:0 0 auto;font-size:27px;line-height:1;margin-top:0}
.section-card .section-batch-select{grid-column:3;grid-row:1;justify-self:end;align-self:start;white-space:nowrap;margin:0}
.section-card .info{min-width:0}
.section-card .info h4{font-weight:800;font-size:14px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.section-card .info p{font-size:12px;color:var(--text-d);margin-top:4px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.section-card .actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;grid-column:1/-1;border-top:1px solid rgba(255,255,255,.05);padding-top:10px;margin-top:2px}
.section-card .actions .btn-sm{white-space:nowrap;min-height:32px}
.section-card .meta-row{grid-column:1/-1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.section-card .edit-row{grid-column:1/-1;margin-top:10px}
.status-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--text-d);background:var(--bg);white-space:nowrap}
.status-chip.ok{color:var(--ok);border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
.status-chip.busy{color:var(--primary-h);border-color:rgba(99,102,241,.35);background:rgba(99,102,241,.10)}
.section-source-pill{display:inline-flex;align-items:center;gap:4px;max-width:100%;border:1px solid var(--border);border-radius:999px;padding:4px 9px;background:rgba(255,255,255,.025);font-size:11px;color:var(--text-d);line-height:1.2}
.section-source-pill strong{color:var(--text);font-weight:800}
.section-prompt-compact{grid-column:1/-1;display:flex;align-items:flex-start;gap:7px;margin-top:8px;padding:8px 10px;border:1px solid rgba(99,102,241,.22);border-radius:10px;background:rgba(99,102,241,.07);color:var(--text-m);font-size:12px;line-height:1.45;min-width:0}
.section-prompt-compact.empty{border-style:dashed;opacity:.72}
.section-prompt-compact .material-icons-outlined{font-size:15px;color:var(--primary-h);margin-top:1px;flex:0 0 auto}
.section-prompt-compact b{color:var(--text);font-size:12px;white-space:nowrap;flex:0 0 auto}
.section-prompt-compact .preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.section-mode-label{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;color:var(--text-m);white-space:nowrap}
.section-mode-select,.section-basis-select{height:32px;min-width:150px;max-width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:700;font-family:inherit;padding:0 28px 0 10px;outline:none}
.section-basis-select{min-width:138px;border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.055)}
.section-mode-select:focus,.section-basis-select:focus{border-color:var(--primary)}
.section-mode-select option,.section-basis-select option{background:#10131d;color:#f8fafc;font-weight:800}
.section-mode-select option:checked,.section-basis-select option:checked{background:#4f46e5;color:#fff}
.section-mode-panel{border:1px solid rgba(99,102,241,.20);border-radius:10px;background:rgba(99,102,241,.055);padding:10px;margin-bottom:10px}
.section-mode-panel-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--text);margin-bottom:8px}
.section-mode-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.section-mode-choice{border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text-d);padding:10px;text-align:left;cursor:pointer;font-family:inherit;min-height:74px}
.section-mode-choice:hover{border-color:var(--primary);background:rgba(99,102,241,.08)}
.section-mode-choice.active{border-color:var(--primary);background:var(--primary-dim);color:var(--text)}
.section-mode-choice b{display:block;font-size:12px;color:var(--text);margin-bottom:4px;line-height:1.25}
.section-mode-choice span{display:block;font-size:11px;color:var(--text-m);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.section-mode-current{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(99,102,241,.25);border-radius:999px;background:rgba(99,102,241,.08);color:var(--primary-h);font-size:10px;font-weight:800;padding:3px 7px;white-space:nowrap}
.basis-prompt-compare{border:1px solid rgba(99,102,241,.20);border-radius:10px;background:rgba(255,255,255,.025);padding:10px;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.basis-prompt-box{border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:10px;min-width:0}
.basis-prompt-box.active{border-color:var(--primary);background:var(--primary-dim)}
.basis-prompt-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.basis-prompt-title{font-size:12px;font-weight:900;color:var(--text);line-height:1.35}
.basis-prompt-badge{border:1px solid rgba(99,102,241,.35);border-radius:999px;background:rgba(99,102,241,.11);color:var(--primary-h);font-size:10px;font-weight:900;padding:3px 7px;white-space:nowrap}
.basis-prompt-text{max-height:168px;overflow:auto;border:1px solid rgba(255,255,255,.06);border-radius:8px;background:rgba(0,0,0,.18);padding:9px;font-size:11px;color:var(--text-d);line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.basis-prompt-empty{color:var(--warn)}
.custom-badge{margin-top:8px;padding:6px 10px;background:var(--primary-dim);border-radius:6px;font-size:12px;color:var(--primary-h)}

/* Progress */
.progress-outer{width:100%;max-width:400px;height:24px;background:var(--bg-card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));border-radius:12px;transition:width .5s ease;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:40px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.spinner-lg{width:64px;height:64px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
/* ── Agent Chat ── */
.agent-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(99,102,241,.5);z-index:1000;transition:.2s}
.agent-fab:hover{background:var(--primary-h);transform:scale(1.08)}
.agent-fab .badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center}
.agent-panel{position:fixed;bottom:88px;right:24px;width:420px;max-width:calc(100vw - 40px);height:600px;max-height:calc(100vh - 120px);background:var(--bg-card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;z-index:999;box-shadow:0 8px 40px rgba(0,0,0,.6);overflow:hidden}
.agent-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.agent-msgs::-webkit-scrollbar{width:4px}.agent-msgs::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:2px}
.agent-bubble{max-width:90%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word}
.agent-bubble.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.agent-bubble.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.agent-action-block{margin-top:8px;padding:8px 10px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.25);border-radius:8px;font-size:11px;color:var(--primary-h);font-family:monospace;line-height:1.7}
.agent-input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg)}
.agent-input-row textarea{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px;font-family:'Pretendard','Noto Sans KR',sans-serif;resize:none;line-height:1.5;max-height:120px}
.agent-input-row textarea:focus{outline:none;border-color:var(--primary)}
.agent-cursor{display:inline-block;width:2px;height:1em;background:var(--primary-h);animation:blink .7s step-end infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.gen-icons{margin-top:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gen-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border-radius:10px;font-size:22px;border:1px solid var(--border);transition:.3s}
.gen-icon.done{background:var(--primary-dim);border-color:var(--primary)}

/* Preview */
.preview-wrap{background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.fixed-detail-assets-panel{margin:0 0 16px;padding:14px;background:linear-gradient(135deg,rgba(15,23,42,.72),rgba(17,24,39,.86));border:1px solid rgba(99,102,241,.35);border-radius:14px;box-shadow:var(--shadow-sm)}
.fixed-detail-assets-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fixed-detail-assets-head h3{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:15px;font-weight:900;color:var(--text)}
.fixed-detail-assets-head h3 .material-icons-outlined{font-size:19px;color:var(--primary-h)}
.fixed-detail-assets-head p{margin:0;font-size:12px;color:var(--text-m);line-height:1.55}
.fixed-detail-count{display:inline-flex;align-items:center;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.12);color:var(--ok);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900;white-space:nowrap}
.fixed-detail-assets-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fixed-detail-slot{min-width:0;border:1px solid var(--border);background:rgba(0,0,0,.20);border-radius:12px;padding:10px}
.fixed-detail-slot.ready{border-color:rgba(34,197,94,.45);background:rgba(6,78,59,.14)}
.fixed-detail-slot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.fixed-detail-slot-head strong{display:block;font-size:13px;color:var(--text);line-height:1.35}
.fixed-detail-slot-kicker{font-size:10px;font-weight:900;color:var(--primary-h);margin-bottom:2px}
.fixed-detail-slot-state{font-size:10px;font-weight:900;color:var(--text-m);border:1px solid var(--border);border-radius:999px;padding:2px 6px;white-space:nowrap}
.fixed-detail-slot.ready .fixed-detail-slot-state{color:var(--ok);border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.12)}
.fixed-detail-thumb{width:100%;aspect-ratio:16/5;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(129,140,248,.45);border-radius:10px;background:rgba(15,23,42,.42);overflow:hidden;cursor:pointer;color:var(--text-d);font-family:inherit}
.fixed-detail-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.fixed-detail-placeholder{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800}
.fixed-detail-placeholder .material-icons-outlined{font-size:24px;color:var(--primary-h)}
.fixed-detail-desc{margin-top:8px;color:var(--text-d);font-size:11px;line-height:1.45}
.fixed-detail-meta{margin-top:5px;color:var(--text-m);font-size:10px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.fixed-detail-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fixed-detail-page-image{line-height:0}
.fixed-detail-page-image img{display:block;width:100%;height:auto}
.section-ctrl{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-card);border-bottom:1px solid var(--border)}
.section-ctrl .name{font-weight:600;font-size:13px}
.section-ctrl .image-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.variant-quickbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:linear-gradient(180deg,rgba(99,102,241,.09),rgba(255,255,255,.02));border-bottom:1px solid var(--border)}
.variant-quickbar-title{display:inline-flex;align-items:center;gap:5px;color:var(--text-m);font-size:11px;font-weight:900;white-space:nowrap}
.variant-quickbar-list{display:flex;align-items:center;gap:6px;flex:1;min-width:180px;flex-wrap:wrap}
.variant-quickchip{display:inline-grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:7px;max-width:300px;min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text-d);padding:4px 8px 4px 4px;cursor:pointer;font-family:inherit;text-align:left}
.variant-quickchip:hover{border-color:var(--primary);background:rgba(99,102,241,.08);color:var(--text)}
.variant-quickchip.active{border-color:var(--primary);background:var(--primary-dim);color:var(--primary-h)}
.variant-quickthumb{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);object-fit:cover;display:block}
.variant-quickcopy{min-width:0}
.variant-quickname{font-size:11px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.variant-quickmeta{margin-top:2px;font-size:10px;color:var(--text-m);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.variant-quickcheck{font-size:16px;color:var(--ok)}
.variant-model-line{margin-top:6px;font-size:10px;color:var(--text-m);line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.variant-model-line b{color:var(--primary-h)}
.variant-eval-panel{padding:10px 14px;background:rgba(16,163,127,.055);border-bottom:1px solid rgba(16,163,127,.18)}
.variant-eval-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.variant-eval-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#b7f7c8;line-height:1.35}
.variant-eval-summary{font-size:12px;color:var(--text-d);line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.variant-eval-best{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid rgba(34,197,94,.28);background:rgba(34,197,94,.10);border-radius:10px;color:#d8ffe2;font-size:12px;line-height:1.55;margin-bottom:8px}
.variant-eval-score{font-size:16px;font-weight:900;color:var(--ok)}
.variant-eval-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:8px}
.variant-eval-card{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px;min-width:0}
.variant-eval-card.best{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.08)}
.variant-eval-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.variant-eval-name{font-size:12px;font-weight:900;color:var(--text);line-height:1.35}
.variant-eval-criteria{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.variant-eval-criterion{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:10px;color:var(--text-m)}
.variant-eval-bar{grid-column:1/-1;height:4px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.variant-eval-bar span{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);border-radius:999px}
.variant-eval-reason{font-size:11px;color:var(--text-d);line-height:1.55;margin-top:6px;word-break:keep-all;overflow-wrap:anywhere}
.variant-eval-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.inserted-image-block{background:#fff;border-top:1px solid rgba(15,23,42,.08);border-bottom:1px solid rgba(15,23,42,.08);padding:22px 20px;position:relative}
.inserted-image-inner{max-width:1120px;margin:0 auto}
.inserted-image-ctrl{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.inserted-image-card{position:relative;border-radius:22px;overflow:hidden;background:#f8fafc;box-shadow:0 18px 46px rgba(15,23,42,.10)}
.inserted-image-card img{display:block;width:100%;height:auto;max-height:820px;object-fit:contain;margin:0 auto}
.inserted-image-caption{font-size:11px;color:#64748b;margin-top:8px;text-align:right}
.image-insert-overlay{z-index:1250;align-items:flex-start;overflow:auto;padding:28px 16px}
.image-insert-modal{max-width:920px;width:min(920px,96vw);padding:0;overflow:hidden}
.image-insert-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(99,102,241,.10))}
.image-insert-title{font-size:18px;font-weight:800;margin-bottom:4px}
.image-insert-sub{font-size:12px;color:var(--text-d);line-height:1.55}
.image-insert-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.image-source-panel{border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:14px;min-width:0}
.image-source-panel h3{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.image-source-panel p{font-size:12px;color:var(--text-d);line-height:1.5;margin-bottom:12px}
.image-source-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.image-source-card{border:1px solid var(--border);border-radius:10px;background:var(--bg-card);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.image-source-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--bg-input)}
.image-source-card .src-name{font-size:11px;color:var(--text-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.image-insert-error{grid-column:1/-1;padding:10px 12px;border:1px solid rgba(239,68,68,.32);background:rgba(239,68,68,.10);border-radius:10px;color:var(--err);font-size:12px}
.edit-panel{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.preview-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.layer-mode-banner{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:14px;border:1px solid rgba(99,102,241,.35);background:rgba(99,102,241,.10);border-radius:12px;color:var(--text-d);font-size:13px}
.preview-layer{position:relative;transition:box-shadow .12s ease, outline-color .12s ease, transform .04s linear}
.preview-layer.layer-editable{cursor:grab;outline:1px dashed transparent;outline-offset:5px;border-radius:10px}
.preview-layer.layer-editable:hover{outline-color:rgba(99,102,241,.55);box-shadow:0 0 0 6px rgba(99,102,241,.08)}
.preview-layer.layer-selected{outline-color:var(--primary)!important;box-shadow:0 0 0 8px rgba(99,102,241,.14)}
.layer-editor{margin-top:12px;padding:14px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.03)}
.layer-pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.layer-pill{border:1px solid var(--border);background:var(--bg-card);color:var(--text-d);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.layer-pill.active{border-color:var(--primary);color:var(--primary-h);background:var(--primary-dim)}
.layer-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.range-row label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-m);margin-bottom:4px}
.range-row input[type=range]{width:100%;accent-color:var(--primary)}

/* AI local image repair */
.repair-overlay{z-index:1200;align-items:flex-start;overflow:auto;padding:28px 16px}
.repair-modal{max-width:1120px;width:min(1120px,96vw);padding:0;overflow:hidden}
.repair-head{display:flex;align-items:flex-start;gap:14px;padding:20px 22px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(16,163,127,.14),rgba(99,102,241,.10))}
.repair-title{font-size:18px;font-weight:800;margin-bottom:4px}
.repair-sub{font-size:12px;color:var(--text-d);line-height:1.6}
.repair-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:0;min-height:560px}
.repair-canvas-panel{padding:18px;background:#111827;display:flex;align-items:center;justify-content:center}
.repair-stage{position:relative;max-width:100%;max-height:70vh;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.36);background:#0b1020}
.repair-stage img{display:block;max-width:100%;max-height:70vh;object-fit:contain}
.repair-stage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.repair-side{padding:18px;border-left:1px solid var(--border);background:var(--bg-card);display:flex;flex-direction:column;gap:14px}
.repair-tip{padding:10px 12px;border:1px solid rgba(16,163,127,.32);background:rgba(16,163,127,.10);border-radius:10px;color:var(--text-d);font-size:12px;line-height:1.55}
.repair-actions{display:flex;gap:8px;flex-wrap:wrap}
.repair-mini{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-m)}
.repair-error{padding:10px 12px;border:1px solid rgba(239,68,68,.32);background:rgba(239,68,68,.10);border-radius:10px;color:var(--err);font-size:12px;line-height:1.5}
.repair-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.62);backdrop-filter:blur(4px);color:#fff;font-size:13px;font-weight:700}
@media (max-width:900px){.repair-body{grid-template-columns:1fr}.repair-side{border-left:0;border-top:1px solid var(--border)}}
@media (max-width:900px){.image-insert-body{grid-template-columns:1fr}.section-ctrl{align-items:flex-start;flex-wrap:wrap}.section-ctrl .image-tools{width:100%}}

.color-field{display:flex;align-items:center;gap:8px}
.color-field .input{flex:1;font-family:monospace;font-weight:700}
.color-picker{width:44px;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--bg-input);padding:4px;cursor:pointer;flex-shrink:0}
.color-picker::-webkit-color-swatch-wrapper{padding:0}
.color-picker::-webkit-color-swatch{border:0;border-radius:6px}
.color-picker::-moz-color-swatch{border:0;border-radius:6px}

/* Error */
.error-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:var(--err);font-size:13px;margin-bottom:16px}

/* API Key Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:480px;width:90%}
.modal h2{font-size:20px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text-d);margin-bottom:20px}
.prompt-trace-modal{width:min(1120px,96vw);max-width:none;max-height:88vh;overflow:auto;padding:0}
.prompt-trace-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(34,197,94,.06))}
.prompt-trace-title{font-size:18px;font-weight:900;color:var(--text);line-height:1.35}
.prompt-trace-sub{margin-top:5px;font-size:12px;color:var(--text-m);line-height:1.55}
.prompt-trace-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.prompt-trace-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.prompt-trace-chip{border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.025);padding:9px 10px;font-size:11px;color:var(--text-m);line-height:1.45}
.prompt-trace-chip b{display:block;color:var(--text);font-size:12px;margin-bottom:3px}
.prompt-trace-section{border:1px solid var(--border);border-radius:12px;background:var(--bg);overflow:hidden}
.prompt-trace-section h3{display:flex;align-items:center;gap:6px;margin:0;padding:11px 13px;border-bottom:1px solid var(--border);font-size:13px;font-weight:900;color:var(--text)}
.prompt-trace-pre{max-height:340px;overflow:auto;margin:0;padding:13px;background:#080b12;color:#dbe7ff;font-family:Consolas,'D2Coding','Courier New',monospace;font-size:11px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.prompt-trace-empty{color:var(--warn);font-size:12px;line-height:1.6;padding:13px}
.prompt-clickable-image{cursor:pointer}
.prompt-clickable-image:hover{outline:3px solid rgba(99,102,241,.35);outline-offset:3px}

/* Image Cuts */
.cuts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:20px}
.cut-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.cut-card.has-result{border-color:var(--primary)}
.cut-label{font-size:13px;font-weight:700;color:var(--primary)}
.cut-preview{width:100%;aspect-ratio:4/3;border-radius:8px;object-fit:cover;background:var(--bg-input);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-m);font-size:12px;overflow:hidden}
.cut-preview img{width:100%;height:100%;object-fit:cover}
.cut-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:auto}
.cut-subsection{border:1px solid rgba(99,102,241,.22);border-radius:14px;background:rgba(99,102,241,.035);padding:16px;margin:24px 0}
.cut-subsection.size{border-color:rgba(56,189,248,.28);background:rgba(14,165,233,.035)}
.cut-subsection-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cut-subsection-title{font-size:16px;font-weight:950;color:var(--text);line-height:1.35}
.cut-subsection-desc{font-size:12px;color:var(--text-m);line-height:1.55;margin-top:4px}
.cut-card textarea{min-height:74px;resize:vertical}
.source-upload{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:var(--bg-card);transition:.2s;margin-bottom:0px;position:relative}
.source-upload:hover{border-color:var(--primary)}
.placement-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;min-width:0;flex-wrap:wrap}
.placement-row:last-child{border-bottom:none}
.placement-select{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:12px;font-family:inherit;outline:none;min-width:180px;max-width:100%;flex:0 1 260px}
.cut-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:var(--bg-input)}

/* Automation */
.auto-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.auto-card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.auto-status{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.auto-status.running{background:rgba(34,197,94,.15);color:var(--ok)}
.auto-status.stopped{background:rgba(239,68,68,.15);color:var(--err)}
.auto-status.waiting{background:rgba(245,158,11,.15);color:var(--warn)}
.auto-output-panel{margin-top:12px;border:1px solid rgba(99,102,241,.22);border-radius:11px;background:rgba(99,102,241,.055);padding:10px;min-width:0;overflow:hidden}
.auto-output-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.auto-output-title{font-size:13px;font-weight:900;color:var(--text);line-height:1.35}
.auto-output-sub{font-size:11px;color:var(--text-m);line-height:1.45;margin-top:2px}
.auto-output-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px;max-width:100%}
.auto-output-card{border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(0,0,0,.22);padding:6px;min-width:0;overflow:hidden}
.auto-output-thumb{width:100%;aspect-ratio:1/1;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:#090b11;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;cursor:zoom-in}
.auto-output-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.auto-output-name{font-size:10px;font-weight:900;color:var(--text);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.auto-output-meta{font-size:9px;color:var(--text-m);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.auto-output-empty,.auto-output-error{margin-top:10px;border:1px dashed rgba(255,255,255,.12);border-radius:9px;padding:10px;font-size:12px;color:var(--text-m);line-height:1.5}
.auto-output-error{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#fecaca}
.folder-pick{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;min-height:44px}
.folder-pick:hover{border-color:var(--primary)}
.folder-pick .name{flex:1;font-size:13px;color:var(--text)}
.folder-pick .placeholder{flex:1;font-size:13px;color:var(--text-m)}
.queue-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.queue-item:last-child{border-bottom:none}
.queue-item .q-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.queue-item .q-status.pending{background:var(--text-m)}
.queue-item .q-status.processing{background:var(--warn);animation:pulse 1s infinite}
.queue-item .q-status.done{background:var(--ok)}
.queue-item .q-status.error{background:var(--err)}
.log-box{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.8}
.log-line{color:var(--text-d)}
.log-line.ok{color:var(--ok)}
.log-line.err{color:var(--err)}
.log-line.info{color:var(--cyan)}
.interval-slider{width:100%;accent-color:var(--primary)}

/* ── Feature: Preview Viewport Toggle ── */
.preview-viewport-pc .preview-wrap{max-width:1100px;margin:0 auto}
.preview-viewport-mobile .preview-wrap{max-width:430px;margin:0 auto;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.viewport-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text-m);font-size:11px;font-family:inherit;cursor:pointer;transition:.15s}
.viewport-btn.active{background:var(--primary-dim);color:var(--primary-h);border-color:var(--primary)}
.preview-builder{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.preview-outline{position:sticky;top:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg-card);padding:12px;max-height:calc(100vh - 24px);overflow:auto}
.preview-outline-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.preview-outline-title{font-size:13px;font-weight:900;color:var(--text)}
.preview-outline-list{display:flex;flex-direction:column;gap:7px}
.preview-outline-item{display:grid;grid-template-columns:18px 42px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:7px;cursor:grab}
.preview-outline-item:hover{border-color:var(--primary)}
.preview-outline-item.active{border-color:var(--primary);background:var(--primary-dim)}
.preview-outline-thumb{width:42px;height:42px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:18px}
.preview-outline-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.preview-outline-name{font-size:12px;font-weight:800;color:var(--text);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-outline-meta{font-size:10px;color:var(--text-m);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tone-quick-panel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--border);border-radius:12px;background:var(--bg-card);padding:10px 12px;margin-bottom:14px}
.tone-quick-label{font-size:12px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:5px;margin-right:2px}
.tone-chip{border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--text-d);padding:7px 11px;font-size:12px;font-family:inherit;cursor:pointer;line-height:1}
.tone-chip:hover,.tone-chip.active{border-color:var(--primary);background:var(--primary-dim);color:var(--primary-h)}
.history-panel{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.025);padding:10px;margin-top:10px}
.history-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.history-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto}
.history-item{border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:7px 8px;font-size:11px;color:var(--text-d);line-height:1.35}
.history-item.current{border-color:var(--primary);color:var(--primary-h);background:var(--primary-dim)}
@media (max-width:980px){.preview-builder{grid-template-columns:1fr}.preview-outline{position:relative;top:auto;max-height:none}.preview-outline-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
/* ── Feature: Drag & Drop Sections ── */
.drag-handle{cursor:grab;color:var(--text-d);padding:0 6px;flex-shrink:0;font-size:18px;line-height:1;transition:color .15s}
.drag-handle:hover{color:var(--text)}
.section-card.sortable-ghost{opacity:.35;background:var(--primary-dim)!important}
.section-card.sortable-chosen{box-shadow:0 0 0 2px var(--primary)!important}
/* ── Feature: Multi-image upload ── */
.analysis-imgs-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.analysis-img-thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:2px solid var(--border);cursor:pointer;flex-shrink:0}
.analysis-img-thumb img{width:100%;height:100%;object-fit:cover}
.analysis-img-thumb .remove-img{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);border:none;border-radius:50%;width:18px;height:18px;font-size:11px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.analysis-img-thumb.primary{border-color:var(--primary)}
.upload-area-mini{border:2px dashed var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s;font-size:13px;color:var(--text-m)}
.upload-area-mini:hover{border-color:var(--primary);color:var(--primary-h)}
/* ── Feature: AI QA ── */
.qa-ai-badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;margin-left:6px}
.qa-ai-badge.pass{background:rgba(52,211,153,.2);color:#34d399}
.qa-ai-badge.fail{background:rgba(239,68,68,.2);color:#f87171}
.qa-ai-score{font-size:28px;font-weight:900;color:var(--ok)}
/* ── Feature: Option Image Sorter ── */
.opt-upload-zone{border:2px dashed var(--border);border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer;transition:.15s}
.opt-upload-zone:hover,.opt-upload-zone.dragover{border-color:var(--primary);background:var(--primary-dim)}
.opt-img-preview-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.opt-img-thumb{position:relative;width:108px;height:108px;border-radius:10px;overflow:hidden;border:2px solid var(--border);flex-shrink:0;background:var(--bg);cursor:zoom-in;box-shadow:0 8px 18px rgba(0,0,0,.16);transition:border-color .15s,transform .15s,box-shadow .15s}
.opt-img-thumb:hover{border-color:var(--primary-h);transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.24)}
.opt-img-thumb:focus-visible{outline:2px solid var(--primary-h);outline-offset:3px}
.opt-img-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.opt-img-thumb .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:20px;height:20px;font-size:11px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.opt-img-zoom-hint{position:absolute;left:4px;bottom:4px;padding:2px 5px;border-radius:7px;background:rgba(0,0,0,.68);color:#fff;font-size:9px;font-weight:700;line-height:1;opacity:0;transition:opacity .15s;pointer-events:none}
.opt-img-thumb:hover .opt-img-zoom-hint,.opt-img-thumb:focus-visible .opt-img-zoom-hint{opacity:1}
.opt-image-preview-overlay{background:rgba(0,0,0,.82);align-items:center;overflow:auto;padding:22px 12px;z-index:100000}
.opt-image-preview-modal{width:min(1120px,96vw);max-width:none;max-height:calc(100vh - 44px);overflow:auto;padding:14px;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.62)}
.opt-image-preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.opt-image-preview-title{font-size:15px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-image-preview-sub{font-size:12px;color:var(--text-m);margin-top:3px}
.opt-image-preview-stage{background:#060814;border:1px solid var(--border);border-radius:12px;max-height:78vh;overflow:auto;padding:12px;display:flex;align-items:center;justify-content:center}
.opt-image-preview-stage img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:10px;background:#fff;image-rendering:auto}
.opt-option-gen-panel{background:linear-gradient(135deg,rgba(99,102,241,.10),rgba(34,197,94,.045));border:1px solid rgba(99,102,241,.28);border-radius:14px;padding:16px;margin-bottom:20px}
.opt-option-gen-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.opt-option-gen-title{font-size:15px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:7px}
.opt-option-gen-desc{font-size:12px;color:var(--text-m);line-height:1.6;margin-top:4px}
.opt-option-mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}
.opt-option-mode-card{border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text-d);padding:12px;text-align:left;cursor:pointer;font-family:inherit;min-height:94px}
.opt-option-mode-card:hover{border-color:var(--primary);background:rgba(99,102,241,.08)}
.opt-option-mode-card.active{border-color:var(--primary);background:var(--primary-dim);color:var(--text)}
.opt-option-mode-card b{display:block;font-size:13px;color:var(--text);margin-bottom:5px}
.opt-option-mode-card span{display:block;font-size:12px;line-height:1.55;color:var(--text-m);word-break:keep-all;overflow-wrap:anywhere}
.opt-option-mode-card.recommended{border-color:rgba(34,197,94,.45)}
.opt-option-mode-card .tag{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:2px 7px;margin:0 4px 6px 0;font-size:10px;font-weight:900;color:var(--primary-h);background:rgba(99,102,241,.10)}
.opt-option-mode-card .tag.ok{color:var(--ok);background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.25)}
.opt-option-mode-card .tag.warn{color:var(--warn);background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.25)}
.opt-layout-candidate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:9px;margin:10px 0}
.opt-layout-candidate{border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text-d);padding:9px;text-align:left;cursor:pointer;font-family:inherit;min-height:116px;display:flex;flex-direction:column;gap:7px}
.opt-layout-candidate:hover{border-color:var(--primary);background:rgba(99,102,241,.08)}
.opt-layout-candidate.active{border-color:var(--primary);background:var(--primary-dim);box-shadow:0 0 0 1px rgba(99,102,241,.18) inset}
.opt-layout-candidate b{font-size:12px;color:var(--text);line-height:1.25}
.opt-layout-candidate span{font-size:10px;color:var(--text-m);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.opt-layout-mini{display:grid;gap:3px;align-content:center;max-width:100%;padding:7px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(0,0,0,.18)}
.opt-layout-mini-row{display:grid;gap:3px;justify-content:center}
.opt-layout-mini span{display:block;min-width:8px;height:10px;border-radius:3px;border:1px solid rgba(99,102,241,.36);background:rgba(99,102,241,.25)}
.opt-layout-mini span.empty{border-style:dashed;background:transparent;opacity:.28}
.opt-layout-mini.compact{gap:2px;padding:6px}
.opt-layout-mini.compact .opt-layout-mini-row{gap:2px}
.opt-layout-mini.compact span{height:7px;min-width:0;border-radius:2px}
.opt-layout-direct-preview{border:1px solid rgba(99,102,241,.22);border-radius:10px;background:rgba(99,102,241,.06);padding:9px;margin:8px 0 10px}
.opt-layout-direct-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:7px;font-size:11px;color:var(--text-m)}
.opt-layout-direct-head b{color:var(--text);font-size:12px}
.opt-layout-mode-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 10px;padding:9px;border:1px solid rgba(99,102,241,.22);border-radius:8px;background:rgba(99,102,241,.06)}
.opt-layout-mode-bar .btn-sm.active{border-color:var(--primary);background:var(--primary-dim);color:var(--text)}
.opt-layout-mode-bar .material-icons-outlined{font-size:15px}
.opt-layout-mode-bar>span{font-size:11px;color:var(--text-m);line-height:1.45;min-width:180px;flex:1}
.opt-workflow-panel{border:1px solid var(--border);border-radius:8px;background:var(--bg-card);padding:14px;margin-bottom:14px;min-width:0}
.opt-workflow-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.opt-workflow-head>div{min-width:0;flex:1}
.opt-workflow-head b{display:block;font-size:14px;color:var(--text);line-height:1.4}
.opt-workflow-head>div>span{display:block;font-size:11px;color:var(--text-m);line-height:1.55;margin-top:3px;word-break:keep-all;overflow-wrap:anywhere}
.opt-source-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.opt-source-card{position:relative;display:grid;grid-template-rows:90px auto auto;gap:5px;min-width:0;padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit;text-align:left;cursor:zoom-in}
.opt-source-card:hover{border-color:var(--primary)}
.opt-source-card:focus-visible{outline:2px solid var(--primary-h);outline-offset:2px}
.opt-source-card.assigned{border-color:rgba(34,197,94,.4)}
.opt-source-card img,.opt-source-card .opt-missing-image{width:100%;height:90px;min-height:90px;object-fit:contain;border-radius:6px;background:#fff}
.opt-source-index{position:absolute;top:11px;left:11px;z-index:1;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(15,15,19,.88);color:#fff;font-size:10px;font-weight:800}
.opt-source-name{display:block;min-width:0;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-source-state{display:block;font-size:10px;color:var(--text-m)}
.opt-source-card.assigned .opt-source-state{color:var(--ok)}
.opt-assignment-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:10px 0 8px;font-size:12px;color:var(--text)}
.opt-assignment-heading>span:last-child{font-size:11px;color:var(--text-m)}
.opt-tone-preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:8px 0 10px}
.opt-tone-preset{border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text-d);padding:9px;text-align:left;cursor:pointer;font-family:inherit;min-height:64px}
.opt-tone-preset:hover{border-color:var(--primary);background:rgba(99,102,241,.08)}
.opt-tone-preset.active{border-color:var(--primary);background:var(--primary-dim);box-shadow:0 0 0 1px rgba(99,102,241,.18) inset}
.opt-tone-preset b{display:block;font-size:12px;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-tone-preset span{display:block;font-size:10px;line-height:1.45;color:var(--text-m);word-break:keep-all;overflow-wrap:anywhere}
.opt-option-tone{width:100%;min-height:68px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:12px;line-height:1.6;padding:10px;resize:vertical}
.opt-option-map{border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(0,0,0,.18);padding:10px;margin-top:12px}
.opt-option-map-title{font-size:12px;font-weight:900;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.opt-option-map-sheet{display:grid;gap:8px}
.opt-option-map-sheet+.opt-option-map-sheet{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.opt-option-map-sheet-title{font-size:11px;font-weight:900;color:var(--primary-h)}
.opt-option-map-row{display:grid;gap:8px;min-width:0}
.opt-option-map-card{display:grid;grid-template-columns:22px 46px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:7px;min-width:0}
.opt-map-drag-handle{width:22px;height:46px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--text-m);cursor:grab;padding:0}
.opt-map-drag-handle:active{cursor:grabbing}.opt-map-drag-handle:hover,.opt-map-drag-handle:focus-visible{color:var(--primary-h);background:var(--primary-dim);outline:none}
.opt-option-map-card img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid rgba(255,255,255,.08);cursor:zoom-in}
.opt-option-map-card img:focus-visible{outline:2px solid var(--primary-h);outline-offset:2px}
.opt-option-map-card .order{font-size:10px;color:var(--primary-h);font-weight:900}
.opt-option-map-card .name{font-size:12px;color:var(--text);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-option-map-card .src{font-size:10px;color:var(--text-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-option-map-conflict{margin-top:5px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.10);border-radius:8px;padding:5px;font-size:10px;color:var(--warn);line-height:1.45}
.opt-option-log{margin-top:10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(0,0,0,.2);padding:8px;max-height:128px;overflow:auto}
.opt-option-log-line{font-size:11px;color:var(--text-d);line-height:1.55}
.opt-option-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.opt-option-result{border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:10px;min-width:0}
.opt-option-result.sample{border-color:rgba(34,197,94,.65);box-shadow:0 0 0 1px rgba(34,197,94,.22),0 0 0 4px rgba(34,197,94,.08)}
.opt-option-result img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:10px;border:1px solid rgba(255,255,255,.08);cursor:zoom-in}
.opt-option-result .name{font-size:12px;font-weight:900;color:var(--text);margin-top:8px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.opt-option-result-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.opt-option-result-badges span{display:inline-flex;align-items:center;border:1px solid rgba(99,102,241,.35);background:rgba(99,102,241,.12);border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;color:var(--primary-h)}
.opt-option-result-send-factory{border-color:rgba(129,140,248,.9);background:var(--primary);color:#fff;font-weight:900;box-shadow:0 4px 14px rgba(99,102,241,.22)}
.opt-option-result-send-factory:hover:not(:disabled){border-color:#a5b4fc;background:var(--primary-h);color:#fff}
.opt-option-result-send-factory:disabled{border-color:var(--border);background:var(--bg-card);color:var(--text-d);box-shadow:none}
.opt-option-result-send-factory .material-icons-outlined{font-size:14px}
.opt-option-result .meta{font-size:10px;color:var(--text-m);line-height:1.45;margin-top:3px;word-break:keep-all;overflow-wrap:anywhere}
.opt-option-result-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt-generation-details{margin-top:8px;border:1px solid rgba(255,255,255,.10);border-radius:10px;background:rgba(0,0,0,.18);overflow:hidden}
.opt-generation-details summary{cursor:pointer;list-style:none;padding:8px 9px;font-size:11px;font-weight:900;color:var(--primary-h);display:flex;align-items:center;justify-content:space-between;gap:8px}
.opt-generation-details summary::-webkit-details-marker{display:none}
.opt-generation-details summary:after{content:'expand_more';font-family:'Material Icons Outlined';font-size:16px;color:var(--text-m)}
.opt-generation-details[open] summary:after{content:'expand_less'}
.opt-generation-detail-body{border-top:1px solid rgba(255,255,255,.08);padding:9px;display:grid;gap:9px}
.opt-generation-detail-section{display:grid;gap:5px}
.opt-generation-detail-title{font-size:10px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:4px}
.opt-generation-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:5px}
.opt-generation-detail-kv{border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.03);padding:6px;min-width:0}
.opt-generation-detail-kv .k{font-size:9px;color:var(--text-m);margin-bottom:3px}
.opt-generation-detail-kv .v{font-size:10px;color:var(--text-d);font-weight:800;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.opt-generation-detail-list{display:grid;gap:4px}
.opt-generation-detail-list div{font-size:10px;line-height:1.45;color:var(--text-d);border:1px solid rgba(255,255,255,.07);border-radius:7px;background:rgba(255,255,255,.025);padding:5px 6px;word-break:keep-all;overflow-wrap:anywhere}
.opt-generation-prompt{width:100%;min-height:120px;max-height:220px;background:#05060b;border:1px solid rgba(255,255,255,.10);border-radius:8px;color:var(--text-d);font-family:Consolas,monospace;font-size:10px;line-height:1.45;padding:8px;resize:vertical}
.opt-style-sample-box{margin-top:10px;border:1px solid rgba(99,102,241,.28);border-radius:12px;background:rgba(99,102,241,.07);padding:10px}
.opt-style-sample-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.opt-style-sample-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--text)}
.opt-style-sample-active{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center}
.opt-style-sample-active img{width:92px;height:92px;object-fit:contain;background:#fff;border:1px solid rgba(255,255,255,.10);border-radius:10px}
.opt-style-sample-copy{font-size:12px;color:var(--text-d);line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.opt-style-sample-library{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
.opt-style-sample-card{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;background:rgba(0,0,0,.18);padding:7px}
.opt-style-sample-card img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid rgba(255,255,255,.08)}
.opt-style-sample-card .name{font-size:11px;font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt-style-sample-card .meta{font-size:10px;color:var(--text-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.opt-img-thumb{width:92px;height:92px}.opt-image-preview-overlay{padding:10px}.opt-image-preview-modal{width:98vw;padding:10px}.opt-image-preview-stage{max-height:74vh}}
/* drag card — used in both pool and slots */
.opt-dc{position:relative;border-radius:7px;overflow:hidden;cursor:grab;border:2px solid var(--border);background:var(--bg);transition:border-color .1s,box-shadow .1s;aspect-ratio:1}
.opt-dc:hover{border-color:var(--primary-h)}
.opt-dc img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.opt-dc .opt-dc-tip{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);font-size:9px;color:#fff;padding:2px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.opt-dc:hover .opt-dc-tip{opacity:1}
.opt-dc.sortable-ghost{opacity:.3;background:var(--primary-dim)!important}
.opt-dc.sortable-chosen{border-color:var(--primary);box-shadow:0 0 0 2px rgba(99,102,241,.25)}
/* pool */
.opt-pool-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
.opt-pool-list{display:flex;flex-wrap:wrap;gap:7px;min-height:56px;border-radius:8px;padding:3px;transition:background .15s}
.opt-pool-list .opt-dc{width:64px;height:64px;flex-shrink:0}
/* slot grid */
.opt-slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt-slot-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.opt-slot-card.sortable-ghost{opacity:.35;background:var(--primary-dim)!important;border-color:var(--primary)!important}
.opt-slot-card.sortable-chosen{box-shadow:0 0 0 2px var(--primary)!important}
.opt-slot-head{display:flex;align-items:center;gap:5px;min-height:26px}
.opt-slot-handle{cursor:grab;color:var(--text-m);font-size:17px;line-height:1;flex-shrink:0;padding:1px 2px;user-select:none}
.opt-slot-handle:active{cursor:grabbing}
.opt-slot-num{width:20px;height:20px;border-radius:50%;background:var(--primary-dim);color:var(--primary-h);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt-slot-name-inp{flex:1;min-width:0;background:none;border:none;border-bottom:1px solid transparent;color:var(--text);font-size:12px;font-weight:600;font-family:inherit;padding:1px 3px;border-radius:3px 3px 0 0;outline:none;transition:.15s}
.opt-slot-name-inp:hover{border-bottom-color:var(--border-h)}
.opt-slot-name-inp:focus{border-bottom-color:var(--primary);background:rgba(99,102,241,.07)}
.opt-slot-cnt{font-size:10px;color:var(--text-m);white-space:nowrap;flex-shrink:0}
.opt-slot-del{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-m);cursor:pointer;font-size:13px;padding:0;border-radius:7px;flex:0 0 30px;width:30px;height:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.opt-slot-del:hover{color:var(--err);background:rgba(239,68,68,.12)}
/* slot image list — 2-col grid */
.opt-slot-list{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;min-height:60px;border-radius:8px;padding:2px;align-content:start;transition:background .15s;border:1.5px solid transparent}
.opt-slot-list.drag-over{background:var(--primary-dim);border-color:var(--primary)}
.opt-slot-list.is-empty{border:1.5px dashed var(--border)}
.opt-slot-list.is-empty::before{content:"드롭";display:flex;align-items:center;justify-content:center;color:var(--text-m);font-size:11px;min-height:52px;grid-column:1/-1;pointer-events:none}
/* Token Tracker */
.token-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:11px;z-index:500;flex-wrap:wrap}
.token-bar .tb-label{color:var(--text-m);white-space:nowrap}
.token-bar .tb-val{font-weight:700;font-family:monospace}
.token-bar .sep{color:var(--border);user-select:none}
.token-bar .tb-model{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.token-bar .m-flash{background:rgba(99,102,241,.2);color:var(--primary-h)}
.token-bar .m-img{background:rgba(249,115,22,.2);color:var(--orange)}
.token-bar .tb-cost{color:var(--ok);font-weight:700;font-family:monospace}
.token-bar .tb-reset{cursor:pointer;color:var(--text-m);padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:none;font-size:10px;font-family:inherit}
.token-bar .tb-reset:hover{color:var(--text);border-color:var(--border-h)}
.tb-section-badge{background:rgba(99,102,241,.3);color:var(--primary-h);padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;white-space:nowrap}
.tb-provider{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.tb-provider.g-badge{background:rgba(52,211,153,.2);color:#34d399}
.tb-provider.o-badge{background:rgba(251,191,36,.2);color:#fbbf24}
.tb-op-badge{background:rgba(99,102,241,.15);color:var(--primary-h);padding:1px 5px;border-radius:6px;font-size:9px;white-space:nowrap}
.tb-call-cost{color:#6ee7b7;font-size:10px;font-weight:700;font-family:monospace}
@keyframes tb-flash{0%{transform:scale(1.2);color:#6ee7b7}100%{transform:scale(1);color:var(--ok)}}
.tb-animate{animation:tb-flash .5s ease}
.token-detail-btn{cursor:pointer;color:var(--primary-h);font-size:10px;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;white-space:nowrap}
.token-modal{position:fixed;bottom:44px;right:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:400px;max-width:520px;z-index:600;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.token-modal h3{font-size:14px;font-weight:700;margin-bottom:12px}
.token-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.token-row:last-child{border-bottom:none}
.token-row .model-name{font-family:monospace;font-size:11px;color:var(--text-d)}
.token-tab-btn{cursor:pointer;padding:4px 12px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text-m);font-size:11px;font-family:inherit;transition:all .15s}
.token-tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hist-table{width:100%;border-collapse:collapse;font-size:11px}
.hist-table th{text-align:left;padding:4px 6px;color:var(--text-m);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600}
.hist-table td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.hist-session td{color:var(--text)}
.hist-old td{color:var(--text-d);opacity:.65}
.hist-op{background:rgba(99,102,241,.15);color:var(--primary-h);padding:1px 5px;border-radius:4px;font-size:10px;white-space:nowrap}
/* API status strip */
.api-status-wrap{max-width:1100px;margin:0 auto 10px;display:flex;justify-content:flex-end;position:relative;top:auto;z-index:70;pointer-events:none}
.top-command-row .api-status-wrap{max-width:430px;margin:0;justify-content:flex-end;position:relative;top:auto;z-index:1;pointer-events:none;overflow:hidden}
.top-command-row .api-status-strip{margin:0;max-width:100%;flex-wrap:nowrap;overflow:hidden}
.top-command-row .api-status-chip{display:none}
.top-command-row .api-status-summary{overflow:hidden;text-overflow:ellipsis}
.api-status-strip{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;max-width:100%;padding:7px 9px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(14,16,25,.92);box-shadow:0 10px 28px rgba(0,0,0,.22);backdrop-filter:blur(10px);pointer-events:auto}
.api-status-title{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;color:var(--text-m);white-space:nowrap;margin-right:2px}
.api-status-summary{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;color:var(--text-d);white-space:nowrap}
.api-status-toggle{display:inline-flex;align-items:center;gap:3px;min-height:24px;padding:3px 8px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.045);color:var(--text-d);font-size:10px;font-weight:900;font-family:inherit;cursor:pointer}
.api-status-toggle:hover{border-color:rgba(99,102,241,.45);color:var(--primary-h);background:rgba(99,102,241,.10)}
.api-status-chip{display:inline-flex;align-items:center;gap:5px;min-height:24px;max-width:245px;padding:4px 8px 4px 5px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.035);color:var(--text-d);font-size:10px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.api-status-chip b{color:var(--text);font-weight:900;overflow:hidden;text-overflow:ellipsis}
.api-status-no{width:18px;height:18px;border-radius:999px;background:var(--api-color,#6366f1);color:#07111f;font-size:10px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 5px 12px rgba(0,0,0,.18);flex:0 0 18px}
.api-status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-m);flex:0 0 7px;box-shadow:0 0 0 2px rgba(255,255,255,.04)}
.api-status-chip.ok{border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.08);color:#b7f7c8}
.api-status-chip.ok .api-status-dot{background:var(--ok)}
.api-status-chip.warn{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08);color:#ffd28a}
.api-status-chip.warn .api-status-dot{background:var(--warn)}
.api-status-chip.idle{opacity:.82}
.api-status-chip.idle .api-status-dot{background:var(--text-m)}
.api-status-strip.collapsed .api-status-chip{display:none}
.api-status-strip.collapsed{padding:6px 8px}
/* Factory conveyor */
.factory-page{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.factory-page-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:20px;align-items:start;padding-bottom:48px;width:100%;min-width:0}
