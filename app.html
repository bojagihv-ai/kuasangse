<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
// 파일 변경 감지 자동 새로고침 (로컬 개발용)
(function(){
  if(location.hostname !== '127.0.0.1' && location.hostname !== 'localhost') return;
  let lastModified = null;
  setInterval(async function(){
    try {
      const r = await fetch('/app.html', {method:'HEAD', cache:'no-store'});
      const lm = r.headers.get('last-modified') || r.headers.get('content-length');
      if(lastModified && lm && lastModified !== lm) { location.reload(); return; }
      lastModified = lm || lastModified;
    } catch(e){}
  }, 3000);
})();
</script>
<title>상세페이지 자동 생성기</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#6366f1;--primary-h:#818cf8;--primary-dim:rgba(99,102,241,.15);
  --bg:#0f0f13;--bg-card:#1a1a23;--bg-input:#13131a;
  --border:#2a2a36;--border-h:#3a3a4a;
  --text:#e4e4e7;--text-d:#9494a5;--text-m:#6b6b7b;
  --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --cyan:#06b6d4;--orange:#f97316;
}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fade-in{animation:fadeIn .3s ease-out}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;padding:20px 16px;border-bottom:1px solid var(--border)}
.logo-icon{font-size:28px;color:var(--primary);font-weight:900}
.logo-text{font-weight:700;font-size:15px;line-height:1.3}
.logo-sub{font-weight:400;font-size:12px;color:var(--text-d)}
.nav{padding:12px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;color:var(--text-d);font-size:13px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.03)}
.nav-item.active{background:var(--primary-dim);color:var(--primary-h)}
.nav-item.disabled{opacity:.4;cursor:not-allowed}
.main{flex:1;min-width:0;padding:24px 32px;overflow-y:auto}
.container{max-width:1100px;margin:0 auto}

/* Typography */
.page-title{font-size:26px;font-weight:800;margin-bottom:6px}
.page-desc{font-size:14px;color:var(--text-d);margin-bottom:24px}

/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:16px;padding:40px;text-align:center;cursor:pointer;background:var(--bg-card);margin-bottom:24px;min-height:240px;display:flex;align-items:center;justify-content:center;transition:.2s}
.upload-area:hover{border-color:var(--primary);background:rgba(99,102,241,.03)}
.upload-area.has-image{border-style:solid;border-color:var(--border)}
.preview-img{max-height:300px;max-width:100%;border-radius:12px;object-fit:contain}

/* Form */
.input-group{margin-bottom:20px}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text-d)}
.input,.textarea{width:100%;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border .2s}
.input:focus,.textarea:focus{border-color:var(--primary)}
.textarea{resize:vertical;line-height:1.5;font-size:13px}

/* Buttons */
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary:hover{background:var(--primary-h)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--bg-card);color:var(--text-d);border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-sm:hover{border-color:var(--border-h);color:var(--text)}

/* Cards */
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}
.feature-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center}
.feature-card .mi{font-size:28px;color:var(--primary);margin-bottom:8px}
.feature-card h4{font-weight:600;font-size:14px;margin-bottom:4px}
.feature-card p{font-size:12px;color:var(--text-d)}

/* Analysis Summary */
.analysis-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:24px}
.tag{display:inline-block;padding:3px 10px;background:var(--primary-dim);color:var(--primary-h);border-radius:20px;font-size:11px;font-weight:500;margin:2px}

/* Section Cards */
.section-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.section-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s}
.section-card:hover{border-color:var(--border-h);background:var(--bg-card)}
.section-card .head{display:flex;align-items:center;gap:12px}
.section-card .icon{font-size:28px}
.section-card .info{flex:1}
.section-card .info h4{font-weight:600;font-size:14px}
.section-card .info p{font-size:12px;color:var(--text-d);margin-top:2px}
.custom-badge{margin-top:8px;padding:6px 10px;background:var(--primary-dim);border-radius:6px;font-size:12px;color:var(--primary-h)}

/* Progress */
.progress-outer{width:100%;max-width:400px;height:24px;background:var(--bg-card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));border-radius:12px;transition:width .5s ease;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:40px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
.spinner-lg{width:64px;height:64px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
/* ── Agent Chat ── */
.agent-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(99,102,241,.5);z-index:1000;transition:.2s}
.agent-fab:hover{background:var(--primary-h);transform:scale(1.08)}
.agent-fab .badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:16px;text-align:center}
.agent-panel{position:fixed;bottom:88px;right:24px;width:420px;max-width:calc(100vw - 40px);height:600px;max-height:calc(100vh - 120px);background:var(--bg-card);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;z-index:999;box-shadow:0 8px 40px rgba(0,0,0,.6);overflow:hidden}
.agent-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.agent-msgs::-webkit-scrollbar{width:4px}.agent-msgs::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:2px}
.agent-bubble{max-width:90%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;word-break:break-word}
.agent-bubble.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.agent-bubble.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.agent-action-block{margin-top:8px;padding:8px 10px;background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.25);border-radius:8px;font-size:11px;color:var(--primary-h);font-family:monospace;line-height:1.7}
.agent-input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg)}
.agent-input-row textarea{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px;font-family:'Pretendard','Noto Sans KR',sans-serif;resize:none;line-height:1.5;max-height:120px}
.agent-input-row textarea:focus{outline:none;border-color:var(--primary)}
.agent-cursor{display:inline-block;width:2px;height:1em;background:var(--primary-h);animation:blink .7s step-end infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.gen-icons{margin-top:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gen-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border-radius:10px;font-size:22px;border:1px solid var(--border);transition:.3s}
.gen-icon.done{background:var(--primary-dim);border-color:var(--primary)}

/* Preview */
.preview-wrap{background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.section-ctrl{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-card);border-bottom:1px solid var(--border)}
.section-ctrl .name{font-weight:600;font-size:13px}
.edit-panel{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}

/* Error */
.error-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:var(--err);font-size:13px;margin-bottom:16px}

/* API Key Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:480px;width:90%}
.modal h2{font-size:20px;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text-d);margin-bottom:20px}

/* Image Cuts */
.cuts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.cut-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.cut-card.has-result{border-color:var(--primary)}
.cut-label{font-size:13px;font-weight:700;color:var(--primary)}
.cut-preview{width:100%;aspect-ratio:4/3;border-radius:8px;object-fit:cover;background:var(--bg-input);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-m);font-size:12px;overflow:hidden}
.cut-preview img{width:100%;height:100%;object-fit:cover}
.cut-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:auto}
.source-upload{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:var(--bg-card);transition:.2s;margin-bottom:0px;position:relative}
.source-upload:hover{border-color:var(--primary)}
.placement-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.placement-row:last-child{border-bottom:none}
.placement-select{background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:12px;font-family:inherit;outline:none}
.cut-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--border);background:var(--bg-input)}

/* Automation */
.auto-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.auto-card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.auto-status{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.auto-status.running{background:rgba(34,197,94,.15);color:var(--ok)}
.auto-status.stopped{background:rgba(239,68,68,.15);color:var(--err)}
.auto-status.waiting{background:rgba(245,158,11,.15);color:var(--warn)}
.folder-pick{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;min-height:44px}
.folder-pick:hover{border-color:var(--primary)}
.folder-pick .name{flex:1;font-size:13px;color:var(--text)}
.folder-pick .placeholder{flex:1;font-size:13px;color:var(--text-m)}
.queue-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.queue-item:last-child{border-bottom:none}
.queue-item .q-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.queue-item .q-status.pending{background:var(--text-m)}
.queue-item .q-status.processing{background:var(--warn);animation:pulse 1s infinite}
.queue-item .q-status.done{background:var(--ok)}
.queue-item .q-status.error{background:var(--err)}
.log-box{background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.8}
.log-line{color:var(--text-d)}
.log-line.ok{color:var(--ok)}
.log-line.err{color:var(--err)}
.log-line.info{color:var(--cyan)}
.interval-slider{width:100%;accent-color:var(--primary)}

/* Token Tracker */
.token-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:11px;z-index:500;flex-wrap:wrap}
.token-bar .tb-label{color:var(--text-m);white-space:nowrap}
.token-bar .tb-val{font-weight:700;font-family:monospace}
.token-bar .sep{color:var(--border);user-select:none}
.token-bar .tb-model{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.token-bar .m-flash{background:rgba(99,102,241,.2);color:var(--primary-h)}
.token-bar .m-img{background:rgba(249,115,22,.2);color:var(--orange)}
.token-bar .tb-cost{color:var(--ok);font-weight:700;font-family:monospace}
.token-bar .tb-reset{cursor:pointer;color:var(--text-m);padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:none;font-size:10px;font-family:inherit}
.token-bar .tb-reset:hover{color:var(--text);border-color:var(--border-h)}
.tb-section-badge{background:rgba(99,102,241,.3);color:var(--primary-h);padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;white-space:nowrap}
.tb-provider{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;white-space:nowrap}
.tb-provider.g-badge{background:rgba(52,211,153,.2);color:#34d399}
.tb-provider.o-badge{background:rgba(251,191,36,.2);color:#fbbf24}
.tb-op-badge{background:rgba(99,102,241,.15);color:var(--primary-h);padding:1px 5px;border-radius:6px;font-size:9px;white-space:nowrap}
.tb-call-cost{color:#6ee7b7;font-size:10px;font-weight:700;font-family:monospace}
@keyframes tb-flash{0%{transform:scale(1.2);color:#6ee7b7}100%{transform:scale(1);color:var(--ok)}}
.tb-animate{animation:tb-flash .5s ease}
.token-detail-btn{cursor:pointer;color:var(--primary-h);font-size:10px;text-decoration:underline;background:none;border:none;font-family:inherit;padding:0;white-space:nowrap}
.token-modal{position:fixed;bottom:44px;right:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:400px;max-width:520px;z-index:600;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.token-modal h3{font-size:14px;font-weight:700;margin-bottom:12px}
.token-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.token-row:last-child{border-bottom:none}
.token-row .model-name{font-family:monospace;font-size:11px;color:var(--text-d)}
.token-tab-btn{cursor:pointer;padding:4px 12px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text-m);font-size:11px;font-family:inherit;transition:all .15s}
.token-tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.hist-table{width:100%;border-collapse:collapse;font-size:11px}
.hist-table th{text-align:left;padding:4px 6px;color:var(--text-m);border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600}
.hist-table td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.hist-session td{color:var(--text)}
.hist-old td{color:var(--text-d);opacity:.65}
.hist-op{background:rgba(99,102,241,.15);color:var(--primary-h);padding:1px 5px;border-radius:4px;font-size:10px;white-space:nowrap}
/* Model Settings */
.provider-tabs{display:flex;gap:8px;margin-bottom:20px}
.provider-tab{flex:1;padding:14px;border-radius:10px;border:2px solid var(--border);background:var(--bg-card);cursor:pointer;text-align:center;transition:.15s}
.provider-tab:hover{border-color:var(--border-h)}
.provider-tab.active-gemini{border-color:#6366f1;background:rgba(99,102,241,.1)}
.provider-tab.active-openai{border-color:#10a37f;background:rgba(16,163,127,.1)}
.provider-tab .pt-icon{font-size:22px;font-weight:900;margin-bottom:4px}
.provider-tab .pt-label{font-size:13px;font-weight:700}
.provider-tab .pt-sub{font-size:11px;color:var(--text-m);margin-top:2px}
.model-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.model-card{padding:12px 14px;border-radius:8px;border:2px solid var(--border);background:var(--bg-card);cursor:pointer;transition:.15s}
.model-card:hover{border-color:var(--border-h)}
.model-card.selected{border-color:var(--primary);background:var(--primary-dim)}
.model-card.selected-green{border-color:#10a37f;background:rgba(16,163,127,.1)}
.model-card .mc-label{font-size:13px;font-weight:700;margin-bottom:2px}
.model-card .mc-id{font-size:10px;font-family:monospace;color:var(--text-m)}
.model-card .mc-desc{font-size:11px;color:var(--text-d);margin-top:4px}
.model-card .mc-price{font-size:10px;color:var(--warn);margin-top:4px}
.settings-section{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.settings-section h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cur-model-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-left:8px}
.cur-model-badge.gemini{background:rgba(99,102,241,.2);color:var(--primary-h)}
.cur-model-badge.openai{background:rgba(16,163,127,.2);color:#10a37f}

/* Competitor Analysis */
.comp-mode-tab{padding:10px 4px;background:var(--bg-card);border:none;color:var(--text-m);cursor:pointer;font-size:13px;font-weight:500;transition:background .15s,color .15s;border-right:1px solid var(--border)}
.comp-mode-tab:last-child{border-right:none}
.comp-mode-tab.active{background:var(--primary);color:#fff;font-weight:700}
.comp-drop-zone{border:2px dashed var(--border);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.comp-drop-zone:hover{border-color:var(--primary);background:rgba(99,102,241,.05)}
.comp-file-input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px}
.comp-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.comp-card-title{font-weight:700;font-size:13px;color:var(--text);margin-bottom:8px}
.comp-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(99,102,241,.12);color:var(--primary-h);margin:2px}
.comp-tag-green{background:rgba(72,187,120,.15);color:#48bb78}
.comp-tag-red{background:rgba(229,62,62,.12);color:#e53e3e}
.comp-tag-primary{background:rgba(99,102,241,.15);color:var(--primary-h)}
.comp-section-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:opacity .2s}
.comp-section-disabled{opacity:.5}
.comp-plan-input{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;line-height:1.5;resize:vertical;box-sizing:border-box}
.comp-toggle-wrap{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.comp-toggle-wrap input{opacity:0;width:0;height:0}
.comp-toggle-slider{position:absolute;cursor:pointer;inset:0;background:#555;border-radius:20px;transition:.2s}
.comp-toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.comp-toggle-wrap input:checked+.comp-toggle-slider{background:var(--primary)}
.comp-toggle-wrap input:checked+.comp-toggle-slider:before{transform:translateX(16px)}

/* Responsive */
@media(max-width:900px){
  .feature-grid{grid-template-columns:repeat(2,1fr)}
  .section-grid{grid-template-columns:1fr}
  .sidebar{width:60px;overflow:hidden}
  .sidebar .logo-text,.sidebar .logo-sub,.sidebar .nav-item span:last-child{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ════════════════════════════════════════════════════════════════
// SECTION DEFINITIONS (15 sections)
// ════════════════════════════════════════════════════════════════
const SECTIONS = [
  {n:1,name:"헤더 (Header)",id:"header",purpose:"제품을 깔끔한 화이트톤 배경으로 강조. 제품명을 상단에 크고 임팩트 있게 표시.",desc:"화이트 배경 + 제품 중앙 배치 + 제품명 강조",icon:"🎯"},
  {n:2,name:"훅 (Hook)",id:"hook",purpose:"구매 욕구를 자극하는 강렬한 비주얼과 카피. 고객의 페인포인트를 건드리고 제품이 해결책임을 암시.",desc:"구매 욕구 자극 훅 메시지 + 감성 이미지",icon:"🪝"},
  {n:3,name:"핵심 특징 (Key Features)",id:"key_features",purpose:"제품의 핵심 특장점 3~5가지를 아이콘/이미지와 함께 명확하게 전달.",desc:"핵심 특장점 3~5가지 아이콘+텍스트 그리드",icon:"⭐"},
  {n:4,name:"상세 스펙 (Specifications)",id:"specifications",purpose:"제품의 상세 사양, 크기, 재질, 무게 등 구체적인 정보 제공.",desc:"상세 사양 테이블 + 제품 디테일 이미지",icon:"📐"},
  {n:5,name:"사용 시나리오 (Use Scenarios)",id:"use_scenarios",purpose:"다양한 사용 상황을 보여주어 고객이 자신의 라이프스타일에서 제품을 상상할 수 있게 함.",desc:"라이프스타일 이미지 + 사용 상황 텍스트",icon:"🏠"},
  {n:6,name:"비교 우위 (Competitive Edge)",id:"competitive_edge",purpose:"경쟁 제품 대비 우위점을 시각적으로 비교.",desc:"경쟁사 대비 비교표 또는 Before/After",icon:"🏆"},
  {n:7,name:"소재/기술 (Material & Tech)",id:"material_tech",purpose:"사용된 소재의 우수성이나 특허 기술 등을 시각적으로 설명.",desc:"소재/기술력 강조 다크톤 섹션",icon:"🔬"},
  {n:8,name:"인증/수상 (Certifications)",id:"certifications",purpose:"제품이 받은 인증, 수상 내역, 테스트 결과 등으로 신뢰도 구축.",desc:"인증마크/수상내역 배지 나열",icon:"🏅"},
  {n:9,name:"리뷰/후기 (Reviews)",id:"reviews",purpose:"실제 사용자 후기를 활용한 사회적 증거.",desc:"고객 리뷰 카드 레이아웃",icon:"💬"},
  {n:10,name:"크기/컬러 가이드",id:"size_color",purpose:"사이즈 차트, 컬러 옵션 등 선택에 도움되는 정보 제공.",desc:"사이즈표 + 컬러 스와치 옵션",icon:"🎨"},
  {n:11,name:"프로모션 (Promotion)",id:"promotion",purpose:"특별 할인, 세트 구성, 사은품 등 구매 촉진 이벤트 섹션.",desc:"할인/이벤트/세트 구성 프로모션 배너",icon:"🎁"},
  {n:12,name:"배송/포장 (Shipping)",id:"shipping",purpose:"배송 정보, 포장 상태, 언박싱 경험 등을 보여줌.",desc:"배송정보 + 패키징 이미지",icon:"📦"},
  {n:13,name:"FAQ (자주 묻는 질문)",id:"faq",purpose:"고객들이 자주 묻는 질문을 미리 답변하여 구매 불안 해소.",desc:"아코디언 형식 FAQ 섹션",icon:"❓"},
  {n:14,name:"브랜드 스토리",id:"brand_story",purpose:"브랜드의 철학, 스토리, 가치를 전달하여 감성적 연결 형성.",desc:"브랜드 스토리텔링 다크 섹션",icon:"📖"},
  {n:15,name:"CTA 푸터 (Footer)",id:"cta_footer",purpose:"최종 구매 결정을 유도하는 강력한 CTA.",desc:"최종 CTA + 가격 + 구매버튼",icon:"🛒"},
];

// ════════════════════════════════════════════════════════════════
// MODEL CONFIG SYSTEM
// ════════════════════════════════════════════════════════════════
// LLM 프로바이더 및 모델 목록 정의
const LLM_PROVIDERS = {
  gemini: {
    label: 'Google Gemini',
    icon: '✦',
    color: '#6366f1',
    models: [
      { id: 'gemini-2.5-flash',       label: 'Gemini 2.5 Flash',       desc: 'Vertex 권장 기본값',      inputPerM: 0.10,  outputPerM: 0.40  },
      { id: 'gemini-2.5-flash-lite',  label: 'Gemini 2.5 Flash Lite',  desc: '저비용 대량 처리',        inputPerM: 0.075, outputPerM: 0.30  },
      { id: 'gemini-2.5-pro',         label: 'Gemini 2.5 Pro',         desc: '고성능 추론/전략',        inputPerM: 1.25,  outputPerM: 10.00 },
    ],
  },
  openai: {
    label: 'OpenAI ChatGPT',
    icon: '◆',
    color: '#10a37f',
    models: [
      { id: 'gpt-5.4-mini',   label: 'GPT-5.4 mini',   desc: '가성비(기본추천) · 실무 전반',      inputPerM: 0.75,  outputPerM: 4.50  },
      { id: 'gpt-5.4',        label: 'GPT-5.4',        desc: '최고성능 · 복잡한 추론/전략',      inputPerM: 2.50,  outputPerM: 15.00 },
      { id: 'gpt-5.4-nano',   label: 'GPT-5.4 nano',   desc: '최저비용 · 무료티어/대량 처리용',   inputPerM: 0.20,  outputPerM: 1.25  },
      { id: 'gpt-5.3-codex',  label: 'GPT-5.3-Codex',  desc: '코딩특화 · 에이전틱 생성',         inputPerM: 1.75,  outputPerM: 14.00 },
      { id: 'gpt-4.1-nano', label: 'GPT-4.1 nano', desc: '초저비용 · 1M 컨텍스트',    inputPerM: 0.10,  outputPerM: 0.40  },
      { id: 'gpt-4.1-mini', label: 'GPT-4.1 mini', desc: '저비용 · 1M 컨텍스트',      inputPerM: 0.40,  outputPerM: 1.60  },
      { id: 'gpt-4o-mini',  label: 'GPT-4o mini',  desc: '빠름 · 멀티모달',           inputPerM: 0.15,  outputPerM: 0.60  },
    ],
  },
};

// 이미지 생성 모델 목록 (Gemini 전용)
const IMAGE_MODELS = [
  { id: 'gemini-3.1-flash-image-preview',       label: '나노바나나2 (Gemini 3.1 Flash Image)', desc: '빠름 · 기본값',  inputPerM: 0.10,  outputPerM: 0.40,  imageOut: 0.02  },
  { id: 'gemini-3-pro-image-preview',       label: 'Gemini 3 Pro Image Preview', desc: '최고품질',  inputPerM: 3.50,  outputPerM: 10.50, imageOut: 0.039 },
  { id: 'gemini-2.5-flash-image', label: 'Gemini 2.5 Flash Image', desc: 'Vertex 권장 대안', inputPerM: 0.10,  outputPerM: 0.40,  imageOut: 0.02  },
];

// 설정 저장/불러오기
function normalizeModelConfig(cfg) {
  const c = { ...(cfg || {}) };
  const provider = c.llmProvider === 'gemini' || c.llmProvider === 'openai' ? c.llmProvider : 'openai';
  c.llmProvider = provider;

  const allowedLlm = (LLM_PROVIDERS[provider]?.models || []).map(m => m.id);
  if (!allowedLlm.includes(c.llmModel)) c.llmModel = allowedLlm[0] || (provider === 'openai' ? 'gpt-5.4-nano' : 'gemini-2.5-flash');

  const allowedImg = IMAGE_MODELS.map(m => m.id);
  if (!allowedImg.includes(c.imageModel)) c.imageModel = allowedImg[0] || 'gemini-3.1-flash-image-preview';

  c.imageSizeMode = c.imageSizeMode === 'custom' ? 'custom' : 'auto';
  const w = Number.parseInt(c.imageWidth, 10);
  c.imageWidth = Number.isFinite(w) ? Math.max(64, Math.min(4096, w)) : 860;
  if (c.imageHeight == null || c.imageHeight === '') {
    c.imageHeight = null;
  } else {
    const h = Number.parseInt(c.imageHeight, 10);
    c.imageHeight = Number.isFinite(h) ? Math.max(64, Math.min(4096, h)) : null;
  }
  return c;
}

function saveModelConfig(cfg) {
  try { localStorage.setItem('model_config', JSON.stringify(normalizeModelConfig(cfg))); } catch(e) {}
}
function loadModelConfig() {
  try {
    const raw = localStorage.getItem('model_config');
    if (raw) return normalizeModelConfig(JSON.parse(raw));
  } catch(e) {}
  return normalizeModelConfig({
    llmProvider: 'openai',
    llmModel: 'gpt-5.4-nano',
    imageModel: 'gemini-3.1-flash-image-preview',
    openaiKey: '',
    imageSizeMode: 'auto',   // 'auto' | 'custom'
    imageWidth: 860,          // px (custom 모드 시 사용)
    imageHeight: null,        // px or null (null = 비율 자동 유지)
  });
}
function saveOpenAIKey(key) {
  try { localStorage.setItem('openai_api_key', key); } catch(e) {}
}
function loadOpenAIKey() {
  try { return localStorage.getItem('openai_api_key') || ''; } catch(e) { return ''; }
}

// ════════════════════════════════════════════════════════════════
// TOKEN / COST TRACKER
// ════════════════════════════════════════════════════════════════
// 가격표를 동적으로 구성 (LLM_PROVIDERS + IMAGE_MODELS 기반)
function buildModelPricing() {
  const pricing = {};
  for (const prov of Object.values(LLM_PROVIDERS)) {
    for (const m of prov.models) {
      pricing[m.id] = { inputPerM: m.inputPerM, outputPerM: m.outputPerM, label: m.label, type: 'text' };
    }
  }
  for (const m of IMAGE_MODELS) {
    pricing[m.id] = { inputPerM: m.inputPerM, outputPerM: m.outputPerM, imageOut: m.imageOut, label: m.label, type: 'image' };
  }
  return pricing;
}
const MODEL_PRICING = buildModelPricing();

const tokenTracker = {
  sessions: {},      // modelId → { inputTokens, outputTokens, calls, imageCount, costUSD }
  callHistory: [],   // [{ts, model, label, provider, inputTokens, outputTokens, costUSD, op}]
  sessionStart: Date.now(),
  activeTab: 'stats',
  showDetail: false,

  record(modelId, inputTokens, outputTokens, isImage = false, op = '') {
    if (!this.sessions[modelId]) {
      this.sessions[modelId] = { inputTokens: 0, outputTokens: 0, calls: 0, imageCount: 0, costUSD: 0 };
    }
    const s = this.sessions[modelId];
    s.inputTokens  += inputTokens  || 0;
    s.outputTokens += outputTokens || 0;
    s.calls++;
    if (isImage) s.imageCount++;

    const p = MODEL_PRICING[modelId];
    if (p) {
      const inCost  = (s.inputTokens  / 1_000_000) * p.inputPerM;
      const outCost = (s.outputTokens / 1_000_000) * p.outputPerM;
      const imgCost = p.imageOut ? s.imageCount * p.imageOut : 0;
      s.costUSD = inCost + outCost + imgCost;
    }

    // 이번 호출 단건 비용
    let callCost = 0;
    if (p) {
      callCost  = ((inputTokens  || 0) / 1_000_000) * p.inputPerM;
      callCost += ((outputTokens || 0) / 1_000_000) * p.outputPerM;
      if (isImage && p.imageOut) callCost += p.imageOut;
    }

    const provider = modelId.startsWith('gemini') ? 'Gemini' : 'OpenAI';
    this.callHistory.push({
      ts: Date.now(),
      model: modelId,
      label: p?.label || modelId,
      provider,
      inputTokens:  inputTokens  || 0,
      outputTokens: outputTokens || 0,
      costUSD: callCost,
      op: op || (isImage ? '이미지생성' : '텍스트'),
    });
    if (this.callHistory.length > 200) this.callHistory.shift();

    this.save();
    this.renderBar();
  },

  totals() {
    let totalIn = 0, totalOut = 0, totalCost = 0, totalCalls = 0;
    for (const s of Object.values(this.sessions)) {
      totalIn    += s.inputTokens;
      totalOut   += s.outputTokens;
      totalCost  += s.costUSD;
      totalCalls += s.calls;
    }
    return { totalIn, totalOut, totalCost, totalCalls };
  },

  sessionTotals() {
    let sIn = 0, sOut = 0, sCost = 0, sCalls = 0, gCost = 0, oCost = 0;
    for (const h of this.callHistory) {
      if (h.ts >= this.sessionStart) {
        sIn    += h.inputTokens;
        sOut   += h.outputTokens;
        sCost  += h.costUSD;
        sCalls++;
        if (h.provider === 'Gemini') gCost += h.costUSD;
        else oCost += h.costUSD;
      }
    }
    return { sIn, sOut, sCost, sCalls, gCost, oCost };
  },

  save() {
    try {
      localStorage.setItem('token_tracker', JSON.stringify(this.sessions));
      localStorage.setItem('token_history', JSON.stringify(this.callHistory.slice(-100)));
    } catch(e) {}
  },

  load() {
    try {
      const raw = localStorage.getItem('token_tracker');
      if (raw) this.sessions = JSON.parse(raw);
      const hist = localStorage.getItem('token_history');
      if (hist) this.callHistory = JSON.parse(hist);
    } catch(e) {}
  },

  reset() {
    this.sessions = {};
    this.callHistory = [];
    this.sessionStart = Date.now();
    try {
      localStorage.removeItem('token_tracker');
      localStorage.removeItem('token_history');
    } catch(e) {}
    this.renderBar();
  },

  renderBar() {
    let bar = document.getElementById('tokenBar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'tokenBar';
      bar.className = 'token-bar';
      document.body.appendChild(bar);
    }

    const { totalCost } = this.totals();
    const { sIn, sOut, sCost, sCalls, gCost, oCost } = this.sessionTotals();
    const fmtN   = n => n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n);
    const fmtUSD = d => d < 0.0001 ? '$0.0000' : '$' + d.toFixed(4);
    const fmtKRW = d => '≈₩' + Math.round(d * 1380).toLocaleString();

    const lastCall = this.callHistory[this.callHistory.length - 1];
    const lastLabel = lastCall?.label || '-';
    const lastOp    = lastCall?.op    || '';
    const isImg = lastCall && MODEL_PRICING[lastCall.model]?.type === 'image';
    const hasCumul = totalCost > 0 && Math.abs(sCost - totalCost) > 0.00005;

    bar.innerHTML = `
      <span class="tb-label">💰 세션비용</span>
      <span class="tb-cost tb-animate" id="tbCostSession">${fmtUSD(sCost)}</span>
      <span style="color:var(--warn);font-family:monospace;font-size:10px;font-weight:700">${fmtKRW(sCost)}</span>
      ${hasCumul ? `<span class="sep">│</span><span class="tb-label">누적</span><span class="tb-cost" style="opacity:.55">${fmtUSD(totalCost)}</span>` : ''}
      ${gCost > 0.00001 ? `<span class="tb-provider g-badge" title="Gemini">G ${fmtUSD(gCost)}</span>` : ''}
      ${oCost > 0.00001 ? `<span class="tb-provider o-badge" title="OpenAI">O ${fmtUSD(oCost)}</span>` : ''}
      <span class="sep">│</span>
      <span class="tb-label">토큰</span>
      <span class="tb-val">${fmtN(sIn)}↑ ${fmtN(sOut)}↓</span>
      <span class="sep">│</span>
      <span class="tb-label">호출</span>
      <span class="tb-val">${sCalls}회</span>
      ${lastCall ? `
        <span class="sep">│</span>
        ${lastOp ? `<span class="tb-op-badge">${lastOp}</span>` : ''}
        <span class="tb-model ${isImg?'m-img':'m-flash'}">${lastLabel}</span>
        <span class="tb-call-cost">+${fmtUSD(lastCall.costUSD)}</span>
      ` : ''}
      <span class="sep">│</span>
      <button class="token-detail-btn" id="tbDetailBtn">내역 ▲</button>
      <button class="tb-reset" id="tbResetBtn">초기화</button>
    `;

    const main = document.querySelector('.main');
    if (main) main.style.paddingBottom = '52px';

    // 신규 호출 시 flash
    const el = document.getElementById('tbCostSession');
    if (el && sCalls > 0) { el.classList.remove('tb-animate'); void el.offsetWidth; el.classList.add('tb-animate'); }

    document.getElementById('tbDetailBtn')?.addEventListener('click', () => {
      this.showDetail = !this.showDetail;
      this.renderDetail();
    });
    document.getElementById('tbResetBtn')?.addEventListener('click', () => {
      if (confirm('토큰 사용 기록을 초기화할까요?')) this.reset();
    });
  },

  renderDetail() {
    let modal = document.getElementById('tokenModal');
    if (!this.showDetail) { modal?.remove(); return; }

    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'tokenModal';
      modal.className = 'token-modal';
      document.body.appendChild(modal);
    }

    const fmtUSD = d => '$' + d.toFixed(5);
    const fmtKRW = d => '₩' + Math.round(d * 1380).toLocaleString();
    const fmtN   = n => n.toLocaleString();

    // 모델별 통계 탭
    let rows = '';
    for (const [modelId, s] of Object.entries(this.sessions)) {
      const p   = MODEL_PRICING[modelId];
      const lbl = p?.label || modelId;
      const typ = p?.type  || 'text';
      rows += `
        <div class="token-row">
          <div>
            <div style="font-weight:600">${lbl}</div>
            <div class="model-name">${modelId}</div>
          </div>
          <div style="text-align:right;font-size:11px;line-height:1.8">
            <div>입력 <b>${fmtN(s.inputTokens)}</b> tok</div>
            <div>출력 <b>${fmtN(s.outputTokens)}</b> tok</div>
            ${typ==='image' ? `<div>이미지 <b>${s.imageCount}</b>장</div>` : ''}
            <div>호출 <b>${s.calls}</b>회</div>
            <div style="color:var(--ok);font-weight:700">${fmtUSD(s.costUSD)} ${fmtKRW(s.costUSD)}</div>
          </div>
        </div>`;
    }

    // 호출 이력 탭 (최신 50건)
    const recent = [...this.callHistory].reverse().slice(0, 50);
    let histRows = '';
    for (const h of recent) {
      const t = new Date(h.ts);
      const timeStr = t.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      const isSess  = h.ts >= this.sessionStart;
      histRows += `
        <tr class="${isSess ? 'hist-session' : 'hist-old'}">
          <td>${timeStr}</td>
          <td><span class="hist-op">${h.op||'-'}</span></td>
          <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${h.label}">${h.label}</td>
          <td style="font-family:monospace">${fmtN(h.inputTokens)}</td>
          <td style="font-family:monospace">${fmtN(h.outputTokens)}</td>
          <td style="color:var(--ok);font-weight:600;font-family:monospace">${fmtUSD(h.costUSD)}</td>
        </tr>`;
    }

    const { totalCost } = this.totals();
    const { sCost, sCalls } = this.sessionTotals();
    const tab = this.activeTab;

    modal.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">📊 API 사용량 실시간 추적</h3>
        <span style="cursor:pointer;font-size:18px;color:var(--text-m)" id="closeTokenModal">✕</span>
      </div>

class GeminiAPI {
  constructor(apiKeyOrOptions, model) {
    const isObject = apiKeyOrOptions && typeof apiKeyOrOptions === 'object';
    this.apiKey = isObject ? (apiKeyOrOptions.apiKey || '') : (apiKeyOrOptions || '');
    this.model = isObject
      ? (apiKeyOrOptions.model || model || 'gemini-2.5-flash')
      : (model || 'gemini-2.5-flash');
    this.backendBaseUrl = (isObject ? apiKeyOrOptions.backendBaseUrl : '') || '';
    this.baseUrl = 'https://generativelanguage.googleapis.com/v1beta';
  }

  _normalizeBackendUrl() {
    return (this.backendBaseUrl || '').replace(/\/+$/, '');
  }

  _hasBackendRoute() {
    return !!this._normalizeBackendUrl();
  }

  async _generateContent(model, body) {
    if (this._hasBackendRoute()) {
      const backendUrl = this._normalizeBackendUrl();
      const res = await fetch(`${backendUrl}/api/gemini/generate-content`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model, ...body }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data?.error?.message || data?.error || `HTTP ${res.status}`);
      return data;
    }

    if (!this.apiKey) {
      throw new Error('Gemini API key is required when backend URL is not set.');
    }

    const res = await fetch(`${this.baseUrl}/models/${model}:generateContent?key=${this.apiKey}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data?.error?.message || data?.error || `HTTP ${res.status}`);
    return data;
  }

  async generateImage(prompt, productImageBase64, mimeType, imageModel) {
    const imgMod = imageModel || getImageModel();
    const cfg = state.modelConfig;
    const sizeHint = (cfg.imageSizeMode === 'custom' && cfg.imageWidth)
      ? `Exact size: ${cfg.imageWidth}px wide${cfg.imageHeight ? ' × ' + cfg.imageHeight + 'px tall' : ''}.`
      : 'Size: 860px wide.';
    const activeDirectives = (state.imageDirectives||[]).filter(d=>d.active).map(d=>d.text);
    const directiveStr = activeDirectives.length > 0
      ? `\n\nCRITICAL CONSTRAINTS — you MUST follow these exactly, no exceptions:\n${activeDirectives.map((d,i)=>`${i+1}. ${d}`).join('\n')}`
      : '';
    const parts = [
      { text: `Create a professional Korean e-commerce product detail page section image. ${prompt} Style: clean, modern, high-end Korean shopping mall aesthetic. ${sizeHint}${directiveStr}` }
    ];
    if (productImageBase64) {
      parts.push({ inline_data: { mime_type: mimeType, data: productImageBase64 } });
    }

    const body = {
      contents: [{ parts }],
      generationConfig: {
        temperature: 0.8,
        responseModalities: ["TEXT", "IMAGE"]
      }
    };

    try {
      const data = await this._generateContent(imgMod, body);
      tokenTracker.record(imgMod, data.usageMetadata?.promptTokenCount, data.usageMetadata?.candidatesTokenCount, true, '이미지생성');

      for (const part of data.candidates[0].content.parts) {
        let raw = null;
        if (part.inlineData && part.inlineData.mimeType?.startsWith('image/')) {
          raw = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
        } else if (part.inline_data && part.inline_data.mime_type?.startsWith('image/')) {
          raw = `data:${part.inline_data.mime_type};base64,${part.inline_data.data}`;
        }
        if (raw) return await applyImageSizeConfig(raw);
      }
      return null;
    } catch (e) {
      console.warn('Image generation failed:', e.message);
      return null;
    }
  }

// IMAGE RESIZE HELPER (Canvas API — 정확한 픽셀 강제)
// ════════════════════════════════════════════════════════════════
function resizeImageDataUrl(dataUrl, targetW, targetH) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const ratio = img.naturalWidth / img.naturalHeight;
        const w = Math.round(targetW);
        // targetH가 null이면 가로/세로 비율 유지
        const h = (targetH != null) ? Math.round(targetH) : Math.round(w / ratio);
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        // 선명한 렌더링을 위해 이중 패스 다운스케일
        if (img.naturalWidth > w * 2 || img.naturalHeight > h * 2) {
          const tmp = document.createElement('canvas');
          tmp.width = Math.round(img.naturalWidth / 2);
          tmp.height = Math.round(img.naturalHeight / 2);
          tmp.getContext('2d').drawImage(img, 0, 0, tmp.width, tmp.height);
          ctx.drawImage(tmp, 0, 0, w, h);
        } else {
          ctx.drawImage(img, 0, 0, w, h);
        }
        resolve(canvas.toDataURL('image/png'));
      } catch(e) {
        // 리사이즈 실패 시 원본 반환
        console.warn('resizeImageDataUrl failed, using original:', e);
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl); // 로드 실패 시 원본 반환
    img.src = dataUrl;
  });
}

// 현재 설정에 따라 이미지를 리사이즈 (auto 모드면 그냥 반환)
async function applyImageSizeConfig(dataUrl) {
  const cfg = state.modelConfig;
  if (!dataUrl || cfg.imageSizeMode !== 'custom' || !cfg.imageWidth) return dataUrl;
  return resizeImageDataUrl(dataUrl, cfg.imageWidth, cfg.imageHeight || null);
}

// LLM ROUTER — 선택된 프로바이더/모델로 자동 분기
// ════════════════════════════════════════════════════════════════
function getLLMClient() {
  const cfg = normalizeModelConfig(state.modelConfig);
  state.modelConfig = cfg;
  if (cfg.llmProvider === 'openai') {
    if (!state.openaiKey) throw new Error('OpenAI API 키가 설정되지 않았습니다. 모델 설정에서 입력해주세요.');
    return new OpenAIAPI(state.openaiKey, cfg.llmModel);
  }
  if (!hasGeminiConnection()) throw new Error('Gemini 연결 설정(API Key 또는 Backend URL)이 필요합니다.');
  return createGeminiClient(cfg.llmModel);
}

function hasGeminiConnection() {
  return !!((state.backendBaseUrl && state.backendBaseUrl.trim()) || state.apiKey);
}

function createGeminiClient(model) {
  return new GeminiAPI({
    apiKey: state.apiKey,
    model: model || state.modelConfig.llmModel,
    backendBaseUrl: state.backendBaseUrl,
  });
}

function getImageModel() {
  return state.modelConfig.imageModel || 'gemini-3.1-flash-image-preview';
}

function cssFontFamily(value, fallback = "'Pretendard','Noto Sans KR',sans-serif") {
  const raw = String(value || '').trim();
  if (!raw) return fallback;
  // Prevent style-break/injection while allowing Korean/space/comma font names.
  const cleaned = raw.replace(/[<>`\\]/g, '').replace(/;/g, '').trim();
  if (!cleaned) return fallback;
  if (cleaned.includes(',') || /^['"].*['"]$/.test(cleaned)) return cleaned;
  return `'${cleaned}'`;
}

// ════════════════════════════════════════════════════════════════
// PERSISTENT STORAGE (works on file:// too)
// ════════════════════════════════════════════════════════════════
function saveKey(key) {
  try { localStorage.setItem('gemini_api_key', key); } catch(e) {}
  try { document.cookie = `gemini_api_key=${encodeURIComponent(key)};max-age=31536000;path=/;SameSite=Lax`; } catch(e) {}
}
function loadKey() {
  let k = '';
  try { k = localStorage.getItem('gemini_api_key') || ''; } catch(e) {}
  if (!k) {
    try {
      const m = document.cookie.match(/gemini_api_key=([^;]+)/);
      if (m) k = decodeURIComponent(m[1]);
    } catch(e) {}
  }
  return k;
}

function saveBackendUrl(url) {
  try { localStorage.setItem('gemini_backend_url', url || ''); } catch(e) {}
}

function loadBackendUrl() {
  try {
    const stored = localStorage.getItem('gemini_backend_url') || '';
    // 4000은 sachyosangse API (pdp 전용) — GeminiClient backendUrl로 쓰면 안 됨, 5050으로 리셋
    if (!stored || stored.includes(':4000')) {
      localStorage.setItem('gemini_backend_url', 'http://127.0.0.1:5050');
      return 'http://127.0.0.1:5050';
    }
    return stored;
  } catch(e) { return 'http://127.0.0.1:5050'; }
}

function defaultServerAutomationApiBase() {
  return 'http://127.0.0.1:4000/v1';
}

function normalizeServerAutomationApiBase(url) {
  let base = (url || '').trim();
  if (!base) return defaultServerAutomationApiBase();
  base = base.replace(/\/+$/, '');
  if (!/\/v1$/i.test(base)) base += '/v1';
  return base;
}

function loadServerAutomationApiBase() {
  try {
    const stored = localStorage.getItem('server_auto_api_base') || '';
    // migrate: if stored value points to wrong port (5050), reset to default
    if (stored.includes(':5050')) {
      localStorage.removeItem('server_auto_api_base');
      return defaultServerAutomationApiBase();
    }
    return normalizeServerAutomationApiBase(stored);
  } catch(e) {
    return 'http://127.0.0.1:4000/v1';
  }
}

function loadDraftCuts() {
  try {
    const raw = localStorage.getItem('server_cuts_draft');
    if (!raw) return Array.from({length: 10}, () => ({label: '', prompt: ''}));
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return Array.from({length: 10}, () => ({label: '', prompt: ''}));
    const arr = parsed.slice(0, 10).map(item => ({
      label: String(item?.label || ''),
      prompt: String(item?.prompt || '')
    }));
    while (arr.length < 10) arr.push({label: '', prompt: ''});
    return arr;
  } catch(e) {
    return Array.from({length: 10}, () => ({label: '', prompt: ''}));
  }
}

function saveDraftCuts(cuts) {
  try { localStorage.setItem('server_cuts_draft', JSON.stringify(cuts)); } catch(e) {}
}

function saveServerAutomationApiBase(url) {
  const normalized = normalizeServerAutomationApiBase(url);
  try { localStorage.setItem('server_auto_api_base', normalized); } catch(e) {}
  return normalized;
}

function assertServerAutomationApiBaseAllowed(base) {
  const isHttpsPage = typeof window !== 'undefined' && window.location?.protocol === 'https:';
  if (isHttpsPage && /^http:\/\//i.test(base)) {
    throw new Error('HTTPS 페이지에서는 http:// 자동화 API 호출이 차단됩니다. https:// 엔드포인트를 사용하거나 localhost 앱(start.bat)으로 실행하세요.');
  }
}

// SESSION PERSISTENCE (analysis + generated content)
// ════════════════════════════════════════════════════════════════
function savePersistentState() {
  try {
    const payload = {
      step: state.step,
      analysis: state.analysis,
      competitorData: state.competitorData,
      sectionContents: state.sectionContents,
      imagePreview: state.imagePreview,
      imageMime: state.imageMime,
      productName: state.productName,
      analysisTimestamp: state.analysisTimestamp,
    };
    localStorage.setItem('pdp_session', JSON.stringify(payload));
  } catch(e) {}
  // imageBase64 별도 저장 (크기가 클 수 있어 분리)
  try { if (state.imageBase64) localStorage.setItem('pdp_session_img', state.imageBase64); } catch(e) {}
  // sectionImages 별도 저장
  try {
    if (Object.keys(state.sectionImages).length > 0)
      localStorage.setItem('pdp_session_imgs', JSON.stringify(state.sectionImages));
  } catch(e) {}
}
function loadPersistentSession() {
  try {
    const raw = localStorage.getItem('pdp_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    // 과도기 step → 안전한 step으로 정규화
    if (s.step === 'analyzing') s.step = 'sections';
    if (s.step === 'generating') s.step = Object.keys(s.sectionContents||{}).length > 0 ? 'preview' : 'sections';
    s.imageBase64 = localStorage.getItem('pdp_session_img') || null;
    try { s.sectionImages = JSON.parse(localStorage.getItem('pdp_session_imgs') || '{}'); } catch(e) { s.sectionImages = {}; }
    return s;
  } catch(e) { return null; }
}
function clearPersistentSession() {
  localStorage.removeItem('pdp_session');
  localStorage.removeItem('pdp_session_img');
  localStorage.removeItem('pdp_session_imgs');
}

function renderImageDirectivesPanel() {

  return `<div style="margin-bottom:16px;border:1px solid var(--border);border-radius:10px;overflow:hidden">

        ? `<span style="font-size:11px;font-weight:600;color:var(--ok);background:rgba(72,199,142,.15);padding:2px 8px;border-radius:12px">${active}개 적용 중</span>`
        : `<span style="font-size:11px;color:var(--text-m)">없음</span>`}
      <span class="material-icons-outlined" style="font-size:18px;color:var(--text-m)">${open?'expand_less':'expand_more'}</span>

      <p style="font-size:12px;color:var(--text-m);margin-bottom:12px;line-height:1.6">
        이미지 생성에 적용할 지시사항을 자유롭게 입력하세요. 설정된 LLM이 자동으로 이미지 프롬프트 제약으로 변환합니다.<br>
        예) "구매하기 버튼 넣지 마" · "톤을 좀 어둡게" · "텍스트 오버레이 없이 제품만"

        : directives.map(d => `

            <button data-directive-toggle="${d.id}" style="background:none;border:none;cursor:pointer;padding:0;flex-shrink:0;margin-top:1px">
              <span class="material-icons-outlined" style="font-size:18px;color:${d.active?'var(--ok)':'var(--text-m)'}">${d.active?'toggle_on':'toggle_off'}</span>

                  ${content.extra_elements.map(e => `<div style="padding:8px 0;color:${c.text_secondary||'#555'};font-size:14px;font-family:${bodyFont};border-bottom:1px solid rgba(0,0,0,.05)">• ${e}</div>`).join('')}
                </div>` : ''}
                ${content.cta_text ? `<div style="display:inline-block;margin-top:20px;padding:12px 36px;background:${c.accent||'#6366f1'};color:#fff;border-radius:8px;font-weight:600;font-size:16px;font-family:${bodyFont}">${content.cta_text}</div>` : ''}
              </div>
            </div>
          </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// COMPETITOR ANALYSIS STEP
// ════════════════════════════════════════════════════════════════
function renderCompetitorStep() {
  const cp = state.compPage;
  const backendBase = (cp.scraperBase || 'http://127.0.0.1:5001').replace(/\/+$/, '');
  const hasBackend = cp.backendOk === true;

  if (cp.subStep === 'analyzing') {
    return `<div class="fade-in" style="text-align:center;padding:60px 20px">
      <div class="spinner" style="margin:0 auto 24px"></div>
      <p style="font-size:16px;color:var(--text-m)">${cp.analyzeMsg || '경쟁사 페이지 분석 중...'}</p>
    </div>`;
  }

  if (cp.subStep === 'report') {
    const r = cp.analysisResult || {};
    const sections = r.sections_found || [];
    const typeLabel = {header:'헤더',hook:'훅',features:'핵심특징',specs:'스펙',scenarios:'사용시나리오',comparison:'비교우위',material:'소재/기술',certification:'인증',review:'리뷰',size_color:'사이즈/컬러',promotion:'프로모션',shipping:'배송',faq:'FAQ',brand_story:'브랜드스토리',cta:'CTA',other:'기타'};

    const ps = r.page_score || {};
    const total = typeof ps.total === 'number' ? ps.total : null;

    const scoreColor = s => s >= 8 ? '#48bb78' : s >= 6 ? '#f6ad55' : s >= 4 ? '#fc8181' : '#e53e3e';
    const gradeBg = g => ({S:'#6366f1',A:'#48bb78',B:'#38b2ac',C:'#f6ad55',D:'#fc8181',F:'#e53e3e'}[g]||'#666');
    const renderStars = (score, size=15) => {
      let h = '';
      for (let i = 1; i <= 5; i++) {
        const v = score/2;
        h += v >= i ? `<span style="color:#f6ad55;font-size:${size}px">★</span>`
           : v >= i-.5 ? `<span style="color:#f6ad55;font-size:${size}px;opacity:.6">★</span>`
           : `<span style="color:#444;font-size:${size}px">☆</span>`;
      }
      return h;
    };

    return `<div class="fade-in">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <button class="btn-sm" data-comp-back="input" style="gap:6px"><span class="material-icons-outlined" style="font-size:14px">arrow_back</span>다시 입력</button>
        <h1 class="page-title" style="margin:0">🔍 경쟁사 분석 결과</h1>
      </div>
      <p class="page-desc" style="margin-bottom:16px">${r.page_title ? `"${r.page_title}" 분석 완료 · ` : ''}섹션 ${sections.length}개 발견</p>

      ${total !== null ? `
      <!-- ── 총점 헤더 ── -->
      <div style="background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(99,102,241,.05));border:1px solid rgba(99,102,241,.3);border-radius:12px;padding:16px;margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
          <div style="text-align:center">
            <div style="font-size:48px;font-weight:900;color:${scoreColor(total)};line-height:1">${total.toFixed(1)}</div>
            <div style="font-size:11px;color:var(--text-m)">/10점</div>
            <div style="margin-top:4px">${renderStars(total, 16)}</div>
          </div>
          <div style="flex:1">
            ${ps.grade ? `<span style="display:inline-block;background:${gradeBg(ps.grade)};color:#fff;font-size:18px;font-weight:900;padding:3px 14px;border-radius:20px;margin-bottom:8px">${ps.grade}등급</span>` : ''}
            ${ps.verdict ? `<p style="font-size:13px;color:var(--text);line-height:1.6;margin:0;font-style:italic">"${ps.verdict}"</p>` : ''}
          </div>
        </div>

        <!-- 항목별 바 요약 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px">
          ${(ps.criteria||[]).map(c=>`
            <div style="display:flex;align-items:center;gap:6px;font-size:11px">
              <span style="font-size:13px">${c.icon||''}</span>
              <span style="color:var(--text-m);min-width:80px;font-size:11px">${c.name}</span>
              <div style="flex:1;height:4px;background:#333;border-radius:2px;overflow:hidden">
                <div style="height:100%;width:${(c.score||0)*10}%;background:${scoreColor(c.score||0)};border-radius:2px"></div>
              </div>
              <span style="font-weight:700;color:${scoreColor(c.score||0)};min-width:20px;text-align:right">${c.score||0}</span>
            </div>`).join('')}
        </div>

        <!-- 최우선 개선사항 -->
        ${(ps.top_priorities||[]).length > 0 ? `
        <div style="margin-top:14px;padding:12px;background:rgba(229,62,62,.1);border:1px solid rgba(229,62,62,.25);border-radius:8px">
          <div style="font-size:12px;font-weight:700;color:#fc8181;margin-bottom:8px">🚨 지금 당장 고쳐야 할 것</div>
          ${ps.top_priorities.map(p=>`<div style="font-size:12px;color:var(--text);line-height:1.6;margin-bottom:4px">${p}</div>`).join('')}
        </div>` : ''}
      </div>

      <!-- ── 항목별 상세 카드 ── -->
      <div style="margin-bottom:16px">
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px">📋 항목별 상세 분석</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${(ps.criteria||[]).map(c => {
            const sc = c.score || 0;
            const col = scoreColor(sc);
            return `<div style="background:var(--bg-card);border:1px solid var(--border);border-left:3px solid ${col};border-radius:8px;padding:12px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <span style="font-size:16px">${c.icon||'📌'}</span>
                <span style="font-weight:700;font-size:13px;flex:1">${c.name}</span>
                <div style="display:flex;align-items:center;gap:4px">
                  ${renderStars(sc, 12)}
                  <span style="font-weight:900;font-size:14px;color:${col};margin-left:4px">${sc}</span>
                  <span style="font-size:10px;color:var(--text-m)">/10</span>
                </div>
              </div>
              ${c.current_state ? `<div style="font-size:12px;color:var(--text-m);margin-bottom:6px;padding:6px 8px;background:rgba(255,255,255,.04);border-radius:5px">현황: ${c.current_state}</div>` : ''}
              ${(c.issues||[]).length > 0 ? `<div style="margin-bottom:8px">${c.issues.map(i=>`<span style="display:inline-block;font-size:11px;color:#fc8181;background:rgba(229,62,62,.1);padding:2px 7px;border-radius:10px;margin:2px">✗ ${i}</span>`).join('')}</div>` : ''}
              ${c.to_perfect ? `<div style="padding:8px 10px;background:rgba(72,187,120,.08);border:1px solid rgba(72,187,120,.2);border-radius:6px;font-size:12px;color:#68d391;line-height:1.6">
                <span style="font-weight:700;color:#48bb78">💡 10점 받으려면:</span> ${c.to_perfect}
              </div>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      <div class="comp-card" style="margin-bottom:16px">
        <div class="comp-card-title">📋 전체 전략 요약</div>
        <p style="color:var(--text-m);line-height:1.7;font-size:14px">${r.overall_strategy || '-'}</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div class="comp-card">
          <div class="comp-card-title">✅ 강점</div>
          ${(r.strengths||[]).map(s=>`<div class="comp-tag comp-tag-green">${s}</div>`).join('')||'<span style="color:var(--text-m);font-size:13px">없음</span>'}
        </div>
        <div class="comp-card">
          <div class="comp-card-title">⚠️ 약점</div>
          ${(r.weaknesses||[]).map(s=>`<div class="comp-tag comp-tag-red">${s}</div>`).join('')||'<span style="color:var(--text-m);font-size:13px">없음</span>'}
        </div>
      </div>

      ${(r.selling_strategies||[]).length>0?`<div class="comp-card" style="margin-bottom:16px">
        <div class="comp-card-title">💡 판매 전략</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${(r.selling_strategies||[]).map(s=>`<span class="comp-tag">${s}</span>`).join('')}</div>
      </div>`:''}

      <div class="comp-card" style="margin-bottom:20px">
        <div class="comp-card-title">🗂 발견된 섹션 (${sections.length}개)</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${sections.map(s=>`<div style="display:flex;gap:10px;padding:8px;background:var(--bg);border-radius:6px;font-size:13px">
            <span style="background:var(--primary);color:#fff;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap">${typeLabel[s.type]||s.type}</span>
            <div><div style="font-weight:600;color:var(--text)">${s.headline||'-'}</div><div style="color:var(--text-m);margin-top:2px">${s.body_summary||''}</div></div>
          </div>`).join('')}
        </div>
      </div>

      ${cp.sectionPlan
        ? `<div style="display:flex;gap:10px">
            <button class="btn" id="compViewPlan" style="flex:1;justify-content:center;font-size:15px;padding:13px">
              <span class="material-icons-outlined">dashboard_customize</span> 섹션 플랜 보기 →
            </button>
            <button class="btn-secondary" id="compGenPlan" style="padding:13px 16px" title="플랜 다시 생성">
              <span class="material-icons-outlined">refresh</span>
            </button>
          </div>`
        : `<button class="btn" id="compGenPlan" style="width:100%;justify-content:center;font-size:16px;padding:14px">
            <span class="material-icons-outlined">auto_fix_high</span> 이 분석으로 15개 섹션 플랜 생성 →
          </button>`}
    </div>`;
  }

  if (cp.subStep === 'plan') {
    const plan = cp.sectionPlan || {};
    const recs = plan.recommended_sections || [];
    const edits = cp.planEdits || {};
    const hasAnalysis = !!state.analysis;
    const genStatus = cp.sectionStatus || {}; // {sectionId: 'loading'|'done'|'error'}
    return `<div class="fade-in">

      </div>
      ${plan.strategy_summary?`<div class="comp-card" style="margin-bottom:12px">
        <div class="comp-card-title">🎯 전략 요약</div>
        <p style="color:var(--text-m);font-size:14px;line-height:1.7">${plan.strategy_summary}</p>
        ${(plan.key_differentiators||[]).length>0?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${plan.key_differentiators.map(d=>`<span class="comp-tag comp-tag-primary">${d}</span>`).join('')}</div>`:''}
      </div>`:''}

      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
        ${SECTIONS.map(s => {
          const rec = recs.find(r=>r.section_id===s.id) || {};
          const ed = edits[s.id] || {};
          const enabled = ed.enabled !== undefined ? ed.enabled : (rec.enabled !== false);
          const instructions = ed.instructions !== undefined ? ed.instructions : (rec.recommended_instructions || '');
          const st = genStatus[s.id];
          const doneContent = state.sectionContents[s.id];
          return `<div class="comp-section-card ${enabled?'':'comp-section-disabled'}">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <label class="comp-toggle-wrap">
                <input type="checkbox" class="comp-plan-toggle" data-sid="${s.id}" ${enabled?'checked':''}>
                <span class="comp-toggle-slider"></span>
              </label>
              <span style="font-size:18px">${s.icon||'📄'}</span>
              <span style="font-weight:700;font-size:14px;flex:1">${s.n}. ${s.name}</span>
              ${!hasAnalysis ? '' :
                st === 'loading'
                  ? `<span style="font-size:12px;color:var(--primary-h)">⏳ 생성 중...</span>`
                  : st === 'error'
                    ? `<button class="btn-sm" data-comp-gen-section="${s.id}" style="background:rgba(229,62,62,.15);color:#e53e3e;border-color:#e53e3e">재시도</button>`
                    : doneContent
                      ? `<span style="font-size:12px;color:#48bb78;font-weight:700">✓ 완료</span>
                         <button class="btn-sm" data-comp-gen-section="${s.id}" style="padding:3px 8px">↺</button>`
                      : `<button class="btn-sm" data-comp-gen-section="${s.id}">생성</button>`
              }
            </div>
            <textarea class="comp-plan-input" data-sid="${s.id}" rows="3"
              placeholder="경쟁사 분석 기반 지시사항을 입력하세요..."
              style="width:100%;resize:vertical;${!enabled?'opacity:0.4;':''}">
${instructions}</textarea>
            ${rec.competitor_reference?`<details style="margin-top:6px">
              <summary style="font-size:12px;color:var(--text-m);cursor:pointer">📌 경쟁사 방식 / 개선 포인트</summary>
              <div style="font-size:12px;color:var(--text-m);margin-top:6px;padding:8px;background:var(--bg);border-radius:6px;line-height:1.6">
                <b>경쟁사:</b> ${rec.competitor_reference}<br>
                <b>개선:</b> ${rec.improvement_suggestions||'-'}
              </div>
            </details>`:''}
          </div>`;
        }).join('')}
      </div>

      <div style="display:flex;gap:12px;position:sticky;bottom:0;background:var(--surface);padding:16px 0">
        <button class="btn" id="compApplyGenerate" style="flex:1;justify-content:center;font-size:15px"
          ${!hasAnalysis?'disabled title="먼저 제품 이미지를 분석해주세요 (AI 분석 탭)"':''}>
          <span class="material-icons-outlined">rocket_launch</span> 자동 생성 바로 시작
        </button>
        <button class="btn-secondary" id="compApplySections" style="flex:1;justify-content:center;font-size:15px">
          <span class="material-icons-outlined">dashboard_customize</span> 섹션 설정으로 이동
        </button>
      </div>

  // subStep === 'input'
  const imgs = cp.uploadedImages || [];
  const savedComp = loadCompAnalysis();

  const savedAt = hasSaved ? new Date(savedComp.savedAt).toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

    ? `<span style="font-weight:900;color:${savedTot>=8?'#48bb78':savedTot>=6?'#f6ad55':'#fc8181'};margin-left:6px">${savedTot.toFixed(1)}점</span>`

  return `<div class="fade-in">

    ${hasSaved ? `<div class="comp-card" style="margin-bottom:20px;border-color:var(--primary);background:rgba(99,102,241,.06)">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:18px">🕐</span>

          <div style="font-size:11px;color:var(--text-m);margin-top:2px">${savedAt} 저장 · 섹션 ${(savedComp.analysisResult.sections_found||[]).length}개 발견${hasSavedPlan?' · 15개 플랜 있음':''}</div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          <button class="btn-sm" id="compLoadReport">분석 결과 보기</button>
          ${hasSavedPlan ? `<button class="btn-sm" id="compLoadPlan" style="background:var(--primary);color:#fff;border-color:var(--primary)">섹션 플랜 바로가기</button>` : ''}
        </div>
      </div>

    <div style="display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
      ${[['images','🖼 이미지 스크린샷'],['html','📄 HTML 파일'],['url','🔗 URL']].map(([m,l])=>`
        <button class="comp-mode-tab ${cp.mode===m?'active':''}" data-comp-mode="${m}" style="flex:1">${l}</button>
      `).join('')}
    </div>

    ${cp.mode === 'images' ? `
      <div class="comp-drop-zone" id="compDropZone">
        <span class="material-icons-outlined" style="font-size:40px;color:var(--primary);margin-bottom:8px">add_photo_alternate</span>

      </div>
      ${imgs.length>0?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
        ${imgs.map((img,i)=>`<div style="position:relative">
          <img src="data:${img.mime};base64,${img.base64}" style="width:100px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">
          <button data-comp-remove-img="${i}" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#e53e3e;color:#fff;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center">✕</button>
        </div>`).join('')}
      </div>`:''}
    ` : cp.mode === 'html' ? `
      <div style="margin-bottom:12px">
        <label style="font-size:13px;color:var(--text-m);display:block;margin-bottom:6px">HTML 파일 업로드</label>
        <input type="file" id="compHtmlInput" accept=".html,.htm" class="comp-file-input">
      </div>
      <div>
        <label style="font-size:13px;color:var(--text-m);display:block;margin-bottom:6px">또는 HTML 텍스트 직접 붙여넣기</label>
        <textarea id="compHtmlText" rows="8" style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:monospace;resize:vertical"
          placeholder="경쟁사 페이지 소스 붙여넣기 (Ctrl+U → 전체 복사)...">${cp.htmlText||''}</textarea>
      </div>
    ` : `
      <div>
        <label style="font-size:13px;color:var(--text-m);display:block;margin-bottom:6px">경쟁사 상세페이지 URL</label>

          <button id="compPingBtn" class="btn-sm" style="white-space:nowrap">연결 확인</button>
        </div>
        <div style="padding:8px 10px;background:var(--bg);border-radius:6px;font-size:12px;color:var(--text-m)">
          ${cp.backendOk === true
            ? `<span style="color:#48bb78">● 백엔드 연결됨</span> — 더보기/펼쳐보기 버튼 자동 클릭 후 스크린샷 캡처`
            : cp.backendOk === false
              ? `<span style="color:#e53e3e">● 백엔드 미연결</span> — Flask 백엔드를 시작하세요: <code>cd backend && python app.py</code>`
              : `<span style="color:#ccc">● 미확인</span> — 위 "연결 확인" 버튼을 누르거나 분석을 바로 시작하세요`}

    `}

    <button class="btn" id="compStartAnalyze" style="width:100%;justify-content:center;margin-top:20px;font-size:15px;padding:14px">
      <span class="material-icons-outlined">search</span> 분석 시작
    </button>
  </div>`;
}

// EVENT BINDING
// ════════════════════════════════════════════════════════════════
function bindEvents() {
  // API Key modal
  const saveBtn = document.getElementById('saveApiKey');
  if (saveBtn) {
    saveBtn.onclick = () => {
      const key = document.getElementById('apiKeyInput')?.value.trim() || '';
      const backendUrl = document.getElementById('backendUrlInput')?.value.trim() || '';
      if (!key && !backendUrl) return;

      state.apiKey = key;
      state.backendBaseUrl = backendUrl;
      saveKey(key);
      saveBackendUrl(backendUrl);

      gemini = createGeminiClient();
      state.showApiModal = false;
      render();
    };
  }

  const skipBtn = document.getElementById('skipApiModal');
  if (skipBtn) {
    skipBtn.onclick = () => {
      if (!hasGeminiConnection()) return;
      gemini = createGeminiClient();
      state.showApiModal = false;
      render();
    };
  }

  const toggleVis = document.getElementById('toggleKeyVis');
  if (toggleVis) {
    toggleVis.onclick = () => {
      const inp = document.getElementById('apiKeyInput');
      if (inp.type === 'text') { inp.type = 'password'; toggleVis.textContent = 'visibility'; }
      else { inp.type = 'text'; toggleVis.textContent = 'visibility_off'; }
    };
  }

  const changeApiBtn = document.getElementById('changeApiKey');
  if (changeApiBtn) {
    changeApiBtn.onclick = () => { state.showApiModal = true; render(); };
  }

  // Navigation
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.nav;
      // 과도기 상태 탭은 데이터 여부에 따라 적절한 탭으로 리다이렉트
      if (target === 'analyzing') { state.step = state.analysis ? 'sections' : 'upload'; render(); return; }
      if (target === 'generating') { state.step = Object.keys(state.sectionContents).length > 0 ? 'preview' : 'sections'; render(); return; }
      state.step = target;
      render();
      // 모델 설정 탭 열면 Vertex config 자동 로드
      if (target === 'modelsettings' && !state.vertexConfig) {
        const base = state.auto.serverApiBase || 'http://127.0.0.1:4000/v1';
        fetch(`${base}/pdp/vertex-config`).then(r => r.json()).then(d => { state.vertexConfig = d; render(); }).catch(() => {});
      }
    };
  });

  // ── 경쟁사 분석 이벤트 ──────────────────────────────────────

  document.querySelectorAll('[data-comp-mode]').forEach(btn => {

  // 뒤로가기
  document.querySelectorAll('[data-comp-back]').forEach(btn => {
    btn.onclick = () => { state.compPage.subStep = btn.dataset.compBack; render(); };
  });
  // 이미지 업로드 드롭존
  const compDrop = document.getElementById('compDropZone');
  const compImgInput = document.getElementById('compImageInput');

  // 이미지 삭제
  document.querySelectorAll('[data-comp-remove-img]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); state.compPage.uploadedImages.splice(+btn.dataset.compRemoveImg, 1); render(); };
  });
  // HTML 파일 업로드
  const compHtmlInput = document.getElementById('compHtmlInput');
  if (compHtmlInput) compHtmlInput.onchange = e => {
