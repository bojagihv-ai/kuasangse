<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생산관제 작업대</title>
  <style>
    /* 작업대 — 제품 넣기 · 줄 · 진단, 세 자리만. 바깥 출처는 부르지 않는다(글꼴도). */
    :root {
      --wb-bg: #EFEFEB; --wb-card: #FFFFFF; --wb-card-2: #F7F7F4;
      --wb-line: #D9D8D2; --wb-line-strong: #B9B8B0;
      --wb-ink: #1C1B19; --wb-ink-2: #47463F; --wb-muted: #7A7973;
      --wb-accent: #0F6E6E; --wb-accent-ink: #0A5252; --wb-accent-wash: #E1F0EF; --wb-on-accent: #FFFFFF;
      --wb-mine: #B4550F; --wb-mine-wash: #FBEBDC;
      --wb-blocked: #B3261E; --wb-blocked-wash: #F8E0DE;
      --wb-done: #2E7D32; --wb-done-wash: #E0F0E1;
      --wb-run: #0F6E6E;
      --wb-shadow: 0 1px 2px rgba(28,27,25,.06), 0 4px 14px rgba(28,27,25,.05);
      --wb-radius: 6px; --wb-radius-lg: 10px;
      --wb-font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
      --wb-mono: ui-monospace, Consolas, "Cascadia Mono", monospace;
      --wb-touch: 44px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --wb-bg: #161715; --wb-card: #1F2120; --wb-card-2: #262927;
        --wb-line: #35383B; --wb-line-strong: #4C5054;
        --wb-ink: #ECEAE4; --wb-ink-2: #C9C7C0; --wb-muted: #9C9A93;
        --wb-accent: #5FBDB4; --wb-accent-ink: #8ED6CF; --wb-accent-wash: #1B3532; --wb-on-accent: #0F1E1D;
        --wb-mine: #E09A4A; --wb-mine-wash: #3A2A17;
        --wb-blocked: #E3736A; --wb-blocked-wash: #3E2321;
        --wb-done: #72C176; --wb-done-wash: #1F3623;
        --wb-run: #5FBDB4;
        --wb-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --wb-bg: #161715; --wb-card: #1F2120; --wb-card-2: #262927;
      --wb-line: #35383B; --wb-line-strong: #4C5054;
      --wb-ink: #ECEAE4; --wb-ink-2: #C9C7C0; --wb-muted: #9C9A93;
      --wb-accent: #5FBDB4; --wb-accent-ink: #8ED6CF; --wb-accent-wash: #1B3532; --wb-on-accent: #0F1E1D;
      --wb-mine: #E09A4A; --wb-mine-wash: #3A2A17;
      --wb-blocked: #E3736A; --wb-blocked-wash: #3E2321;
      --wb-done: #72C176; --wb-done-wash: #1F3623;
      --wb-run: #5FBDB4;
      --wb-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    /* display 를 준 요소(.wb-intake 의 grid 등)가 hidden 속성을 이기지 못하게. 없으면 접은 자리가 그대로 보인다. */
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      background: var(--wb-bg); color: var(--wb-ink); font-family: var(--wb-font);
      font-size: 15px; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere;
    }
    h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--wb-accent); outline-offset: 2px; }
    .wb-wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 96px; }
    .wb-eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--wb-muted); font-weight: 500; }

    .wb-top { display: grid; grid-template-columns: 1fr auto auto; gap: 24px; align-items: end; padding: 28px 0 14px; }
    .wb-top h1 { font-size: 26px; letter-spacing: -.01em; }
    .wb-counts { display: flex; gap: 8px; }
    .wb-count { display: grid; gap: 2px; min-width: 96px; padding: 10px 14px; border: 1px solid var(--wb-line); border-radius: var(--wb-radius-lg); background: var(--wb-card); }
    .wb-count b { font-family: var(--wb-mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 500; line-height: 1; }
    .wb-count span { font-size: 12.5px; color: var(--wb-muted); }
    .wb-count.mine { border-color: var(--wb-mine); background: var(--wb-mine-wash); } .wb-count.mine b { color: var(--wb-mine); }
    .wb-count.run b { color: var(--wb-run); } .wb-count.done b { color: var(--wb-done); }
    .wb-top-actions { display: flex; gap: 8px; }

    .wb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--wb-touch); padding: 0 16px; border-radius: var(--wb-radius); border: 1px solid var(--wb-line-strong); background: var(--wb-card); color: var(--wb-ink); font-weight: 500; }
    .wb-btn:hover { border-color: var(--wb-ink-2); }
    .wb-btn.primary { background: var(--wb-accent); border-color: var(--wb-accent); color: var(--wb-on-accent); }
    .wb-btn.primary:hover { background: var(--wb-accent-ink); border-color: var(--wb-accent-ink); }
    .wb-btn.ghost { border-color: transparent; background: transparent; color: var(--wb-ink-2); }
    .wb-btn.ghost:hover { background: var(--wb-card-2); border-color: var(--wb-line); }
    .wb-btn.danger { color: var(--wb-blocked); border-color: var(--wb-blocked); background: transparent; }
    .wb-btn.danger:hover { background: var(--wb-blocked-wash); }
    .wb-btn.sm { padding: 0 12px; font-size: 14px; }
    .wb-btn[aria-pressed="true"] { background: var(--wb-ink); color: var(--wb-bg); border-color: var(--wb-ink); }

    .wb-status { margin: 0 0 12px; padding: 10px 14px; border-radius: var(--wb-radius); border: 1px solid var(--wb-line); background: var(--wb-card-2); font-size: 14px; }
    .wb-status[data-tone="ok"] { border-color: var(--wb-done); background: var(--wb-done-wash); }
    .wb-status[data-tone="error"] { border-color: var(--wb-blocked); background: var(--wb-blocked-wash); }

    .wb-intake { margin: 6px 0 22px; padding: 22px 24px 24px; background: var(--wb-card); border: 1px solid var(--wb-line); border-radius: var(--wb-radius-lg); box-shadow: var(--wb-shadow); display: grid; gap: 14px; }
    .wb-intake-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .wb-intake-head h2 { font-size: 19px; }
    .wb-intake-head p { margin: 4px 0 0; color: var(--wb-muted); font-size: 14px; }

    .wb-queue-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 8px 0 10px; flex-wrap: wrap; }
    .wb-queue-head h2 { font-size: 19px; }
    .wb-note { font-size: 13px; color: var(--wb-muted); }
    .wb-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .wb-empty { padding: 28px; text-align: center; color: var(--wb-muted); border: 1px dashed var(--wb-line-strong); border-radius: var(--wb-radius-lg); }

    .wb-row { background: var(--wb-card); border: 1px solid var(--wb-line); border-radius: var(--wb-radius-lg); margin-bottom: 8px; box-shadow: var(--wb-shadow); }
    .wb-row[data-stale="true"] { outline: 2px solid var(--wb-blocked); outline-offset: -2px; }
    .wb-row[data-live="true"] { box-shadow: inset 4px 0 0 var(--wb-accent), var(--wb-shadow); }
    .wb-row-head { display: grid; grid-template-columns: 22px 112px 1fr 300px auto; gap: 16px; align-items: center; padding: 14px 18px; cursor: pointer; border-radius: var(--wb-radius-lg); }
    .wb-row-pick { width: 20px; height: 20px; margin: 0; accent-color: var(--wb-accent); cursor: pointer; }
    .wb-row-pick:disabled { opacity: .35; cursor: not-allowed; }
    .wb-bulk { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: var(--wb-radius); border: 1px solid var(--wb-blocked); background: var(--wb-blocked-wash); font-size: 13.5px; }
    .wb-row-head:hover { background: var(--wb-card-2); }
    .wb-row[data-open="true"] .wb-row-head { border-bottom: 1px solid var(--wb-line); border-radius: var(--wb-radius-lg) var(--wb-radius-lg) 0 0; }
    .wb-state { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; }
    .wb-state::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--wb-muted); }
    .wb-row[data-state="mine"] .wb-state { color: var(--wb-mine); } .wb-row[data-state="mine"] .wb-state::before { background: var(--wb-mine); }
    .wb-row[data-state="run"] .wb-state { color: var(--wb-run); } .wb-row[data-state="run"] .wb-state::before { background: var(--wb-run); animation: wb-pulse 1.6s infinite; }
    .wb-row[data-state="blocked"] .wb-state { color: var(--wb-blocked); } .wb-row[data-state="blocked"] .wb-state::before { background: var(--wb-blocked); }
    .wb-row[data-state="done"] .wb-state { color: var(--wb-done); } .wb-row[data-state="done"] .wb-state::before { background: var(--wb-done); }
    @keyframes wb-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .wb-row[data-state="run"] .wb-state::before { animation: none; } }
    .wb-name { display: grid; gap: 2px; min-width: 0; }
    .wb-name b { font-weight: 600; font-size: 15.5px; }
    .wb-sub { font-size: 13px; color: var(--wb-muted); }
    .wb-wait { color: var(--wb-mine); font-weight: 500; }
    .wb-stale { font-size: 13px; font-weight: 600; color: var(--wb-blocked); }

    .wb-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .wb-strip i { display: grid; gap: 4px; font-style: normal; text-align: center; }
    .wb-strip i::before { content: ""; display: block; height: 8px; border-radius: 3px; background: var(--wb-card-2); border: 1px solid var(--wb-line-strong); }
    .wb-strip i span { font-size: 10.5px; color: var(--wb-muted); }
    .wb-strip i[data-s="done"]::before { background: var(--wb-accent); border-color: var(--wb-accent); opacity: .55; }
    .wb-strip i[data-s="now"]::before { background: var(--wb-mine); border-color: var(--wb-mine); }
    .wb-strip i[data-s="now"] span { color: var(--wb-ink); font-weight: 600; }
    .wb-row[data-state="run"] .wb-strip i[data-s="now"]::before { background: var(--wb-run); border-color: var(--wb-run); }
    .wb-row[data-state="blocked"] .wb-strip i[data-s="now"]::before { background: var(--wb-blocked); border-color: var(--wb-blocked); }
    .wb-row[data-state="done"] .wb-strip i::before { background: var(--wb-done); border-color: var(--wb-done); opacity: .55; }

    .wb-panel { padding: 18px 20px 22px; display: grid; gap: 14px; }
    .wb-why { padding: 10px 14px; border-radius: var(--wb-radius); background: var(--wb-card-2); border: 1px solid var(--wb-line); font-size: 14px; }
    .wb-row[data-state="blocked"] .wb-why { background: var(--wb-blocked-wash); border-color: var(--wb-blocked); }
    .wb-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .wb-spacer { flex: 1; }
    .wb-tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-style: normal; font-weight: 500; color: var(--wb-accent-ink); background: var(--wb-accent-wash); }
    .wb-tag.warn { color: var(--wb-mine); background: var(--wb-mine-wash); }
    .wb-note.error { color: var(--wb-blocked); } .wb-note.ok { color: var(--wb-done); }
    .wb-or { font-size: 13px; color: var(--wb-muted); padding: 0 4px; }

    /* 컷 고르기 — 후보는 한 줄에 다 펴진다. 칸 안 스크롤 없음: 많으면 행이 아래로 길어진다. */
    .wb-pick { display: grid; gap: 18px; }
    .wb-stage { display: grid; gap: 10px; }
    .wb-stage-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
    .wb-cuts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    .wb-cut { position: relative; display: grid; gap: 6px; padding: 8px; text-align: left; background: var(--wb-card); border: 1px solid var(--wb-line); border-radius: var(--wb-radius-lg); color: var(--wb-ink); cursor: pointer; }
    .wb-cut:hover { border-color: var(--wb-ink-2); }
    .wb-cut:focus-visible { outline: 2px solid var(--wb-accent); outline-offset: 2px; }
    .wb-cut-frame { position: relative; }
    .wb-cut-zoom { position: absolute; right: 6px; bottom: 6px; min-height: 30px; padding: 0 10px; border-radius: 999px; border: 0; background: rgba(28,27,25,.72); color: #fff; font-size: 12.5px; opacity: 0; transition: opacity .12s; }
    .wb-cut:hover .wb-cut-zoom, .wb-cut:focus-within .wb-cut-zoom { opacity: 1; }
    @media (hover: none) { .wb-cut-zoom { opacity: 1; } }

    /* 자동 고르기 토글 */
    .wb-auto { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--wb-radius); border: 1px solid var(--wb-line); background: var(--wb-card-2); }
    .wb-auto[data-on="true"] { border-color: var(--wb-accent); background: var(--wb-accent-wash); }
    .wb-auto select { min-height: 36px; padding: 0 10px; border: 1px solid var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card); color: var(--wb-ink); font: inherit; font-size: 14px; }
    .wb-switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14.5px; cursor: pointer; min-height: 36px; }
    .wb-switch input { appearance: none; width: 44px; height: 24px; border-radius: 999px; background: var(--wb-line-strong); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
    .wb-switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .wb-switch input:checked { background: var(--wb-accent); }
    .wb-switch input:checked::after { transform: translateX(20px); }
    .wb-switch input:focus-visible { outline: 2px solid var(--wb-accent); outline-offset: 2px; }
    .wb-auto-tag { font-size: 12.5px; color: var(--wb-accent-ink); font-weight: 600; }
    .wb-queue-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .wb-auto-default { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--wb-ink-2); }
    .wb-auto-default select { min-height: 36px; padding: 0 10px; border: 1px solid var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card); color: var(--wb-ink); font: inherit; font-size: 13.5px; }

    /* 크게 보기 */
    .wb-lightbox { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1400px); max-height: 96vh; }
    .wb-lightbox::backdrop { background: rgba(0,0,0,.72); }
    .wb-lightbox figure { margin: 0; display: grid; gap: 10px; padding: 12px; background: var(--wb-card); border-radius: var(--wb-radius-lg); box-shadow: var(--wb-shadow); }
    .wb-lightbox img { max-width: min(92vw, 1360px); max-height: 80vh; width: auto; height: auto; object-fit: contain; display: block; border-radius: var(--wb-radius); }
    .wb-lightbox figcaption { font-size: 14px; color: var(--wb-ink-2); }

    /* 섹션 설정 — 접힌 채로 있다가 프롬프트를 바꿀 때만 편다. 칸 안 스크롤 없이 아래로 길어진다. */
    .wb-sections { border: 1px solid var(--wb-line); border-radius: var(--wb-radius-lg); background: var(--wb-card-2); padding: 0 14px; }
    .wb-sections > summary { cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 14px; list-style: none; }
    .wb-sections > summary::before { content: "▸ "; color: var(--wb-muted); }
    .wb-sections[open] > summary::before { content: "▾ "; }
    .wb-sections > .wb-note { margin: 0 0 10px; }
    .wb-section { border-top: 1px solid var(--wb-line); }
    .wb-section > summary { cursor: pointer; padding: 10px 0; font-size: 13.5px; list-style: none; }
    .wb-section > summary::before { content: "▸ "; color: var(--wb-muted); }
    .wb-section[open] > summary::before { content: "▾ "; }
    .wb-section-body { display: grid; gap: 12px; padding: 4px 0 16px; }
    .wb-field textarea { min-height: 72px; padding: 8px 10px; border: 1px solid var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card); color: var(--wb-ink); font: inherit; font-size: 14px; resize: vertical; }
    .wb-section-content > summary { cursor: pointer; font-size: 13.5px; color: var(--wb-ink-2); padding: 6px 0; }

    /* 출처 확정 — 신화DB·Cafe24 후보 */
    .wb-source { display: grid; gap: 18px; }
    .wb-cuts-source { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .wb-cuts-source .wb-cut { cursor: default; }
    .wb-cuts-source .wb-cut[data-chosen="true"] { border-color: var(--wb-accent); box-shadow: 0 0 0 3px var(--wb-accent-wash); }
    .wb-stage[data-decided="true"] .wb-stage-head b { color: var(--wb-done); }
    .wb-cut[aria-checked="true"] { border-color: var(--wb-accent); box-shadow: 0 0 0 3px var(--wb-accent-wash), var(--wb-shadow); }
    .wb-cut[data-reserved="true"] .wb-cut-label::after { content: " · 예약됨"; color: var(--wb-accent-ink); }
    .wb-chosen .wb-cut { cursor: default; } .wb-chosen .wb-cut:hover { border-color: var(--wb-line); }
    .wb-chosen .wb-cut[data-chosen="false"] { opacity: .6; }
    .wb-cut-frame { display: grid; place-items: center; aspect-ratio: 1 / 1; border-radius: var(--wb-radius); background: var(--wb-card-2); overflow: hidden; }
    .wb-cut-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wb-cut-frame[data-broken="true"] img { visibility: hidden; }
    .wb-cut-doc { font-size: 12.5px; color: var(--wb-muted); }
    .wb-cut-n { position: absolute; top: 12px; left: 12px; min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 999px; background: var(--wb-ink); color: var(--wb-bg); font-family: var(--wb-mono); font-size: 12px; }
    .wb-cut-label { font-size: 13.5px; font-weight: 600; }
    .wb-cut-why { font-size: 12px; color: var(--wb-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .wb-cut-prompt { display: grid; gap: 4px; font-size: 12px; }
    .wb-cut-prompt .wb-note { white-space: pre-wrap; max-height: none; }
    .wb-compose { display: grid; gap: 8px; padding: 10px 12px; border: 1px dashed var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card-2); }
    .wb-receipt { display: grid; gap: 4px; padding: 10px 14px; border-radius: var(--wb-radius); border: 1px solid var(--wb-line); background: var(--wb-card-2); font-size: 13.5px; }
    .wb-receipt[data-provider="claude-oauth"] { border-left: 4px solid var(--wb-mine); }
    .wb-receipt[data-provider="gpt-oauth"] { border-left: 4px solid var(--wb-accent); }

    /* 값 채우기 — 빈 칸이 앞에 온다. */
    .wb-values { display: grid; gap: 14px; }
    .wb-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
    .wb-field { display: grid; gap: 4px; font-size: 13px; }
    .wb-field-name { color: var(--wb-ink-2); display: flex; align-items: center; }
    .wb-field input, .wb-bring input, .wb-bring select { min-height: 40px; padding: 0 10px; border: 1px solid var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card); color: var(--wb-ink); font: inherit; font-size: 14px; }
    .wb-field[data-missing="true"] input { border-color: var(--wb-mine); background: var(--wb-mine-wash); }
    .wb-field[data-prefilled="true"] input { border-color: var(--wb-accent); background: var(--wb-accent-wash); }
    .wb-bring { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
    .wb-sources { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .wb-link { border: 0; background: transparent; padding: 6px 8px; text-align: left; color: var(--wb-accent-ink); border-radius: var(--wb-radius); font-size: 14px; }
    .wb-link:hover { background: var(--wb-accent-wash); }

    /* Cafe24 승인 — 네 단계 관문. */
    .wb-cafe24 { display: grid; gap: 12px; }
    .wb-blockers { display: grid; gap: 8px; padding: 10px 14px; border-radius: var(--wb-radius); border: 1px solid var(--wb-blocked); background: var(--wb-blocked-wash); font-size: 13.5px; }
    .wb-blockers ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
    .wb-gate { display: flex; gap: 6px; margin: 0; padding: 0; list-style: none; counter-reset: gate; }
    .wb-gate li { counter-increment: gate; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--wb-line); font-size: 13px; color: var(--wb-muted); }
    .wb-gate li::before { content: counter(gate); font-family: var(--wb-mono); font-size: 11.5px; }
    .wb-gate li[data-state="done"] { color: var(--wb-done); border-color: var(--wb-done); background: var(--wb-done-wash); }
    .wb-gate li[data-state="now"] { color: var(--wb-ink); border-color: var(--wb-accent); background: var(--wb-accent-wash); }
    @media (max-width: 860px) { .wb-bring { grid-template-columns: 1fr; } }

    /* 제품 넣기 — 한 장에 다섯 묶음. 칸 안 스크롤 없이 아래로 길어진다. */
    .wb-intake-form { display: grid; gap: 22px; }
    .wb-intake-block { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--wb-line); }
    .wb-intake-block h3 { font-size: 15px; }
    .wb-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .wb-photo { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--wb-line); border-radius: var(--wb-radius-lg); background: var(--wb-card-2); }
    .wb-photo img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: var(--wb-radius); display: block; background: var(--wb-card); }
    .wb-photo[data-role="base"] img { outline: 2px solid var(--wb-accent); outline-offset: -2px; }
    .wb-photo-meta { display: grid; gap: 6px; font-size: 12.5px; }
    .wb-photo-meta b { overflow-wrap: anywhere; }
    .wb-photo-meta select, .wb-photo-meta input { min-height: 36px; padding: 0 8px; border: 1px solid var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card); color: var(--wb-ink); font: inherit; font-size: 13px; }
    .wb-check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; min-height: 36px; }
    .wb-check input { width: 18px; height: 18px; accent-color: var(--wb-accent); }
    .wb-field select { min-height: 40px; padding: 0 10px; border: 1px solid var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card); color: var(--wb-ink); font: inherit; font-size: 14px; }
    .wb-actions select, .wb-actions input[type="text"] { min-height: 40px; padding: 0 10px; border: 1px solid var(--wb-line-strong); border-radius: var(--wb-radius); background: var(--wb-card); color: var(--wb-ink); font: inherit; font-size: 14px; }
    .wb-matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 4px 18px; }
    .wb-matrix-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; font-size: 13.5px; padding: 2px 0; }
    .wb-note.error:empty { display: none; }

    .wb-diag { margin-top: 28px; padding: 18px 20px; border: 1px dashed var(--wb-line-strong); border-radius: var(--wb-radius-lg); background: var(--wb-card-2); display: grid; gap: 12px; }
    .wb-diag h2 { font-size: 15px; }
    .wb-kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; margin: 0; }
    .wb-kv dt { color: var(--wb-muted); } .wb-kv dd { margin: 0; font-family: var(--wb-mono); }
    .wb-foot { margin-top: 18px; display: flex; justify-content: center; gap: 12px; align-items: center; font-size: 13px; color: var(--wb-muted); }
    .wb-foot a { color: var(--wb-accent-ink); }

    @media (max-width: 860px) {
      .wb-top { grid-template-columns: 1fr; align-items: start; }
      .wb-row-head { grid-template-columns: 22px 1fr; gap: 10px; }
      .wb-row-head > :not(.wb-row-pick) { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="wb-wrap">
    <header class="wb-top">
      <div>
        <div class="wb-eyebrow">보자기 상세페이지 · 조립공장 제어</div>
        <h1>생산관제</h1>
      </div>
      <div class="wb-counts" aria-label="요약">
        <div class="wb-count mine"><b id="wb-count-mine">0</b><span>내 차례</span></div>
        <div class="wb-count run"><b id="wb-count-run">0</b><span>돌아가는 중</span></div>
        <div class="wb-count done"><b id="wb-count-done">0</b><span>완료</span></div>
      </div>
      <div class="wb-top-actions">
        <button class="wb-btn primary" id="wb-btn-intake" type="button" aria-expanded="false" aria-controls="wb-intake">＋ 제품 넣기</button>
        <button class="wb-btn ghost" id="wb-btn-diag" type="button" aria-expanded="false" aria-controls="wb-diag">진단</button>
      </div>
    </header>

    <p class="wb-status" id="wb-status" role="status" aria-live="polite" hidden></p>

    <section class="wb-intake" id="wb-intake" hidden aria-label="제품 넣기">
      <div class="wb-intake-head">
        <div>
          <h2>제품 넣기</h2>
          <p>사진과 이름만 있으면 줄에 섭니다. 값은 아는 만큼만 — 빈 칸은 조립공장이 채우거나 줄에서 「내 차례」로 묻습니다.</p>
        </div>
        <button class="wb-btn ghost sm" id="wb-btn-intake-close" type="button">접기</button>
      </div>
      <div id="wb-intake-body"></div>
    </section>

    <main aria-label="제품 줄">
      <div class="wb-queue-head">
        <h2>줄 <span class="wb-note" id="wb-headline">읽는 중…</span></h2>
        <div class="wb-queue-tools">
          <div class="wb-filters" id="wb-filters" role="group" aria-label="보기"></div>
          <div class="wb-bulk" id="wb-bulk" hidden>
            <span id="wb-bulk-count">0개 골랐습니다</span>
            <button class="wb-btn danger sm" id="wb-bulk-delete" type="button">선택 지우기</button>
            <button class="wb-btn ghost sm" id="wb-bulk-clear" type="button">선택 해제</button>
          </div>
          <label class="wb-auto-default" title="켜 두면 새로 오는 컷 고르기를 판정자에게 맡깁니다. 제품별로 끌 수 있습니다.">
            <span>컷 자동 고르기</span>
            <select id="wb-auto-pick-default" name="auto-pick-default">
              <option value="">끔 · 내가 고른다</option>
              <option value="gpt-oauth">GPT 에게</option>
              <option value="claude-oauth">Claude 에게</option>
            </select>
          </label>
        </div>
      </div>
      <div id="wb-queue" aria-live="polite"></div>
    </main>

    <section class="wb-diag" id="wb-diag" hidden aria-label="진단">
      <h2>진단 — 고장났을 때만 여는 곳</h2>
      <div id="wb-diag-body"></div>
      <p class="wb-note">병렬 보드 · 작업파일 탭 · 같이 보는 사람 · 감사 타임라인 · 연결 세부는 옛 화면에 그대로 있습니다.</p>
    </section>

    <div class="wb-foot">
      <a id="wb-old-page" href="./control-tower.html">옛 화면(관제탑 전체) 열기</a>
    </div>
  </div>
  <script type="module" src="./src/workbench/main.mjs?wb=1"></script>
</body>
</html>
